# memos-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  main:
    environment:
    - GODEBUG=multipathtcp=0
    - MEMOS_MODE=prod
    - MEMOS_PORT=5230
    image: neosmemo/memos:26.11.1@sha256:5dcd6e6b973a55b964f2fe2ccdaa33319463ab448a23404ebb5d2acbd19299ba
    networks:
      appnet:
        aliases:
        - memos_main_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/var/opt/memos
