# sshwifty: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  sshwifty:
    image: niruix/sshwifty:0.4.10-beta-release
    networks:
      appnet:
        aliases:
        - sshwifty_sshwifty_1
    privileged: true
    restart: unless-stopped
