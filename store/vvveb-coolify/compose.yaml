# vvveb-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  vvveb:
    environment:
    - SERVICE_URL_VVVEB_80=${SERVICE_URL_VVVEB_80}
    healthcheck:
      interval: 2s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1
      timeout: 10s
    image: vvveb/vvvebcms:latest
    networks:
      appnet:
        aliases:
        - vvveb-coolify_vvveb_1
    restart: unless-stopped
    volumes:
    - vvveb-data:/var/www/html
volumes:
  vvveb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/vvveb-data
      o: bind
      type: none
