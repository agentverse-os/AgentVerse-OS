# plane-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  admin:
    depends_on:
    - api
    - web
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - echo
      - hey whats up
      timeout: 10s
    image: makeplane/plane-admin:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_admin_1
    restart: unless-stopped
  api:
    command: ./bin/docker-entrypoint-api.sh
    depends_on:
    - plane-db
    - plane-redis
    - plane-mq
    environment:
      <<:
      - AMQP_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        DATABASE_URL: postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane
        DEBUG: ${DEBUG:-0}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
        USE_MINIO: ${USE_MINIO:-1}
        WEB_URL: ${SERVICE_URL_PLANE}
      - PGDATA: /var/lib/postgresql/data
        PGDATABASE: plane
        PGHOST: plane-db
        POSTGRES_DB: plane
        POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        POSTGRES_PORT: 5432
        POSTGRES_USER: $SERVICE_USER_POSTGRES
      - REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      - MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO
        MINIO_ROOT_USER: $SERVICE_USER_MINIO
      - AWS_ACCESS_KEY_ID: $SERVICE_USER_MINIO
        AWS_REGION: ${AWS_REGION:-}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_SECRET_ACCESS_KEY: $SERVICE_PASSWORD_MINIO
      - APP_DOMAIN: ${SERVICE_URL_PLANE}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - echo
      - hey whats up
      timeout: 10s
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_api_1
    restart: unless-stopped
    volumes:
    - logs_api:/code/plane/logs
  beat-worker:
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
    - api
    - plane-db
    - plane-redis
    - plane-mq
    environment:
      <<:
      - AMQP_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        DATABASE_URL: postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane
        DEBUG: ${DEBUG:-0}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
        USE_MINIO: ${USE_MINIO:-1}
        WEB_URL: ${SERVICE_URL_PLANE}
      - PGDATA: /var/lib/postgresql/data
        PGDATABASE: plane
        PGHOST: plane-db
        POSTGRES_DB: plane
        POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        POSTGRES_PORT: 5432
        POSTGRES_USER: $SERVICE_USER_POSTGRES
      - REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      - MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO
        MINIO_ROOT_USER: $SERVICE_USER_MINIO
      - AWS_ACCESS_KEY_ID: $SERVICE_USER_MINIO
        AWS_REGION: ${AWS_REGION:-}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_SECRET_ACCESS_KEY: $SERVICE_PASSWORD_MINIO
      - APP_DOMAIN: ${SERVICE_URL_PLANE}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - echo
      - hey whats up
      timeout: 10s
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_beat-worker_1
    restart: unless-stopped
    volumes:
    - logs_beat-worker:/code/plane/logs
  live:
    depends_on:
    - api
    - web
    environment:
      <<:
      - API_BASE_URL: ${API_BASE_URL:-http://api:8000}
        LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
      - REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - echo
      - hey whats up
      timeout: 10s
    image: makeplane/plane-live:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_live_1
    restart: unless-stopped
  migrator:
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
    - plane-db
    - plane-redis
    environment:
      <<:
      - AMQP_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        DATABASE_URL: postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane
        DEBUG: ${DEBUG:-0}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
        USE_MINIO: ${USE_MINIO:-1}
        WEB_URL: ${SERVICE_URL_PLANE}
      - PGDATA: /var/lib/postgresql/data
        PGDATABASE: plane
        PGHOST: plane-db
        POSTGRES_DB: plane
        POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        POSTGRES_PORT: 5432
        POSTGRES_USER: $SERVICE_USER_POSTGRES
      - REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      - MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO
        MINIO_ROOT_USER: $SERVICE_USER_MINIO
      - AWS_ACCESS_KEY_ID: $SERVICE_USER_MINIO
        AWS_REGION: ${AWS_REGION:-}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_SECRET_ACCESS_KEY: $SERVICE_PASSWORD_MINIO
      - APP_DOMAIN: ${SERVICE_URL_PLANE}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_migrator_1
    restart: no
    volumes:
    - logs_migrator:/code/plane/logs
  plane-db:
    command: postgres -c 'max_connections=1000'
    environment:
      <<:
        PGDATA: /var/lib/postgresql/data
        PGDATABASE: plane
        PGHOST: plane-db
        POSTGRES_DB: plane
        POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        POSTGRES_PORT: 5432
        POSTGRES_USER: $SERVICE_USER_POSTGRES
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:15.7-alpine
    networks:
      appnet:
        aliases:
        - plane-coolify_plane-db_1
    restart: unless-stopped
    volumes:
    - pgdata:/var/lib/postgresql/data
  plane-minio:
    command: server /export --console-address ":9090"
    environment:
      <<:
        MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO
        MINIO_ROOT_USER: $SERVICE_USER_MINIO
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 20s
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    networks:
      appnet:
        aliases:
        - plane-coolify_plane-minio_1
    restart: unless-stopped
    volumes:
    - uploads:/export
  plane-mq:
    environment:
      <<:
        RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ:-plane}
        RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ:-plane}
        RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
        RABBITMQ_HOST: plane-mq
        RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
        RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
    healthcheck:
      interval: 30s
      retries: 3
      test: rabbitmq-diagnostics -q ping
      timeout: 30s
    image: rabbitmq:3.13.6-management-alpine
    networks:
      appnet:
        aliases:
        - plane-coolify_plane-mq_1
    restart: unless-stopped
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
  plane-redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 20s
    image: valkey/valkey:7.2.11-alpine
    networks:
      appnet:
        aliases:
        - plane-coolify_plane-redis_1
    restart: unless-stopped
    volumes:
    - redisdata:/data
  proxy:
    depends_on:
    - web
    - api
    - space
    - admin
    - live
    environment:
    - SERVICE_URL_PLANE=${SERVICE_URL_PLANE}
    - APP_DOMAIN=${SERVICE_URL_PLANE}
    - SITE_ADDRESS=:80
    - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
    - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80
      timeout: 10s
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_proxy_1
    restart: unless-stopped
    volumes:
    - proxy_config:/config
    - proxy_data:/data
  space:
    depends_on:
    - api
    - worker
    - web
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - echo
      - hey whats up
      timeout: 10s
    image: makeplane/plane-space:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_space_1
    restart: unless-stopped
  web:
    depends_on:
    - api
    - worker
    healthcheck:
      interval: 2s
      retries: 15
      test: wget -qO- http://`hostname`:3000
      timeout: 10s
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_web_1
    restart: unless-stopped
  worker:
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
    - api
    - plane-db
    - plane-redis
    - plane-mq
    environment:
      <<:
      - AMQP_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        DATABASE_URL: postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane
        DEBUG: ${DEBUG:-0}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
        USE_MINIO: ${USE_MINIO:-1}
        WEB_URL: ${SERVICE_URL_PLANE}
      - PGDATA: /var/lib/postgresql/data
        PGDATABASE: plane
        PGHOST: plane-db
        POSTGRES_DB: plane
        POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        POSTGRES_PORT: 5432
        POSTGRES_USER: $SERVICE_USER_POSTGRES
      - REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      - MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO
        MINIO_ROOT_USER: $SERVICE_USER_MINIO
      - AWS_ACCESS_KEY_ID: $SERVICE_USER_MINIO
        AWS_REGION: ${AWS_REGION:-}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_SECRET_ACCESS_KEY: $SERVICE_PASSWORD_MINIO
      - APP_DOMAIN: ${SERVICE_URL_PLANE}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - echo
      - hey whats up
      timeout: 10s
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    networks:
      appnet:
        aliases:
        - plane-coolify_worker_1
    restart: unless-stopped
    volumes:
    - logs_worker:/code/plane/logs
volumes:
  logs_api:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/logs_api
      o: bind
      type: none
  logs_beat-worker:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/logs_beat-worker
      o: bind
      type: none
  logs_migrator:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/logs_migrator
      o: bind
      type: none
  logs_worker:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/logs_worker
      o: bind
      type: none
  pgdata:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/pgdata
      o: bind
      type: none
  proxy_config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/proxy_config
      o: bind
      type: none
  proxy_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/proxy_data
      o: bind
      type: none
  rabbitmq_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/rabbitmq_data
      o: bind
      type: none
  redisdata:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redisdata
      o: bind
      type: none
  uploads:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/uploads
      o: bind
      type: none
x-app-env:
  AMQP_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  APP_RELEASE: ${APP_RELEASE:-v1.3.0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  DATABASE_URL: postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane
  DEBUG: ${DEBUG:-0}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
  USE_MINIO: ${USE_MINIO:-1}
  WEB_URL: ${SERVICE_URL_PLANE}
x-aws-s3-env:
  AWS_ACCESS_KEY_ID: $SERVICE_USER_MINIO
  AWS_REGION: ${AWS_REGION:-}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_SECRET_ACCESS_KEY: $SERVICE_PASSWORD_MINIO
x-db-env:
  PGDATA: /var/lib/postgresql/data
  PGDATABASE: plane
  PGHOST: plane-db
  POSTGRES_DB: plane
  POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
  POSTGRES_PORT: 5432
  POSTGRES_USER: $SERVICE_USER_POSTGRES
x-live-env:
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_LIVESECRET
x-minio-env:
  MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO
  MINIO_ROOT_USER: $SERVICE_USER_MINIO
x-mq-env:
  RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ:-plane}
  RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
x-proxy-env:
  APP_DOMAIN: ${SERVICE_URL_PLANE}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}
x-redis-env:
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
