# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/plane-coolify
description: The open source project management tool
endpoint:
  port: 80
  service: admin
env:
  API_BASE_URL: http://api:8000
  API_KEY_RATE_LIMIT: 60/minute
  AWS_REGION: ''
  AWS_S3_BUCKET_NAME: uploads
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  CORS_ALLOWED_ORIGINS: http://localhost
  DEBUG: '0'
  FILE_SIZE_LIMIT: '5242880'
  GUNICORN_WORKERS: '1'
  MINIO_ENDPOINT_SSL: '0'
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  RABBITMQ_PORT: '5672'
  RABBITMQ_VHOST: plane
  REDIS_HOST: plane-redis
  REDIS_PORT: '6379'
  REDIS_URL: redis://plane-redis:6379/
  SERVICE_PASSWORD_64_LIVESECRET:
    generate: hex64
  SERVICE_PASSWORD_64_SECRETKEY:
    generate: hex64
  SERVICE_PASSWORD_MINIO:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_RABBITMQ:
    generate: password
  SERVICE_URL_PLANE: https://${APP_DOMAIN}
  SERVICE_USER_MINIO:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
  SERVICE_USER_RABBITMQ:
    generate: password
  SITE_ADDRESS: :80
  USE_MINIO: '1'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
