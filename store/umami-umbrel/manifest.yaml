# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/umami-umbrel
description: Simple, fast, privacy-focused alternative to Google Analytics
endpoint:
  port: 25727
  service: app
env:
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/umami/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/umami/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/umami/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/umami/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: umami
  path: null
  user: admin
name: umami-umbrel
notes:
- 'порт 25727:3000 (app) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Umami
type: app
upstream:
  author: Umami
  categories:
  - developer
  release_notes: |-
    This update adds browser error tracking and improves analytics, navigation, and account security. If you still use the default administrator password, you will be prompted to change it before continuing. Password settings are now under Settings → Security.

    Key highlights:
      - Capture browser errors alongside analytics and investigate grouped issues and affected visits
      - Improved date-range selection, comparison charts, timezone handling, and reporting performance
      - Easier replay navigation and dashboard access on mobile
      - Stronger two-factor authentication, team permissions, and shared-report access controls
      - Fixes session attribution, stale analytics caches, and tracking and display issues


    Full release notes are found at https://github.com/umami-software/umami/releases/tag/v3.5.0
  source: https://github.com/umami-software/umami
  version: 3.5.0
  website: https://umami.is
website: https://umami.is
