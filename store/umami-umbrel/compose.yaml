# umami-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
    - db
    environment:
      APP_SECRET: ${APP_SEED}
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:umami@umami_db_1:5432/umami
      TWO_FACTOR_ENCRYPTION_KEY: ${APP_SEED}
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    networks:
      appnet:
        aliases:
        - umami_app_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1001:1001
  db:
    environment:
      POSTGRES_DB: umami
      POSTGRES_PASSWORD: umami
      POSTGRES_USER: umami
    image: postgres:15-alpine@sha256:8a8d55343d6fc456cb183453e3094ff140b984157b36b48f817dd581654f2aec
    networks:
      appnet:
        aliases:
        - umami_db_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
