# searxng-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      SEARXNG_LIMITER: 'false'
      SEARXNG_SECRET: ${APP_SEED}
    image: ghcr.io/searxng/searxng:2026.11.18-b867c56a5@sha256:6012a064924a032969a2e7989d66971803f126a237a2fb6c62f10ae3d82093e1
    networks:
      appnet:
        aliases:
        - searxng_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/etc/searxng
    - ${APP_DATA_DIR}/data/cache:/var/cache/searxng
