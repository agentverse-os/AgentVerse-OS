icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: stirling-pdf-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- pdf
- manipulation
- web
- tool
title: Stirling Pdf
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/Stirling-Tools/Stirling-PDF
  tags:
  - pdf
  - manipulation
  - web
  - tool
  template: stirling-pdf.yaml
website: https://github.com/Stirling-Tools/Stirling-PDF
