# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/morphos-umbrel
description: Self-hosted file converter
endpoint:
  port: 8080
  service: web
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/morphos/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/morphos/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/morphos/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/morphos/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: morphos-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Morphos server
type: app
upstream:
  author: Dan Vergara
  categories:
  - files
  release_notes: |-
    New features:
      - Add dark mode
      - Add ffmpeg to handle images
      - Add support for ebooks
      - Add an API so other systems can interact with morphos

    Bug fixes:
      - Fix zip files preview
      - Add non-root user to the dockerfile
  source: https://github.com/danvergara/morphos
  version: 0.6.0
  website: https://github.com/danvergara/morphos
website: https://github.com/danvergara/morphos
