# grimmory-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  grimmory:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
    - SERVICE_URL_GRIMMORY_80=${SERVICE_URL_GRIMMORY_80}
    - USER_ID=${GRIMMORY_USER_ID:-0}
    - GROUP_ID=${GRIMMORY_GROUP_ID:-0}
    - TZ=${TZ:-UTC}
    - DATABASE_URL=jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-grimmory-db}
    - DATABASE_USERNAME=${SERVICE_USER_MARIADB}
    - DATABASE_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - BOOKLORE_PORT=80
    healthcheck:
      interval: 10s
      retries: 10
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1
      timeout: 5s
    image: grimmory/grimmory:nightly-20260403-3a371f7
    networks:
      appnet:
        aliases:
        - grimmory-coolify_grimmory_1
    restart: unless-stopped
    volumes:
    - grimmory-data:/app/data
    - grimmory-books:/books
    - grimmory-bookdrop:/bookdrop
  mariadb:
    environment:
    - MARIADB_USER=${SERVICE_USER_MARIADB}
    - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_MARIADBROOT}
    - MARIADB_DATABASE=${MARIADB_DATABASE:-grimmory-db}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 5s
    image: mariadb:12
    networks:
      appnet:
        aliases:
        - grimmory-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - mariadb-data:/var/lib/mysql
volumes:
  grimmory-bookdrop:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/grimmory-bookdrop
      o: bind
      type: none
  grimmory-books:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/grimmory-books
      o: bind
      type: none
  grimmory-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/grimmory-data
      o: bind
      type: none
  mariadb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mariadb-data
      o: bind
      type: none
