  release_notes: |-
    This urgent patch fixes a Termix 2.9.1 issue that could cause the server to rewrite its database many times per second, creating very high disk writes.

    It also reduces noisy plugin audit-log entries and clears the plugin read entries that 2.9.1 could pile up on first start.

    This Umbrel package keeps upstream telemetry disabled.

    Full release notes can be found at https://github.com/Termix-SSH/Termix/releases/tag/release-2.9.2-tag
