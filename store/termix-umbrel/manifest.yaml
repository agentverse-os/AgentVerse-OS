  release_notes: |-
    Important for skipped-version updates: if you are updating from before Termix 2.5.1, avoid downgrading after this update because the database-layer refactor can cause data loss on downgrade. If you must revert, restore a pre-refactor backup from your data folder.

    New features and improvements:
      - Added credential cloning, WSL local terminals, Helm and GitOps deployment options, and editable AI provider model settings
      - Improved the file manager with an editable path bar, download progress bars, and more reliable folder uploads
      - Improved tmux monitor performance and Linux packaging icons
      - This Umbrel package keeps upstream telemetry disabled


    Bug fixes:
      - Fixed passkey sign-in, jump-host connections, synced remote desktop hosts, malformed websocket crashes, and SSH agent forwarding
      - Fixed OIDC recovery, two-factor code handling, Tailscale requests on some setups, runtime SSL settings, and remote sync certificate probing
      - Fixed file manager key prompts, RDP file drops, portable imports on remote databases, and several host/sidebar layout issues


    Full release notes can be found at https://github.com/Termix-SSH/Termix/releases/tag/release-2.7.1-tag
  source: https://github.com/Termix-SSH/Termix/
  version: 2.7.1
  website: https://docs.termix.site/
