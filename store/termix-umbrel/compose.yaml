# termix-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    networks:
      appnet:
        aliases:
        - termix_guacd_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/termix-data
  web:
    depends_on:
    - guacd
    environment:
      ENABLE_TELEMETRY: 'false'
      GUACD_HOST: guacd
      GUACD_RECORDING_PATH: /termix-data/session_recordings/guacamole
      GUACD_TUNNEL_HOST: web
      POSTHOG_API_KEY: ''
    image: ghcr.io/lukegus/termix:release-2.9.2@sha256:d64c841a560c54aa7c27b0e6bbd2fbf8b51073565040d2a6bfbc127f0a72cf1e
    networks:
      appnet:
        aliases:
        - termix_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
