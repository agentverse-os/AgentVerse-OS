# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/bookstack-coolify
description: BookStack is a simple, self-hosted, easy-to-use platform for organising and storing information
endpoint:
  port: 80
  service: bookstack
env:
  GITHUB_APP_ID: ''
  GITHUB_APP_SECRET: ''
  MAIL_DRIVER: smtp
  MAIL_ENCRYPTION: tls
  MAIL_FROM: ''
  MAIL_FROM_NAME: BookStack
  MAIL_HOST: ''
  MAIL_PASSWORD: ''
  MAIL_PORT: '587'
  MAIL_USERNAME: ''
  MYSQL_DATABASE: bookstackapp
  QUEUE_CONNECTION: ''
  SERVICE_PASSWORD_APPKEY:
    generate: password
  SERVICE_PASSWORD_MYSQL:
    generate: password
  SERVICE_PASSWORD_MYSQLROOT:
    generate: password
  SERVICE_URL_BOOKSTACK: https://${APP_DOMAIN}
  SERVICE_URL_BOOKSTACK_80: https://${APP_DOMAIN}
  SERVICE_USER_MYSQL:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
