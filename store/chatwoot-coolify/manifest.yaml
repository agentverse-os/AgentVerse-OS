# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/chatwoot-coolify
description: Delightful customer relationships at scale.
endpoint:
  port: 3000
  service: chatwoot
env:
  ACTIVE_STORAGE_SERVICE: local
  CHATWOOT_DEFAULT_LOCALE: ''
  CHATWOOT_MAILER_SENDER_EMAIL: ''
  CHATWOOT_SMTP_ADDRESS: ''
  CHATWOOT_SMTP_AUTHENTICATION: ''
  CHATWOOT_SMTP_DOMAIN: ''
  CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO: ''
  CHATWOOT_SMTP_PASSWORD: ''
  CHATWOOT_SMTP_PORT: ''
  CHATWOOT_SMTP_USERNAME: ''
  ENABLE_ACCOUNT_SIGNUP: 'false'
  FORCE_SSL: 'false'
  INSTALLATION_ENV: docker
  NODE_ENV: production
  POSTGRES_DB: chatwoot
  POSTGRES_HOST: postgres
  RAILS_ENV: production
  RAILS_MAX_THREADS: '5'
  REDIS_OPENSSL_VERIFY_MODE: none
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: 'false'
  SERVICE_PASSWORD_CHATWOOT:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_URL_CHATWOOT: https://${APP_DOMAIN}
  SERVICE_URL_CHATWOOT_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
