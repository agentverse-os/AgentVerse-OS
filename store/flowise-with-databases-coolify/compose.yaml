# flowise-with-databases-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  flowise:
    depends_on:
      pg-record-manager:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
    - SERVICE_URL_FLOWISE_3001=${SERVICE_URL_FLOWISE_3001}
    - DEBUG=${DEBUG:-false}
    - DISABLE_FLOWISE_TELEMETRY=${DISABLE_FLOWISE_TELEMETRY:-true}
    - PORT=${PORT:-3001}
    - DATABASE_PATH=/root/.flowise
    - APIKEY_PATH=/root/.flowise
    - SECRETKEY_PATH=/root/.flowise
    - LOG_PATH=/root/.flowise/logs
    - BLOB_STORAGE_PATH=/root/.flowise/storage
    - FLOWISE_USERNAME=${SERVICE_USER_FLOWISE}
    - FLOWISE_PASSWORD=${SERVICE_PASSWORD_FLOWISE}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3001 || exit 1
      timeout: 5s
    image: flowiseai/flowise:latest
    networks:
      appnet:
        aliases:
        - flowise-with-databases-coolify_flowise_1
    restart: unless-stopped
    volumes:
    - flowise-data:/root/.flowise
  pg-record-manager:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-pg-record-manager}
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
    image: postgres:16
    networks:
      appnet:
        aliases:
        - flowise-with-databases-coolify_pg-record-manager_1
    restart: unless-stopped
    volumes:
    - pg-record-manager-data:/var/lib/postgresql/data
  qdrant:
    environment:
    - SERVICE_URL_QDRANT_6333=${SERVICE_URL_QDRANT_6333}
    - QDRANT__SERVICE__API_KEY=${SERVICE_PASSWORD_QDRANTAPIKEY}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      timeout: 5s
    image: qdrant/qdrant:latest
    networks:
      appnet:
        aliases:
        - flowise-with-databases-coolify_qdrant_1
    restart: unless-stopped
    volumes:
    - flowise-qdrant-data:/qdrant/storage
  redis-cache:
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - redis-cli -h localhost -p 6379 ping
      timeout: 5s
    image: redis:7
    networks:
      appnet:
        aliases:
        - flowise-with-databases-coolify_redis-cache_1
    restart: unless-stopped
    volumes:
    - flowise-redis-cache-data:/data
volumes:
  flowise-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/flowise-data
      o: bind
      type: none
  flowise-qdrant-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/flowise-qdrant-data
      o: bind
      type: none
  flowise-redis-cache-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/flowise-redis-cache-data
      o: bind
      type: none
  pg-record-manager-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/pg-record-manager-data
      o: bind
      type: none
