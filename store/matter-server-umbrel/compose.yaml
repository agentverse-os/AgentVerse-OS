# matter-server-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: ghcr.io/matter-js/python-matter-server:8.1.2@sha256:6827e352011e2d8c2bde771e446fcf72acc49150ef66bad978816bac1762aad3
    network_mode: host
    restart: on-failure
    security_opt:
    - apparmor:unconfined
    volumes:
    - ${APP_DATA_DIR}/data:/data/
    - /run/dbus:/run/dbus:ro
