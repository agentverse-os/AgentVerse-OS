# matter-server-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      FABRIC_ID: '1'
      NOBLE_BINDINGS: dbus
      PORT: '5580'
      STORAGE_PATH: /data
      VENDOR_ID: '65521'
    image: ghcr.io/matter-js/matterjs-server:1.6.0@sha256:9eb98c839d0b4b07f9230b96ad52de570f7f2a7c286c5992b4c04b6b26c08a3f
    network_mode: host
    restart: on-failure
    security_opt:
    - apparmor:unconfined
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data/
    - /run/dbus:/run/dbus:ro
