# hermes-agent: the official Nous Research image, one container — the gateway (messengers), an OpenAI-compatible API (8642) and the
# Web Dashboard (9119, HERMES_DASHBOARD=1). The agent data (.env, config.yaml, sessions, memories, skills) is in /opt/data →
# ${APP_DATA_DIR}/data. The dashboard does not listen on loopback, so it enables the auth gate itself: login admin, the password and
# the session secret are generated by Cloud OS. PUID/PGID=1000 is the image's convention for the user switch; the core creates the
# data directory with the same owner. The network is created by cloudd (external), ports are not published. Update — change the image
# tag, the config migrates itself.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.31
    command: ["gateway", "run"]
    restart: unless-stopped
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET}
      HERMES_DASHBOARD_PUBLIC_URL: https://${APP_DOMAIN}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      PUID: "1000"
      PGID: "1000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
    networks: [appnet]
    deploy:
      resources:
        limits:
          memory: 4G
