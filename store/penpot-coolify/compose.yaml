# penpot-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  frontend:
    depends_on:
      penpot-backend:
        condition: service_healthy
      penpot-exporter:
        condition: service_healthy
    environment:
    - SERVICE_URL_FRONTEND_8080=${SERVICE_URL_FRONTEND_8080}
    - PENPOT_FLAGS=${PENPOT_FRONTEND_FLAGS:-enable-login-with-password}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080
      timeout: 10s
    image: penpotapp/frontend:2.11.1
    networks:
      appnet:
        aliases:
        - penpot-coolify_frontend_1
    restart: unless-stopped
    volumes:
    - penpot-assets:/opt/data/assets
  mailpit:
    environment:
    - SERVICE_URL_MAILPIT_8025=${SERVICE_URL_MAILPIT_8025}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - /mailpit
      - readyz
      timeout: 20s
    image: axllent/mailpit:v1.28
    networks:
      appnet:
        aliases:
        - penpot-coolify_mailpit_1
    restart: unless-stopped
  penpot-backend:
    depends_on:
      penpot-valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
    - PENPOT_FLAGS=${PENPOT_BACKEND_FLAGS:-enable-login-with-password enable-smtp}
    - PENPOT_HTTP_SERVER_PORT=6060
    - PENPOT_SECRET_KEY=$SERVICE_REALBASE64_64_PENPOT
    - PENPOT_PUBLIC_URI=$SERVICE_URL_FRONTEND_8080
    - PENPOT_BACKEND_URI=http://penpot-backend
    - PENPOT_EXPORTER_URI=http://penpot-exporter
    - PENPOT_DATABASE_URI=postgresql://postgres/${POSTGRES_DB:-penpot}
    - PENPOT_DATABASE_USERNAME=${SERVICE_USER_POSTGRES}
    - PENPOT_DATABASE_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - PENPOT_REDIS_URI=redis://penpot-valkey/0
    - PENPOT_OBJECTS_STORAGE_BACKEND=fs
    - PENPOT_OBJECTS_STORAGE_FS_DIRECTORY=/opt/data/assets
    - PENPOT_TELEMETRY_ENABLED=${PENPOT_TELEMETRY_ENABLED:-false}
    - PENPOT_SMTP_DEFAULT_FROM=${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
    - PENPOT_SMTP_DEFAULT_REPLY_TO=${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
    - PENPOT_SMTP_HOST=${PENPOT_SMTP_HOST:-mailpit}
    - PENPOT_SMTP_PORT=${PENPOT_SMTP_PORT:-1025}
    - PENPOT_SMTP_USERNAME=${PENPOT_SMTP_USERNAME:-penpot}
    - PENPOT_SMTP_PASSWORD=${PENPOT_SMTP_PASSWORD:-penpot}
    - PENPOT_SMTP_TLS=${PENPOT_SMTP_TLS:-false}
    - PENPOT_SMTP_SSL=${PENPOT_SMTP_SSL:-false}
    healthcheck:
      interval: 10s
      retries: 15
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get({host:''127.0.0.1'', port:6060, path:''/readyz''}, res => process.exit(res.statusCode===200 ? 0 : 1)).on(''error'', () => process.exit(1));'
      timeout: 30s
    image: penpotapp/backend:2.11.1
    networks:
      appnet:
        aliases:
        - penpot-coolify_penpot-backend_1
    restart: unless-stopped
    volumes:
    - penpot-assets:/opt/data/assets
  penpot-exporter:
    environment:
    - PENPOT_PUBLIC_URI=$SERVICE_URL_FRONTEND_8080
    - PENPOT_REDIS_URI=redis://penpot-valkey/0
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:6061/readyz
      timeout: 10s
    image: penpotapp/exporter:2.11.1
    networks:
      appnet:
        aliases:
        - penpot-coolify_penpot-exporter_1
    restart: unless-stopped
  penpot-valkey:
    environment:
    - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
    healthcheck:
      interval: 1s
      retries: 5
      start_period: 3s
      test:
      - CMD-SHELL
      - valkey-cli ping | grep PONG
      timeout: 3s
    image: valkey/valkey:8.1
    networks:
      appnet:
        aliases:
        - penpot-coolify_penpot-valkey_1
    restart: unless-stopped
    volumes:
    - penpot-valkey-data:/data
  postgres:
    environment:
    - POSTGRES_INITDB_ARGS=--data-checksums
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=${POSTGRES_DB:-penpot}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:15
    networks:
      appnet:
        aliases:
        - penpot-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - penpot-postgresql-data:/var/lib/postgresql/data
volumes:
  penpot-assets:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/penpot-assets
      o: bind
      type: none
  penpot-postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/penpot-postgresql-data
      o: bind
      type: none
  penpot-valkey-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/penpot-valkey-data
      o: bind
      type: none
