# dashdot: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  dashdot:
    environment:
      DASHDOT_ACCEPT_OOKLA_EULA: 'true'
      DASHDOT_ALWAYS_SHOW_PERCENTAGES: 'true'
      DASHDOT_ENABLE_CPU_TEMPS: 'true'
      DASHDOT_PAGE_TITLE: dashdot
      DASHDOT_SHOW_DASH_VERSION: 'true'
      DASHDOT_SHOW_HOST: 'false'
      DASHDOT_USE_IMPERIAL: 'true'
    image: mauricenino/dashdot:6.3.4
    networks:
      appnet:
        aliases:
        - dashdot_dashdot_1
    privileged: true
    restart: unless-stopped
    volumes:
    - /:/mnt/host:ro
