  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: umbrel
  path: null
  user: admin
name: copyparty-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: copyparty
type: app
upstream:
  author: '9001'
  categories:
  - files
  release_notes: |-
    New features and improvements in this release:
      - Fixes thumbnail generation for RAW photos when using JPEG XL
      - Reduces false warnings about shadowing on case-insensitive filesystems
      - Improves symlink handling and access checks when using the optional xvol/xdev filesystem guards
      - Fixes copy-on-write settings for history folders on Btrfs


    Full release notes can be found at https://github.com/9001/copyparty/releases/tag/v1.20.26
  source: https://github.com/9001/copyparty
  version: 1.20.26
  website: https://github.com/9001/copyparty
