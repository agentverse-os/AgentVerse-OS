# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/kimai-umbrel
description: Time tracking for project-driven teams
endpoint:
  port: 8001
  service: app
env:
  APP_PASSWORD:
    generate: password
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/kimai/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/kimai/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/kimai/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/kimai/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: changeme
  path: null
  user: umbrel@umbrel.local
name: kimai-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Kimai
type: app
upstream:
  author: Kevin Papst
  categories:
  - files
  release_notes: |-
    ⚠️ Legacy API passwords are no longer supported. Update integrations to use API access tokens before upgrading.

    This update improves invoice searches, highlights unpaid invoices, and fixes monetary rounding and timezone formatting. It also preserves the selected calendar month after reloading and improves export previews.

    Security improvements include stronger login and API validation, safer templates, and corrected password-reset link expiration.

    For full release notes, visit https://github.com/kimai/kimai/releases/tag/2.72.0
  source: https://github.com/kimai/kimai
  version: 2.72.0
  website: https://www.kimai.org/
website: https://www.kimai.org/
