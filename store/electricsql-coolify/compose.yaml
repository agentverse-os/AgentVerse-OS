# electricsql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  electric:
    environment:
    - SERVICE_URL_ELECTRIC_3000=${SERVICE_URL_ELECTRIC_3000}
    - DATABASE_URL=
    - ELECTRIC_SECRET=${SERVICE_PASSWORD_64_ELECTRIC}
    - ELECTRIC_STORAGE_DIR=/app/persistent
    - ELECTRIC_USAGE_REPORTING=${ELECTRIC_USAGE_REPORTING:-false}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000/v1/health
      timeout: 5s
    image: electricsql/electric:1.4.2
    networks:
      appnet:
        aliases:
        - electricsql-coolify_electric_1
    restart: unless-stopped
    volumes:
    - electric_data:/app/persistent
volumes:
  electric_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/electric_data
      o: bind
      type: none
