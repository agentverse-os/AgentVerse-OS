  release_notes: |-
    This release includes bug fixes, security hardening, and performance improvements, including fixes for conditional form fields and document signing.

    Legacy document download links created before February 22, 2024 no longer work. Open the document in DocuSeal to download it again.

    A database migration runs automatically during this update. It takes a few seconds for smaller installs and may take 1-2 minutes for databases with around 500,000 submissions. Please leave the app running until it starts.

    If you are upgrading from a version before 3.1.3, the database migration introduced in 3.1.3 may also run on first boot.

    Full release notes can be found at https://github.com/docusealco/docuseal/releases/tag/3.3.7
