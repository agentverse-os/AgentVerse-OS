# immich: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  immich:
    depends_on:
    - immich-redis
    - immich-db
    environment:
      DB_DATABASE_NAME: immich
      DB_HOSTNAME: immich-db
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: tipi
      ENABLE_MAPBOX: 'false'
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      REDIS_HOSTNAME: immich-redis
    image: ghcr.io/immich-app/immich-server:v3.1.0
    networks:
      appnet:
        aliases:
        - immich_immich_1
    restart: unless-stopped
    volumes:
    - ${ROOT_FOLDER_HOST}/media/data/images/immich:/usr/src/app/upload
  immich-db:
    environment:
      PG_DATA: /var/lib/postgresql/data
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: tipi
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    networks:
      appnet:
        aliases:
        - immich_immich-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  immich-machine-learning:
    depends_on:
    - immich-db
    environment:
      DB_DATABASE_NAME: immich
      DB_HOSTNAME: immich-db
      DB_NAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: tipi
      NODE_ENV: production
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    networks:
      appnet:
        aliases:
        - immich_immich-machine-learning_1
    restart: unless-stopped
    volumes:
    - ${ROOT_FOLDER_HOST}/media/data/images/immich:/usr/src/app/upload
    - ${APP_DATA_DIR}/data/immich-ml-cache:/cache
  immich-redis:
    healthcheck:
      test: redis-cli ping || exit 1
    image: redis:6.2
    networks:
      appnet:
        aliases:
        - immich_immich-redis_1
    restart: unless-stopped
