# palworld-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  palworld:
    environment:
    - TZ=
    - PUID=
    - PGID=
    - MULTITHREADING=
    - MAX_PLAYERS=
    - SERVER_NAME=
    - SERVER_DESCRIPTION=
    - SERVER_PASSWORD=
    - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminPassword}
    - COMMUNITY=
    - PUBLIC_IP=${PUBLIC_IP:-}
    - PUBLIC_PORT=
    - PORT=
    - QUERY_PORT=
    - UPDATE_ON_BOOT=
    - RCON_ENABLED=
    - RCON_PORT=
    - BACKUP_ENABLED=
    - DELETE_OLD_BACKUPS=
    - OLD_BACKUP_DAYS=
    - BACKUP_CRON_EXPRESSION=
    - AUTO_UPDATE_ENABLED=
    - AUTO_UPDATE_CRON_EXPRESSION=
    - AUTO_UPDATE_WARN_MINUTES=
    - AUTO_REBOOT_ENABLED=
    - AUTO_REBOOT_EVEN_IF_PLAYERS_ONLINE=
    - AUTO_REBOOT_WARN_MINUTES=
    - AUTO_REBOOT_CRON_EXPRESSION=
    - AUTO_PAUSE_ENABLED=
    - AUTO_PAUSE_TIMEOUT_EST=
    - AUTO_PAUSE_LOG=
    - AUTO_PAUSE_DEBUG=
    - ENABLE_PLAYER_LOGGING=
    - PLAYER_LOGGING_POLL_PERIOD=
    - DIFFICULTY=
    - RANDOMIZER_TYPE=${RANDOMIZER_TYPE:-}
    - RANDOMIZER_SEED=
    - DAYTIME_SPEEDRATE=
    - NIGHTTIME_SPEEDRATE=
    - EXP_RATE=
    - PAL_CAPTURE_RATE=
    - PAL_SPAWN_NUM_RATE=
    - PAL_DAMAGE_RATE_ATTACK=
    - PAL_DAMAGE_RATE_DEFENSE=
    - PLAYER_DAMAGE_RATE_ATTACK=
    - PLAYER_DAMAGE_RATE_DEFENSE=
    - PLAYER_STOMACH_DECREASE_RATE=
    - PLAYER_STAMINA_DECREASE_RATE=
    - PLAYER_AUTO_HP_REGEN_RATE=
    - PLAYER_AUTO_HP_REGEN_RATE_IN_SLEEP=
    - PAL_STOMACH_DECREASE_RATE=
    - PAL_STAMINA_DECREASE_RATE=
    - PAL_AUTO_HP_REGEN_RATE=
    - PAL_AUTO_HP_REGEN_RATE_IN_SLEEP=
    - BUILD_OBJECT_HP_RATE=
    - BUILD_OBJECT_DAMAGE_RATE=
    - BUILD_OBJECT_DETERIORATION_DAMAGE_RATE=
    - COLLECTION_DROP_RATE=
    - COLLECTION_OBJECT_HP_RATE=
    - COLLECTION_OBJECT_RESPAWN_SPEED_RATE=
    - ENEMY_DROP_ITEM_RATE=
    - DEATH_PENALTY=
    - ENABLE_PLAYER_TO_PLAYER_DAMAGE=
    - ENABLE_FRIENDLY_FIRE=
    - ENABLE_INVADER_ENEMY=
    - ACTIVE_UNKO=
    - ENABLE_AIM_ASSIST_PAD=
    - ENABLE_AIM_ASSIST_KEYBOARD=
    - DROP_ITEM_MAX_NUM=
    - DROP_ITEM_MAX_NUM_UNKO=
    - BASE_CAMP_MAX_NUM=
    - BASE_CAMP_WORKER_MAX_NUM=
    - DROP_ITEM_ALIVE_MAX_HOURS=
    - AUTO_RESET_GUILD_NO_ONLINE_PLAYERS=
    - AUTO_RESET_GUILD_TIME_NO_ONLINE_PLAYERS=
    - GUILD_PLAYER_MAX_NUM=
    - BASE_CAMP_MAX_NUM_IN_GUILD=
    - PAL_EGG_DEFAULT_HATCHING_TIME=
    - WORK_SPEED_RATE=
    - AUTO_SAVE_SPAN=
    - IS_MULTIPLAY=
    - IS_PVP=
    - HARDCORE=
    - PAL_LOST=
    - CAN_PICKUP_OTHER_GUILD_DEATH_PENALTY_DROP=
    - ENABLE_NON_LOGIN_PENALTY=
    - ENABLE_FAST_TRAVEL=
    - IS_START_LOCATION_SELECT_BY_MAP=
    - EXIST_PLAYER_AFTER_LOGOUT=
    - ENABLE_DEFENSE_OTHER_GUILD_PLAYER=
    - INVISIBLE_OTHER_GUILD_BASE_CAMP_AREA_FX=
    - BUILD_AREA_LIMIT=
    - ITEM_WEIGHT_RATE=
    - COOP_PLAYER_MAX_NUM=
    - REGION=${REGION:-}
    - USEAUTH=
    - BAN_LIST_URL=
    - REST_API_ENABLED=
    - REST_API_PORT=
    - SHOW_PLAYER_LIST=
    - ENABLE_PREDATOR_BOSS_PAL=
    - MAX_BUILDING_LIMIT_NUM=
    - SERVER_REPLICATE_PAWN_CULL_DISTANCE=
    - SERVER_REPLICATE_PAWN_CULL_DISTANCE_IN_BASE_CAMP=
    - CROSSPLAY_PLATFORMS=
    - USE_BACKUP_SAVE_DATA=
    - USE_DEPOT_DOWNLOADER=
    - INSTALL_BETA_INSIDER=
    - ALLOW_GLOBAL_PALBOX_EXPORT=
    - ALLOW_GLOBAL_PALBOX_IMPORT=
    - EQUIPMENT_DURABILITY_DAMAGE_RATE=
    - ITEM_CONTAINER_FORCE_MARK_DIRTY_INTERVAL=
    - BOX64_DYNAREC_STRONGMEM=${BOX64_DYNAREC_STRONGMEM:-}
    - BOX64_DYNAREC_BIGBLOCK=${BOX64_DYNAREC_BIGBLOCK:-}
    - BOX64_DYNAREC_SAFEFLAGS=${BOX64_DYNAREC_SAFEFLAGS:-}
    - BOX64_DYNAREC_FASTROUND=${BOX64_DYNAREC_FASTROUND:-}
    - BOX64_DYNAREC_FASTNAN=${BOX64_DYNAREC_FASTNAN:-}
    - BOX64_DYNAREC_X87DOUBLE=${BOX64_DYNAREC_X87DOUBLE:-}
    image: thijsvanloef/palworld-server-docker:v1.4.6
    networks:
      appnet:
        aliases:
        - palworld-coolify_palworld_1
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
    - palworld-data:/palworld/
volumes:
  palworld-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/palworld-data
      o: bind
      type: none
