# rusty-kaspad-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  frontend:
    depends_on:
    - kaspad
    image: elldee/kaspa-frontend:v0.4.1@sha256:a77573dfbc706b632ba24b9087685dc0b44d588c60b5399e2c2df2a19bd38a93
    networks:
      appnet:
        aliases:
        - rusty-kaspad_frontend_1
    restart: on-failure
    stop_grace_period: 1m
  kaspad:
    image: kaspanet/rusty-kaspad:v2.1.0@sha256:f85da74b9514584451f83a2cbea3aa93f700248302fe7e3e0ab17288f93c905b
    networks:
      appnet:
        aliases:
        - rusty-kaspad_kaspad_1
    restart: on-failure
    stop_grace_period: 3m
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/data
