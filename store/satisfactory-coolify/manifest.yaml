# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/satisfactory-coolify
description: Satisfactory Dedicated Server for hosting your own Satisfactory game sessions.
endpoint:
  port: 80
  service: satisfactory-server
env:
  AUTOSAVE_NUM: '5'
  DEBUG: 'false'
  DISABLE_SEASONAL_EVENTS: 'false'
  LOG: 'false'
  MAX_TICK_RATE: '30'
  MULTI_HOME: '::'
  SERVER_GAME_PORT: ''
  SERVER_MESSAGING_PORT: ''
  SERVER_STREAMING: 'true'
  SKIP_UPDATE: 'false'
  STEAM_BETA: 'false'
  TIMEOUT: '30'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: null
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: satisfactory-coolify
notes:
- 'порт ${SERVER_GAME_PORT}:7777/tcp (satisfactory-server) не публикуется: доступ только через edge/gate'
- 'порт ${SERVER_GAME_PORT}:7777/udp (satisfactory-server) не публикуется: доступ только через edge/gate'
- 'порт ${SERVER_MESSAGING_PORT}:8888/tcp (satisfactory-server) не публикуется: доступ только через edge/gate'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
