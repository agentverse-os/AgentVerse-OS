upstream:
  author: Daniel García
  categories:
  - files
  release_notes: |-
    This update fixes security issues in website icons and emergency access, and updates the bundled Web Vault to 2026.10.1.

    It also improves two-step login compatibility, emergency account recovery, shared vault items and attachments, and fixes email two-factor authentication for SSO logins on iOS and Android.

    If you have customized Vaultwarden's configuration, check your settings before updating: invalid numeric values and schedules now prevent startup.

    For shared organizations upgrading from before 1.37.4: if you have admins you don’t fully trust, rotate the organization’s API key under Admin Console → Settings → Rotate API key.

    For custom setups using IP_HEADER=X-Forwarded-For with multiple reverse proxies, list all trusted proxies in IP_HEADER_TRUSTED_PROXIES so rate limiting and logs use the correct client IP address. Standard Umbrel installations need no proxy changes.

    Full release notes can be found at https://github.com/dani-garcia/vaultwarden/releases/tag/1.37.5
