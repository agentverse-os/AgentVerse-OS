# vaultwarden-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    command:
    - -c
    - |
      set -e
      web_vault="/tmp/web-vault-patched"
      rm -rf "$$web_vault"
      cp -R /web-vault "$$web_vault"
      main_js="$$(ls "$$web_vault"/app/main.*.js)"
      grep -Fq '&&!this.platformUtilsService.isDev()' "$$main_js"
      sed -i 's/&&!this\.platformUtilsService\.isDev()/\&\&!this.platformUtilsService.isDev()\&\&!location.hostname.endsWith(".onion")/g' "$$main_js"
      grep -Fq '&&!this.platformUtilsService.isDev()&&!location.hostname.endsWith(".onion")' "$$main_js"
      export WEB_VAULT_FOLDER="$$web_vault"
      exec /start.sh
    entrypoint: /bin/sh
    environment:
      ROCKET_PORT: 8089
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    networks:
      appnet:
        aliases:
        - vaultwarden_server_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
