# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/trigger-coolify
description: The open source background jobs platform for developers
endpoint:
  port: 3000
  service: trigger
env:
  ADMIN_EMAILS: ''
  AUTH: '1'
  AUTH_GITHUB_CLIENT_ID: ''
  AUTH_GITHUB_CLIENT_SECRET: ''
  CONTAINERS: '1'
  DEFAULT_ENV_EXECUTION_CONCURRENCY_LIMIT: '100'
  DEFAULT_ORG_EXECUTION_CONCURRENCY_LIMIT: '300'
  DEPLOY_REGISTRY_HOST: ghcr.io
  DEPLOY_REGISTRY_NAMESPACE: trigger
  DEPLOY_REGISTRY_PASSWORD: ''
  DEPLOY_REGISTRY_PROTOCOL: https
  DEPLOY_REGISTRY_USERNAME: ''
  DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ''
  DISTRIBUTION: '1'
  DOCKER_AUTOREMOVE_EXITED_CONTAINERS: '1'
  DOCKER_RUNNER_NETWORKS: ''
  EMAIL_TRANSPORT: smtp
  FROM_EMAIL: ''
  IMAGES: '1'
  INFO: '1'
  INTERNAL_OTEL_TRACE_LOGGING_ENABLED: '0'
  NETWORKS: '1'
  OBJECT_STORE_ACCESS_KEY_ID: ''
  OBJECT_STORE_BASE_URL: ''
  OBJECT_STORE_SECRET_ACCESS_KEY: ''
  POST: '1'
  POSTGRES_DB: trigger-db
  POSTGRES_USER: ''
  REPLY_TO_EMAIL: ''
  RESEND_API_KEY: ''
  SERVICE_PASSWORD_64_CLICKHOUSE:
    generate: hex64
  SERVICE_PASSWORD_64_ELECTRIC:
    generate: hex64
  SERVICE_PASSWORD_64_MAGICLINK:
    generate: hex64
  SERVICE_PASSWORD_64_SESSION:
    generate: hex64
  SERVICE_PASSWORD_64_WORKERSECRET:
    generate: hex64
  SERVICE_PASSWORD_ENCRYPTIONKEY:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_TRIGGER_3000: https://${APP_DOMAIN}
  SERVICE_USER_CLICKHOUSE:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
  SMTP_HOST: ''
  SMTP_PASSWORD: ''
  SMTP_PORT: ''
  SMTP_SECURE: ''
  SMTP_USER: ''
  SUPERVISOR_DEBUG: '0'
  TRIGGER_TELEMETRY_DISABLED: 'true'
  TRIGGER_WORKER_TOKEN: ''
  TRIGGER_WORKLOAD_API_DOMAIN: ''
  WHITELISTED_EMAILS: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: generated
  note: null
  password: DEPLOY_REGISTRY_PASSWORD
  path: null
  user: DEPLOY_REGISTRY_USERNAME
name: trigger-coolify
notes:
- 'docker-proxy: docker.sock заменён на read-only прокси (DOCKER_HOST=tcp://cloudos-docker-ro:2375)'
origin: coolify
provides: []
readme: null
requires: []
route:
