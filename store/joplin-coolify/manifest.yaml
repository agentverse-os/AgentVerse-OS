# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/joplin-coolify
description: Self-hosted sync server for Joplin
endpoint:
  port: 22300
  service: joplin
env:
  SERVICE_PASSWORD_64_POSTGRES:
    generate: hex64
  SERVICE_URL_JOPLIN: https://${APP_DOMAIN}
  SERVICE_URL_JOPLIN_22300: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: joplin-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- joplin
title: Joplin
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/laurent22/joplin/blob/dev/packages/server/README.md
  tags:
  - joplin
  template: joplin.yaml
website: https://github.com/laurent22/joplin/blob/dev/packages/server/README.md
