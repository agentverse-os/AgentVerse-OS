# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/filebrowser-coolify
description: FileBrowser is a web-based file manager and file explorer with a user-friendly interface.
endpoint:
  port: 80
  service: filebrowser
env:
  SERVICE_URL_FILEBROWSER_80: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: filebrowser-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- file-management
- storage-access
- data-organization
- file-utilization
- administration-tool
title: Filebrowser
type: app
upstream:
  categories:
  - storage
  source: https://filebrowser.org
  tags:
  - file-management
  - storage-access
  - data-organization
  - file-utilization
  - administration-tool
  template: filebrowser.yaml
website: https://filebrowser.org
