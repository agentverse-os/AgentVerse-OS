# newapi-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  new-api:
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_NEW_API_3000=${SERVICE_URL_NEW_API_3000}
    - SQL_DSN=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DATABASE:-newapi}?sslmode=disable&TimeZone=${TZ:-Asia/Shanghai}
    - REDIS_CONN_STRING=redis://redis:6379
    - TZ=${TZ:-Asia/Shanghai}
    - SESSION_SECRET=$SERVICE_BASE64_64_SESSION_SECRET
    - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD-SHELL
      - 'wget -q -O - http://localhost:3000/api/status | grep -o ''"success":\s*true'' | awk -F: ''{print $2}'''
      timeout: 10s
    image: calciumion/new-api:v0.9.2.0
    networks:
      appnet:
        aliases:
        - newapi-coolify_new-api_1
    restart: unless-stopped
  postgresql:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=${POSTGRES_DATABASE:-newapi}
    healthcheck:
      interval: 5s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-newapi}
      timeout: 10s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - newapi-coolify_postgresql_1
    restart: unless-stopped
    volumes:
    - postgresql-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 20
      test:
      - CMD
      - redis-cli
      - PING
      timeout: 10s
    image: redis:7-alpine
    networks:
      appnet:
        aliases:
        - newapi-coolify_redis_1
    restart: unless-stopped
    volumes:
    - redis-data:/data
volumes:
  postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgresql-data
      o: bind
      type: none
  redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis-data
      o: bind
      type: none
