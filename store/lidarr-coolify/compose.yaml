# lidarr-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  lidarr:
    environment:
    - SERVICE_URL_LIDARR_8686=${SERVICE_URL_LIDARR_8686}
    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-America/Toronto}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8686
      timeout: 10s
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40
    networks:
      appnet:
        aliases:
        - lidarr-coolify_lidarr_1
    restart: unless-stopped
    volumes:
    - lidarr-config:/config
    - lidarr-music:/music
    - lidarr-downloads:/downloads
volumes:
  lidarr-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/lidarr-config
      o: bind
      type: none
  lidarr-downloads:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/lidarr-downloads
      o: bind
      type: none
  lidarr-music:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/lidarr-music
      o: bind
      type: none
