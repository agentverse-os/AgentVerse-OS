# vikunja-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: vikunja
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_USER: vikunja
    healthcheck:
      interval: 2s
      start_period: 30s
      test:
      - CMD-SHELL
      - mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
    image: mariadb:10.11.8@sha256:75f6e61397758489d1dccf95db33b6b49ebfc7ec1253d40060fdf8ceb7f938a3
    networks:
      appnet:
        aliases:
        - vikunja_db_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql
  web:
    depends_on:
    - db
    environment:
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_HOST: vikunja_db_1
      VIKUNJA_DATABASE_PASSWORD: secret
      VIKUNJA_DATABASE_TYPE: mysql
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_SERVICE_PUBLICURL: http://${DEVICE_DOMAIN_NAME}:4523
      VIKUNJA_SERVICE_SECRET: ${APP_SEED}
    image: vikunja/vikunja:2.6.0@sha256:417ada6f94e81f0267aa2f007d0a811fc82d38dd2aa58351e3ea520ca01c2ea5
    networks:
      appnet:
        aliases:
        - vikunja_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/files:/app/vikunja/files
