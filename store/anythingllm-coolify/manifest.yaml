# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/anythingllm-coolify
description: AnythingLLM is the easiest to use, all-in-one AI application that can do RAG, AI Agents, and much more with no code or infrastructure headaches.
endpoint:
  port: 3001
  service: anything-llm
env:
  DISABLE_TELEMETRY: 'true'
  GID: '1000'
  PASSWORDLOWERCASE: '1'
  PASSWORDMAXCHAR: '250'
  PASSWORDMINCHAR: '6'
  PASSWORDNUMERIC: '1'
  PASSWORDREQUIREMENTS: '1'
  PASSWORDSYMBOL: '1'
  PASSWORDUPPERCASE: '1'
  SERVER_PORT: '3001'
  SERVICE_PASSWORD_AUTHTOKEN:
    generate: password
  SERVICE_PASSWORD_JWTSECRET:
    generate: password
  SERVICE_PASSWORD_SIGKEY:
    generate: password
  SERVICE_PASSWORD_SIGSALT:
    generate: password
  SERVICE_URL_ANYTHINGLLM_3001: https://${APP_DOMAIN}
  UID: '1000'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: anythingllm-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
