# mdns-repeater: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mdns-repeater:
    environment:
      dockerNIC: ${MDNS_DOCKER_NIC}
      hostNIC: ${MDNS_HOST_NIC}
    image: angelnu/mdns_repeater:latest
    network_mode: host
    restart: unless-stopped
