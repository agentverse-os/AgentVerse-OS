# convex-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  backend:
    environment:
    - SERVICE_URL_BACKEND_3210=${SERVICE_URL_BACKEND_3210}
    - SERVICE_URL_SITE_3211=${SERVICE_URL_SITE_3211}
    - INSTANCE_NAME=${INSTANCE_NAME:-self-hosted-convex}
    - INSTANCE_SECRET=${SERVICE_HEX_64_SECRET}
    - CONVEX_RELEASE_VERSION_DEV=${CONVEX_RELEASE_VERSION_DEV:-}
    - ACTIONS_USER_TIMEOUT_SECS=${ACTIONS_USER_TIMEOUT_SECS:-}
    - CONVEX_CLOUD_ORIGIN=${SERVICE_URL_BACKEND}
    - CONVEX_SITE_ORIGIN=${SERVICE_URL_SITE}
    - DATABASE_URL=${DATABASE_URL:-}
    - DISABLE_BEACON=
    - REDACT_LOGS_TO_CLIENT=
    - DO_NOT_REQUIRE_SSL=
    - POSTGRES_URL=${POSTGRES_URL:-}
    - MYSQL_URL=${MYSQL_URL:-}
    - RUST_LOG=${RUST_LOG:-info}
    - RUST_BACKTRACE=${RUST_BACKTRACE:-}
    - AWS_REGION=${AWS_REGION:-}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
    - AWS_S3_DISABLE_SSE=${AWS_S3_DISABLE_SSE:-}
    - AWS_S3_DISABLE_CHECKSUMS=${AWS_S3_DISABLE_CHECKSUMS:-}
    - S3_STORAGE_EXPORTS_BUCKET=${S3_STORAGE_EXPORTS_BUCKET:-}
    - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET=${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-}
    - S3_STORAGE_MODULES_BUCKET=${S3_STORAGE_MODULES_BUCKET:-}
    - S3_STORAGE_FILES_BUCKET=${S3_STORAGE_FILES_BUCKET:-}
    - S3_STORAGE_SEARCH_BUCKET=${S3_STORAGE_SEARCH_BUCKET:-}
    - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
    healthcheck:
      interval: 5s
      start_period: 10s
      test: curl -f http://127.0.0.1:3210/version
    image: ghcr.io/get-convex/convex-backend:a9a760ca10399ed42e1b4bb87c78539a235488c7
    networks:
      appnet:
        aliases:
        - convex-coolify_backend_1
    restart: unless-stopped
    volumes:
    - data:/convex/data
  dashboard:
    depends_on:
      backend:
        condition: service_healthy
    environment:
    - SERVICE_URL_DASHBOARD_6791=${SERVICE_URL_DASHBOARD_6791}
    - NEXT_PUBLIC_DEPLOYMENT_URL=${SERVICE_URL_BACKEND}
    healthcheck:
      interval: 5s
      start_period: 5s
      test: curl -f http://127.0.0.1:6791/
    image: ghcr.io/get-convex/convex-dashboard:a9a760ca10399ed42e1b4bb87c78539a235488c7
    networks:
      appnet:
        aliases:
        - convex-coolify_dashboard_1
    restart: unless-stopped
volumes:
  data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/data
      o: bind
      type: none
