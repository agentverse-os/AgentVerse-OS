# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/convex-coolify
description: Convex is the open-source reactive database for app developers.
endpoint:
  port: 6791
  service: dashboard
env:
  ACTIONS_USER_TIMEOUT_SECS: ''
  AWS_ACCESS_KEY_ID: ''
  AWS_REGION: ''
  AWS_S3_DISABLE_CHECKSUMS: ''
  AWS_S3_DISABLE_SSE: ''
  AWS_S3_FORCE_PATH_STYLE: ''
  AWS_SECRET_ACCESS_KEY: ''
  AWS_SESSION_TOKEN: ''
  CONVEX_RELEASE_VERSION_DEV: ''
  DATABASE_URL: ''
  INSTANCE_NAME: self-hosted-convex
  MYSQL_URL: ''
  POSTGRES_URL: ''
  RUST_BACKTRACE: ''
  RUST_LOG: info
  S3_ENDPOINT_URL: ''
  S3_STORAGE_EXPORTS_BUCKET: ''
  S3_STORAGE_FILES_BUCKET: ''
  S3_STORAGE_MODULES_BUCKET: ''
  S3_STORAGE_SEARCH_BUCKET: ''
  S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ''
  SERVICE_HEX_64_SECRET:
    generate: hex64
  SERVICE_URL_BACKEND: https://${APP_DOMAIN}
  SERVICE_URL_BACKEND_3210: https://${APP_DOMAIN}
  SERVICE_URL_DASHBOARD_6791: https://${APP_DOMAIN}
  SERVICE_URL_SITE: https://${APP_DOMAIN}
  SERVICE_URL_SITE_3211: https://${APP_DOMAIN}
