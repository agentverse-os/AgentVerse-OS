  author: Julian Prieber
  categories:
  - files
  release_notes: |-
    ⚠️ Existing users must also update LinkStack from its Admin Panel: click the update notification, then choose “Update automatically”. Updating the Umbrel app alone does not replace the application files in your persistent data.

    - Strengthened ownership checks when editing or reordering links and removing link icons.
    - Added filtering of unsafe attributes in profile descriptions and tighter restrictions on direct access to sensitive files.
    - Fixed backup download links in the Admin Panel.
    - Omitted empty addresses from downloaded contact cards.
    - Added Friendica profile verification support.

    Full release notes can be found at https://github.com/LinkStackOrg/LinkStack/releases/tag/v4.8.8
