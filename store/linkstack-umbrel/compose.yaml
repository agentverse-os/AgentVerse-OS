# linkstack-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  linkstack:
    hostname: linkstack
    image: linkstackorg/linkstack:v4.8.8@sha256:deba986fc1f7391af629c0bbcca67a1508284176bd3accf69d041ecc887dc7dd
    networks:
      appnet:
        aliases:
        - linkstack_linkstack_1
    restart: on-failure
    volumes:
    - linkstack_data:/htdocs
volumes:
  linkstack_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/linkstack_data
      o: bind
      type: none
