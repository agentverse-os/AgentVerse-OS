# komga-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  komga:
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 60s
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:25600/actuator/health
      timeout: 10s
    image: ghcr.io/gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
    networks:
      appnet:
        aliases:
        - komga_komga_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/library:/data
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
