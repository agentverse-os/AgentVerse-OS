# plunk-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  plunk:
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint:
    - /app/entry.sh
    environment:
    - SERVICE_URL_PLUNK_3000=${SERVICE_URL_PLUNK_3000}
    - REDIS_URL=redis://redis:6379
    - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql/plunk-db?schema=public
    - JWT_SECRET=${SERVICE_PASSWORD_JWTSECRET}
    - AWS_REGION=
    - AWS_ACCESS_KEY_ID=
    - AWS_SECRET_ACCESS_KEY=
    - AWS_SES_CONFIGURATION_SET=
    - NEXT_PUBLIC_API_URI=${SERVICE_URL_PLUNK}/api
    - APP_URI=${SERVICE_URL_PLUNK}
    - API_URI=${SERVICE_URL_PLUNK}/api
    - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-False}
    - NODE_OPTIONS=--no-network-family-autoselection
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD-SHELL
      - (wget -S --spider http://127.0.0.1:3000/api/health 2>&1 | grep -q "HTTP/1.1 [1-3]")
      timeout: 10s
    image: driaug/plunk:latest
    networks:
      appnet:
        aliases:
        - plunk-coolify_plunk_1
    restart: unless-stopped
  postgresql:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-plunk-db}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - plunk-coolify_postgresql_1
    restart: unless-stopped
    volumes:
    - plunk-postgresql-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 20
      test:
      - CMD
      - redis-cli
      - PING
      timeout: 10s
    image: redis:7.4-alpine
    networks:
      appnet:
        aliases:
        - plunk-coolify_redis_1
    restart: unless-stopped
    volumes:
    - plunk-redis-data:/data
volumes:
  plunk-postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/plunk-postgresql-data
      o: bind
      type: none
  plunk-redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/plunk-redis-data
      o: bind
      type: none
