# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/plunk-coolify
description: Plunk, The Open-Source Email Platform for AWS
endpoint:
  port: 3000
  service: plunk
env:
  AUTO_PROJECT_DISABLE: 'false'
  DISABLE_SIGNUPS: 'false'
  POSTGRES_DB: plunk
  POSTGRES_USER: ''
  S3_ACCESS_KEY_ID: ''
  S3_ACCESS_KEY_SECRET: ''
  S3_BUCKET: uploads
  S3_ENDPOINT: ''
  S3_PUBLIC_URL: ''
  SERVICE_FQDN_API: ${APP_DOMAIN}
  SERVICE_FQDN_PLUNK: ${APP_DOMAIN}
  SERVICE_PASSWORD_64_JWTSECRET:
    generate: hex64
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_API: https://${APP_DOMAIN}
  SERVICE_URL_API_8080: https://${APP_DOMAIN}
  SERVICE_URL_PLUNK: https://${APP_DOMAIN}
  SERVICE_URL_PLUNK_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  SES_CONFIGURATION_SET: plunk-configuration-set
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
