# firefly-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
configs:
  cron-inline-1:
    content: |
      #!/bin/sh
      # Substitute the environment variable into the cron command
      CRON_COMMAND="0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/${STATIC_CRON_TOKEN}"
      # Add the cron command to the crontab
      echo "$CRON_COMMAND" | crontab -
      # Start the cron daemon in the foreground with logging to stdout
      crond -f -L /dev/stdout
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cron:
    configs:
    - source: cron-inline-1
      target: /entrypoint.sh
    entrypoint:
    - /entrypoint.sh
    environment:
    - STATIC_CRON_TOKEN=$SERVICE_BASE64_CRONTOKEN
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD-SHELL
      - ls /entrypoint.sh || exit 1
      timeout: 10s
    image: alpine
    networks:
      appnet:
        aliases:
        - firefly-coolify_cron_1
    restart: unless-stopped
    volumes: []
  firefly:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SERVICE_URL_FIREFLY_8080=${SERVICE_URL_FIREFLY_8080}
    - APP_KEY=$SERVICE_BASE64_APPKEY
    - DB_HOST=mysql
    - DB_PORT=3306
    - DB_CONNECTION=mysql
    - DB_DATABASE=${MYSQL_DATABASE:-firefly}
    - DB_USERNAME=$SERVICE_USER_MYSQL
    - DB_PASSWORD=$SERVICE_PASSWORD_MYSQL
    - STATIC_CRON_TOKEN=$SERVICE_BASE64_CRONTOKEN
    - TRUSTED_PROXIES=*
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080/health
      timeout: 20s
    image: fireflyiii/core:latest
    networks:
      appnet:
        aliases:
        - firefly-coolify_firefly_1
    restart: unless-stopped
    volumes:
    - firefly-upload:/var/www/html/storage/upload
  mysql:
    environment:
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-firefly}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mariadb-admin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -p${SERVICE_PASSWORD_MYSQLROOT}
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - firefly-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - firefly-mysql-data:/var/lib/mysql
volumes:
  firefly-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/firefly-mysql-data
      o: bind
      type: none
  firefly-upload:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/firefly-upload
      o: bind
      type: none
