  port: 8080
  service: firefly
env:
  MYSQL_DATABASE: firefly
  SERVICE_BASE64_APPKEY:
    generate: hex64
  SERVICE_BASE64_CRONTOKEN:
    generate: hex64
  SERVICE_PASSWORD_MYSQL:
    generate: password
  SERVICE_PASSWORD_MYSQLROOT:
    generate: password
  SERVICE_URL_FIREFLY_8080: https://${APP_DOMAIN}
  SERVICE_USER_MYSQL:
    generate: password
  STATIC_CRON_TOKEN: ''
