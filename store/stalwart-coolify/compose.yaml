# stalwart-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  stalwart:
    environment:
    - SERVICE_URL_STALWART_8080=${SERVICE_URL_STALWART_8080}
    expose:
    - '8080'
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/healthz/live || curl -fsSk https://127.0.0.1:443/healthz/live
      timeout: 10s
    image: stalwartlabs/stalwart:v1.1.0
    networks:
      appnet:
        aliases:
        - stalwart-coolify_stalwart_1
    restart: unless-stopped
    volumes:
    - stalwart-mail:/etc/stalwart
    - stalwart-data:/var/lib/stalwart
    - /etc/localtime:/etc/localtime:ro
volumes:
  stalwart-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/stalwart-data
      o: bind
      type: none
  stalwart-mail:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/stalwart-mail
      o: bind
      type: none
