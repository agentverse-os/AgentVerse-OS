# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/mstream-umbrel
description: A private music server
endpoint:
  port: 3000
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/mstream/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/mstream/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/mstream/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/mstream/4.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/mstream/5.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/mstream/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: mstream-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: mStream
type: app
upstream:
  author: Iros Software
  categories:
  - media
  release_notes: |-
    This update adds opt-in federation requests and lets federated mStream servers be browsed from the web app.

    It also adds AutoDJ song-length filters and improves Discovery readiness/auth handling.

    Full release notes can be found at https://github.com/IrosTheBeggar/mStream/releases/tag/v6.25.0
  source: https://github.com/IrosTheBeggar/mStream
  version: 6.25.0
  website: https://mstream.io/
website: https://mstream.io/
