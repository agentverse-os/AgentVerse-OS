  release_notes: |-
    This update moves mStream 6.33.1 to a rebuilt image with Node.js 24.22.3, which includes the November 2026 Node.js security fixes. There are no changes to mStream itself.

    mStream 6.33.1 improves music transcoding and adds support for upcoming portable-player features:

    - Adds higher-quality 256 and 320 kbps MP3 transcoding and sample-rate selection.
    - Adds APIs for arranging tracks into a smooth listening order and reading mood scores.
    - Fixes missing cover art in Opus and OGG downloads from YouTube.
    - Improves federated streaming and peer-to-peer components.

    If you're updating from a version before mStream 6.26.0, please note that the Subsonic API and legacy Velvet UI have been removed.
    Full release notes can be found at https://github.com/IrosTheBeggar/mStream/releases/tag/v6.33.1
