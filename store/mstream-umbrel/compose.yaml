# mstream-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/mstream:6.33.1@sha256:28aa5fac4d604fd8a696f30ecdbe6d637f39f84599e84868a7de2dabaadc89cb
    networks:
      appnet:
        aliases:
        - mstream_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${UMBREL_ROOT}/data/storage/downloads/music:/music
