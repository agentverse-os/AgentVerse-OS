# kitchenowl-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: kitchenowl
      POSTGRES_PASSWORD: password
      POSTGRES_USER: kitchenowl
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 80s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 60s
    image: postgres:17.4@sha256:fe3f571d128e8efadcd8b2fde0e2b73ebab6dbec33f6bfe69d98c682c7d8f7bd
    networks:
      appnet:
        aliases:
        - kitchenowl_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/kitchenowl_db:/var/lib/postgresql/data
  web:
    depends_on:
    - db
    environment:
      DB_DRIVER: postgresql
      DB_HOST: kitchenowl_db_1
      DB_NAME: kitchenowl
      DB_PASSWORD: password
      DB_USER: kitchenowl
      JWT_SECRET_KEY: ${APP_PASSWORD}
    image: tombursch/kitchenowl:v0.7.10@sha256:bd821a41b8cb27fd7fcf429acd1fc67e9f889485a2cd1193d68c2d804a8e1bef
    networks:
      appnet:
        aliases:
        - kitchenowl_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/kitchenowl_files:/data
