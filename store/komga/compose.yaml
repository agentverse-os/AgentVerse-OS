# komga: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  komga:
    environment:
      TZ: ${TZ}
    image: ghcr.io/gotson/komga:1.26.3
    networks:
      appnet:
        aliases:
        - komga_komga_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/data:/data
    - ${ROOT_FOLDER_HOST}/media:/media
