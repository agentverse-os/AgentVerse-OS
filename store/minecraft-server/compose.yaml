# minecraft-server: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  minecraft-server:
    environment:
      EULA: 'TRUE'
      VERSION: ${MC_VERSION:-LATEST}
    image: itzg/minecraft-server:latest
    networks:
      appnet:
        aliases:
        - minecraft-server_minecraft-server_1
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
    - ${APP_DATA_DIR}/data/minecraft-data:/data
