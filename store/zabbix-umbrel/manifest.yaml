# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/zabbix-umbrel
description: The all-in-one, open-source solution that lets you monitor anything
endpoint:
  port: 8080
  service: zabbix-frontend
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/zabbix/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zabbix/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zabbix/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/zabbix/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: zabbix
  path: null
  user: Admin
name: zabbix-umbrel
notes:
- 'порт 10050:10050 (zabbix-server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Zabbix
type: app
upstream:
  author: Zabbix LLC
  categories:
  - networking
  release_notes: |-
    This major update automatically upgrades the monitoring database. Back up your Zabbix data before updating, and leave the app running until the upgrade finishes. Returning to an older version requires restoring your backup.

    Zabbix 8.0 includes:
      - New event-processing options and manual suppression of trigger events
      - Improved proxy and proxy-group permissions and stricter API access controls
      - New JSONPath, XPath, and string functions for monitoring expressions
      - A dark blue theme and improved form validation
      - Updated monitoring templates and improvements to agent reliability


    Review your user roles and API permissions after upgrading. API access is disabled by default for new roles.

    Full release notes are available at https://www.zabbix.com/rn/rn8.0.0
  source: https://github.com/zabbix/zabbix
  version: 8.0.0
  website: https://www.zabbix.com/
website: https://www.zabbix.com/
