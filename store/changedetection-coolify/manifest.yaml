# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/changedetection-coolify
description: Website change detection monitor and notifications.
endpoint:
  port: 5000
  service: changedetection
env:
  DISABLE_VERSION_CHECK: 'true'
  FETCH_WORKERS: '10'
  HIDE_REFERER: 'true'
  LOGGER_LEVEL: DEBUG
  MAX_CONCURRENT_CHROME_PROCESSES: '10'
  MINIMUM_SECONDS_RECHECK_TIME: '3'
  PGID: '1000'
  PLAYWRIGHT_DRIVER_URL: ws://browser-sockpuppet-chrome:3000
  PUID: '1000'
  SCREENSHOT_MAX_HEIGHT: '16000'
  SCREEN_DEPTH: '16'
  SCREEN_HEIGHT: '1024'
  SCREEN_WIDTH: '1920'
  SERVICE_URL_CHANGEDETECTION: https://${APP_DOMAIN}
  SERVICE_URL_CHANGEDETECTION_5000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: changedetection-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: PUID
  hint: 'по умолчанию: 1000'
  label: puid
  options: null
  required: false
  type: text
