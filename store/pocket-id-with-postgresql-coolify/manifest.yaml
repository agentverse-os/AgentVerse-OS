# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/pocket-id-with-postgresql-coolify
description: A simple and secure OIDC provider with passkey authentication
endpoint:
  port: 1411
  service: pocket-id
env:
  EMAIL_API_KEY_EXPIRATION_ENABLED: 'false'
  EMAIL_LOGIN_NOTIFICATION_ENABLED: 'false'
  EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: 'false'
  KEYS_STORAGE: database
  MAXMIND_LICENSE_KEY: ''
  PGID: '1000'
  POSTGRES_DB: pocketid
  POSTGRES_USER: ''
  PUID: '1000'
  SERVICE_PASSWORD_64_POCKETID:
    generate: hex64
  SERVICE_PASSWORD_POSTGRESQL:
    generate: password
  SERVICE_URL_POCKETID: https://${APP_DOMAIN}
  SERVICE_URL_POCKETID_1411: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRESQL:
    generate: password
  SMTP_FROM: ''
  SMTP_HOST: ''
  SMTP_PASSWORD: ''
  SMTP_PORT: '587'
  SMTP_SKIP_CERT_VERIFY: 'false'
  SMTP_TLS: starttls
  SMTP_USER: ''
  TRUST_PROXY: 'true'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
