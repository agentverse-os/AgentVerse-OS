# imgcompress-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  imgcompress:
    environment:
    - SERVICE_URL_IMGCOMPRESS_5000=${SERVICE_URL_IMGCOMPRESS_5000}
    - DISABLE_LOGO=${DISABLE_LOGO:-false}
    - DISABLE_STORAGE_MANAGEMENT=${DISABLE_STORAGE_MANAGEMENT:-false}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - python
      - /container/healthcheck.py
      timeout: 10s
    image: karimz1/imgcompress:1.0.0
    networks:
      appnet:
        aliases:
        - imgcompress-coolify_imgcompress_1
    restart: unless-stopped
