# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/mailflow-umbrel
description: Unified self-hosted webmail client
endpoint:
  port: 80
  service: frontend
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/mailflow/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/mailflow/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/mailflow/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/mailflow/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: mailflow-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: MailFlow
type: app
upstream:
  author: maathimself
  categories:
  - networking
  release_notes: |-
    You will be signed out once after updating. Reload open MailFlow tabs and sign in again. Single sign-on users with a MailFlow authenticator will now be asked for its code.

    - Fixed security issues that could bypass two-factor sign-in through recovery email or single sign-on. - Changing a recovery email now requires confirmation, and administrators can indicate when an identity provider already enforces multi-factor authentication. - MailFlow now runs without Redis, with sessions and temporary data stored in PostgreSQL. - Added spam controls on phones and clearer folder-search scope. - Improved the composer toolbar, large-text menus, message-list layout, and Proton Mail Bridge message previews.

    Since version 4.0, contacts apps using passwords can no longer sign in through CardDAV when SSO-only or required two-factor authentication is enabled.

    Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.4.0
  source: https://github.com/maathimself/mailflow
  version: 4.4.0
  website: https://mailflow.sh
website: https://mailflow.sh
