# mailflow-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:3395
      DB_HOST: mailflow_postgres_1
      DB_NAME: mailflow
      DB_PASSWORD: mailflow
      DB_PORT: 5432
      DB_USER: mailflow
      ENCRYPTION_KEY: ${APP_SEED}
      FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:3395
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      IMAP_MAX_PERSISTENT_PER_HOST: ''
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${APP_SEED}
      TRUST_PROXY_HOPS: 2
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      VAPID_SUBJECT: ''
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/health || exit 1
      timeout: 5s
    image: ghcr.io/maathimself/mailflow-backend:4.4.0@sha256:db540d4bc86da0de6e3c8fe86b0b0b79b42caeb245beb8231d7a4b4428306e5d
    networks:
      appnet:
        aliases:
        - mailflow_backend_1
    restart: on-failure
    stop_grace_period: 1m
  frontend:
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: mailflow_backend_1
      TLS_MODE: off
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 20s
      test:
      - CMD-SHELL
      - wget -qO/dev/null http://127.0.0.1:2080/healthz || exit 1
      timeout: 5s
    image: ghcr.io/maathimself/mailflow-frontend:4.4.0@sha256:74be6c108479985214fe54ac30c14fabe64c7a80a54100f80ad2b89b45fa6f43
    networks:
      appnet:
        aliases:
        - mailflow_frontend_1
    restart: on-failure
    stop_grace_period: 1m
  postgres:
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_PASSWORD: mailflow
      POSTGRES_USER: mailflow
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -U mailflow -d mailflow
      timeout: 5s
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    networks:
      appnet:
        aliases:
        - mailflow_postgres_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
