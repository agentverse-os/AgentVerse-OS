  author: Grafana Labs
  categories:
  - networking
  release_notes: |-
    ⚠️ If you're updating from before Grafana 13.1, Prometheus Azure/SigV4 authentication and the Zipkin core plugin were removed from Grafana core. Review the upstream notes if you use those integrations.

    Grafana 13.2.1 includes security fixes for CVE-2026-12704 and CVE-2026-14199.

    This release also fixes dashboard import variables, bundled plugin packaging, and panel editor resizing.

    Full release notes can be found at https://github.com/grafana/grafana/releases/tag/v13.2.1
  source: https://github.com/grafana/grafana
  version: 13.2.1
  website: https://grafana.com
website: https://grafana.com
