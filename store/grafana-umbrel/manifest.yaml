# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/grafana-umbrel
description: The open-source platform for monitoring and observability
endpoint:
  port: 3000
  service: web
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/grafana/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/grafana/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/grafana/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/grafana/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: admin
  path: null
  user: admin
name: grafana-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Grafana
type: app
upstream:
  author: Grafana Labs
  categories:
  - networking
  release_notes: |-
    This update lets you connect an SMTP email provider in Grafana's app settings on umbrelOS 2.0, for email alerts, invitations and password resets.

    Previous Grafana 13.3.1 release notes:

    This update fixes six security vulnerabilities and updates time zone data for 2026. It also allows same-host URL changes for connection-backed provisioning repositories.

    If you're updating from before Grafana 13.1, Prometheus Azure/SigV4 authentication and the Zipkin core plugin were removed from Grafana core. Review the upstream notes if you use those integrations.

    Full release notes: https://github.com/grafana/grafana/releases/tag/v13.3.1
  source: https://github.com/grafana/grafana
  version: 13.3.1-patch.1
  website: https://grafana.com
website: https://grafana.com
