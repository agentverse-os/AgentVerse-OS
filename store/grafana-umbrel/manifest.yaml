  port: 3000
  service: web
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/grafana/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/grafana/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/grafana/3.jpg
health: null
hooks: {}
host_docker_socket: false
