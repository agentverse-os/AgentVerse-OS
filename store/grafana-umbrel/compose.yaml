# grafana-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GODEBUG: multipathtcp=0
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    networks:
      appnet:
        aliases:
        - grafana_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/var/lib/grafana
