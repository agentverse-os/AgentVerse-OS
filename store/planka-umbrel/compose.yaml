# planka-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: http://${DEVICE_DOMAIN_NAME}:8546
      DATABASE_URL: postgresql://postgres@planka_db_1/planka
      DEFAULT_ADMIN_EMAIL: umbrel@umbrel.local
      DEFAULT_ADMIN_NAME: Umbrel
      DEFAULT_ADMIN_PASSWORD: ${APP_PASSWORD}
      DEFAULT_ADMIN_USERNAME: umbrel
      SECRET_KEY: ${APP_SEED}
      TRUST_PROXY: 0
    image: ghcr.io/plankanban/planka:2.2.1@sha256:125f45330853210c678fed1132bedc0912b4a11a27779b79802fbca108e069e2
    networks:
      appnet:
        aliases:
        - planka_app_1
    restart: on-failure
    user: 1000:1000
  db:
    environment:
      POSTGRES_DB: planka
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d planka
      timeout: 5s
    image: postgres:16.13-alpine3.23@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    networks:
      appnet:
        aliases:
        - planka_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
