# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/home-assistant-umbrel
description: Home automation that puts local control & privacy first
endpoint:
  port: 8123
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/home-assistant/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/home-assistant/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/home-assistant/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/home-assistant/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: home-assistant-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Home Assistant
type: app
upstream:
  author: Home Assistant
  categories:
  - automation
  release_notes: |-
    ⚠️ If updating from a version before 2026.11, review the backward-incompatible changes at https://www.home-assistant.io/blog/2026/11/04/release-202611/. Entity display names may change; update custom dashboard cards first. Z-Wave users need zwave-js-server 3.11.0 or newer. Some deprecated integration actions and entities have been removed.

    This patch release includes bug fixes and improvements across multiple integrations:
      - Fix Hue migration for multi-channel Zigbee devices and improve LG webOS TV connectivity
      - Fix Reolink playback, Axis camera authentication, and ONVIF stream recovery
      - Prevent MQTT reload loops and Alexa Devices from replaying the last voice command after reload
      - Improve privacy by redacting sensitive diagnostics and avoiding configuration values in logs
      - Enforce text helper validation patterns and restore Jellyfin artist album listings


    Full release notes are available at https://github.com/home-assistant/core/releases/
  source: https://github.com/home-assistant/core
  version: 2026.11.2
  website: https://home-assistant.io
website: https://home-assistant.io
