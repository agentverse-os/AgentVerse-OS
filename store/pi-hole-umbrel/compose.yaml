# pi-hole-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    cap_add:
    - NET_ADMIN
    environment:
    - FTLCONF_webserver_api_password=${APP_PASSWORD}
    - FTLCONF_webserver_port=8082,[::]:8082
    - FTLCONF_dns_listeningMode=all
    image: pihole/pihole:2026.11.0@sha256:66c798d79a95c2691f280329c3611dba1746117c61c9f331907ca35a06a52778
    network_mode: host
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/pihole:/etc/pihole/
    - ${APP_DATA_DIR}/data/dnsmasq:/etc/dnsmasq.d/
