# seafile-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mariadb:
    environment:
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-seafile-db}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - seafile-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - seafile_mariadb_data:/var/lib/mysql
  memcached:
    entrypoint: memcached -m 256
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - bash -c "echo version | (exec 3<>/dev/tcp/localhost/11211; cat >&3; timeout 0.5 cat <&3; exec 3<&-)"
      timeout: 20s
    image: memcached:latest
    networks:
      appnet:
        aliases:
        - seafile-coolify_memcached_1
    restart: unless-stopped
  seafile:
    depends_on:
      mariadb:
        condition: service_healthy
      memcached:
        condition: service_started
    environment:
    - SERVICE_URL_SEAFILE_80=${SERVICE_URL_SEAFILE_80}
    - SEAFILE_SERVER_HOSTNAME=${SERVICE_FQDN_SEAFILE}
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_ROOT_PASSWD=${SERVICE_PASSWORD_MYSQLROOT}
    - DB_USER=${SERVICE_USER_MYSQL}
    - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}
    - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}
    - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}
    - TIME_ZONE=${TIME_ZONE:-UTC}
    - INIT_SEAFILE_ADMIN_EMAIL=${INIT_SEAFILE_ADMIN_EMAIL:-test@example.com}
    - INIT_SEAFILE_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    - SEAFILE_SERVER_PROTOCOL=https
    - SITE_ROOT=${SITE_ROOT:-/}
    - NON_ROOT=${NON_ROOT:-false}
    - JWT_PRIVATE_KEY=${SERVICE_PASSWORD_64_JWT}
    - SEAFILE_LOG_TO_STDOUT=${SEAFILE_LOG_TO_STDOUT:-true}
    - FILE_SERVER_ROOT=${SERVICE_URL_SEAFILE}/seafhttp
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80/api2/ping
      timeout: 20s
    image: seafileltd/seafile-mc:12.0-latest
    networks:
      appnet:
        aliases:
        - seafile-coolify_seafile_1
    restart: unless-stopped
    volumes:
    - seafile-data:/shared
volumes:
  seafile-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/seafile-data
      o: bind
      type: none
  seafile_mariadb_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/seafile_mariadb_data
      o: bind
      type: none
