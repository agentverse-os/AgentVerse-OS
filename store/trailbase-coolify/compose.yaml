# trailbase-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  trailbase:
    environment:
    - SERVICE_URL_TRAILBASE_4000=${SERVICE_URL_TRAILBASE_4000}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:4000/api/healthcheck
      timeout: 5s
    image: trailbase/trailbase:0.35.12
    networks:
      appnet:
        aliases:
        - trailbase-coolify_trailbase_1
    restart: unless-stopped
    volumes:
    - trailbase-data:/app/traildepot
volumes:
  trailbase-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/trailbase-data
      o: bind
      type: none
