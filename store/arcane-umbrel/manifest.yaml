# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/arcane-umbrel
description: An easy and modern Docker management platform
endpoint:
  port: 3552
  service: arcane
env:
  APP_PASSWORD:
    generate: password
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/arcane/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/arcane/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/arcane/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/arcane/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/arcane/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/arcane/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: arcane-admin
  path: null
  user: arcane
name: arcane-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Arcane
type: app
upstream:
  author: Arcane
  categories:
  - developer
  release_notes: |-
    This update fixes an issue where Arcane could show its Docker environment as offline after starting, with "permission denied" errors in the logs. Arcane now waits for its built-in Docker engine to be ready before it starts.

    This update fixes an issue where containers deployed with Arcane could not be reached on their published ports through your Umbrel's IPv4 address, while access through umbrel.local or IPv6 still worked. If you were affected, restart your Umbrel after updating to clear any leftover network rules.

    This update improves container name sorting, shows the configured image for Compose services, and fixes image update planning. It also redacts secrets from logged request paths and improves certificate handling for backups.
    If you're updating from a pre-2.0 version, back up your Arcane data first and review the v2 migration guide if you use OIDC, API keys/automation, Edge mTLS remote environments, Apprise notifications, or deprecated prune/GitOps settings.
    Full release notes can be found at https://github.com/getarcaneapp/arcane/releases/tag/v2.17.3
  source: https://github.com/getarcaneapp/arcane
  version: 2.17.3-patch.1
  website: https://getarcane.app/
website: https://getarcane.app/
