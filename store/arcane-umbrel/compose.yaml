# arcane-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  arcane:
    depends_on:
    - docker
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:3552
      ENCRYPTION_KEY: ${APP_PASSWORD}
      JWT_SECRET: ${APP_PASSWORD}
      PGID: 1000
      PUID: 1000
    image: ghcr.io/getarcaneapp/arcane:v2.10.1@sha256:5695ac9b3ffb4dc8ac33030e92c87f2fa64f431b03d63605316af0cb713156de
    networks:
      appnet:
        aliases:
        - arcane_arcane_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app_data:/app/data
    - ${APP_DATA_DIR}/data/projects:/app/data/projects
    - ${APP_DATA_DIR}/data/docker:/var/run
  docker:
    command: |
      dockerd
        --bridge dind0
        --data-root /data/data
        --exec-root /data/exec
        --host unix:///data/docker.sock
        --pidfile /data/docker.pid
    entrypoint: /entrypoint.sh
    environment:
      DOCKER_ENSURE_BRIDGE: dind0:10.32.0.1/16
    image: docker:27.2.0-dind@sha256:f9f72ad901a78f27be922b2d320bbc263174f12919c1b37e6a01f828fa904565
    network_mode: host
    privileged: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
    - ${APP_DATA_DIR}/data/docker:/data
