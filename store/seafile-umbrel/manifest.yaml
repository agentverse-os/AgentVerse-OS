# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/seafile-umbrel
description: Reliable and Performant File Sync and Share Solution
endpoint:
  port: 80
  service: seafile
env:
  APP_PASSWORD:
    generate: password
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/seafile/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/seafile/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/seafile/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/seafile/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: umbrel
name: seafile-umbrel
notes:
- 'порт 8921:80 (seadoc) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Seafile
type: app
upstream:
  author: Seafile
  categories:
  - files
  release_notes: Updated Seafile Community Edition to version 14.0.9. This release includes the 14.0 upgrade line with file sharing and collaboration fixes, updated Docker deployment defaults, and configuration updates for WebDAV, search, thumbnails, local passwords, and traffic limits.
  source: https://github.com/haiwen/seafile
  version: 14.0.9
  website: https://www.seafile.com/
website: https://www.seafile.com/
