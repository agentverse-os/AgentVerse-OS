# zeronote-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - NODE_ENV=production
    image: ghcr.io/besoeasy/zeronote:1.0.12@sha256:208586649fcf38a86b73f2b7ed5888d71faac38729fd00c5a793ab90b09ecf2f
    networks:
      appnet:
        aliases:
        - zeronote_app_1
    restart: on-failure
    stop_grace_period: 5m
    user: 1000:1000
