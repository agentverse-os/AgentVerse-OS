# guacamole: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  guacamole:
    environment:
      GUACD_HOSTNAME: guacamole-guacd
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      POSTGRESQL_USER: guacamole
      TOTP_ENABLED: ${GUACAMOLE_TOTP_ENABLED}
    image: guacamole/guacamole:1.6.0
    networks:
      appnet:
        aliases:
        - guacamole_guacamole_1
    restart: unless-stopped
  guacamole-db:
    environment:
      POSTGRES_DB: guacamole
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      POSTGRES_USER: guacamole
    image: postgres:14
    networks:
      appnet:
        aliases:
        - guacamole_guacamole-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    - ${APP_DATA_DIR}/data/init/sql:/config/sql
    - ${APP_DATA_DIR}/data/init/init-guacamole.sh:/docker-entrypoint-initdb.d/init-guacamole.sh
  guacamole-guacd:
    image: guacamole/guacd:1.5.5
    networks:
      appnet:
        aliases:
        - guacamole_guacamole-guacd_1
    restart: unless-stopped
