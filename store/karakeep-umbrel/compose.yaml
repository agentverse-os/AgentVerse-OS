# karakeep-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chrome:
    command:
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
    image: ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa
    init: true
    networks:
      appnet:
        aliases:
        - karakeep_chrome_1
    restart: on-failure
  meilisearch:
    environment:
      MEILI_MASTER_KEY: ${APP_SEED}
      MEILI_NO_ANALYTICS: 'true'
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    networks:
      appnet:
        aliases:
        - karakeep_meilisearch_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/meilisearch_data:/meili_data
  web:
    depends_on:
    - chrome
    - meilisearch
    environment:
      BROWSER_WEB_URL: http://karakeep_chrome_1:9222
      DATA_DIR: /data
      KARAKEEP_VERSION: release
      MEILI_ADDR: http://karakeep_meilisearch_1:7700
      MEILI_MASTER_KEY: ${APP_SEED}
      NEXTAUTH_SECRET: ${APP_SEED}
      NEXTAUTH_URL: http://${DEVICE_DOMAIN_NAME}:8620
    image: ghcr.io/karakeep-app/karakeep:0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
    networks:
      appnet:
        aliases:
        - karakeep_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/karakeep_data:/data
