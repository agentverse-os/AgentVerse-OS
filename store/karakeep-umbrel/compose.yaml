# karakeep-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chrome:
    command:
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
    init: true
    networks:
      appnet:
        aliases:
        - karakeep_chrome_1
    restart: on-failure
  meilisearch:
    environment:
      MEILI_MASTER_KEY: ${APP_SEED}
      MEILI_NO_ANALYTICS: 'true'
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    networks:
      appnet:
        aliases:
        - karakeep_meilisearch_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/meilisearch_data:/meili_data
  web:
    depends_on:
    - chrome
    - meilisearch
    environment:
      BROWSER_WEB_URL: http://karakeep_chrome_1:9222
      DATA_DIR: /data
      KARAKEEP_VERSION: release
      MEILI_ADDR: http://karakeep_meilisearch_1:7700
      MEILI_MASTER_KEY: ${APP_SEED}
      NEXTAUTH_SECRET: ${APP_SEED}
      NEXTAUTH_URL: http://${DEVICE_DOMAIN_NAME}:8620
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    networks:
      appnet:
        aliases:
        - karakeep_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/karakeep_data:/data
