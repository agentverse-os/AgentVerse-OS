# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/karakeep-umbrel
description: A bookmark-everything app
endpoint:
  port: 3000
  service: web
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/karakeep/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/karakeep/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/karakeep/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/karakeep/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/karakeep/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: karakeep-umbrel
notes:
- 'web: env_file из каталога проигнорирован (значения — через настройки приложения)'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Karakeep
type: app
upstream:
  author: karakeep.app
  categories:
  - files
  release_notes: |-
    ⚠️ If upgrading from a version before 0.34.0, you will need to sign in again. Before updating, resolve any accounts whose email addresses differ only by capitalization by deleting the unused duplicate account, or those accounts may be locked out. API keys are unaffected.

    This release refreshes the web interface and improves bookmarking, reading, and search:
      - Redesigned bookmark cards, reader, settings, and dark mode
      - Easier smart-list filters and faster smart lists
      - Cleaner article extraction and notes that save as you type
      - More reliable highlights, PDF processing, and search filters
      - Security fixes for avatar cleanup, shared-list privacy, webhook redirects, and sign-in rate limiting


    Full release notes can be found at https://github.com/karakeep-app/karakeep/releases/tag/v0.35.0
  source: https://github.com/karakeep-app/karakeep
  version: 0.35.0
  website: https://karakeep.app/
website: https://karakeep.app/
