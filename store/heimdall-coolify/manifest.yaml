# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/heimdall-coolify
description: Heimdall is a dashboard for managing and organizing your server applications.
endpoint:
  port: 80
  service: heimdall
env:
  SERVICE_URL_HEIMDALL: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: heimdall-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- dashboard
- server
- applications
- interface
title: Heimdall
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/linuxserver/Heimdall
  tags:
  - dashboard
  - server
  - applications
  - interface
  template: heimdall.yaml
website: https://github.com/linuxserver/Heimdall
