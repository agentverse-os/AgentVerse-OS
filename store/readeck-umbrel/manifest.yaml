# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/readeck-umbrel
description: Save web pages to read and keep forever
endpoint:
  port: 8000
  service: web
env:
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/readeck/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/readeck/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/readeck/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/readeck/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/readeck/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: readeck-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Readeck
type: app
upstream:
  author: Readeck
  categories:
  - files
  release_notes: |-
    Readeck 0.23.2 adds frontend timezone support, improves Fediverse content fetching, unifies localized time formats, and prevents edited bookmark properties from being overwritten while a new link is finishing processing.

    If you're updating from a pre-0.23 version, the 0.23 series also includes a refreshed dashboard and interface, bookmark notes, sharing options, new filters, and OpenID Connect support. Readeck's previous Forwarded Authentication support has been removed upstream.
  source: https://codeberg.org/readeck/readeck
  version: 0.23.2
  website: https://readeck.org
website: https://readeck.org
