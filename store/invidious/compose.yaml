# invidious: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  invidious:
    depends_on:
      invidious-db:
        condition: service_healthy
    environment:
      INVIDIOUS_CONFIG: |-
        db:
          dbname: invidious
          user: tipi
          password: tipi
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: ${INVIDIOUS_COMPANION_KEY}
        hmac_key: ${INVIDIOUS_HMAC_KEY}
        use_innertube_for_captions: true
        domain: ${INVIDIOUS_DOMAIN}
        external_port: ${INVIDIOUS_EXTERNAL_PORT:-${APP_PORT}}
        https_only: ${INVIDIOUS_HTTPS_ONLY}
    healthcheck:
      interval: 30s
      retries: 2
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit 1
      timeout: 5s
    image: quay.io/invidious/invidious:master
    networks:
      appnet:
        aliases:
        - invidious_invidious_1
    restart: unless-stopped
  invidious-companion:
    cap_drop:
    - ALL
    environment:
      SERVER_SECRET_KEY: ${INVIDIOUS_COMPANION_KEY}
    image: quay.io/invidious/invidious-companion:latest
    networks:
      appnet:
        aliases:
        - invidious_invidious-companion_1
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  invidious-db:
    environment:
      POSTGRES_DB: invidious
      POSTGRES_PASSWORD: tipi
      POSTGRES_USER: tipi
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
    image: postgres:14
    networks:
      appnet:
        aliases:
        - invidious_invidious-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    - ${APP_DATA_DIR}/data/init/sql:/config/sql
    - ${APP_DATA_DIR}/data/init/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
