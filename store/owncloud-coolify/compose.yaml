# owncloud-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mariadb:
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_bin
    - --max-allowed-packet=128M
    - --innodb-log-file-size=64M
    environment:
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MARIADBROOT}
    - MYSQL_USER=${SERVICE_USER_MARIADB}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - MYSQL_DATABASE=${DB_NAME:-owncloud}
    - TZ=auto
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:latest
    networks:
      appnet:
        aliases:
        - owncloud-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - owncloud-mysql-data:/var/lib/mysql
  owncloud:
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_OWNCLOUD_8080=${SERVICE_URL_OWNCLOUD_8080}
    - OWNCLOUD_DOMAIN=${SERVICE_FQDN_OWNCLOUD}
    - OWNCLOUD_TRUSTED_DOMAINS=${SERVICE_FQDN_OWNCLOUD}
    - OWNCLOUD_DB_TYPE=mysql
    - OWNCLOUD_DB_HOST=mariadb
    - OWNCLOUD_DB_NAME=${DB_NAME:-owncloud}
    - OWNCLOUD_DB_USERNAME=${SERVICE_USER_MARIADB}
    - OWNCLOUD_DB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - OWNCLOUD_ADMIN_USERNAME=${SERVICE_USER_OWNCLOUD}
    - OWNCLOUD_ADMIN_PASSWORD=${SERVICE_PASSWORD_OWNCLOUD}
    - OWNCLOUD_MYSQL_UTF8MB4=${MYSQL_UTF8MB4:-true}
    - OWNCLOUD_REDIS_ENABLED=${REDIS_ENABLED:-true}
    - OWNCLOUD_REDIS_HOST=redis
    healthcheck:
      interval: 30s
      retries: 5
      test:
      - CMD
      - /usr/bin/healthcheck
      timeout: 10s
    image: owncloud/server:latest
    networks:
      appnet:
        aliases:
        - owncloud-coolify_owncloud_1
    restart: unless-stopped
    volumes:
    - owncloud-data:/mnt/data
  redis:
    command:
    - --databases
    - '1'
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:6
    networks:
      appnet:
        aliases:
        - owncloud-coolify_redis_1
    restart: unless-stopped
volumes:
  owncloud-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/owncloud-data
      o: bind
      type: none
  owncloud-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/owncloud-mysql-data
      o: bind
      type: none
