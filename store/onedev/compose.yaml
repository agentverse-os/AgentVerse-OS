# onedev: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
  dockerro:
    external: true
    name: cloudos-docker-ro-net
services:
  onedev:
    depends_on:
    - onedev-db
    environment:
      DOCKER_HOST: tcp://cloudos-docker-ro:2375
      hibernate_connection_driver_class: org.postgresql.Driver
      hibernate_connection_password: ${ONEDEV_DB_PASSWORD}
      hibernate_connection_url: jdbc:postgresql://onedev-db:5432/onedev
      hibernate_connection_username: tipi
      hibernate_dialect: io.onedev.server.persistence.PostgreSQLDialect
      initial_email: ${ONEDEV_EMAIL}
      initial_password: ${ONEDEV_PASSWORD}
      initial_server_url: ${APP_DOMAIN}
      initial_user: ${ONEDEV_USERNAME}
    image: 1dev/server:16.5.11
    networks:
      appnet:
        aliases:
        - onedev_onedev_1
      dockerro: {}
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/onedev:/opt/onedev
  onedev-db:
    environment:
      POSTGRES_DB: onedev
      POSTGRES_PASSWORD: ${ONEDEV_DB_PASSWORD}
      POSTGRES_USER: tipi
    image: postgres:14
    networks:
      appnet:
        aliases:
        - onedev_onedev-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
