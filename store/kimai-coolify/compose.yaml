# kimai-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  kimai:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SERVICE_URL_KIMAI_8001=${SERVICE_URL_KIMAI_8001}
    - APP_SECRET=${SERVICE_PASSWORD_APPSECRET}
    - MAILER_FROM=${MAILER_FROM:-kimai@example.com}
    - MAILER_URL=${MAILER_URL:-null://null}
    - ADMINMAIL=${ADMINMAIL:-admin@kimai.local}
    - ADMINPASS=${SERVICE_PASSWORD_ADMINPASS}
    - DATABASE_URL=mysql://${SERVICE_USER_MYSQL}:${SERVICE_PASSWORD_MYSQL}@mysql/${MYSQL_DATABASE}?charset=utf8mb4&serverVersion=8.3.0
    - TRUSTED_HOSTS=${TRUSTED_HOSTS}|localhost|127.0.0.1
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8001
      timeout: 10s
    image: kimai/kimai2:apache
    networks:
      appnet:
        aliases:
        - kimai-coolify_kimai_1
    restart: unless-stopped
    volumes:
    - kimai-data:/opt/kimai/var/data
  mysql:
    command: --default-storage-engine innodb
    environment:
    - MYSQL_DATABASE=${MYSQL_DATABASE:-kimai}
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:8
    networks:
      appnet:
        aliases:
        - kimai-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - kimai-mysql-data:/var/lib/mysql
volumes:
  kimai-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/kimai-data
      o: bind
      type: none
  kimai-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/kimai-mysql-data
      o: bind
      type: none
