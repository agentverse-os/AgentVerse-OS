# deluge: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  deluge:
    environment:
      DELUGE_LOGLEVEL: error
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: lscr.io/linuxserver/deluge:18.04.1
    networks:
      appnet:
        aliases:
        - deluge_deluge_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/deluge/config:/config
    - ${ROOT_FOLDER_HOST}/media/torrents:/media/torrents
