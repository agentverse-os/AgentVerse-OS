# ollama-cpu: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  ollama-cpu:
    image: ollama/ollama:0.32.15
    networks:
      appnet:
        aliases:
        - ollama-cpu_ollama-cpu_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/.ollama:/root/.ollama
