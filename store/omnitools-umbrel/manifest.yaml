  author: Ibrahima Gaye Coulibaly
  categories:
  - files
  release_notes: |-
    This update expands the toolbox with new file conversion and everyday utilities.

      - Convert audio and images, including JPG and WebP output.
      - Split and watermark images, and create GIFs from images.
      - Convert JSON to CSV and sort JSON data.
      - Convert files to PDF, extract PDF images, and fill PDF forms.
      - Compare text, extract email addresses, generate slugs, and edit URLs.
      - Convert byte units, numbers to words, and time to decimal hours.
      - Add audio to videos and resize videos.


    Full release notes can be found at https://github.com/iib0011/omni-tools/releases/tag/v0.7.0
