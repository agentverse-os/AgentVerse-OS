# passbolt-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mariadb:
    environment:
    - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOTMARIADB}
    - MARIADB_DATABASE=${MYSQL_DB:-passbolt-db}
    - MARIADB_USER=${SERVICE_USER_PASSBOLT}
    - MARIADB_PASSWORD=${SERVICE_PASSWORD_PASSBOLT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - passbolt-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - passbolt_mariadb_data:/var/lib/mysql
  passbolt:
    command:
    - /usr/bin/wait-for.sh
    - -t
    - '0'
    - mariadb:3306
    - --
    - /docker-entrypoint.sh
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
    - SERVICE_URL_PASSBOLT=${SERVICE_URL_PASSBOLT}
    - APP_FULL_BASE_URL=${SERVICE_URL_PASSBOLT}
    - DATASOURCES_DEFAULT_HOST=mariadb
    - DATASOURCES_DEFAULT_USERNAME=${SERVICE_USER_PASSBOLT}
    - DATASOURCES_DEFAULT_PASSWORD=${SERVICE_PASSWORD_PASSBOLT}
    - DATASOURCES_DEFAULT_DATABASE=${MYSQL_DB:-passbolt-db}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80
      timeout: 20s
    image: passbolt/passbolt:latest-ce
    networks:
      appnet:
        aliases:
        - passbolt-coolify_passbolt_1
    restart: unless-stopped
    volumes:
    - gpg_volume:/etc/passbolt/gpg
    - jwt_volume:/etc/passbolt/jwt
volumes:
  gpg_volume:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gpg_volume
      o: bind
      type: none
  jwt_volume:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/jwt_volume
      o: bind
      type: none
  passbolt_mariadb_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/passbolt_mariadb_data
      o: bind
      type: none
