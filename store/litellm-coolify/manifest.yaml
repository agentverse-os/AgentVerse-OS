# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/litellm-coolify
description: Call all LLM APIs using the OpenAI format. Use Bedrock, Azure, OpenAI, Cohere, Anthropic, Ollama, Sagemaker, HuggingFace, Replicate, Groq (100+ LLMs)
endpoint:
  port: 4000
  service: litellm
env:
  ANTHROPIC_API_BASE: ''
  ANTHROPIC_API_KEY: ''
  LITELLM_LOG: ERROR
  LITELLM_MODE: PRODUCTION
  OPENAI_API_BASE: ''
  OPENAI_API_KEY: ''
  POSTGRES_DB: litellm
  POSTGRES_USER: ''
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  SERVICE_PASSWORD_MASTERKEY:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_UI:
    generate: password
  SERVICE_URL_LITELLM_4000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  SERVICE_USER_UI:
    generate: password
  STORE_MODEL_IN_DB: ''
  VOYAGE_API_BASE: ''
  VOYAGE_API_KEY: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_UI
  path: null
  user: SERVICE_USER_UI
name: litellm-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
