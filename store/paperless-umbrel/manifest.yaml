  categories:
  - files
  release_notes: |-
    This update fixes background operations when audit logging is disabled and keeps your document selection after queuing a bulk edit. It also fixes and improves streaming answers when using AI chat.

    Paperless-ngx's consume and export folders now live in the app's own storage and are included in backups. Pending files in Home/paperless/consume move across automatically; earlier exports remain in Home/paperless/export. If a scanner or another device saves files to Home/paperless/consume, choose that folder as the Consume folder in the app's settings so it keeps working.

    If you're updating from a pre-3.0 version, API v1 compatibility has been removed, legacy document/thumbnail encryption is no longer supported, and pre/post-consume scripts no longer receive positional arguments.

    Full release notes can be found at https://github.com/paperless-ngx/paperless-ngx/releases/tag/v3.5.1
  source: https://github.com/paperless-ngx/paperless-ngx
  version: 3.5.1
