# filebrowser-quantum: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  filebrowser-quantum:
    image: gtstef/filebrowser:2-beta
    networks:
      appnet:
        aliases:
        - filebrowser-quantum_filebrowser-quantum_1
    restart: unless-stopped
    volumes:
    - ${ROOT_FOLDER_HOST}/media:/runtipi/media
    - ${ROOT_FOLDER_HOST}/app-data:/runtipi/app-data
    - ${ROOT_FOLDER_HOST}/user-config:/runtipi/user-config
    - ${APP_DATA_DIR}/data:/home/filebrowser/data
