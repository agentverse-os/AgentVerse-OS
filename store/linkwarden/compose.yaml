# linkwarden: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  linkwarden:
    depends_on:
    - linkwarden-db
    environment:
      DATABASE_URL: postgresql://tipi:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/linkwarden
      NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}/api/v1/auth
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${LINKWARDEN_NEXT_PUBLIC_DISABLE_REGISTRATION}
    image: ghcr.io/linkwarden/linkwarden:v2.16.2
    networks:
      appnet:
        aliases:
        - linkwarden_linkwarden_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/linkwarden:/data/data
  linkwarden-db:
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_PASSWORD: ${LINKWARDEN_DB_PASSWORD}
      POSTGRES_USER: tipi
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - linkwarden_linkwarden-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
