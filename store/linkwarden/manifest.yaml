# Импортировано из каталога runtipi командой `cloudd store import runtipi`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/linkwarden
description: A self-hosted, open-source collaborative bookmark manager
endpoint:
  port: 3000
  service: linkwarden
env:
  LINKWARDEN_DB_PASSWORD:
    generate: token
  LINKWARDEN_NEXTAUTH_SECRET:
    generate: token
  LINKWARDEN_NEXT_PUBLIC_DISABLE_REGISTRATION: 'false'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.jpg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: linkwarden
notes: []
origin: runtipi
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: LINKWARDEN_DB_PASSWORD
  hint: null
  label: Linkwarden DB Password
  options: null
  required: false
  type: random
- env: LINKWARDEN_NEXTAUTH_SECRET
  hint: null
  label: Linkwarden Nextauth Secret
  options: null
  required: false
  type: random
- env: LINKWARDEN_NEXT_PUBLIC_DISABLE_REGISTRATION
  hint: Needed for at least one user. If on registration will be disabled.
  label: Disable Registration
  options: null
  required: false
  type: boolean
tags: []
title: Linkwarden
type: app
upstream:
  author: Linkwarden
