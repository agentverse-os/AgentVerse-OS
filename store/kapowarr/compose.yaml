# kapowarr: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  kapowarr:
    image: mrcas/kapowarr:v1.3.1
    networks:
      appnet:
        aliases:
        - kapowarr_kapowarr_1
    restart: unless-stopped
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - ${APP_DATA_DIR}/data/kapowarr-db:/app/db
    - ${ROOT_FOLDER_HOST}/media/downloads/kapowarr:/app/temp_downloads
    - ${ROOT_FOLDER_HOST}/media:/media
