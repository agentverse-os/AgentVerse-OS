  options: null
  required: false
  type: random
- env: OWNCLOUD_USERNAME
  hint: null
  label: Owncloud username
  options: null
  required: true
  type: text
- env: OWNCLOUD_PASSWORD
  hint: null
  label: Owncloud password
  options: null
  required: true
  type: password
tags: []
