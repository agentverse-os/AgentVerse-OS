# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/sessy-coolify
description: Email observability platform for monitoring and analyzing email systems.
endpoint:
  port: 80
  service: sessy
env:
  SERVICE_HEX_64_SESSYSECRET:
    generate: hex64
  SERVICE_PASSWORD_SESSY:
    generate: password
  SERVICE_URL_SESSY_80: https://${APP_DOMAIN}
  SERVICE_USER_SESSY:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_SESSY
  path: null
  user: SERVICE_USER_SESSY
name: sessy-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- email
- observability
- monitoring
- analytics
title: Sessy
type: app
upstream:
  categories:
  - monitoring
  source: https://github.com/marckohlbrugge/sessy/blob/main/docs/docker-deployment.md
  tags:
  - email
  - observability
  - monitoring
  - analytics
  template: sessy.yaml
website: https://github.com/marckohlbrugge/sessy/blob/main/docs/docker-deployment.md
