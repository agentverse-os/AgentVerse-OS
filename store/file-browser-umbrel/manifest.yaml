# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/file-browser-umbrel
description: Browse and manage the files you download on your Umbrel
endpoint:
  port: 80
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/file-browser/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/file-browser/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/file-browser/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/file-browser/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: file-browser-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: File Browser
type: app
upstream:
  author: File Browser
  categories:
  - files
  release_notes: |-
    This update includes important security improvements. We recommend updating as soon as possible.

    Upstream has announced that File Browser v2.63.23 is its last planned release.
  source: https://github.com/filebrowser/filebrowser
  version: 2.63.23-patch.2
  website: https://filebrowser.org/
website: https://filebrowser.org/
