# file-browser-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - FB_PORT=80
    - FB_DATABASE=/database/filebrowser.db
    - FB_ROOT=/data
    - FB_NOAUTH=true
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    networks:
      appnet:
        aliases:
        - file-browser_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/database/
    - ${APP_DATA_DIR}/data:/config/
    - ${UMBREL_ROOT}/data/storage:/data
