# shlink: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  shlink:
    depends_on:
    - shlink-db
    environment:
      DB_DRIVER: postgres
      DB_HOST: shlink-db
      DB_NAME: shlink
      DB_PASSWORD: ${SHLINK_POSTGRES_PASSWORD}
      DB_USER: shlink
      DEFAULT_DOMAIN: ${APP_DOMAIN}
      IS_HTTPS_ENABLED: 'true'
    image: ghcr.io/shlinkio/shlink:5.1.5
    networks:
      appnet:
        aliases:
        - shlink_shlink_1
    restart: unless-stopped
  shlink-db:
    environment:
      POSTGRES_DB: shlink
      POSTGRES_PASSWORD: ${SHLINK_POSTGRES_PASSWORD}
      POSTGRES_USER: shlink
    image: postgres:17.2-alpine
    networks:
      appnet:
        aliases:
        - shlink_shlink-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
