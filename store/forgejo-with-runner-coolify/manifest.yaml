# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/forgejo-with-runner-coolify
description: Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job.
endpoint:
  port: 3000
  service: forgejo
env:
  RUNNER_SHARED_SECRET: '0000000000000000000000000000000000000000'
  SERVICE_URL_FORGEJO: https://${APP_DOMAIN}
  SERVICE_URL_FORGEJO_3000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: forgejo-with-runner-coolify
notes:
- 'порт 22222:22 (forgejo) не публикуется: доступ только через edge/gate'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: RUNNER_SHARED_SECRET
  hint: 'по умолчанию: 0000000000000000000000000000000000000000'
  label: runner shared secret
  options: null
  required: false
  type: password
tags:
- version control
- collaboration
- code
- hosting
- lightweight
- runner
- actions
- cicd
- ci
title: Forgejo With Runner
type: app
upstream:
  categories:
  - git
  source: https://forgejo.org/docs
  tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - runner
  - actions
  - cicd
  - ci
  template: forgejo-with-runner.yaml
website: https://forgejo.org/docs
