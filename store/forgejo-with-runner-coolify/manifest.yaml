# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/forgejo-with-runner-coolify
description: Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job.
endpoint:
  port: 3000
  service: forgejo
env:
  FORGEJO_ADMIN_EMAIL: admin@example.com
  FORGEJO_SSH_PORT: '22222'
  SERVICE_FQDN_FORGEJO: ${APP_DOMAIN}
  SERVICE_HEX_64_RUNNER:
    generate: hex64
  SERVICE_PASSWORD_ADMIN:
    generate: password
  SERVICE_URL_FORGEJO: https://${APP_DOMAIN}
  SERVICE_URL_FORGEJO_3000: https://${APP_DOMAIN}
  SERVICE_USER_ADMIN:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_ADMIN
  path: null
  user: SERVICE_USER_ADMIN
name: forgejo-with-runner-coolify
notes:
- 'порт ${FORGEJO_SSH_PORT:-22222}:22 (forgejo) не публикуется: доступ только через edge/gate'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: FORGEJO_SSH_PORT
  hint: 'по умолчанию: 22222'
  label: forgejo ssh port
  options: null
  required: false
  type: text
- env: FORGEJO_ADMIN_EMAIL
  hint: 'по умолчанию: admin@example.com'
  label: forgejo admin email
  options: null
  required: false
  type: text
tags:
- version control
- collaboration
- code
- hosting
- lightweight
- runner
- actions
- cicd
- ci
title: Forgejo With Runner
type: app
upstream:
  categories:
  - git
  source: https://forgejo.org/docs
  tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - runner
  - actions
  - cicd
  - ci
  template: forgejo-with-runner.yaml
website: https://forgejo.org/docs
