# pearcircle-seeder-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      SEEDER_HOST: 0.0.0.0
      SEEDER_NO_AUTH: '1'
      SEEDER_NO_UPDATE_CHECK: '1'
      SEEDER_PORT: '8730'
    image: ghcr.io/peerloomllc/pearcircle-seeder:1.1.4@sha256:ad80eaa9156c19f13c02c19f0d70602724ec2bec8002dfb25cb580e18f35f400
    networks:
      appnet:
        aliases:
        - pearcircle-seeder_app_1
    restart: on-failure
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/data
