# convertx-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  convertx:
    environment:
    - SERVICE_URL_CONVERTX=${SERVICE_URL_CONVERTX}
    - ACCOUNT_REGISTRATION=${ACCOUNT_REGISTRATION:-false}
    - HTTP_ALLOWED=${HTTP_ALLOWED:-true}
    - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-false}
    - AUTO_DELETE_EVERY_N_HOURS=${AUTO_DELETE_EVERY_N_HOURS:-24}
    - JWT_SECRET=${SERVICE_PASSWORD_CONVERTXJWTSECRET}
    image: ghcr.io/c4illin/convertx:latest
    networks:
      appnet:
        aliases:
        - convertx-coolify_convertx_1
    restart: unless-stopped
    volumes:
    - convertx_data:/app/data
volumes:
  convertx_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/convertx_data
      o: bind
      type: none
