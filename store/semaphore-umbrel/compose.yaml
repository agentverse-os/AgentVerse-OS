# semaphore-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      HOME: /var/lib/semaphore
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_PASSWORD: ${APP_PASSWORD}
      SEMAPHORE_DB_DIALECT: sqlite
    image: semaphoreui/semaphore:v2.20.23@sha256:00e6733dbca9a2bddf77e048f34f9002027c8a6f549a8cde18d13101e84a19c3
    networks:
      appnet:
        aliases:
        - semaphore_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/config:/etc/semaphore
    - ${APP_DATA_DIR}/data/db:/var/lib/semaphore
    - ${APP_DATA_DIR}/data/repos:/tmp/semaphore
