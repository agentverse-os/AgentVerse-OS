# trilium-notes-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - TRILIUM_DATA_DIR=/data
    image: triliumnext/trilium:v0.107.0@sha256:739ba0f0488f506549f7c21dc9e792decd99382cc759f01d5ec1abba32e87da8
    networks:
      appnet:
        aliases:
        - trilium-notes_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
