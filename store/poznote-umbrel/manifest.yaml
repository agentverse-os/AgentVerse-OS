# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/poznote-umbrel
description: A powerful app for taking notes
endpoint:
  port: 80
  service: app
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/poznote/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/poznote/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/poznote/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/poznote/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/poznote/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: admin
  path: null
  user: admin_change_me
name: poznote-umbrel
notes:
- 'порт 8340:8045 (mcp) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Poznote
type: app
upstream:
  author: Timothé Poznanski
  categories:
  - files
  release_notes: |-
    ⚠️ If you configured SSO, accounts are no longer linked by username alone. Before updating, add the provider's verified email to each affected account in Settings > Admin Tools > User Management, or explicitly link its OIDC subject. This prevents unintended access to existing accounts.

    - Remember opened and closed folders across devices and workspace changes.
    - Load notes with their final layout immediately, without tabs, translations, tags, or previews jumping into place.
    - Keep the note toolbar visible when switching notes and improve dark-theme accent colours.
    - Fix dragging notes and importing files after switching workspaces.

    ⚠️ MCP clients require authentication. If you have not updated since Poznote 6.81.5, your existing MCP URL and port 8340 stay the same, but connections will fail until you add an access token. Sign in to Poznote as an administrator, then open http://umbrel.local:8389/umbrel-mcp.php to get your token and setup instructions. Replace umbrel.local with your Umbrel's address if needed. Configure your client with an Authorization header of Bearer YOUR_TOKEN. The token stays the same across app restarts and updates. The built-in AI assistant does not need this token.

    If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

    If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

    Full release notes can be found at https://github.com/timothepoznanski/Poznote/releases/tag/6.151.1
  source: https://github.com/timothepoznanski/poznote
  version: 6.151.1
  website: https://poznote.com/
website: https://poznote.com/
