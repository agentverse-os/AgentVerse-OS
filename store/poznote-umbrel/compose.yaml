# poznote-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      HTTP_WEB_PORT: 80
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --timeout=5
      - -O
      - /dev/null
      - http://127.0.0.1/api/health
      timeout: 10s
    image: ghcr.io/timothepoznanski/poznote:6.151.1@sha256:2a87e4147d796064899303b2d0328721cbe96e9aa946295a700712e122c7aa1b
    networks:
      appnet:
        aliases:
        - poznote_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/html/data
    - ${APP_DATA_DIR}/umbrel-mcp.php:/var/www/html/public/umbrel-mcp.php:ro
  mcp:
    depends_on:
    - app
    environment:
      POZNOTE_API_URL: http://poznote_app_1:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
      POZNOTE_MCP_AUTH_TOKEN: ${APP_POZNOTE_MCP_AUTH_TOKEN:?MCP authentication token is required}
    image: ghcr.io/timothepoznanski/poznote-mcp:6.151.1@sha256:a4a85302775590be1399d13da63d30ce3b8cd7f47545f8e8cd639171c63573b3
    networks:
      appnet:
        aliases:
        - poznote_mcp_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/html/data:ro
