# poznote-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      HTTP_WEB_PORT: 80
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --timeout=5
      - -O
      - /dev/null
      - http://127.0.0.1/api/health
      timeout: 10s
    image: ghcr.io/timothepoznanski/poznote:6.70.3@sha256:cb49e81398c67d50b498ea3ba92d54e861cbce3da9c5cc1aa3dae2f66dcd98a2
    networks:
      appnet:
        aliases:
        - poznote_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/html/data
  mcp:
    depends_on:
    - app
    environment:
      POZNOTE_API_URL: http://poznote_app_1:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
    image: ghcr.io/timothepoznanski/poznote-mcp:6.70.3@sha256:4a01ec2be1d9f5ab33961b728f343fdbe76b35491dca2d11bddc01aa1886e277
    networks:
      appnet:
        aliases:
        - poznote_mcp_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/html/data:ro
