# unstructured-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  unstructured:
    environment:
    - SERVICE_URL_UNSTRUCTURED_8000=${SERVICE_URL_UNSTRUCTURED_8000}
    - UNSTRUCTURED_API_KEY=${SERVICE_PASSWORD_APIKEY}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - wget
      - -qO-
      - http://0.0.0.0:8000/healthcheck
      timeout: 30s
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    networks:
      appnet:
        aliases:
        - unstructured-coolify_unstructured_1
    restart: unless-stopped
