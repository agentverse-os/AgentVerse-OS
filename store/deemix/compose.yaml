# deemix: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  deemix:
    environment:
      PGID: '1000'
      PUID: '1000'
      UMASK_SET: '022'
    image: registry.gitlab.com/bockiii/deemix-docker:latest
    networks:
      appnet:
        aliases:
        - deemix_deemix_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/deemix-config:/config
    - ${ROOT_FOLDER_HOST}/media:/media
    - ${ROOT_FOLDER_HOST}/media/data/torrents/deemix:/downloads
    - ${ROOT_FOLDER_HOST}/media/data/music:/music
