# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/activepieces-umbrel
description: Your friendliest open source AI automation tool
endpoint:
  port: 80
  service: app
env:
  APP_AP_ENCRYPTION_KEY: ''
  APP_PASSWORD:
    generate: password
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/activepieces/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/activepieces/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/activepieces/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/activepieces/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: activepieces-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_AP_ENCRYPTION_KEY
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app ap encryption key
  options: null
  required: false
  type: password
tags: []
title: Activepieces
type: app
upstream:
  author: Activepieces
  categories:
  - automation
  release_notes: |-
    This update improves workflow reliability and adds new integrations.

    Key improvements:
      - Adds OAuth2 support for MCP clients and new integrations including Apache Kafka.
      - Fixes lost flow edits and preserves polling state when flows are republished.
      - Improves code-step execution, worker reconnections, and cache cleanup.
      - Prevents malformed webhook responses from crashing the server.
      - Includes security fixes and more reliable integration updates that preserve existing settings.


    Review Activepieces' breaking changes page before updating production automations or custom integrations on self-hosted instances.

    Full release notes can be found at https://github.com/activepieces/activepieces/releases/tag/0.93.0
  source: https://github.com/activepieces/activepieces/
  version: 0.93.0
  website: https://www.activepieces.com/
website: https://www.activepieces.com/
