# qdirstat: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  qdirstat:
    image: lscr.io/linuxserver/qdirstat:1.8.1-ls82
    networks:
      appnet:
        aliases:
        - qdirstat_qdirstat_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/qdirstat/config:/config
    - ${APP_DATA_DIR}/data/qdirstat/app/data:/data
    - /:/host:ro
