# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/audiobookshelf-umbrel
description: Audiobook and podcast server
endpoint:
  port: 80
  service: web
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/audiobookshelf/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/audiobookshelf/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/audiobookshelf/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/audiobookshelf/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: audiobookshelf-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Audiobookshelf
type: app
upstream:
  author: advplyr
  categories:
  - media
  release_notes: |-
    This update fixes crashes when scanning or saving books with duplicate author or series links, and when signing out without OpenID configured.

    It also fixes access checks for restricted libraries, tags, playback sessions, and reading progress, and improves how the server handles uploads and sends events to connected users.

    Full release notes can be found at https://github.com/advplyr/audiobookshelf/releases/tag/v2.38.0
  source: https://github.com/advplyr/audiobookshelf
  version: 2.38.0
  website: https://audiobookshelf.org
website: https://audiobookshelf.org
