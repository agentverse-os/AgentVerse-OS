# invio-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  backend:
    environment:
      ADMIN_PASS: ${APP_PASSWORD}
      ADMIN_USER: admin
      DATABASE_PATH: /app/data/invio.db
      ENABLE_HSTS: 'true'
      JWT_SECRET: ${APP_SEED}
      SECURE_HEADERS_DISABLED: 'false'
      SESSION_TTL_SECONDS: 43200
    image: ghcr.io/kittendevv/invio-backend:v2.4.1@sha256:7d3a3bbae9b682038f1ab3453b019a5a3893d0a4e7fd1934854442dac1a09651
    networks:
      appnet:
        aliases:
        - invio_backend_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
  frontend:
    depends_on:
    - backend
    environment:
      BACKEND_URL: http://invio_backend_1:3000
      COOKIE_SECURE: 'false'
      ENABLE_HSTS: 'false'
      FRONTEND_SECURE_HEADERS_DISABLED: 'false'
      PORT: 8000
    image: ghcr.io/kittendevv/invio-frontend:v2.4.1@sha256:22244b93397802e19326f8d36f9b0a864e1dd7b253648f6274d5287c783b37e4
    networks:
      appnet:
        aliases:
        - invio_frontend_1
    restart: on-failure
