# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/invio-umbrel
description: Invio is a self-hosted invoicing app without the bloat
endpoint:
  port: 8000
  service: frontend
env:
  APP_PASSWORD:
    generate: password
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/invio/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/invio/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/invio/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/invio/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: admin
name: invio-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Invio
type: app
upstream:
  author: kittendevv
  categories:
  - finance
  release_notes: |-
    This update fixes per-line taxes not being saved correctly in the invoice editor and restores saved tax rates when editing an invoice.

    Full release notes can be found at https://github.com/kittendevv/Invio/releases/tag/v2.4.1
  source: https://github.com/kittendevv/invio
  version: 2.4.1
  website: https://github.com/kittendevv/invio
website: https://github.com/kittendevv/invio
