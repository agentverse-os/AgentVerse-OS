  release_notes: |-
    Stirling PDF 2.14.3 is a follow-up to the recent 2.12.0 major update. If you're updating from a pre-2.12.0 version, back up your Stirling PDF data before upgrading.

    This hotfix improves reliability for merge, split, automate, signing, crop/rotate preview, and PDF viewer search workflows. It also fixes concurrent tool usage issues, protects active temporary files from cleanup, and avoids renderer crashes when adding large PDFs to the workbench.
    Full release notes can be found at https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v2.14.3
