# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/stirling-pdf-umbrel
description: Merge, split, rotate, and convert PDFs with ease
endpoint:
  port: 8080
  service: app
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/stirling-pdf/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/stirling-pdf/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/stirling-pdf/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/stirling-pdf/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: stirling-pdf-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Stirling PDF
type: app
upstream:
  author: Stirling Tools
  categories:
  - files
  release_notes: |-
    This update improves PDF redaction, merging and splitting, and reduces memory use for large files.

    The optional Stirling Office Convert beta supports more conversion tools, and mobile scanning is faster and more accurate.

    Fixes include mixed-file conversion routing, ebook output settings, email recipient handling, fillable PDF/UA forms, and keeping your reading position when adding bookmarks. Security and stability improvements are also included.

    The deprecated backend PDF text-editing API has been removed. Use the new Text Editor in the web interface instead.

    Full release notes can be found at https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.3.0
  source: https://github.com/Stirling-Tools/Stirling-PDF
  version: 3.3.0
  website: https://stirlingtools.com/
website: https://stirlingtools.com/
