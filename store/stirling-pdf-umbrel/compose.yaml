# stirling-pdf-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      DOCKER_ENABLE_SECURITY: 'false'
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: 'true'
      LANGS: ALL
      SECURITY_ENABLELOGIN: 'false'
    image: stirlingtools/stirling-pdf:3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
    networks:
      appnet:
        aliases:
        - stirling-pdf_app_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/tessdata:/usr/share/tessdata
    - ${APP_DATA_DIR}/data/configs:/configs
    - ${APP_DATA_DIR}/data/logs:/logs
    - ${APP_DATA_DIR}/data/pipeline:/pipeline
