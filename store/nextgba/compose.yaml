# nextgba: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  nextgba:
    environment:
      NODE_ENV: production
    image: ghcr.io/nicotsx/nextgba:v0.1.0
    networks:
      appnet:
        aliases:
        - nextgba_nextgba_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/games:/data/games
