# yuvomi-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - NODE_ENV=production
    - PORT=3000
    - DB_PATH=/data/yuvomi.db
    - BACKUP_DIR=/backups
    - SESSION_SECRET=${APP_SEED}
    - DB_ENCRYPTION_KEY=${APP_SEED}
    - SESSION_SECURE=false
    image: ghcr.io/ulsklyc/yuvomi:2.93.0@sha256:530a6fdff7602d80f1a4b96b5071af5e65e6beaa1333a534650276f5c0e92887
    networks:
      appnet:
        aliases:
        - yuvomi_web_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
    - ${APP_DATA_DIR}/data/backups:/backups
