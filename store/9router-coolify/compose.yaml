# 9router-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  9router:
    environment:
    - SERVICE_URL_9ROUTER_20128=${SERVICE_URL_9ROUTER_20128}
    - DATA_DIR=/app/data
    - INITIAL_PASSWORD=${SERVICE_PASSWORD_PASSWORD}
    - JWT_SECRET=${SERVICE_PASSWORD_64_JWTSECRET}
    - API_KEY_SECRET=${SERVICE_PASSWORD_KEYSECRET}
    - MACHINE_ID_SALT=${SERVICE_HEX_64_HMACSALT}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - wget
      - --spider
      - http://127.0.0.1:20128/
      timeout: 10s
    image: decolua/9router:0.5.116
    networks:
      appnet:
        aliases:
        - 9router-coolify_9router_1
    restart: unless-stopped
    volumes:
    - 9router:/app/data
volumes:
  9router:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/9router
      o: bind
      type: none
