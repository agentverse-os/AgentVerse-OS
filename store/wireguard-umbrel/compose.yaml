# wireguard-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    environment:
      INSECURE: 'true'
      PORT: 51821
    image: ghcr.io/wg-easy/wg-easy:15.3.0@sha256:93bbd593e07bab98d02807a28770ac87ab6c48818e319e68c1f66561feb99876
    networks:
      appnet:
        aliases:
        - wireguard_app_1
    restart: on-failure
    stop_grace_period: 1m
    sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.src_valid_mark=1
    - net.ipv6.conf.all.disable_ipv6=0
    - net.ipv6.conf.all.forwarding=1
    - net.ipv6.conf.default.forwarding=1
    volumes:
    - ${APP_DATA_DIR}/data/wireguard:/etc/wireguard
    - /lib/modules:/lib/modules:ro
