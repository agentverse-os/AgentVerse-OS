# obsidian-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  obsidian:
    environment:
    - SERVICE_URL_OBSIDIAN_3000=${SERVICE_URL_OBSIDIAN_3000}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Etc/UTC}
    - CUSTOM_USER=${SERVICE_USER_OBSIDIAN}
    - PASSWORD=${SERVICE_PASSWORD_OBSIDIAN}
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 90s
      test:
      - CMD
      - curl
      - -s
      - -o
      - /dev/null
      - http://127.0.0.1:3000/
      timeout: 20s
    image: lscr.io/linuxserver/obsidian:1.15.1
    networks:
      appnet:
        aliases:
        - obsidian-coolify_obsidian_1
    restart: unless-stopped
    security_opt:
    - seccomp=unconfined
    shm_size: 1gb
    volumes:
    - obsidian-config:/config
volumes:
  obsidian-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/obsidian-config
      o: bind
      type: none
