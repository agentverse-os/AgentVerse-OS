# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/airtrail-umbrel
description: A modern, open-source personal flight tracking system
endpoint:
  port: 3000
  service: app
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/airtrail/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/airtrail/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/airtrail/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/airtrail/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: airtrail-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: AirTrail
type: app
upstream:
  author: Johan Ohly
  categories:
  - files
  release_notes: |-
    This update introduces a redesigned statistics page with ranked lists, bar charts, and filters that open the matching flights.

    - Subscribe to your flights from a calendar app using the optional calendar feed in Settings → Export. Treat the feed URL like a password: anyone with it can see flight details, including notes and seats.
    - Import flights from LogMyTrip and fill takeoff and landing times from uploaded tracks.
    - View country flags in flight lists and optionally enable aircraft photos from Planespotters.net.
    - Fix shared flight lists being cut off, tracks crossing the antimeridian, and several OAuth sign-in and account-management issues.

    Full release notes: https://github.com/johanohly/AirTrail/releases/tag/v3.14.0
  source: https://github.com/johanohly/AirTrail
  version: 3.14.0
  website: https://airtrail.johan.ohly.dk
website: https://airtrail.johan.ohly.dk
