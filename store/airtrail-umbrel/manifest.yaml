- https://getumbrel.github.io/umbrel-apps-gallery/airtrail/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/airtrail/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/airtrail/3.jpg
health: null
hooks: {}
