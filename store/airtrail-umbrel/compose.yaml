# airtrail-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgres://airtrail:itworkslocally@airtrail_postgres_1:5432/airtrail
      UPLOAD_LOCATION: /app/uploads
    image: johly/airtrail:v3.14.0@sha256:69ef0a421d6a5f99c06d04ea6b66445a5d1261dd533d6efe3bd8bc3e2dfd018f
    networks:
      appnet:
        aliases:
        - airtrail_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/uploads:/app/uploads
  postgres:
    environment:
      PGDATA: /data/pgdata
      POSTGRES_DB: airtrail
      POSTGRES_PASSWORD: itworkslocally
      POSTGRES_USER: airtrail
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: pg_isready -U airtrail -h localhost -d airtrail
      timeout: 5s
    image: postgres:18.3-alpine@sha256:52098013b4b64a746626437d38afc03cabff6cdeb4d3d92e2342aa95f0ce56ea
    networks:
      appnet:
        aliases:
        - airtrail_postgres_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/data
