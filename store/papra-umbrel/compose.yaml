# papra-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - AUTH_SECRET=${APP_SEED}
    - APP_BASE_URL=http://${DEVICE_DOMAIN_NAME}:8112
    image: ghcr.io/papra-hq/papra:26.7.1-rootless@sha256:d1f596a35332ad04d8a69d88a5e19bc82acd47f2bc2fe687dd2145b1ef5a8b19
    networks:
      appnet:
        aliases:
        - papra_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/app-data
