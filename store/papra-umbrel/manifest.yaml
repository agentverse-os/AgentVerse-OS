# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/papra-umbrel
description: The minimalistic document archiving platform
endpoint:
  port: 1221
  service: server
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/papra/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/papra/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/papra/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/papra/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: papra-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Papra
type: app
upstream:
  author: Papra
  categories:
  - files
  release_notes: |-
    This update improves document search and processing and includes security fixes.

    - Search across all pages in the advanced PDF viewer with Ctrl+F or Cmd+F, including match highlighting and navigation.
    - Reprocess existing documents to run content extraction and tagging again.
    - Use Papra offline without downloading fonts from an external service.
    - Improved OCR for rotated images and fixed reinviting users to organizations.
    - Security fixes for registration through custom OAuth providers, email intake webhook validation, and the underlying runtime.

    If you have manually enabled email intake, you must explicitly configure INTAKE_EMAILS_WEBHOOK_SECRET. API integrations should also account for document deletion returning HTTP 204 with no response body and profile updates returning only public user fields.

    Full release notes can be found at https://github.com/papra-hq/papra/releases/tag/%40papra/app%4026.7.1
  source: https://github.com/papra-hq/papra
  version: 26.7.1
  website: https://papra.app
website: https://papra.app
