# soketi-app-manager-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  soketi-app-manager:
    environment:
    - SERVICE_FQDN_SOKETIAPPMANAGER_8080=${SERVICE_FQDN_SOKETIAPPMANAGER_8080}
    - AUTORUN_ENABLED=true
    - AUTORUN_LARAVEL_MIGRATION=${AUTORUN_LARAVEL_MIGRATION:-true}
    - APP_DEBUG=${APP_DEBUG:-false}
    - APP_URL=$SERVICE_FQDN_SOKETIAPPMANAGER
    - APP_KEY=$APP_KEY
    - DB_CONNECTION=$DB_CONNECTION
    - DB_HOST=$DB_HOST
    - DB_PORT=$DB_PORT
    - DB_DATABASE=$DB_DATABASE
    - DB_USERNAME=$DB_USERNAME
    - DB_PASSWORD=$DB_PASSWORD
    - PUSHER_HOST=$PUSHER_HOST
    - PUSHER_PORT=$PUSHER_PORT
    - PUSHER_SCHEME=$PUSHER_SCHEME
    - PUSHER_APP_CLUSTER=$PUSHER_APP_CLUSTER
    - SOKETI_DB_REDIS_USERNAME=$SOKETI_DB_REDIS_USERNAME
    - SOKETI_DB_REDIS_PASSWORD=$SOKETI_DB_REDIS_PASSWORD
    - METRICS_HOST=$METRICS_HOST
    healthcheck:
      start_period: 10s
      test:
      - CMD
      - php-fpm-healthcheck
    image: ghcr.io/rahulhaque/soketi-app-manager-filament-alpine:latest
    networks:
      appnet:
        aliases:
        - soketi-app-manager-coolify_soketi-app-manager_1
    restart: unless-stopped
