# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/affine-coolify
description: Affine is an open-source, all-in-one workspace and OS for knowledge management, a Notion/Miro alternative.
endpoint:
  port: 3010
  service: affine
env:
  AFFINE_REVISION: stable
  COPILOT_FAL_API_KEY: ''
  COPILOT_OPENAI_API_KEY: ''
  COPILOT_PERPLEXITY_API_KEY: ''
  MAILER_HOST: ''
  MAILER_PASSWORD: ''
  MAILER_PORT: ''
  MAILER_SENDER: ''
  MAILER_USER: ''
  POSTGRES_DB: affine
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_AFFINE: https://${APP_DOMAIN}
  SERVICE_URL_AFFINE_3010: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: affine-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
