# affine-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  affine:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_AFFINE_3010=${SERVICE_URL_AFFINE_3010}
    - AFFINE_CONFIG_PATH=/root/.affine/config
    - REDIS_SERVER_HOST=redis
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-affine}
    - NODE_ENV=production
    - AFFINE_SERVER_HOST=$SERVICE_URL_AFFINE
    - AFFINE_SERVER_EXTERNAL_URL=$SERVICE_URL_AFFINE
    - MAILER_HOST=${MAILER_HOST}
    - MAILER_PORT=${MAILER_PORT}
    - MAILER_USER=${MAILER_USER}
    - MAILER_PASSWORD=${MAILER_PASSWORD}
    - MAILER_SENDER=${MAILER_SENDER}
    - COPILOT_FAL_API_KEY=${COPILOT_FAL_API_KEY}
    - COPILOT_PERPLEXITY_API_KEY=${COPILOT_PERPLEXITY_API_KEY}
    - COPILOT_OPENAI_API_KEY=${COPILOT_OPENAI_API_KEY}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/3010' || exit 1
      timeout: 20s
    image: ghcr.io/toeverything/affine:stable
    logging:
      driver: json-file
      options:
        max-size: 1000m
    networks:
      appnet:
        aliases:
        - affine-coolify_affine_1
    restart: unless-stopped
    volumes:
    - affine-config:/root/.affine/config
    - affine-storage:/root/.affine/storage
  affine_migration:
    command:
    - sh
    - -c
    - node ./scripts/self-host-predeploy.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - REDIS_SERVER_HOST=redis
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-affine}
    - AFFINE_INDEXER_ENABLED=false
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    networks:
      appnet:
        aliases:
        - affine-coolify_affine_migration_1
    restart: on-failure
    volumes:
    - affine-storage:/root/.affine/storage
    - affine-config:/root/.affine/config
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-affine}
    - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U affine
      timeout: 5s
    image: pgvector/pgvector:pg16
    networks:
      appnet:
        aliases:
        - affine-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - affine-postgres-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      timeout: 5s
    image: redis
    networks:
      appnet:
        aliases:
        - affine-coolify_redis_1
    restart: unless-stopped
    volumes:
    - affine-redis-data:/data
volumes:
  affine-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/affine-config
      o: bind
      type: none
  affine-postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/affine-postgres-data
      o: bind
      type: none
  affine-redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/affine-redis-data
      o: bind
      type: none
  affine-storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/affine-storage
      o: bind
      type: none
