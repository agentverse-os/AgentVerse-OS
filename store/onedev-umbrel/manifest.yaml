# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/onedev-umbrel
description: A streamlined server for code, builds, and packages
endpoint:
  port: 6610
  service: web
env:
  APP_PROXY_PORT: ''
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/onedev/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/onedev/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/onedev/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/onedev/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/onedev/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/onedev/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: onedev-umbrel
notes:
- 'порт 6611:6611 (web) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_PROXY_PORT
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app proxy port
  options: null
  required: false
  type: text
tags: []
title: OneDev
type: app
upstream:
  author: OneDev Pty
  categories:
  - developer
  release_notes: |-
    ⚠️ Before upgrading, update webhook receivers to verify X-OneDev-Signature as a lowercase hexadecimal HMAC-SHA256 of the raw request body using your webhook secret, instead of comparing the header directly with the secret. Existing receivers using the old comparison will reject deliveries until updated.

    This release improves access-token security by storing only token hashes. Copy newly created or rotated tokens immediately, as their values cannot be retrieved later. Integrations that create tokens through the REST API must use description instead of name and handle the new response containing both id and value.

    It also fixes pull request diffs for intermediate commits, container image uploads with OCI clients, and returning to the requested page after SSO login. Workspace terminals gain clipboard support and improved mobile controls.

    Important: OneDev 16.8.4 disables the Build Image, Run Buildx Image Tools, and Prune Builder Cache CI/CD steps by default for security. Jobs using these steps will fail until the relevant executor security setting is explicitly enabled for trusted projects.

    Important: OneDev 16.8.0 upgrades the build log format. Build logs created before the upgrade will no longer be displayed.

    Note: If you're updating from a pre-16.5.0 version, OneDev may regenerate the system GPG signing key when changing the default system signing email. Commits previously signed with the old system key may show as unverified.

    Full release notes can be found at https://github.com/theonedev/onedev/releases/tag/v17.2.1
  source: https://github.com/theonedev/onedev
  version: 17.2.1
  website: https://onedev.io/
website: https://onedev.io/
