# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/pgadmin-coolify
description: pgAdmin is a web-based database management tool for administering your PostgreSQL databases through a user-friendly interface.
endpoint:
  port: 80
  service: pgadmin
env:
  SERVICE_URL_PGADMIN: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: pgadmin-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- database management
title: Pgadmin
type: app
upstream:
  categories:
  - database
  source: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
  tags:
  - database management
  template: pgadmin.yaml
website: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
