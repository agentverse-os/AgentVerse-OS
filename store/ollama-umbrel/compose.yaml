# ollama-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  ollama:
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_IGPU_ENABLE: '1'
      OLLAMA_ORIGINS: '*'
      OLLAMA_VULKAN: '1'
    image: ollama/ollama:0.33.0@sha256:08ddf4b4dbfdc4fc1f5b0fe535915998581085402e307b57bb308db68460e372
    networks:
      appnet:
        aliases:
        - ollama_ollama_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/root/.ollama
