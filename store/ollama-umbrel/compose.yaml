# ollama-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  ollama:
    environment:
      GODEBUG: multipathtcp=0
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_IGPU_ENABLE: '1'
      OLLAMA_ORIGINS: '*'
      OLLAMA_VULKAN: '1'
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    networks:
      appnet:
        aliases:
        - ollama_ollama_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/root/.ollama
