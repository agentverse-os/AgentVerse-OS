- https://getumbrel.github.io/umbrel-apps-gallery/ollama/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ollama/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ollama/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/ollama/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: ollama-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Ollama
type: app
upstream:
  author: Ollama
  categories:
  - ai
  release_notes: |-
    Key highlights in this release:
      - Adds support for Ripple Preview, a model built for agentic coding.
      - Fixes the OpenAI-compatible responses API so requests are no longer silently truncated by default.
