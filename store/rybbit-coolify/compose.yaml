# rybbit-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
configs:
  rybbit-clickhouse-inline-1:
    content: |
      <clickhouse>
          <settings>
              <enable_json_type>1</enable_json_type>
          </settings>
      </clickhouse>
  rybbit-clickhouse-inline-2:
    content: |
      <clickhouse>
          <logger>
              <level>warning</level>
              <console>true</console>
          </logger>
          <query_thread_log remove="remove"/>
          <query_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
          <latency_log remove="remove"/>
          <processors_profile_log remove="remove"/>
      </clickhouse>
  rybbit-clickhouse-inline-3:
    content: |
      <clickhouse>
          <listen_host>0.0.0.0</listen_host>
      </clickhouse>
  rybbit-clickhouse-inline-4:
    content: |
      <clickhouse>
          <profiles>
              <default>
                  <log_queries>0</log_queries>
                  <log_query_threads>0</log_query_threads>
                  <log_processors_profiles>0</log_processors_profiles>
              </default>
          </profiles>
      </clickhouse>
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  rybbit:
    depends_on:
    - rybbit_backend
    environment:
    - SERVICE_URL_RYBBIT_3002=${SERVICE_URL_RYBBIT_3002}
    - NODE_ENV=production
    - NEXT_PUBLIC_BACKEND_URL=${SERVICE_URL_RYBBIT}
    - NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3002
      timeout: 10s
    image: ghcr.io/rybbit-io/rybbit-client:v2.2.3
    networks:
      appnet:
        aliases:
        - rybbit-coolify_rybbit_1
    restart: unless-stopped
  rybbit_backend:
    depends_on:
      rybbit_clickhouse:
        condition: service_healthy
      rybbit_postgres:
        condition: service_healthy
    environment:
    - NODE_ENV=production
    - TRUST_PROXY=true
    - BASE_URL=${SERVICE_URL_RYBBIT}
    - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_BACKEND}
    - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    - DISABLE_TELEMETRY=${DISABLE_TELEMETRY:-true}
    - CLICKHOUSE_HOST=http://rybbit_clickhouse:8123
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
    - POSTGRES_HOST=rybbit_postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=${POSTGRES_DB:-analytics}
    - POSTGRES_USER=${POSTGRES_USER:-frog}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3001/api/health
      timeout: 10s
    image: ghcr.io/rybbit-io/rybbit-backend:v2.2.3
    networks:
      appnet:
        aliases:
        - rybbit-coolify_rybbit_backend_1
    restart: unless-stopped
  rybbit_clickhouse:
    configs:
    - source: rybbit-clickhouse-inline-1
      target: /etc/clickhouse-server/config.d/enable_json.xml
    - source: rybbit-clickhouse-inline-2
      target: /etc/clickhouse-server/config.d/logging_rules.xml
    - source: rybbit-clickhouse-inline-3
      target: /etc/clickhouse-server/config.d/network.xml
    - source: rybbit-clickhouse-inline-4
      target: /etc/clickhouse-server/config.d/user_logging.xml
    environment:
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
    - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8123/ping
      timeout: 10s
    image: clickhouse/clickhouse-server:25.4.2
    networks:
      appnet:
        aliases:
        - rybbit-coolify_rybbit_clickhouse_1
    restart: unless-stopped
    volumes:
    - clickhouse_data:/var/lib/clickhouse
  rybbit_postgres:
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-analytics}
    - POSTGRES_USER=${POSTGRES_USER:-frog}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 10s
    image: postgres:17.4
    networks:
      appnet:
        aliases:
        - rybbit-coolify_rybbit_postgres_1
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
volumes:
  clickhouse_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/clickhouse_data
      o: bind
      type: none
  postgres_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres_data
      o: bind
      type: none
