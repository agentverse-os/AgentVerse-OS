# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/drizzle-gateway-coolify
description: Free self-hosted Drizzle Studio on steroids
endpoint:
  port: 4983
  service: drizzle-gateway
env:
  SERVICE_PASSWORD_DRIZZLE:
    generate: password
  SERVICE_URL_DRIZZLE_4983: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: drizzle-gateway-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- drizzle
- gateway
- self-hosted
- open-source
- low-code
title: Drizzle Gateway
type: app
upstream:
  categories:
  - devtools
  source: https://gateway.drizzle.team/
  tags:
  - drizzle
  - gateway
  - self-hosted
  - open-source
  - low-code
  template: drizzle-gateway.yaml
website: https://gateway.drizzle.team/
