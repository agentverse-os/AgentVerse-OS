upstream:
  author: Umbrel
  categories:
  - ai
  release_notes: |-
    Murmur now comes with Hermes 0.23.2. Your agents, chats, memories and settings carry over as they are.

    Routines keep everything you gave them on the new Hermes: one made from a template keeps its name, its days and where it tells you, one your agent sets up in a chat still reports back in that chat, and what its runs found stays in place. If your own Hermes had already updated to 0.23.2, this fixes those for you too.

    On Telegram and other messaging apps, a reply that was interrupted no longer arrives twice.
