# murmur-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hermes:
    command:
    - gateway
    - run
    environment:
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${APP_MURMUR_HERMES_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${APP_MURMUR_HERMES_SECRET}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: murmur
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_GID: '1000'
      HERMES_UID: '1000'
      UMBREL_APP_NAME: Murmur
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v0.23.2@sha256:db175a91bbe1794a294a1ca7b2e9754160ad99da1c9bd89ee9047158610dadd3
    networks:
      appnet:
        aliases:
        - murmur_hermes_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/hermes:/opt/data
  web:
    environment:
      MURMUR_ALLOWED_HOSTS: '*'
      MURMUR_BUILTIN_HERMES_PASSWORD: ${APP_MURMUR_HERMES_PASSWORD}
      MURMUR_BUILTIN_HERMES_URL: http://murmur_hermes_1:9119
      MURMUR_BUILTIN_HERMES_USERNAME: murmur
      MURMUR_FIND_HERMES: Hermes Agent=http://hermes-agent_web_1:18789
    image: ghcr.io/getumbrel/murmur:v0.15.1@sha256:1ec71455123d2bd2bc0d58268f36c6c7b2de8275b02dc90bfa106f53f78bac0f
    init: true
    networks:
      appnet:
        aliases:
        - murmur_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/murmur:/data
