# baikal-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: ghcr.io/aalmenar/baikal:0.13.0-nginx@sha256:45f70865d30a2c86d9591e78ac0441bf2153bb94022d6ccbe07cfb856c08a39b
    networks:
      appnet:
        aliases:
        - baikal_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/var/www/baikal/config
    - ${APP_DATA_DIR}/data/Specific:/var/www/baikal/Specific
