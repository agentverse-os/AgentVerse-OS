# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/ente-photos-with-s3-coolify
description: Ente Photos is a fully open source, End to End Encrypted alternative to Google Photos and Apple Photos.
endpoint:
  port: 8080
  service: web
env:
  ENTE_HTTP_USE_TLS: 'false'
  ENTE_INTERNAL_ADMIN: '1580559962386438'
  ENTE_INTERNAL_DISABLE_REGISTRATION: 'false'
  ENTE_SMTP_EMAIL: ''
  ENTE_SMTP_ENCRYPTION: tls
  ENTE_SMTP_HOST: smtp.gmail.com
  ENTE_SMTP_PASSWORD: ''
  ENTE_SMTP_PORT: '587'
  ENTE_SMTP_SENDER_NAME: ''
  ENTE_SMTP_USERNAME: ''
  MINIO_CORS_URLS: ''
  MINIO_ROOT_PASSWORD: ''
  MINIO_ROOT_USER: ''
  POSTGRES_DB: ente_db
  SERVICE_FQDN_MINIO_9000: ${APP_DOMAIN}
  SERVICE_PASSWORD_MINIO:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_REALBASE64_64_HASH:
    generate: hex64
  SERVICE_REALBASE64_ENCRYPTION:
    generate: hex64
  SERVICE_REALBASE64_JWT:
    generate: hex64
  SERVICE_URL_MUSEUM: https://${APP_DOMAIN}
  SERVICE_URL_MUSEUM_8080: https://${APP_DOMAIN}
  SERVICE_URL_WEB: https://${APP_DOMAIN}
  SERVICE_URL_WEB_3000: https://${APP_DOMAIN}
  SERVICE_USER_MINIO:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
