  release_notes: |-
    This update moves to Hermes 0.23.2. Your agents, chats and settings carry over.

    Key highlights:
      - Work an agent hands to a helper agent survives a restart, and can be picked up where it left off.
      - A reply that streamed while the agent updated its to-do list or memory now finishes, instead of leaving Stop showing.
      - On Telegram and other messaging apps, an interrupted reply no longer shows up twice.
      - Support for newer models, including Gemini 4 Carbon.
      - Security and reliability fixes.


    Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.23.2
