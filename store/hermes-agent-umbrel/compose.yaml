# hermes-agent-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    command:
    - gateway
    - run
    environment:
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_PORT: '18789'
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_GID: '1000'
      HERMES_TUI_DIR: /app/umbrel-tui
      HERMES_UID: '1000'
      HERMES_UMBREL_APP_PROXY_AUTH: '1'
      HERMES_UPSTREAM_TUI_ENTRY: /opt/hermes/ui-tui/dist/entry.js
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v0.23.2@sha256:db175a91bbe1794a294a1ca7b2e9754160ad99da1c9bd89ee9047158610dadd3
    networks:
      appnet:
        aliases:
        - hermes-agent_web_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/hermes:/opt/data
