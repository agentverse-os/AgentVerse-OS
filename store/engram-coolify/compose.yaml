# engram-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  engram:
    command:
    - cloud
    - serve
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
    - SERVICE_FQDN_ENGRAM_8080=${SERVICE_FQDN_ENGRAM_8080}
    - ENGRAM_CLOUD_HOST=0.0.0.0
    - ENGRAM_PORT=8080
    - ENGRAM_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB}?sslmode=disable
    - ENGRAM_JWT_SECRET=${SERVICE_BASE64_64_JWTSECRET}
    - ENGRAM_CLOUD_TOKEN=${SERVICE_PASSWORD_64_CLOUDTOKEN}
    - ENGRAM_CLOUD_ADMIN=${SERVICE_PASSWORD_64_ADMIN}
    - ENGRAM_CLOUD_TOKEN_PEPPER=${SERVICE_PASSWORD_64_TOKENPEPPER}
    - ENGRAM_CLOUD_ALLOWED_PROJECTS=${ENGRAM_CLOUD_ALLOWED_PROJECTS:-*}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/health
      timeout: 20s
    image: ghcr.io/gentleman-programming/engram:3.7.2
    networks:
      appnet:
        aliases:
        - engram-coolify_engram_1
    restart: unless-stopped
  postgresql:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-engram-db}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:18-alpine
    networks:
      appnet:
        aliases:
        - engram-coolify_postgresql_1
    restart: unless-stopped
    volumes:
    - engram-postgresql-data:/var/lib/postgresql
volumes:
  engram-postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/engram-postgresql-data
      o: bind
      type: none
