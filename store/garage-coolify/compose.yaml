# garage-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
configs:
  garage-inline-1:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"

      replication_factor = 1
      consistency_mode = "consistent"

      compression_level = 1
      block_size = "1M"

      rpc_bind_addr = "[::]:3901"
      rpc_secret_file = "env:GARAGE_RPC_SECRET"
      bootstrap_peers = []

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token_file = "env:GARAGE_ADMIN_TOKEN"
      metrics_token_file = "env:GARAGE_METRICS_TOKEN"
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  garage:
    configs:
    - source: garage-inline-1
      target: /etc/garage.toml
    environment:
    - GARAGE_S3_API_URL=$GARAGE_S3_API_URL
    - GARAGE_WEB_URL=$GARAGE_WEB_URL
    - GARAGE_ADMIN_URL=$GARAGE_ADMIN_URL
    - GARAGE_RPC_SECRET=${SERVICE_HEX_64_RPCSECRET}
    - GARAGE_ADMIN_TOKEN=$SERVICE_PASSWORD_GARAGE
    - GARAGE_METRICS_TOKEN=$SERVICE_PASSWORD_GARAGEMETRICS
    - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
    - RUST_LOG=${RUST_LOG:-garage=info}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - /garage
      - stats
      - -a
      timeout: 5s
    image: dxflrs/garage:v2.1.0
    networks:
      appnet:
        aliases:
        - garage-coolify_garage_1
    restart: unless-stopped
    volumes:
    - garage-meta:/var/lib/garage/meta
    - garage-data:/var/lib/garage/data
volumes:
  garage-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/garage-data
      o: bind
      type: none
  garage-meta:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/garage-meta
      o: bind
      type: none
