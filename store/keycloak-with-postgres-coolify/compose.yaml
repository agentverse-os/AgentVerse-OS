# keycloak-with-postgres-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  keycloak:
    command:
    - start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_KEYCLOAK_8080=${SERVICE_URL_KEYCLOAK_8080}
    - TZ=${TIMEZONE:-UTC}
    - KC_BOOTSTRAP_ADMIN_USERNAME=${SERVICE_USER_ADMIN}
    - KC_BOOTSTRAP_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    - KC_DB=postgres
    - KC_DB_USERNAME=${SERVICE_USER_DATABASE}
    - KC_DB_PASSWORD=${SERVICE_PASSWORD_64_DATABASE}
    - KC_DB_URL_PORT=5432
    - KC_DB_URL=jdbc:postgresql://postgres/${POSTGRESQL_DATABASE:-keycloak}
    - KC_HOSTNAME=${SERVICE_URL_KEYCLOAK}
    - KC_HTTP_ENABLED=${KC_HTTP_ENABLED:-true}
    - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED:-true}
    - KC_PROXY_HEADERS=${KC_PROXY_HEADERS:-xforwarded}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"
      timeout: 20s
    image: quay.io/keycloak/keycloak:26.1
    networks:
      appnet:
        aliases:
        - keycloak-with-postgres-coolify_keycloak_1
    restart: unless-stopped
    volumes:
    - keycloak-data:/opt/keycloak/data
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_DATABASE}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_DATABASE}
    - POSTGRES_DB=${POSTGRESQL_DATABASE:-keycloak}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - keycloak-with-postgres-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - keycloak-postgresql-data:/var/lib/postgresql/data
volumes:
  keycloak-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/keycloak-data
      o: bind
      type: none
  keycloak-postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/keycloak-postgresql-data
      o: bind
      type: none
