# dcrdex-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    entrypoint:
    - /bin/sh
    - -c
    - exec ./bisonw --webaddr $(hostname -I|cut -d\  -f1 ):5758
    image: decred/dcrdex:v1.0.5@sha256:5d010b92fbb452c9df6e0205d9bb0c8f8c446e011d69501c1e0a9b1fc4abd792
    networks:
      appnet:
        aliases:
        - dcrdex_web_1
    restart: on-failure
    stop_grace_period: 15m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/dex/.dexc
