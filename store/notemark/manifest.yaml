# Импортировано из каталога runtipi командой `cloudd store import runtipi`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/notemark
description: Lighting fast web-based Markdown notes app.
endpoint:
  port: 80
  service: notemark-proxy
env:
  NOTEMARK_SERVICE_SECRET:
    generate: token
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.jpg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: notemark
notes: []
origin: runtipi
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: NOTEMARK_SERVICE_SECRET
  hint: null
  label: Notemark secret
  options: null
  required: false
  type: random
tags: []
title: Notemark
type: app
upstream:
  author: enchant97
  categories:
  - utilities
  source: https://github.com/enchant97/note-mark/
  tipi_version: 55
  version: 0.19.5
website: https://github.com/enchant97/note-mark/
