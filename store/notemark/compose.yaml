# notemark: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  notemark:
    image: ghcr.io/enchant97/note-mark-frontend:0.19.3
    networks:
      appnet:
        aliases:
        - notemark_notemark_1
    restart: unless-stopped
  notemark-backend:
    environment:
      CORS_ORIGINS: '*'
      JWT_SECRET: ${NOTEMARK_SERVICE_SECRET}
    image: ghcr.io/enchant97/note-mark-backend:0.19.5
    networks:
      appnet:
        aliases:
        - notemark_notemark-backend_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
  notemark-proxy:
    image: nginx:alpine
    networks:
      appnet:
        aliases:
        - notemark_notemark-proxy_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
