# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/octoprint-umbrel
description: A snappy web interface for your 3D printer
endpoint:
  port: 5000
  service: web
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/octoprint/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/octoprint/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/octoprint/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/octoprint/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: octoprint-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: OctoPrint
type: app
upstream:
  author: OctoPrint
  categories:
  - files
  release_notes: |-
    This release fixes two security issues affecting OctoPrint 1.11.7 and earlier:
      - Fixed an XSS vulnerability in suppressed command notifications
      - Fixed a file exfiltration issue in upload endpoints


    It also fixes a serial connection thread leak when connecting to a printer that does not respond to handshake attempts.

    Full release notes can be found at https://github.com/OctoPrint/OctoPrint/releases/tag/1.11.8
  source: https://github.com/OctoPrint/OctoPrint
  version: 1.11.8
  website: https://octoprint.org/
website: https://octoprint.org/
