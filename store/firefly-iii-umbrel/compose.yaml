# firefly-iii-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      MYSQL_DATABASE: fireflyiii
      MYSQL_PASSWORD: moneyprintergobrrr
      MYSQL_ROOT_PASSWORD: moneyprintergobrrr
      MYSQL_USER: fireflyiii
    image: mariadb:10.9.4@sha256:f5146e2e0999a6afcf2a9134bb415ad068bf80ec29704f374f6f7dabb145738d
    networks:
      appnet:
        aliases:
        - firefly-iii_db_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
  server:
    environment:
      APP_KEY: $APP_FIREFLY_III_APP_KEY
      DB_CONNECTION: mysql
      DB_DATABASE: fireflyiii
      DB_HOST: firefly-iii_db_1
      DB_PASSWORD: moneyprintergobrrr
      DB_PORT: 3306
      DB_USERNAME: fireflyiii
    image: fireflyiii/core:version-6.6.6@sha256:ae69fdd95cdef9038cd7a460a5aec731f14813973e4f096511d5a4ea9ff0e972
    networks:
      appnet:
        aliases:
        - firefly-iii_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/upload:/var/www/html/storage/upload
    - ${APP_DATA_DIR}/data/logs:/var/www/html/storage/logs
