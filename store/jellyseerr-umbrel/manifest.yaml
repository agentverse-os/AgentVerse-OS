  release_notes: |-
    This update improves request handling, media scanning, and sign-in reliability.
    - Prevents background cache refresh failures from logging credentials.
    - Enforces advanced request permissions and fixes request sorting and completion issues.
    - Improves Jellyfin season and episode scanning and Plex sign-in and watchlist syncing.
    - Preserves discovery filters when navigating back and fixes SQLite migration compatibility.
    Direct API consumers upgrading from before 3.5.0 should note that Plex/Jellyfin library reads no longer accept sync or enable query parameters; use the dedicated sync and library update endpoints instead. The web UI already uses the new endpoints.
    Full release notes are available at https://github.com/seerr-team/seerr/releases/tag/v3.5.2
