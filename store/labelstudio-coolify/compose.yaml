# labelstudio-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  labelstudio:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_LABELSTUDIO_8080=${SERVICE_URL_LABELSTUDIO_8080}
    - CSRF_TRUSTED_ORIGINS=${SERVICE_URL_LABELSTUDIO}
    - EXPERIMENTAL_FEATURES=${EXPERIMENTAL_FEATURES:-false}
    - DJANGO_DB=${DJANGO_DB:-default}
    - POSTGRE_NAME=${POSTGRES_DB:-labelstudio}
    - POSTGRE_USER=${SERVICE_USER_POSTGRES}
    - POSTGRE_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRE_PORT=5432
    - POSTGRE_HOST=postgres
    - LABEL_STUDIO_HOST=${SERVICE_URL_LABELSTUDIO}
    - SSRF_PROTECTION_ENABLED=${SSRF_PROTECTION_ENABLED:-true}
    - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK:-true}
    - DATA_UPLOAD_MAX_NUMBER_FILES=${DATA_UPLOAD_MAX_NUMBER_FILES:-10000}
    - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME:-admin@example.com}
    - LABEL_STUDIO_PASSWORD=${SERVICE_PASSWORD_LABELSTUDIO}
    - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK:-true}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - curl -f http://localhost:8080/health || exit 1
      timeout: 20s
    image: heartexlabs/label-studio:latest
    networks:
      appnet:
        aliases:
        - labelstudio-coolify_labelstudio_1
    restart: unless-stopped
    volumes:
    - labelstudio-data:/label-studio/data
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-labelstudio}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - labelstudio-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - pg-data:/var/lib/postgresql/data
volumes:
  labelstudio-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/labelstudio-data
      o: bind
      type: none
  pg-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/pg-data
      o: bind
      type: none
