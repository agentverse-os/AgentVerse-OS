# jellyfin-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  jellyfin:
    environment:
    - SERVICE_URL_JELLYFIN_8096=${SERVICE_URL_JELLYFIN_8096}
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Madrid
    - JELLYFIN_PublishedServerUrl=$SERVICE_URL_JELLYFIN
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8096
      timeout: 10s
    image: lscr.io/linuxserver/jellyfin:10.11.8
    networks:
      appnet:
        aliases:
        - jellyfin-coolify_jellyfin_1
    restart: unless-stopped
    volumes:
    - jellyfin-config:/config
    - jellyfin-tvshows:/data/tvshows
    - jellyfin-movies:/data/movies
volumes:
  jellyfin-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/jellyfin-config
      o: bind
      type: none
  jellyfin-movies:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/jellyfin-movies
      o: bind
      type: none
  jellyfin-tvshows:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/jellyfin-tvshows
      o: bind
      type: none
