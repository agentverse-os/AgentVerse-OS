  path: null
  user: null
name: snort-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Snort
type: app
upstream:
  author: Snort
  categories:
  - social
  release_notes: |-
    ⚠️ Before updating, update your Umbrel to umbrelOS 2.0 or later and make sure you have your Nostr key or access to your signer. Snort now opens over HTTPS, so you’ll need to sign in again. Browser-local settings and wallet connections won’t transfer automatically.

    - Pages now load faster and shared links show previews, with new feed tabs and a refreshed mobile navigation bar.
    - Redesigned direct messages and made switching between multiple accounts easier.
    - Remote signer logins now stay signed in after reloading the page, and work with more signers.
    - Fixed relay lists not being remembered, profiles not refreshing, and settings not loading from some relays.
    - Fixed crashes on the messages page and in recommended notes.

    Full release notes can be found at https://github.com/v0l/snort/releases/tag/v0.5.6
  source: https://git.v0l.io/Kieran/snort
  version: v0.5.6
  website: https://snort.social
website: https://snort.social
