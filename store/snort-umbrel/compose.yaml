# snort-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: voidic/snort:v0.5.6@sha256:b680ecc8ccf7a76a59b61a403204dc2c796c8b7a013afd754e9e4df2bfa4c6ef
    init: true
    networks:
      appnet:
        aliases:
        - snort_web_1
    restart: on-failure
    user: 101:101
