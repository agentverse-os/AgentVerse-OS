# freshrss-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  freshrss:
    environment:
    - SERVICE_URL_FRESHRSS_80=${SERVICE_URL_FRESHRSS_80}
    - CRON_MIN=${CRON_MIN:-1,31}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      timeout: 20s
    image: freshrss/freshrss:latest
    networks:
      appnet:
        aliases:
        - freshrss-coolify_freshrss_1
    restart: unless-stopped
    volumes:
    - freshrss-data:/var/www/FreshRSS/data
    - freshrss-extensions:/var/www/FreshRSS/extensions
volumes:
  freshrss-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/freshrss-data
      o: bind
      type: none
  freshrss-extensions:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/freshrss-extensions
      o: bind
      type: none
