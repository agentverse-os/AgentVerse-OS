# skybro-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  tracker:
    image: xdeekay/skybro-tracker:1.6.2@sha256:9425a99b0f1cfbf8a4cf39ee4ca8876496d20750e9b960109fc9d5b1eeaa2c67
    networks:
      appnet:
        aliases:
        - skybro_tracker_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - /etc/localtime:/etc/localtime:ro
  web:
    depends_on:
    - tracker
    image: xdeekay/skybro-dashboard:1.6.2@sha256:83ad07aee074ab3d827db00c081eea0e6bf17e7f104ff6ac635bc7dbe6ce2eea
    networks:
      appnet:
        aliases:
        - skybro_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - /etc/localtime:/etc/localtime:ro
