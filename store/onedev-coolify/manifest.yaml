# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/onedev-coolify
description: Git server with CI/CD, kanban, and packages. Seamless integration. Unparalleled experience.
endpoint:
  port: 6610
  service: onedev
env:
  ONEDEV_EMAIL: mail@example.com
  POSTGRESQL_DATABASE: onedev
  SERVICE_PASSWORD_64_DATABASE:
    generate: hex64
  SERVICE_PASSWORD_ONEDEV:
    generate: password
  SERVICE_URL_ONEDEV: https://${APP_DOMAIN}
  SERVICE_URL_ONEDEV_6610: https://${APP_DOMAIN}
  SERVICE_USER_DATABASE:
    generate: password
  SERVICE_USER_ONEDEV:
    generate: password
  SSH_ROOT_URL: ssh://changeme:22
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_ONEDEV
  path: null
  user: SERVICE_USER_ONEDEV
name: onedev-coolify
notes:
- 'onedev: docker.sock заменён на read-only прокси (DOCKER_HOST=tcp://cloudos-docker-ro:2375)'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRESQL_DATABASE
  hint: 'по умолчанию: onedev'
  label: postgresql database
  options: null
  required: false
  type: text
- env: ONEDEV_EMAIL
  hint: 'по умолчанию: mail@example.com'
  label: onedev email
  options: null
  required: false
  type: text
- env: SSH_ROOT_URL
  hint: 'по умолчанию: ssh://changeme:22'
  label: ssh root url
  options: null
  required: false
  type: text
tags:
- git
- scm
- ci
- cd
- kanban
- packages
- devops
- collaboration
- code
- repository
- management
title: Onedev
type: app
upstream:
  categories:
  - git
  source: https://docs.onedev.io/
  tags:
  - git
  - scm
  - ci
  - cd
  - kanban
  - packages
  - devops
  - collaboration
  - code
  - repository
  - management
  template: onedev.yaml
website: https://docs.onedev.io/
