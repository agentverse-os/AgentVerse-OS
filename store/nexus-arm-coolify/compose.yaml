# nexus-arm-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  nexus:
    environment:
    - SERVICE_URL_NEXUS_8081=${SERVICE_URL_NEXUS_8081}
    - NEXUS_SECURITY_RANDOMPASSWORD=false
    - INSTALL4J_ADD_VM_PARAMS=-Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/service/rest/v1/status
      timeout: 10s
    image: sonatypecommunity/nexus3
    networks:
      appnet:
        aliases:
        - nexus-arm-coolify_nexus_1
    restart: unless-stopped
    volumes:
    - nexus_data:/nexus-data
volumes:
  nexus_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/nexus_data
      o: bind
      type: none
