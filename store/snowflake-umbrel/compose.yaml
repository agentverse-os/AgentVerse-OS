# snowflake-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  proxy:
    command: -log /data/snowflake.log -verbose
    image: thetorproject/snowflake-proxy:v2.15.4@sha256:7d442bc13392fd3f4ab67ff7c457773ccfc4996e25f14c67081b9375c690e367
    networks:
      appnet:
        aliases:
        - snowflake_proxy_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/data
  web:
    command: gotty --port 3800 --index "/snowflake/index.html" --title-format "Tor Snowflake Proxy" bash -c 'tail -n 10000 -f /snowflake/snowflake.log | grep "Traffic Relayed"'
    image: sorenisanerd/gotty:v1.6.0@sha256:23b4669973e96d8d7d37b3bfd9e6566bdd701aa1a56eee2dc0e0362bd927ed88
    networks:
      appnet:
        aliases:
        - snowflake_web_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/snowflake
