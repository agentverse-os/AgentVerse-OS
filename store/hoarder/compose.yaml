# hoarder: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hoarder:
    environment:
      BROWSER_WEB_URL: http://hoarder-chrome:9222
      DATA_DIR: /data
      HOARDER_VERSION: 0.20.0
      MEILI_ADDR: http://hoarder-meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    image: ghcr.io/hoarder-app/hoarder:0.35.0
    networks:
      appnet:
        aliases:
        - hoarder_hoarder_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
  hoarder-chrome:
    command:
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    networks:
      appnet:
        aliases:
        - hoarder_hoarder-chrome_1
    restart: unless-stopped
  hoarder-meilisearch:
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: 'true'
      MEILI_UPGRADE_DB: 'true'
    image: getmeili/meilisearch:v1.57
    networks:
      appnet:
        aliases:
        - hoarder_hoarder-meilisearch_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/melli_data:/meili_data
