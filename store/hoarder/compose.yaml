# hoarder: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hoarder:
    environment:
      BROWSER_WEB_URL: http://hoarder-chrome:9222
      DATA_DIR: /data
      HOARDER_VERSION: 0.20.0
      MEILI_ADDR: http://hoarder-meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    image: ghcr.io/hoarder-app/hoarder:0.33.2
    networks:
      appnet:
        aliases:
        - hoarder_hoarder_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
  hoarder-chrome:
    command:
    - --no-sandbox
    - --disable-gpu
    - --disable-dev-shm-usage
    - --remote-debugging-address=0.0.0.0
    - --remote-debugging-port=9222
    - --hide-scrollbars
    image: gcr.io/zenika-hub/alpine-chrome:124
    networks:
      appnet:
        aliases:
        - hoarder_hoarder-chrome_1
    restart: unless-stopped
  hoarder-meilisearch:
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: 'true'
    image: getmeili/meilisearch:v1.53
    networks:
      appnet:
        aliases:
        - hoarder_hoarder-meilisearch_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/melli_data:/meili_data
