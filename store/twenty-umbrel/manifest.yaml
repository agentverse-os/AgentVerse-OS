notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Twenty
type: app
upstream:
  author: Twenty.com PBC
  categories:
  - files
  release_notes: |-
    Twenty 2.37.4 improves performance around workspace cache recomputation, metadata queries, email full-sync cleanup, and imported-message processing.

    This release also fixes rate-limit handling so users see proper rate-limit errors, and improves file-storage streaming cleanup to avoid stuck S3 connections during workspace setup or application asset downloads.
  source: https://github.com/twentyhq/twenty
  version: 2.37.4
  website: https://twenty.com/
website: https://twenty.com/
