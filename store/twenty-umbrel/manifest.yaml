- https://getumbrel.github.io/umbrel-apps-gallery/twenty/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/twenty/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/twenty/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/twenty/4.jpg
health: null
hooks: {}
host_docker_socket: false
