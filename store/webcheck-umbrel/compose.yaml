# webcheck-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: ghcr.io/lissy93/web-check:2.4.0@sha256:3f46c4fdc6c41aac57b6e1965b6afaf4d19239ececdc7b4c12a89211890eaec8
    networks:
      appnet:
        aliases:
        - webcheck_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
