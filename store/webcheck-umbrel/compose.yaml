# webcheck-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: ghcr.io/lissy93/web-check:2.2.0@sha256:455bf61b5cb69b48e1ce600d05ad294fff5a1b8a60b361c54b4893edab6ec496
    networks:
      appnet:
        aliases:
        - webcheck_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
