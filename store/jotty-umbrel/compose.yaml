# jotty-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - NODE_ENV=production
    - INTERNAL_API_URL=http://localhost:3000
    image: ghcr.io/fccview/jotty:1.30.0@sha256:4face8fd1049d1ec3813f3da949d69fb68703f0f8421902a7a2de8ba3f1d61a6
    networks:
      appnet:
        aliases:
        - jotty_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/data
    - ${APP_DATA_DIR}/data/config:/app/config
    - ${APP_DATA_DIR}/data/cache:/app/.next/cache
