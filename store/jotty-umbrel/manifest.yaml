upstream:
  author: fccview
  categories:
  - files
  release_notes: |-
    ⚠️ Back up your Jotty data before updating. This release migrates attachments so they are accessible only to users who own or have access to the associated notes. Complete the migration when prompted in Jotty.

    Highlights:
      - Redesigned public notes, checklists, and Kanban boards, with the owner's theme, a table of contents, and links between public pages.
      - Faster saving, category creation, and admin pages.
      - Improved recurring tasks, including API support and fixes for completed and in-progress items.
      - Fixed checklist text containing vertical bars, bulk item insertion order, and missing recent items.
      - Fixed data exports missing folder sharing settings, note headers after folder renames, and hashtag handling.
      - Security updates and improved iPad sidebar layout.


    API integrations should note that export downloads now require authentication and admin whole-data exports using an API key are denied.

    Full release notes can be found at https://github.com/fccview/jotty/releases/tag/1.30.0
