# scanservjs-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: sbs20/scanservjs:v3.3.0@sha256:7a0c0dfd546f483c2fe8c5ccdcd8fc96301a41fb0d4309747fc8268108defb6a
    networks:
      appnet:
        aliases:
        - scanservjs_server_1
    privileged: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/scans:/var/lib/scanservjs/output
    - ${APP_DATA_DIR}/data/config:/etc/scanservjs
    - /var/run/dbus:/var/run/dbus
    - /dev:/dev
