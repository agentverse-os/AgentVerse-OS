# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/reactive-resume-coolify
description: A one-of-a-kind resume builder that keeps your privacy in mind.
endpoint:
  port: 3000
  service: reactive-resume
env:
  FLAG_DISABLE_EMAIL_AUTH: 'false'
  FLAG_DISABLE_SIGNUPS: 'false'
  POSTGRES_DB: reactive_resume
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_AUTHSECRET:
    generate: hex64
  SERVICE_PASSWORD_64_ENCRYPTIONSECRET:
    generate: hex64
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_REACTIVERESUME: https://${APP_DOMAIN}
  SERVICE_URL_REACTIVERESUME_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: reactive-resume-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRES_DB
  hint: 'по умолчанию: reactive_resume'
  label: postgres db
  options: null
  required: false
  type: text
- env: FLAG_DISABLE_SIGNUPS
  hint: 'по умолчанию: false'
  label: flag disable signups
  options: null
  required: false
  type: text
- env: FLAG_DISABLE_EMAIL_AUTH
  hint: 'по умолчанию: false'
  label: flag disable email auth
  options: null
  required: false
  type: text
- env: POSTGRES_USER
  hint: null
  label: postgres user
  options: null
  required: false
  type: text
tags:
- reactive-resume
- resume-builder
- open-source
- 2fa
title: Reactive Resume
type: app
upstream:
  categories:
  - productivity
  source: https://docs.rxresu.me/self-hosting/docker
  tags:
  - reactive-resume
