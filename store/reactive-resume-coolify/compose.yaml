# reactive-resume-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-reactive_resume}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:18-alpine
    networks:
      appnet:
        aliases:
        - reactive-resume-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql
  reactive-resume:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_REACTIVERESUME_3000=${SERVICE_URL_REACTIVERESUME_3000}
    - APP_URL=${SERVICE_URL_REACTIVERESUME}
    - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-reactive_resume}
    - AUTH_SECRET=${SERVICE_PASSWORD_64_AUTHSECRET}
    - ENCRYPTION_SECRET=${SERVICE_PASSWORD_64_ENCRYPTIONSECRET}
    - FLAG_DISABLE_SIGNUPS=${FLAG_DISABLE_SIGNUPS:-false}
    - FLAG_DISABLE_EMAIL_AUTH=${FLAG_DISABLE_EMAIL_AUTH:-false}
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      timeout: 5s
    image: amruthpillai/reactive-resume:v6
    networks:
      appnet:
        aliases:
        - reactive-resume-coolify_reactive-resume_1
    restart: unless-stopped
    volumes:
    - reactive-resume-data:/app/data
volumes:
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
  reactive-resume-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/reactive-resume-data
      o: bind
      type: none
