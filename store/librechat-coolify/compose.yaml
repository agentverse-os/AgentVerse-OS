# librechat-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
configs:
  librechat-inline-1:
    content: |
      version: 1.2.8
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  librechat:
    configs:
    - source: librechat-inline-1
      target: /app/librechat.yaml
    depends_on:
      meilisearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rag-api:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    environment:
    - SERVICE_URL_LIBRECHAT_3080=${SERVICE_URL_LIBRECHAT_3080}
    - DOMAIN_CLIENT=${SERVICE_URL_LIBRECHAT}
    - DOMAIN_SERVER=${SERVICE_URL_LIBRECHAT}
    - HOST=0.0.0.0
    - PORT=3080
    - MONGO_URI=mongodb://${SERVICE_USER_MONGO}:${SERVICE_PASSWORD_MONGO}@mongodb:27017/librechat?authSource=admin
    - MEILI_HOST=http://meilisearch:7700
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    - RAG_PORT=8000
    - RAG_API_URL=http://rag-api:8000
    - JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - JWT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWT}
    - APP_TITLE=${APP_TITLE:-LibreChat}
    - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
    - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
    - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
    - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}
    - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}
    - ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
    - CREDS_KEY=${SERVICE_PASSWORD_64_CREDS}
    - CREDS_IV=${SERVICE_PASSWORD_CREDS}
    - ANTHROPIC_API_KEY=${SERVICE_ANTHROPIC_API_KEY:-user_provided}
    - GOOGLE_KEY=${SERVICE_GOOGLE_API_KEY:-user_provided}
    - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-user_provided}
    - ASSISTANTS_API_KEY=${SERVICE_ASSISTANTS_API_KEY:-user_provided}
    - DEBUG_LOGGING=${DEBUG_LOGGING:-false}
    - DEBUG_OPENAI=${DEBUG_OPENAI:-false}
    - DEBUG_PLUGINS=${DEBUG_OPENAI:-false}
    - NO_INDEX=${NO_INDEX:-true}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3080/health
      timeout: 10s
    image: ghcr.io/danny-avila/librechat-dev-api:6ecd1b510faaa593ad954fb6276c18e5f12a8e53
    networks:
      appnet:
        aliases:
        - librechat-coolify_librechat_1
    restart: unless-stopped
    volumes:
    - librechat-images:/app/client/public/images
    - librechat-logs:/app/api/logs
    - librechat-uploads:/app/uploads
  meilisearch:
    environment:
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-false}
    - MEILI_ENV=production
    - MEILI_HOST=http://meilisearch:7700
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:7700/health
      timeout: 10s
    image: getmeili/meilisearch:v1.35.1
    networks:
      appnet:
        aliases:
        - librechat-coolify_meilisearch_1
    restart: unless-stopped
    volumes:
    - meilisearch-data:/meili_data
  mongodb:
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${SERVICE_USER_MONGO}
    - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD
      - mongosh
      - --eval
      - db.runCommand('ping').ok
      - 127.0.0.1:27017/test
      - --quiet
      timeout: 10s
    image: mongo:8
    networks:
      appnet:
        aliases:
        - librechat-coolify_mongodb_1
    restart: unless-stopped
    volumes:
    - mongodb-data:/data/db
  rag-api:
    depends_on:
      vectordb:
        condition: service_healthy
    environment:
    - POSTGRES_DB=rag
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - DB_HOST=vectordb
    - DB_USER=${SERVICE_USER_POSTGRES}
    - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - DB_NAME=rag
    - RAG_PORT=8000
    - RAG_OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-user_provided}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      timeout: 10s
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.3
    networks:
      appnet:
        aliases:
        - librechat-coolify_rag-api_1
    restart: unless-stopped
  vectordb:
    environment:
    - POSTGRES_DB=rag
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      interval: 2s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - pg_isready
      - --username=$SERVICE_USER_POSTGRES
      - --host=127.0.0.1
      - --port=5432
      - --dbname=rag
      timeout: 1m
    image: ankane/pgvector:v0.5.1
    networks:
      appnet:
        aliases:
        - librechat-coolify_vectordb_1
    restart: unless-stopped
    volumes:
    - vectordb-data:/var/lib/postgresql/data
volumes:
  librechat-images:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/librechat-images
      o: bind
      type: none
  librechat-logs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/librechat-logs
      o: bind
      type: none
  librechat-uploads:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/librechat-uploads
      o: bind
      type: none
  meilisearch-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/meilisearch-data
      o: bind
      type: none
  mongodb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mongodb-data
      o: bind
      type: none
  vectordb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/vectordb-data
      o: bind
      type: none
