# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/docmost-umbrel
description: An collaborative wiki and documentation software
endpoint:
  port: 3000
  service: web
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/docmost/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/docmost/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/docmost/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/docmost/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/docmost/5.webp
- https://getumbrel.github.io/umbrel-apps-gallery/docmost/6.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/docmost/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: docmost-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Docmost
type: app
upstream:
  author: Docmost, Inc.
  categories:
  - files
  release_notes: |-
    This update lets you connect an SMTP email provider in Docmost's app settings on umbrelOS 2.0, for workspace invitations and password resets.

    Previous Docmost 0.97.0 release notes:

    This release adds page presentation mode, tabs blocks, comment deep links, improved subpage sorting, and a template option for empty pages.

    It also improves search performance, page duplication, Markdown and document exports, and includes security fixes.

    Full release notes can be found at https://github.com/docmost/docmost/releases/tag/v0.97.0
  source: https://github.com/docmost/docmost
  version: 0.97.0-patch.1
  website: https://docmost.com/
website: https://docmost.com/
