# docmost-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: docmost
      POSTGRES_PASSWORD: docmostpass
      POSTGRES_USER: docmostuser
    image: postgres:17.3@sha256:0321e2252ebfeecb8bc1a899755084d29bce872953e1a5a3e25ec0860b739098
    networks:
      appnet:
        aliases:
        - docmost_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db_data:/var/lib/postgresql/data
  redis:
    image: redis:8.0.1@sha256:b3ad79880c88e302deb5e0fed6cee3e90c0031eb90cd936b01ef2f83ff5b3ff2
    networks:
      appnet:
        aliases:
        - docmost_redis_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/redis_data:/data
  web:
    depends_on:
    - db
    - redis
    environment:
      APP_SECRET: ${APP_SEED}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8941
      DATABASE_URL: postgresql://docmostuser:docmostpass@docmost_db_1:5432/docmost?sslmode=disable
      DISABLE_TELEMETRY: 'true'
      REDIS_URL: redis://docmost_redis_1:6379
    image: docmost/docmost:0.95.0@sha256:3f05c20808ebd680f74bae4686bb123e4a21c166d4fb1b5a653b02ffa9ba2cff
    networks:
      appnet:
        aliases:
        - docmost_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/docmost_data:/app/data/storage
