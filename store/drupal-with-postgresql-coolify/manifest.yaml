  type: text
- env: POSTGRES_DB
  hint: null
  label: postgres db
  options: null
  required: false
  type: text
tags:
- cms
- blog
- content
- management
- postgresql
title: Drupal With Postgresql
type: app
upstream:
  categories:
  - cms
