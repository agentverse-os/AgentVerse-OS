# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/documenso-coolify
description: Document signing, finally open source
endpoint:
  port: 3000
  service: documenso
env:
  CERT_INFO_COUNTRY_NAME: DO
  CERT_INFO_EMAIL: example@gmail.com
  CERT_INFO_LOCALITY_NAME: Santiago
  CERT_INFO_ORGANIZATIONAL_UNIT: IT Department
  CERT_INFO_ORGANIZATION_NAME: Example INC
  CERT_INFO_STATE_OR_PROVIDENCE: Santiago
  CERT_VALID_DAYS: '365'
  DISABLE_LOGIN: 'false'
  NEXT_PRIVATE_RESEND_API_KEY: ''
  NEXT_PRIVATE_SIGNING_LOCAL_FILE_PASSPHRASE: ''
  NEXT_PRIVATE_SMTP_FROM_ADDRESS: ''
  NEXT_PRIVATE_SMTP_FROM_NAME: ''
  NEXT_PRIVATE_SMTP_HOST: ''
  NEXT_PRIVATE_SMTP_PASSWORD: ''
  NEXT_PRIVATE_SMTP_PORT: ''
  NEXT_PRIVATE_SMTP_TRANSPORT: ''
  NEXT_PRIVATE_SMTP_USERNAME: ''
  POSTGRES_DB: documenso-db
  POSTGRES_USER: ''
  SERVICE_BASE64_AUTHSECRET:
    generate: hex64
  SERVICE_BASE64_ENCRYPTIONKEY:
    generate: hex64
  SERVICE_BASE64_SECONDARYENCRYPTIONKEY:
    generate: hex64
  SERVICE_PASSWORD_DOCUMENSO:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_DOCUMENSO: https://${APP_DOMAIN}
  SERVICE_URL_DOCUMENSO_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
