# nocodb: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  nocodb:
    depends_on:
      nocodb-db:
        condition: service_healthy
    environment:
      DB_QUERY_LIMIT_DEFAULT: ${NOCODB_TABLE_ROWS-25}
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_DB: pg://nocodb-db:5432?u=postgres&p=${NOCODB_DB_PASSWORD}&d=nocodb
      NC_PUBLIC_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      NC_REDIS_URL: redis://default:${NOCODB_REDIS_PASSWORD}@nocodb-redis:6379
    image: nocodb/nocodb:2026.08.1
    networks:
      appnet:
        aliases:
        - nocodb_nocodb_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/nocode-data:/usr/app/data
  nocodb-db:
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_PASSWORD: ${NOCODB_DB_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 10
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      timeout: 2s
    image: postgres:16
    networks:
      appnet:
        aliases:
        - nocodb_nocodb-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
  nocodb-redis:
    command: redis-server --requirepass ${NOCODB_REDIS_PASSWORD}
    healthcheck:
      interval: 1s
      retries: 30
      test: redis-cli ping
      timeout: 3s
    image: redis:alpine
    networks:
      appnet:
        aliases:
        - nocodb_nocodb-redis_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
