# Импортировано из каталога runtipi командой `cloudd store import runtipi`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/windows
description: Full windows vm in your browser
endpoint:
  port: 8006
  service: windows
env:
  WINDOWS_CPU_CORES: ''
  WINDOWS_DISK_SIZE_GB: ''
  WINDOWS_RAM_GB: ''
  WINDOWS_VERSION: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.jpg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: windows
notes:
- 'порт 3389→3389 (windows) не публикуется: доступ только через edge/gate'
origin: runtipi
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: WINDOWS_RAM_GB
  hint: RAM to asign to the VM (in gigabytes)
  label: RAM
  options: null
  required: true
  type: number
- env: WINDOWS_CPU_CORES
  hint: CPU cores to asign to the VM
  label: CPU Cores
  options: null
  required: true
  type: number
- env: WINDOWS_DISK_SIZE_GB
  hint: Disk size for the VM, it will be used dynamically (in gigabytes)
  label: Disk Size
  options: null
  required: true
  type: number
- env: WINDOWS_VERSION
  hint: The windows version to use
  label: Windows Version
  options:
  - label: Windows 10
    value: win10
  - label: Windows 11
    value: win11
  - label: Windows 10 LTSC
    value: ltsc10
  - label: Windows 8.1
    value: win81
  - label: Windows 7
    value: win7
  - label: Windows Vista
    value: vista
  - label: Windows XP
    value: winxp
  - label: Windows Server 2022
    value: '2022'
  - label: Windows Server 2019
    value: '2019'
  - label: Windows Server 2016
    value: '2016'
  - label: Windows Server 2012
    value: '2012'
  - label: Windows Server 2008
    value: '2008'
  - label: Windows Tiny 11 Core
    value: core11
  - label: Windows Tiny 11
    value: tiny11
  - label: Windows Tiny 10
    value: tiny10
  required: true
  type: text
tags: []
title: Windows
type: app
upstream:
  author: dockurr
  categories:
  - utilities
  source: https://github.com/dockur/windows/
  tipi_version: 104
  version: '6.05'
website: https://github.com/dockur/windows/
