    This update adds Smart Lists, multi-tag filtering, and a redesigned view editor with pinned views and improved mobile layouts.

    Task duplication now keeps links, files, and deadlines. Recurring tasks, cross-project search, worklog exports, and sync recovery are more reliable, with faster startup and smoother navigation.

