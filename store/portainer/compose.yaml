# portainer: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  portainer:
    image: portainer/portainer-ce:2.44.0
    labels:
      traefik.http.services.{{RUNTIPI_APP_ID}}.loadbalancer.server.scheme: https
      traefik.http.services.{{RUNTIPI_APP_ID}}.loadbalancer.serverstransport: insecuretransport@file
    networks:
      appnet:
        aliases:
        - portainer_portainer_1
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/data:/data
