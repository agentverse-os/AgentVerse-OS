# twenty-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-twenty-db}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - twenty-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 20s
    image: redis:7-alpine
    networks:
      appnet:
        aliases:
        - twenty-coolify_redis_1
    restart: unless-stopped
    volumes:
    - redis-data:/data
  twenty:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_TWENTY_3000=${SERVICE_URL_TWENTY_3000}
    - SERVER_URL=${SERVICE_URL_TWENTY}
    - FRONT_BASE_URL=${SERVICE_URL_TWENTY}
    - APP_SECRET=${SERVICE_BASE64_32_SECRET}
    - ENABLE_DB_MIGRATIONS=true
    - CACHE_STORAGE_TYPE=${CACHE_STORAGE_TYPE:-redis}
    - REDIS_URL=redis://redis:6379
    - API_RATE_LIMITING_TTL=${API_RATE_LIMITING_TTL:-100}
    - API_RATE_LIMITING_LIMIT=${API_RATE_LIMITING_LIMIT:-100}
    - POSTGRES_ADMIN_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - PG_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-twenty-db}
    - IS_SIGN_UP_DISABLED=${IS_SIGN_UP_DISABLED:-false}
    - PASSWORD_RESET_TOKEN_EXPIRES_IN=${PASSWORD_RESET_TOKEN_EXPIRES_IN:-5m}
    - WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION=${WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION:-7}
    - WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION=${WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION:-21}
    - STORAGE_TYPE=${STORAGE_TYPE:-local}
    - STORAGE_S3_REGION=$STORAGE_S3_REGION
    - STORAGE_S3_NAME=$STORAGE_S3_NAME
    - STORAGE_S3_ENDPOINT=$STORAGE_S3_ENDPOINT
    - STORAGE_S3_ACCESS_KEY_ID=$STORAGE_S3_ACCESS_KEY_ID
    - STORAGE_S3_SECRET_ACCESS_KEY=$STORAGE_S3_SECRET_ACCESS_KEY
    - MESSAGE_QUEUE_TYPE=${MESSAGE_QUEUE_TYPE:-pg-boss}
    - EMAIL_FROM_ADDRESS=$EMAIL_FROM_ADDRESS
    - EMAIL_FROM_NAME=$EMAIL_FROM_NAME
    - EMAIL_SYSTEM_ADDRESS=$EMAIL_SYSTEM_ADDRESS
    - EMAIL_DRIVER=${EMAIL_DRIVER:-logger}
    - EMAIL_SMTP_HOST=$EMAIL_SMTP_HOST
    - EMAIL_SMTP_PORT=$EMAIL_SMTP_PORT
    - EMAIL_SMTP_USER=$EMAIL_SMTP_USER
    - EMAIL_SMTP_PASSWORD=$EMAIL_SMTP_PASSWORD
    - SIGN_IN_PREFILLED=false
    - DEBUG_MODE=${DEBUG_MODE:-false}
    - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    healthcheck:
      interval: 2s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000/healthz
      timeout: 5s
    image: twentycrm/twenty:v1.15
    networks:
      appnet:
        aliases:
        - twenty-coolify_twenty_1
    restart: unless-stopped
    volumes:
    - twenty-local-storage:/app/packages/twenty-server/.local-storage
  worker:
    command:
    - yarn
    - worker:prod
    depends_on:
      twenty:
        condition: service_healthy
    environment:
    - SERVICE_URL_TWENTY_3000=${SERVICE_URL_TWENTY_3000}
    - SERVER_URL=${SERVICE_URL_TWENTY}
    - FRONT_BASE_URL=${SERVICE_URL_TWENTY}
    - APP_SECRET=${SERVICE_BASE64_32_SECRET}
    - ENABLE_DB_MIGRATIONS=true
    - CACHE_STORAGE_TYPE=${CACHE_STORAGE_TYPE:-redis}
    - REDIS_URL=redis://redis:6379
    - API_RATE_LIMITING_TTL=${API_RATE_LIMITING_TTL:-100}
    - API_RATE_LIMITING_LIMIT=${API_RATE_LIMITING_LIMIT:-100}
    - POSTGRES_ADMIN_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - PG_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-twenty-db}
    - IS_SIGN_UP_DISABLED=${IS_SIGN_UP_DISABLED:-false}
    - PASSWORD_RESET_TOKEN_EXPIRES_IN=${PASSWORD_RESET_TOKEN_EXPIRES_IN:-5m}
    - WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION=${WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION:-7}
    - WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION=${WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION:-21}
    - STORAGE_TYPE=${STORAGE_TYPE:-local}
    - STORAGE_S3_REGION=$STORAGE_S3_REGION
    - STORAGE_S3_NAME=$STORAGE_S3_NAME
    - STORAGE_S3_ENDPOINT=$STORAGE_S3_ENDPOINT
    - STORAGE_S3_ACCESS_KEY_ID=$STORAGE_S3_ACCESS_KEY_ID
    - STORAGE_S3_SECRET_ACCESS_KEY=$STORAGE_S3_SECRET_ACCESS_KEY
    - MESSAGE_QUEUE_TYPE=${MESSAGE_QUEUE_TYPE:-pg-boss}
    - EMAIL_FROM_ADDRESS=$EMAIL_FROM_ADDRESS
    - EMAIL_FROM_NAME=$EMAIL_FROM_NAME
    - EMAIL_SYSTEM_ADDRESS=$EMAIL_SYSTEM_ADDRESS
    - EMAIL_DRIVER=${EMAIL_DRIVER:-logger}
    - EMAIL_SMTP_HOST=$EMAIL_SMTP_HOST
    - EMAIL_SMTP_PORT=$EMAIL_SMTP_PORT
    - EMAIL_SMTP_USER=$EMAIL_SMTP_USER
    - EMAIL_SMTP_PASSWORD=$EMAIL_SMTP_PASSWORD
    - SIGN_IN_PREFILLED=false
    - DEBUG_MODE=${DEBUG_MODE:-false}
    - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    - DISABLE_DB_MIGRATIONS=true
    - DISABLE_CRON_JOBS_REGISTRATION=true
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - ps aux | grep 'dist/queue-worker/queue-worker' | grep -v grep || exit 1
      timeout: 5s
    image: twentycrm/twenty:v1.15
    networks:
      appnet:
        aliases:
        - twenty-coolify_worker_1
    restart: unless-stopped
    volumes:
    - twenty-local-storage:/app/packages/twenty-server/.local-storage
volumes:
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
  redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis-data
      o: bind
      type: none
  twenty-local-storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/twenty-local-storage
      o: bind
      type: none
