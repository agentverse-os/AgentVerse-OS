# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/twenty-coolify
description: Twenty is a CRM designed to fit your unique business needs.
endpoint:
  port: 3000
  service: twenty
env:
  API_RATE_LIMITING_LIMIT: '100'
  API_RATE_LIMITING_TTL: '100'
  CACHE_STORAGE_TYPE: redis
  DEBUG_MODE: 'false'
  EMAIL_DRIVER: logger
  IS_SIGN_UP_DISABLED: 'false'
  MESSAGE_QUEUE_TYPE: pg-boss
  PASSWORD_RESET_TOKEN_EXPIRES_IN: 5m
  POSTGRES_DB: twenty-db
  POSTGRES_USER: ''
  SERVICE_BASE64_32:
    generate: hex64
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_TWENTY: https://${APP_DOMAIN}
  SERVICE_URL_TWENTY_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  STORAGE_TYPE: local
  TELEMETRY_ENABLED: 'false'
  WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION: '21'
  WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION: '7'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: twenty-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
