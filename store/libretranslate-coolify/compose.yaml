# libretranslate-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  libretranslate:
    environment:
    - SERVICE_URL_LIBRETRANSLATE_5000=${SERVICE_URL_LIBRETRANSLATE_5000}
    - LT_SSL=${LT_SSL:-true}
    - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
    - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,es,fr,de,ja}
    healthcheck:
      test:
      - CMD-SHELL
      - ./venv/bin/python scripts/healthcheck.py
    image: libretranslate/libretranslate:latest
    networks:
      appnet:
        aliases:
        - libretranslate-coolify_libretranslate_1
    restart: unless-stopped
    volumes:
    - libretranslate-api-keys:/app/db
    - libretranslate-models:/home/libretranslate/.local
volumes:
  libretranslate-api-keys:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/libretranslate-api-keys
      o: bind
      type: none
  libretranslate-models:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/libretranslate-models
      o: bind
      type: none
