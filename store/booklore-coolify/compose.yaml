# booklore-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  booklore:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
    - SERVICE_URL_BOOKLORE_80=${SERVICE_URL_BOOKLORE_80}
    - USER_ID=${BOOKLORE_USER_ID:-0}
    - GROUP_ID=${BOOKLORE_GROUP_ID:-0}
    - TZ=${TZ:-UTC}
    - DATABASE_URL=jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-booklore-db}
    - DATABASE_USERNAME=${SERVICE_USER_MARIADB}
    - DATABASE_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - BOOKLORE_PORT=80
    healthcheck:
      interval: 10s
      retries: 10
      test: wget --no-verbose --tries=1 --spider http://localhost/login || exit 1
      timeout: 5s
    image: booklore/booklore:v1.16.5
    networks:
      appnet:
        aliases:
        - booklore-coolify_booklore_1
    restart: unless-stopped
    volumes:
    - booklore-data:/app/data
    - booklore-books:/books
    - source: ~/booklore
      target: /bookdrop
      type: bind
  mariadb:
    environment:
    - MARIADB_USER=${SERVICE_USER_MARIADB}
    - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_MARIADBROOT}
    - MARIADB_DATABASE=${MARIADB_DATABASE:-booklore-db}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 5s
    image: mariadb:12
    networks:
      appnet:
        aliases:
        - booklore-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - mariadb-data:/var/lib/mysql
volumes:
  booklore-books:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/booklore-books
      o: bind
      type: none
  booklore-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/booklore-data
      o: bind
      type: none
  mariadb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mariadb-data
      o: bind
      type: none
