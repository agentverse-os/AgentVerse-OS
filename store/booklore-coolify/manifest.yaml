# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/booklore-coolify
description: Booklore is an open-source library management system for your digital book collection.
endpoint:
  port: 80
  service: booklore
env:
  BOOKLORE_GROUP_ID: '0'
  BOOKLORE_USER_ID: '0'
  MARIADB_DATABASE: booklore-db
  SERVICE_PASSWORD_MARIADB:
    generate: password
  SERVICE_PASSWORD_MARIADBROOT:
    generate: password
  SERVICE_URL_BOOKLORE_80: https://${APP_DOMAIN}
  SERVICE_USER_MARIADB:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: booklore-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: BOOKLORE_USER_ID
  hint: 'по умолчанию: 0'
  label: booklore user id
  options: null
  required: false
  type: text
- env: BOOKLORE_GROUP_ID
  hint: 'по умолчанию: 0'
  label: booklore group id
  options: null
  required: false
  type: text
- env: MARIADB_DATABASE
  hint: 'по умолчанию: booklore-db'
  label: mariadb database
  options: null
  required: false
  type: text
tags:
- media
- books
- kobo
- epub
- ebook
- KOreader
title: Booklore
type: app
upstream:
  categories: []
  source: https://booklore.org/docs/getting-started
  tags:
  - media
  - books
  - kobo
  - epub
  - ebook
  - KOreader
  template: booklore.yaml
website: https://booklore.org/docs/getting-started
