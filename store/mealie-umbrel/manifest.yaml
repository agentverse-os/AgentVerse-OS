  release_notes: |-
    This release improves the meal planner editor with a better recipe selector, lowers idle memory usage, and speeds up startup.

    It also adds URL-backed cook mode, optional linked ingredients in print view, support for disabling services, and a cookie-file option for yt-dlp imports.

    Bug fixes include registration with seed data, SPA fallback responses, and several security-related dependency updates.

    Full release notes can be found at https://github.com/mealie-recipes/mealie/releases/tag/v3.24.0
