  release_notes: |-
    This update adds PDF exports for recipes and cookbooks, a day-by-day meal planner view, and faster browsing of large recipe collections.

    It also fixes security issues involving access between groups and households, private recipe visibility, password reset links, and uploads. Updating is recommended.

    Existing recipe cookTime values move to performTime (shown as Cook Time). The API no longer returns cookTime, but older clients can still send it. Uploads are now limited to 1024 MB by default, and password reset links expire after one hour.

    Mealie now blocks server-initiated requests to private network addresses by default for URL imports, recipe images, webhooks, and recipe actions. If you use these features with local network targets, configure Mealie's HTTP_ALLOW_LIST setting to explicitly allow those targets.

    Full release notes can be found at https://github.com/mealie-recipes/mealie/releases/tag/v3.31.0
