# mealie-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      ALLOW_SIGNUP: 'true'
      MAX_WORKERS: 1
      PGID: 1000
      PUID: 1000
      WEB_CONCURRENCY: 1
    image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    networks:
      appnet:
        aliases:
        - mealie_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
