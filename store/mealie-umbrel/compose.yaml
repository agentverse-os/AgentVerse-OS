# mealie-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      ALLOW_SIGNUP: 'true'
      MAX_WORKERS: 1
      PGID: 1000
      PUID: 1000
      WEB_CONCURRENCY: 1
    image: ghcr.io/mealie-recipes/mealie:v3.24.0@sha256:0b08ac3a9f0a65b8298bcb3a9fcb596f870f92fbefbecd8fffe075fa9b6d2d5d
    networks:
      appnet:
        aliases:
        - mealie_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
