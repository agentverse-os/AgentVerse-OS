# wordpress-with-openlitespeed-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mariadb:
    environment:
    - MARIADB_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
    - MARIADB_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
    - MARIADB_USER=$SERVICE_USER_WORDPRESS
    - MARIADB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      interval: 5s
      retries: 15
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - wordpress-with-openlitespeed-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - mariadb-data:/var/lib/mysql
  openlitespeed:
    depends_on:
      wordpress-init:
        condition: service_completed_successfully
    environment:
    - SERVICE_URL_OPENLITESPEED_80=${SERVICE_URL_OPENLITESPEED_80}
    - TZ=${TZ:-UTC}
    healthcheck:
      interval: 5s
      retries: 20
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:80/wp-login.php
      timeout: 10s
    image: litespeedtech/openlitespeed:1.9.4-lsphp83
    networks:
      appnet:
        aliases:
        - wordpress-with-openlitespeed-coolify_openlitespeed_1
    restart: unless-stopped
    volumes:
    - wordpress-files:/var/www/vhosts/localhost/html
  wordpress-init:
    command:
    - -c
    - |
      set -e
      if [ ! -f /var/www/html/wp-settings.php ]; then
        cp -a /usr/src/wordpress/. /var/www/html/
      fi
      if [ ! -f /var/www/html/wp-config.php ]; then
        cp /var/www/html/wp-config-sample.php /var/www/html/wp-config.php
        sed -i "s/database_name_here/$$WORDPRESS_DB_NAME/;s/username_here/$$WORDPRESS_DB_USER/;s/password_here/$$WORDPRESS_DB_PASSWORD/;s/localhost/$$WORDPRESS_DB_HOST/" /var/www/html/wp-config.php
        for KEY in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
          SALT=$$(head -c 64 /dev/urandom | base64 | tr -d '\n/')
          sed -i "s|define( '$$KEY',.*|define( '$$KEY', '$$SALT' );|" /var/www/html/wp-config.php
        done
      fi
      chown -R 1000:1000 /var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint: /bin/bash
    environment:
    - WORDPRESS_DB_HOST=mariadb
    - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
    - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
    - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    image: wordpress:7.1-php8.3-fpm
    networks:
      appnet:
        aliases:
        - wordpress-with-openlitespeed-coolify_wordpress-init_1
    restart: no
    user: 0:0
    volumes:
    - wordpress-files:/var/www/html
volumes:
  mariadb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mariadb-data
      o: bind
      type: none
  wordpress-files:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/wordpress-files
      o: bind
      type: none
