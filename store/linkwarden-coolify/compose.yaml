# linkwarden-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  linkwarden:
    depends_on:
      meilisearch:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
    - SERVICE_URL_LINKWARDEN_3000=${SERVICE_URL_LINKWARDEN_3000}
    - NEXTAUTH_URL=${SERVICE_URL_LINKWARDEN_3000}/api/v1/auth
    - NEXTAUTH_SECRET=${SERVICE_PASSWORD_LINKWARDENNEXTAUTH}
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    - DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DB:-linkwarden}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000
      timeout: 20s
    image: ghcr.io/linkwarden/linkwarden:v2.17.0
    networks:
      appnet:
        aliases:
        - linkwarden-coolify_linkwarden_1
    restart: unless-stopped
    volumes:
    - linkwarden-data:/data/data
  meilisearch:
    environment:
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:7700/health
      timeout: 10s
    image: getmeili/meilisearch:v1.13.3
    networks:
      appnet:
        aliases:
        - linkwarden-coolify_meilisearch_1
    restart: unless-stopped
    volumes:
    - meilisearch-data:/meili_data
  postgresql:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=${POSTGRES_DB:-linkwarden}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - linkwarden-coolify_postgresql_1
    restart: unless-stopped
    volumes:
    - postgresql-data:/var/lib/postgresql/data
volumes:
  linkwarden-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/linkwarden-data
      o: bind
      type: none
  meilisearch-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/meilisearch-data
      o: bind
      type: none
  postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgresql-data
      o: bind
      type: none
