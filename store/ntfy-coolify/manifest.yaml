# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/ntfy-coolify
description: ntfy is a simple HTTP-based pub-sub notification service. It allows you to send notifications to your phone or desktop via scripts from any computer, and/or using a REST API.
endpoint:
  port: 80
  service: ntfy
env:
  NTFY_ATTACHMENT_EXPIRY_DURATION: 24h
  NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 10M
  NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 1G
  NTFY_AUTH_DEFAULT_ACCESS: read-write
  NTFY_BEHIND_PROXY: 'true'
  NTFY_CACHE_DURATION: 24h
  NTFY_ENABLE_LOGIN: 'true'
  NTFY_ENABLE_SIGNUP: 'true'
  NTFY_KEEPALIVE_INTERVAL: 5m
  NTFY_MANAGER_INTERVAL: 5m
  NTFY_SMTP_SENDER_ADDR: smtp.your-domain.de
  NTFY_SMTP_SENDER_FROM: no-reply@de
  NTFY_SMTP_SENDER_PASS: password
  NTFY_SMTP_SENDER_USER: no-reply@de
  NTFY_VISITOR_ATTACHMENT_DAILY_BANDWIDTH_LIMIT: 1G
  NTFY_VISITOR_MESSAGE_DAILY_LIMIT: '100'
  NTFY_WEB_PUSH_EMAIL_ADDRESS: ''
  NTFY_WEB_PUSH_PRIVATE_KEY: ''
  NTFY_WEB_PUSH_PUBLIC_KEY: ''
  SERVICE_URL_NTFY: https://${APP_DOMAIN}
  SERVICE_URL_NTFY_80: https://${APP_DOMAIN}
  UPSTREAM_ACCESS_TOKEN: ''
  UPSTREAM_BASE_URL: https://ntfy.sh
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: NTFY_ENABLE_LOGIN
name: ntfy-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
