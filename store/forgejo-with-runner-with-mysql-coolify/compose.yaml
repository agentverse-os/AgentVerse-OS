# forgejo-with-runner-with-mysql-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  docker-in-docker:
    environment:
    - DOCKER_TLS_CERTDIR=/certs
    - DOCKER_HOST=docker-in-docker
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - docker
      - -H
      - unix:///var/run/docker.sock
      - info
      timeout: 30s
    hostname: docker
    image: docker:29.9.3
    networks:
      appnet:
        aliases:
        - forgejo-with-runner-with-mysql-coolify_docker-in-docker_1
    privileged: true
    restart: unless-stopped
    volumes:
    - forgejo-did-certs:/certs
  forgejo:
    command: bash -c ' /usr/bin/s6-svscan /etc/s6 & until su -c "forgejo forgejo-cli actions register --keep-labels --secret $${RUNNER_SHARED_SECRET:0:40}" git ; do sleep 5 ; done ; su -c "forgejo admin user create --admin --username \"$$FORGEJO_ADMIN_USER\" --password \"$$FORGEJO_ADMIN_PASSWORD\" --email \"$$FORGEJO_ADMIN_EMAIL\" --must-change-password=false" git || true ; touch /tmp/runner-registered ; wait '
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SERVICE_URL_FORGEJO_3000=${SERVICE_URL_FORGEJO_3000}
    - FORGEJO__server__ROOT_URL=${SERVICE_URL_FORGEJO}
    - FORGEJO__migrations__ALLOWED_DOMAINS=${FORGEJO__migrations__ALLOWED_DOMAINS}
    - FORGEJO__migrations__ALLOW_LOCALNETWORKS=${FORGEJO__migrations__ALLOW_LOCALNETWORKS:-false}
    - FORGEJO__server__DOMAIN=${SERVICE_FQDN_FORGEJO}
    - FORGEJO__server__SSH_DOMAIN=${SERVICE_FQDN_FORGEJO}
    - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT:-22222}
    - FORGEJO__database__DB_TYPE=mysql
    - FORGEJO__database__HOST=mysql
    - FORGEJO__database__NAME=${MYSQL_DATABASE:-forgejo}
    - FORGEJO__database__USER=$SERVICE_USER_MYSQL
    - FORGEJO__database__PASSWD=$SERVICE_PASSWORD_MYSQL
    - USER_UID=1000
    - USER_GID=1000
    - RUNNER_SHARED_SECRET=${SERVICE_HEX_64_RUNNER}
    - FORGEJO__security__INSTALL_LOCK=true
    - FORGEJO_ADMIN_USER=${SERVICE_USER_ADMIN}
    - FORGEJO_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    - FORGEJO_ADMIN_EMAIL=${FORGEJO_ADMIN_EMAIL:-admin@example.com}
    - FORGEJO__repository__ENABLE_PUSH_CREATE_USER=true
    - FORGEJO__repository__DEFAULT_PUSH_CREATE_PRIVATE=false
    - FORGEJO__repository__DEFAULT_REPO_UNITS=repo.code,repo.actions
    healthcheck:
      interval: 5s
      retries: 30
      test:
      - CMD-SHELL
      - curl -fs http://127.0.0.1:3000 > /dev/null && test -f /tmp/runner-registered
      timeout: 10s
    image: codeberg.org/forgejo/forgejo:17
    networks:
      appnet:
        aliases:
        - forgejo-with-runner-with-mysql-coolify_forgejo_1
    restart: unless-stopped
    volumes:
    - forgejo-data:/data
    - forgejo-timezone:/etc/timezone:ro
    - forgejo-localtime:/etc/localtime:ro
  mysql:
    environment:
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-forgejo}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:8
    networks:
      appnet:
        aliases:
        - forgejo-with-runner-with-mysql-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - forgejo-mysql-data:/var/lib/mysql
  runner:
    command: forgejo-runner --config config.yml daemon
    depends_on:
      docker-in-docker:
        condition: service_healthy
      forgejo:
        condition: service_healthy
      runner-register:
        condition: service_completed_successfully
    environment:
    - DOCKER_HOST=tcp://docker:2376
    - DOCKER_CERT_PATH=/certs/client
    - DOCKER_TLS_VERIFY=1
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - pgrep
      - forgejo-runner
      timeout: 30s
    image: data.forgejo.org/forgejo/runner:13.2.1
    networks:
      appnet:
        aliases:
        - forgejo-with-runner-with-mysql-coolify_runner_1
    restart: unless-stopped
    user: 1000:1000
    volumes:
    - forgejo-runner-data:/data
    - forgejo-did-certs:/certs
  runner-register:
    command: 'bash -ec '' secret=$${RUNNER_SHARED_SECRET:0:40} ; uuid=$$(printf %s "$${secret:0:16}" | od -An -tx1 | tr -d " \n" | sed -E "s/(.{8})(.{4})(.{4})(.{4})(.{12})/\1-\2-\3-\4-\5/") ; forgejo-runner generate-config > config.yml ; sed -i -e "s|  labels: \[\]|  labels: [\"docker:docker://node:22-bookworm\", \"ubuntu-latest:docker://catthehacker/ubuntu:act-22.04\", \"ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04\"]|" config.yml ; sed -i -e "s|network: .*|network: host|" config.yml ; sed -i -e "s|^  envs:$$|  envs:\n    DOCKER_HOST: tcp://docker:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|" config.yml ; sed -i -e "s|^  options:|  options: -v /certs/client:/certs/client|" config.yml ; sed -i -e "s|  valid_volumes: \[\]$$|  valid_volumes:\n    - /certs/client|" config.yml ; sed -i -e "s|  connections:|  connections:\n    default:\n      url: http://forgejo:3000\n      uuid: $$uuid\n      token: $$secret|" config.yml ; chown -R 1000:1000 /data '''
    environment:
    - RUNNER_SHARED_SECRET=${SERVICE_HEX_64_RUNNER}
    image: data.forgejo.org/forgejo/runner:13.2.1
    networks:
      appnet:
        aliases:
        - forgejo-with-runner-with-mysql-coolify_runner-register_1
    restart: no
    user: 0:0
    volumes:
    - forgejo-runner-data:/data
volumes:
  forgejo-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-data
      o: bind
      type: none
  forgejo-did-certs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-did-certs
      o: bind
      type: none
  forgejo-localtime:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-localtime
      o: bind
      type: none
  forgejo-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-mysql-data
      o: bind
      type: none
  forgejo-runner-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-runner-data
      o: bind
      type: none
  forgejo-timezone:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-timezone
      o: bind
      type: none
