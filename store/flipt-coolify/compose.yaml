# flipt-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  flipt:
    environment:
    - SERVICE_URL_FLIPT_8080=${SERVICE_URL_FLIPT_8080}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://127.0.0.1:8080
      timeout: 10s
    image: docker.flipt.io/flipt/flipt:latest
    networks:
      appnet:
        aliases:
        - flipt-coolify_flipt_1
    restart: unless-stopped
    volumes:
    - flipt-data:/var/opt/flipt
volumes:
  flipt-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/flipt-data
      o: bind
      type: none
