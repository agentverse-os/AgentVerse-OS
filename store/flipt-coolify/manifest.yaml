# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/flipt-coolify
description: Flipt is a fully managed feature flag solution that enables you to keep your feature flags and remote config next to your code in Git.
endpoint:
  port: 8080
  service: flipt
env:
  SERVICE_URL_FLIPT_8080: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: flipt-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- feature flags
- devops
- CI
- CD
title: Flipt
type: app
upstream:
  categories:
  - backend
  source: https://docs.flipt.io/cloud/overview
  tags:
  - feature flags
  - devops
  - CI
  - CD
  template: flipt.yaml
website: https://docs.flipt.io/cloud/overview
