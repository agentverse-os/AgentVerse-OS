# ekko-studio-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      HERMES_BIN: /opt/hermes/.venv/bin/hermes
      HERMES_HOME: /home/agent/.hermes
      HERMES_WEB_UI_MANAGED_GATEWAY: '1'
      HOME: /home/agent
      PORT: '6060'
      WORKSPACE_BASE: /opt/data
    image: ekkoye8888/hermes-web-ui:v0.8.28@sha256:ca7f343184d04b0c8bf4ba478cbfbb8d7385d6a6b35e415da7c5f14298a83852
    init: true
    networks:
      appnet:
        aliases:
        - ekko-studio_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/home:/home/agent
    - ${APP_DATA_DIR}/data/hermes:/home/agent/.hermes
    - ${APP_DATA_DIR}/data/studio:/home/agent/.hermes-web-ui
    - ${APP_DATA_DIR}/data/workspace:/opt/data
