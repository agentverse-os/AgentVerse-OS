# hello-world: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hello-world:
    image: crccheck/hello-world:latest
    networks:
      appnet:
        aliases:
        - hello-world_hello-world_1
    restart: unless-stopped
