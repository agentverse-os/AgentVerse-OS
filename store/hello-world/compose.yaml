# hello-world: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hello-world:
    image: crccheck/hello-world:latest
    networks:
      appnet:
        aliases:
        - hello-world_hello-world_1
    restart: unless-stopped
