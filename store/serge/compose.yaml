# serge: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  serge:
    image: ghcr.io/serge-chat/serge:0.9.0
    networks:
      appnet:
        aliases:
        - serge_serge_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/weights:/usr/src/app/weights
    - ${APP_DATA_DIR}/data/db:/data/db/
