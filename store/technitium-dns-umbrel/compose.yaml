# technitium-dns-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  dns-server:
    environment:
    - DNS_SERVER_DOMAIN=${DEVICE_DOMAIN_NAME}
    - DNS_SERVER_ADMIN_PASSWORD=${APP_PASSWORD}
    image: technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    network_mode: host
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/etc/dns
