# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/ghost-coolify
description: Ghost is a content management system (CMS) and blogging platform.
endpoint:
  port: 2368
  service: ghost
env:
  MAIL_OPTIONS_AUTH_PASS: ''
  MAIL_OPTIONS_AUTH_USER: ''
  MAIL_OPTIONS_HOST: ''
  MAIL_OPTIONS_PORT: '465'
  MAIL_OPTIONS_SECURE: 'true'
  MAIL_OPTIONS_SERVICE: Mailgun
  MYSQL_DATABASE: ghost
  SERVICE_PASSWORD_MYSQL:
    generate: password
  SERVICE_PASSWORD_MYSQLROOT:
    generate: password
  SERVICE_URL_GHOST: https://${APP_DOMAIN}
  SERVICE_URL_GHOST_2368: https://${APP_DOMAIN}
  SERVICE_USER_MYSQL:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
