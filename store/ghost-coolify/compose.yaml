# ghost-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  ghost:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SERVICE_URL_GHOST_2368=${SERVICE_URL_GHOST_2368}
    - url=$SERVICE_URL_GHOST
    - database__client=mysql
    - database__connection__host=mysql
    - database__connection__user=$SERVICE_USER_MYSQL
    - database__connection__password=$SERVICE_PASSWORD_MYSQL
    - database__connection__database=${MYSQL_DATABASE-ghost}
    - mail__transport=SMTP
    - mail__options__auth__pass=${MAIL_OPTIONS_AUTH_PASS}
    - mail__options__auth__user=${MAIL_OPTIONS_AUTH_USER}
    - mail__options__secure=${MAIL_OPTIONS_SECURE:-true}
    - mail__options__port=${MAIL_OPTIONS_PORT:-465}
    - mail__options__service=${MAIL_OPTIONS_SERVICE:-Mailgun}
    - mail__options__host=${MAIL_OPTIONS_HOST}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - echo
      - ok
      timeout: 20s
    image: ghost:5
    networks:
      appnet:
        aliases:
        - ghost-coolify_ghost_1
    restart: unless-stopped
    volumes:
    - ghost-content-data:/var/lib/ghost/content
  mysql:
    environment:
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:8.0
    networks:
      appnet:
        aliases:
        - ghost-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - ghost-mysql-data:/var/lib/mysql
volumes:
  ghost-content-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/ghost-content-data
      o: bind
      type: none
  ghost-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/ghost-mysql-data
      o: bind
      type: none
