# suwayomi: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  suwayomi:
    environment:
      BIND_IP: 0.0.0.0
      TZ: ${TZ}
    image: ghcr.io/suwayomi/tachidesk:v2.3.2333
    networks:
      appnet:
        aliases:
        - suwayomi_suwayomi_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/home/suwayomi/.local/share/Tachidesk
