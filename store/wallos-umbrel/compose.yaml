# wallos-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      PGID: 1000
      PUID: 1000
      TZ: Etc/UTC
    image: bellamy/wallos:5.11.2@sha256:de82c41215a761d33a38a3672526b3ce47d0fe7acb84f5c2a4cb2342c710cf4c
    networks:
      appnet:
        aliases:
        - wallos_server_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/www/html/db
    - ${APP_DATA_DIR}/data/logos:/var/www/html/images/uploads/logos
