  note: null
  password: null
  path: null
  user: null
name: slash-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- links
- shortener
- sharing
- url
- short
- link
- sharing
title: Slash
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/yourselfhosted/slash
  tags:
  - links
  - shortener
  - sharing
  - url
  - short
  - link
  - sharing
  template: slash.yaml
website: https://github.com/yourselfhosted/slash
