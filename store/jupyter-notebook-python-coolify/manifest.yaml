# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/jupyter-notebook-python-coolify
description: Jupyter Notebook is an open-source web application that allows you to create and share documents that contain live code, equations, visualizations, and narrative text.
endpoint:
  port: 8888
  service: jupyter-notebook-python
env:
  SERVICE_URL_JUPYTER_8888: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: jupyter-notebook-python-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- notebook
- python
- data
- analysis
title: Jupyter Notebook Python
type: app
upstream:
  categories:
  - devtools
  source: https://jupyter.org/
  tags:
  - notebook
  - python
  - data
  - analysis
  template: jupyter-notebook-python.yaml
website: https://jupyter.org/
