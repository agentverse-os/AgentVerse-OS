# honcho-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  api:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
    - sh
    - docker/entrypoint.sh
    environment:
    - SERVICE_URL_API_8000=${SERVICE_URL_API_8000}
    - DB_CONNECTION_URI=postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@database:5432/postgres
    - CACHE_URL=redis://redis:6379/0?suppress=true
    - CACHE_ENABLED=true
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - AUTH_USE_AUTH=false
    - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
    - VECTOR_STORE_TYPE=pgvector
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
      timeout: 5s
    image: ghcr.io/plastic-labs/honcho:v3.6.1
    networks:
      appnet:
        aliases:
        - honcho-coolify_api_1
    restart: unless-stopped
  database:
    environment:
    - POSTGRES_DB=postgres
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
    image: pgvector/pgvector:0.8.7-pg15
    networks:
      appnet:
        aliases:
        - honcho-coolify_database_1
    restart: unless-stopped
    volumes:
    - honcho_pgdata:/var/lib/postgresql/data/
  deriver:
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
    - /app/.venv/bin/python
    - -m
    - src.deriver
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@database:5432/postgres
    - CACHE_URL=redis://redis:6379/0?suppress=true
    - CACHE_ENABLED=true
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - AUTH_USE_AUTH=false
    - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
    - VECTOR_STORE_TYPE=pgvector
    image: ghcr.io/plastic-labs/honcho:v3.6.1
    networks:
      appnet:
        aliases:
        - honcho-coolify_deriver_1
    restart: unless-stopped
  redis:
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - redis-cli ping
      timeout: 5s
    image: redis:8.10
    networks:
      appnet:
        aliases:
        - honcho-coolify_redis_1
    restart: unless-stopped
    volumes:
    - honcho_redis_data:/data
volumes:
  honcho_pgdata:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/honcho_pgdata
      o: bind
      type: none
  honcho_redis_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/honcho_redis_data
      o: bind
      type: none
