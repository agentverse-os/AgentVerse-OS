upstream:
  author: OpenClaw
  categories:
  - ai
  release_notes: |-
    This update moves OpenClaw back to its latest release. It includes the upstream fixes we were waiting for: the upgrade and startup issue that kept us on the extended-stable branch, and scheduled tasks that failed when using Claude CLI with a saved account.

    Since the previous version, OpenClaw has added a Chat Details panel and many privacy, security and reliability fixes. Large conversations use less memory, replies are kept across restarts, upgrades are safer, and credentials and private conversation data stay out of logs and shared views.

    Back up your OpenClaw app data before updating. Very old installations or retained legacy data may need intermediate upgrades; see https://docs.openclaw.ai/install/updating#upgrading-very-old-versions. Reverting the app version alone does not reverse database migrations.

    Full release notes can be found at https://docs.openclaw.ai/releases
