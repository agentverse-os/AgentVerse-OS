# openclaw-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gateway:
    environment:
      APP_SEED: ${APP_SEED}
    image: ghcr.io/getumbrel/openclaw-umbrel:2026.11.4@sha256:f96670e4c6bd7e02b3e71e15ad3a4cf801c09d42823c03aa37f42cbf28699488
    init: true
    networks:
      appnet:
        aliases:
        - openclaw_gateway_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/data/linuxbrew:/home/linuxbrew
