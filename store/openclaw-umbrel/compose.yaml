# openclaw-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gateway:
    environment:
      APP_SEED: ${APP_SEED}
    image: ghcr.io/getumbrel/openclaw-umbrel:2026.7.1-2@sha256:fc6febfba3ac82318aa9b02377edeee935f7cb2c359160befc9d54b098e3b701
    init: true
    networks:
      appnet:
        aliases:
        - openclaw_gateway_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/data/linuxbrew:/home/linuxbrew
