# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/privatebin-umbrel
description: A minimalist, open source online pastebin
endpoint:
  port: 8080
  service: server
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/privatebin/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/privatebin/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/privatebin/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/privatebin/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/privatebin/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: privatebin-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: PrivateBin
type: app
upstream:
  author: PrivateBin Community
  categories:
  - files
  release_notes: |-
    This security update fixes vulnerabilities in SVG attachment previews, Markdown rendering, and paste size limits. Updating is strongly recommended.

    It also improves comment integrity, fixes passwords containing non-Latin characters while preserving access to existing pastes, and resolves issues with paste creation, password visibility, and e-mail sharing.

    The legacy Bootstrap 3 template has been removed. If you manually configured the template as "bootstrap", change it to "bootstrap5".

    Full release notes can be found at https://github.com/PrivateBin/PrivateBin/releases/tag/2.1.1
  source: https://github.com/PrivateBin/PrivateBin
  version: 2.1.1
  website: https://privatebin.info/
website: https://privatebin.info/
