# privatebin-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: privatebin/nginx-fpm-alpine:2.0.6@sha256:13290e2f04bfd98cf8fc7e8d216fb76b2b2d12373d4923b859cd41c2d984fde8
    networks:
      appnet:
        aliases:
        - privatebin_server_1
    read_only: true
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/privatebin-data:/srv/data
