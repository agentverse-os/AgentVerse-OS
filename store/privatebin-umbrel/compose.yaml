# privatebin-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: privatebin/nginx-fpm-alpine:2.1.1@sha256:9fbcc4d5671b974cafb55948d6fc3ab9eaf77f0c39271a50a16dd71bd4c4d3e6
    networks:
      appnet:
        aliases:
        - privatebin_server_1
    read_only: true
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/privatebin-data:/srv/data
