# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/penpot-with-s3-coolify
description: Penpot is the first Open Source design and prototyping platform for product teams.
endpoint:
  port: 8080
  service: mailpit
env:
  PENPOT_BACKEND_FLAGS: enable-login-with-password
  PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
  PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
  PENPOT_SMTP_HOST: mailpit
  PENPOT_SMTP_PASSWORD: penpot
  PENPOT_SMTP_PORT: '1025'
  PENPOT_SMTP_SSL: 'false'
  PENPOT_SMTP_TLS: 'false'
  PENPOT_SMTP_USERNAME: penpot
  PENPOT_TELEMETRY_ENABLED: 'false'
  POSTGRES_DB: penpot
  POSTGRES_USER: ''
  SERVICE_PASSWORD_MINIO:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_REALBASE64_64_PENPOT:
    generate: hex64
  SERVICE_URL_FRONTEND_8080: https://${APP_DOMAIN}
  SERVICE_URL_MAILPIT_8025: https://${APP_DOMAIN}
  SERVICE_USER_MINIO:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: penpot-with-s3-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
