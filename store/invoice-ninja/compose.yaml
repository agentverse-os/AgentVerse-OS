# invoice-ninja: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  invoice-ninja:
    depends_on:
    - invoice-ninja-db
    environment:
      APP_CIPHER: AES-256-CBC
      APP_ENV: production
      APP_KEY: ${INVOICE_NINJA_APP_KEY}
      APP_NAME: Invoice Ninja
      APP_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      DB_DATABASE: ninja
      DB_HOST: invoice-ninja-db
      DB_PASSWORD: ninja
      DB_PORT: '3306'
      DB_USERNAME: ninja
      IN_PASSWORD: ${INVOICE_NINJA_USER_PASSWORD}
      IN_USER_EMAIL: ${INVOICE_NINJA_USER_MAIL}
      IS_DOCKER: 'TRUE'
      QUEUE_CONNECTION: database
      REQUIRE_HTTPS: 'false'
    image: invoiceninja/invoiceninja:5.13
    networks:
      appnet:
        aliases:
        - invoice-ninja_invoice-ninja_1
    restart: unless-stopped
    user: 1500:1500
    volumes:
    - ${APP_DATA_DIR}/data/public:/var/www/app/public
    - ${APP_DATA_DIR}/data/storage:/var/www/app/storage
    - ${APP_DATA_DIR}/data/php/php.ini:/usr/local/etc/php/php.ini:ro
    - ${APP_DATA_DIR}/data/php/php-cli.ini:/usr/local/etc/php/php-cli.ini:ro
  invoice-ninja-db:
    environment:
      MARIADB_DATABASE: ninja
      MARIADB_PASSWORD: ninja
      MARIADB_ROOT_PASSWORD: ${INVOICE_NINJA_BDD_PASSWORD}
      MARIADB_USER: ninja
    image: mariadb:10.7
    networks:
      appnet:
        aliases:
        - invoice-ninja_invoice-ninja-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
  invoice-ninja-web:
    depends_on:
      invoice-ninja:
        condition: service_started
    image: nginx:1.31
    networks:
      appnet:
        aliases:
        - invoice-ninja_invoice-ninja-web_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/nginx/invoice-ninja.conf:/etc/nginx/conf.d/default.conf:ro
    - ${APP_DATA_DIR}/data/public:/var/www/app/public:ro
