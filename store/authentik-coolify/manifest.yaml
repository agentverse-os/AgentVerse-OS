# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/authentik-coolify
description: An open-source Identity Provider, focused on flexibility and versatility.
endpoint:
  port: 9000
  service: authentik-server
env:
  AUTHENTIK_EMAIL__FROM: ''
  AUTHENTIK_EMAIL__HOST: ''
  AUTHENTIK_EMAIL__PASSWORD: ''
  AUTHENTIK_EMAIL__PORT: ''
  AUTHENTIK_EMAIL__TIMEOUT: ''
  AUTHENTIK_EMAIL__USERNAME: ''
  AUTHENTIK_EMAIL__USE_SSL: ''
  AUTHENTIK_EMAIL__USE_TLS: ''
  AUTHENTIK_ERROR_REPORTING__ENABLED: 'true'
  AUTHENTIK_TAG: 2025.10.3
  POSTGRES_DB: authentik
  POSTGRES_HOST: postgresql
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_AUTHENTIKSERVER:
    generate: hex64
  SERVICE_PASSWORD_POSTGRESQL:
    generate: password
  SERVICE_URL_AUTHENTIKSERVER_9000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRESQL:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: authentik-coolify
notes:
- 'authentik-worker: docker.sock заменён на read-only прокси (DOCKER_HOST=tcp://cloudos-docker-ro:2375)'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
