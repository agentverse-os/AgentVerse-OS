# miner-sentinel-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  backend:
    command: |
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        (python manage.py createsuperuser --no-input ||
        echo 'Superuser already exists or created — winning!') &&
        gunicorn minersentinel.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "
    depends_on:
    - db
    environment:
      ALLOWED_HOSTS: '*'
      API_BASE_URL: http://${DEVICE_DOMAIN_NAME}:3082
      CORS_ALLOWED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:3082,http://*.ts.net:3082
      CSRF_TRUSTED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:3082,http://*.ts.net:3082
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ${APP_SEED}
      DJANGO_SUPERUSER_EMAIL: admin@umbrel.local
      DJANGO_SUPERUSER_PASSWORD: $APP_PASSWORD
      DJANGO_SUPERUSER_USERNAME: admin
      POSTGRES_DB: minersentinel
      POSTGRES_HOST: miner-sentinel_db_1
      POSTGRES_PASSWORD: minersentinel
      POSTGRES_PORT: 5432
      POSTGRES_USER: minersentinel
    image: dcbert/minersentinel-backend:v1.0.3@sha256:a890925f66df5b3f80334fe9d00c02f027e282d77015613a5b08925adfa5523b
    networks:
      appnet:
        aliases:
        - miner-sentinel_backend_1
    restart: on-failure
    stop_grace_period: 1m
  data-service:
    depends_on:
    - db
    - backend
    environment:
      AVALON_POLL_INTERVAL: 60
      BACKEND_URL: http://miner-sentinel_backend_1:8000
      BITAXE_POLL_INTERVAL: 60
      POOL_POLL_INTERVAL: 300
      POSTGRES_DB: minersentinel
      POSTGRES_HOST: miner-sentinel_db_1
      POSTGRES_PASSWORD: minersentinel
      POSTGRES_PORT: 5432
      POSTGRES_USER: minersentinel
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
    image: dcbert/minersentinel-data-service:v1.0.3@sha256:ce4b2a955dc70e5c3fd897c910e8a7a525b6133ff37e49f0a7f7a7f6239b5bc4
    networks:
      appnet:
        aliases:
        - miner-sentinel_data-service_1
    restart: on-failure
    stop_grace_period: 1m
  db:
    environment:
      POSTGRES_DB: minersentinel
      POSTGRES_PASSWORD: minersentinel
      POSTGRES_USER: minersentinel
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U minersentinel
      timeout: 5s
    image: postgres:17.7@sha256:bac8128cd62a35471a1e97966861aa2ac88c8d2f408767a425ae70695a607c99
    networks:
      appnet:
        aliases:
        - miner-sentinel_db_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  frontend:
    depends_on:
    - backend
    environment:
      VITE_API_URL: http://${DEVICE_DOMAIN_NAME}:3082
    image: dcbert/minersentinel-frontend:v1.0.3@sha256:e4ac190cbf5cdb9c6959b59bdff70d6135c34c18bf492b6b0303bbfd75489e59
    networks:
      appnet:
        aliases:
        - miner-sentinel_frontend_1
    restart: on-failure
    stop_grace_period: 1m
