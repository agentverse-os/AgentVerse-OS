# miner-sentinel-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  backend:
    command: |
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        (python manage.py createsuperuser --no-input ||
        echo 'Superuser already exists or created — winning!') &&
        gunicorn minersentinel.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "
    depends_on:
    - db
    environment:
      ALLOWED_HOSTS: '*'
      API_BASE_URL: http://${DEVICE_DOMAIN_NAME}:3082
      CORS_ALLOWED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:3082,https://${DEVICE_DOMAIN_NAME}:3082,http://${DEVICE_HOSTNAME}:3082,https://${DEVICE_HOSTNAME}:3082,http://*.ts.net:3082,${APP_MINER_SENTINEL_LOCAL_URLS}
      CSRF_TRUSTED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:3082,https://${DEVICE_DOMAIN_NAME}:3082,http://${DEVICE_HOSTNAME}:3082,https://${DEVICE_HOSTNAME}:3082,http://*.ts.net:3082,${APP_MINER_SENTINEL_LOCAL_URLS}
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ${APP_SEED}
      DJANGO_SUPERUSER_EMAIL: admin@umbrel.local
      DJANGO_SUPERUSER_PASSWORD: $APP_PASSWORD
      DJANGO_SUPERUSER_USERNAME: admin
      POSTGRES_DB: minersentinel
      POSTGRES_HOST: miner-sentinel_db_1
      POSTGRES_PASSWORD: minersentinel
      POSTGRES_PORT: 5432
      POSTGRES_USER: minersentinel
    image: dcbert/minersentinel-backend:v1.2.0@sha256:d2bb7fd12bf2b06705ead137f56f9101e6bfc761bc9bdce2e5fac83e93e9a49e
    networks:
      appnet:
        aliases:
        - miner-sentinel_backend_1
    restart: on-failure
    stop_grace_period: 1m
  data-service:
    depends_on:
    - db
    - backend
    environment:
      AVALON_POLL_INTERVAL: 60
      BACKEND_URL: http://miner-sentinel_backend_1:8000
      BITAXE_POLL_INTERVAL: 60
      DISCORD_WEBHOOK_URL: ''
      POOL_POLL_INTERVAL: 300
      POSTGRES_DB: minersentinel
      POSTGRES_HOST: miner-sentinel_db_1
      POSTGRES_PASSWORD: minersentinel
      POSTGRES_PORT: 5432
      POSTGRES_USER: minersentinel
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
    image: dcbert/minersentinel-data-service:v1.2.0@sha256:9fab2cce9d5b0591ca7f14b7b1af078e84cae4edd261d0d4d86d19444e4bf623
    networks:
      appnet:
        aliases:
        - miner-sentinel_data-service_1
    restart: on-failure
    stop_grace_period: 1m
  db:
    environment:
      POSTGRES_DB: minersentinel
      POSTGRES_PASSWORD: minersentinel
      POSTGRES_USER: minersentinel
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U minersentinel
      timeout: 5s
    image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
    networks:
      appnet:
        aliases:
        - miner-sentinel_db_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  frontend:
    depends_on:
    - backend
    environment:
      VITE_API_URL: http://${DEVICE_DOMAIN_NAME}:3082
    image: dcbert/minersentinel-frontend:v1.2.0@sha256:f98ece2ebc2fea9fe9cf0b8363fc1e917783c4185cdb3498bbd6a1c495fed074
    networks:
      appnet:
        aliases:
        - miner-sentinel_frontend_1
    restart: on-failure
    stop_grace_period: 1m
