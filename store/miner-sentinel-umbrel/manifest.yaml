# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/miner-sentinel-umbrel
description: Multi-make Bitcoin mining monitor for home ASIC fleets
endpoint:
  port: 80
  service: frontend
env:
  APP_MINER_SENTINEL_LOCAL_IPS: ${local_ips}
  APP_MINER_SENTINEL_LOCAL_URLS: ${ips_with_port}
  APP_MINER_SENTINEL_PORT: '3082'
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/miner-sentinel/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/miner-sentinel/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/miner-sentinel/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/miner-sentinel/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/miner-sentinel/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/miner-sentinel/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: admin
name: miner-sentinel-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: MinerSentinel
type: app
upstream:
  author: Davide Bert
  categories:
  - bitcoin
  release_notes: This update fixes signing in and saving changes when you open MinerSentinel with https:// in the address bar.
  source: https://github.com/dcbert/miner-sentinel
  version: 1.2.0-patch.1
  website: https://github.com/dcbert/miner-sentinel
website: https://github.com/dcbert/miner-sentinel
