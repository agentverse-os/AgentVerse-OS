# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/convertx-umbrel
description: Self-hosted online file converter
endpoint:
  port: 3000
  service: server
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/convertx/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/convertx/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/convertx/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/convertx/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: convertx-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: ConvertX
type: app
upstream:
  author: Emrik Östling
  categories:
  - files
  release_notes: |-
    This release adds PDF to DOCX conversion support and includes an important security fix.

    Key highlights include:
      - Added PDF to DOCX conversions using LibreOffice
      - Fixed a path traversal vulnerability in the conversion API
      - Fixed 3D model conversions where the output format does not match the filename extension
      - Added support for configuring the server port with an environment variable


    Full release notes can be found at https://github.com/C4illin/ConvertX/releases/tag/v0.18.0
  source: https://github.com/C4illin/ConvertX
  version: 0.18.0
  website: https://github.com/C4illin/ConvertX
website: https://github.com/C4illin/ConvertX
