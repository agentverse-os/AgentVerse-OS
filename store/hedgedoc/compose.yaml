# hedgedoc: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hedgedoc:
    depends_on:
    - hedgedoc-db
    environment:
      CMD_DB_URL: postgres://hedgedoc:${HEDGEDOC_DB_PASSWORD}@hedgedoc-db:5432/hedgedoc
      CMD_DOMAIN: ${APP_DOMAIN}
      CMD_URL_ADDPORT: ${HEDGEDOC_ADDPORT}
    image: quay.io/hedgedoc/hedgedoc:1.12.0
    networks:
      appnet:
        aliases:
        - hedgedoc_hedgedoc_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/hedgedoc-uploads:/hedgedoc/public/uploads
  hedgedoc-db:
    environment:
      POSTGRES_DB: hedgedoc
      POSTGRES_PASSWORD: ${HEDGEDOC_DB_PASSWORD}
      POSTGRES_USER: hedgedoc
    image: postgres:13.4-alpine
    networks:
      appnet:
        aliases:
        - hedgedoc_hedgedoc-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
