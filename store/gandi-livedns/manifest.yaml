# Импортировано из каталога runtipi командой `cloudd store import runtipi`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/gandi-livedns
description: Update your Gandi DNS zone records with your WAN IP
endpoint:
  port: 8134
  service: gandi-livedns
env:
  GANDI_LIVEDNS_DOMAIN: ''
  GANDI_LIVEDNS_FORCE_IPV4: ''
  GANDI_LIVEDNS_FORCE_IPV6: ''
  GANDI_LIVEDNS_PAT: ''
  GANDI_LIVEDNS_RECORD_LIST: ''
  GANDI_LIVEDNS_REFRESH_INTERVAL: ''
  GANDI_LIVEDNS_SET_IPV4: ''
  GANDI_LIVEDNS_SET_IPV6: ''
  GANDI_LIVEDNS_TTL: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.jpg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: gandi-livedns
notes: []
origin: runtipi
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: GANDI_LIVEDNS_PAT
  hint: null
  label: Gandi Personal Access Token
  options: null
  required: true
  type: text
- env: GANDI_LIVEDNS_RECORD_LIST
  hint: DNS records separated by ;
  label: Record list
  options: null
  required: true
  type: text
- env: GANDI_LIVEDNS_DOMAIN
  hint: Your Gandi domain name
  label: Domain
  options: null
  required: true
  type: text
- env: GANDI_LIVEDNS_REFRESH_INTERVAL
  hint: Leave empty for default 600
  label: Refresh interval in seconds
  options: null
  required: false
  type: number
- env: GANDI_LIVEDNS_TTL
  hint: Leave empty for default 300
  label: TTL in seconds
  options: null
  required: false
  type: number
- env: GANDI_LIVEDNS_SET_IPV4
  hint: Leave empty for default yes
  label: Update A record (yes/no)
  options: null
  required: false
  type: text
- env: GANDI_LIVEDNS_SET_IPV6
  hint: Leave empty for default no
  label: Update AAAA record (yes/no)
  options: null
  required: false
  type: text
- env: GANDI_LIVEDNS_FORCE_IPV4
  hint: Leave empty for default yes
  label: Force the IPv4 address to be used in DNS A records
  options: null
  required: false
  type: text
- env: GANDI_LIVEDNS_FORCE_IPV6
  hint: Leave empty for default no
  label: Force the IPv6 address to be used in DNS A records
  options: null
  required: false
  type: text
tags: []
title: gandi-livedns
type: app
upstream:
  author: jbbodart
  categories:
  - network
  source: https://github.com/jbbodart/gandi-livedns
  tipi_version: 6
  version: latest
website: https://github.com/jbbodart/gandi-livedns
