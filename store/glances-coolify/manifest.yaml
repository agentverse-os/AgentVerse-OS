# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/glances-coolify
description: An Eye on your system
endpoint:
  port: 61208
  service: glances
env:
  SERVICE_URL_GLANCES_61208: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: glances-coolify
notes:
- 'glances: docker.sock заменён на read-only прокси (DOCKER_HOST=tcp://cloudos-docker-ro:2375)'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- monitoring tool python cross platform
title: Glances
type: app
upstream:
  categories:
  - monitoring
  source: https://nicolargo.github.io/glances/
  tags:
  - monitoring tool python cross platform
  template: glances.yaml
website: https://nicolargo.github.io/glances/
