# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/solidtime-umbrel
description: A simple, secure, and private time tracking app
endpoint:
  port: 8000
  service: app
env:
  APP_HIDDEN_SERVICE: ''
  APP_SOLIDTIME_LOCAL_IPS: ${local_ips}
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/solidtime/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/solidtime/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/solidtime/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/solidtime/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/solidtime/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: umbrel@umbrel.local
name: solidtime-umbrel
notes:
- 'app: env_file из каталога проигнорирован (значения — через настройки приложения)'
- 'queue: env_file из каталога проигнорирован (значения — через настройки приложения)'
- 'scheduler: env_file из каталога проигнорирован (значения — через настройки приложения)'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Solidtime
type: app
upstream:
  author: Solidtime
  categories:
  - files
  release_notes: |-
    ⚠️ If you created shared reports through the API, review their member filters before updating. Reports saved with an empty member_ids array previously showed no data; after this update, the empty filter means all members and may reveal time totals through an existing public link. Make affected reports private or set explicit member filters before updating.

    This urgent security release updates PHP to 8.3.36 to fix two critical vulnerabilities (CVE-2026-109618 and CVE-2026-109619), and updates FrankenPHP to 1.13. Updating promptly is recommended.

    Full release notes can be found at https://github.com/solidtime-io/solidtime/releases/tag/v0.22.1
  source: https://github.com/solidtime-io/solidtime
  version: 0.22.1
  website: https://www.solidtime.io/
website: https://www.solidtime.io/
