# homer: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  homer:
    image: b4bz/homer:v26.4.2
    networks:
      appnet:
        aliases:
        - homer_homer_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/www/assets
