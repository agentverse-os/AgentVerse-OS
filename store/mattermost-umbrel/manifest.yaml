  release_notes: |-
    Mattermost 11.10.1 includes medium-to-high severity security fixes, updates the Go runtime, and improves SAML RelayState signing and verification.

    This release also fixes role validation for channel and team members, team search visibility, team invitation handling, video attachment previews, Slack imports, and local image proxy size limits.

    Mattermost notes a FIPS-only database password length caveat for deployments using FIPS mode; standard Umbrel installs are unaffected.

    Full release notes can be found at https://docs.mattermost.com/product-overview/mattermost-v11-changelog.html#release-v11-10-feature-release
