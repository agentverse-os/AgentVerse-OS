# mattermost-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      MM_DBNAME: mattermost
      MM_PASSWORD: admin
      MM_SQLSETTINGS_DATASOURCE: postgres://admin:admin@mattermost_db_1:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_USERNAME: admin
    image: alexlack/mattermost-app:v12.1.0@sha256:55477faf6324769984a71b3547618584ed1666f1ac191a7bfce59a90ae18a352
    networks:
      appnet:
        aliases:
        - mattermost_app_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app/mattermost/config:/mattermost/config:rw
    - ${APP_DATA_DIR}/data/app/mattermost/data:/mattermost/data:rw
    - ${APP_DATA_DIR}/data/app/mattermost/logs:/mattermost/logs:rw
    - ${APP_DATA_DIR}/data/app/mattermost/plugins:/mattermost/plugins:rw
    - ${APP_DATA_DIR}/data/app/mattermost/client-plugins:/mattermost/client/plugins:rw
    - /etc/localtime:/etc/localtime:ro
  db:
    environment:
      MM_DBNAME: mattermost
      MM_PASSWORD: admin
      MM_USERNAME: admin
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U admin -d mattermost
      timeout: 5s
    image: alexlack/mattermost-db:v11.11.1@sha256:ed7ade51d12815e65eff05ded2b4264b5bca06cbf523f4c9573759a9688b2259
    networks:
      appnet:
        aliases:
        - mattermost_db_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    - /etc/localtime:/etc/localtime:ro
