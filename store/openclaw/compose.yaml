# openclaw: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  openclaw:
    environment:
    - NODE_ENV=production
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
    - OLLAMA_HOST=${OLLAMA_HOST}
    image: alpine/openclaw:latest
    networks:
      appnet:
        aliases:
        - openclaw_openclaw_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/config:/home/node/.openclaw
    - ${APP_DATA_DIR}/workspace:/home/node/.openclaw/workspace
