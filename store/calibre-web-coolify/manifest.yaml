# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/calibre-web-coolify
description: Calibre-web is a web app providing a clean interface for browsing, reading and downloading eBooks.
endpoint:
  port: 8083
  service: calibre-web
env:
  DOCKER_MODS: linuxserver/mods:universal-calibre
  SERVICE_URL_CALIBRE_8083: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: calibre-web-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: DOCKER_MODS
  hint: 'по умолчанию: linuxserver/mods:universal-calibre'
  label: docker mods
  options: null
  required: false
  type: text
tags:
- calibre
- calibre-web
- ebook
- library
- epub
- ereader
- kindle
- book
- reader
title: Calibre Web
type: app
upstream:
  categories:
  - media
  source: https://github.com/linuxserver/docker-calibre-web
  tags:
  - calibre
  - calibre-web
  - ebook
  - library
  - epub
  - ereader
  - kindle
  - book
  - reader
  template: calibre-web.yaml
website: https://github.com/linuxserver/docker-calibre-web
