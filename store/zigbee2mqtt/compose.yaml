# zigbee2mqtt: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  zigbee2mqtt:
    devices:
    - ${Z2M_DEVICE}:/dev/ttyACM0
    environment:
      TZ: ${TZ}
    image: koenkk/zigbee2mqtt:2.13.0
    networks:
      appnet:
        aliases:
        - zigbee2mqtt_zigbee2mqtt_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/:/app/data
