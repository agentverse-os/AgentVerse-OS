  mode: app
  note: null
  password: null
  path: null
  user: null
name: firefox-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- browser
- web
- privacy
title: Firefox
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/jlesage/docker-firefox
  tags:
  - browser
  - web
  - privacy
  template: firefox.yaml
website: https://github.com/jlesage/docker-firefox
