# cloudreve-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cloudreve:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_CLOUDREVE_5212=${SERVICE_URL_CLOUDREVE_5212}
    - CR_CONF_Database.Type=postgres
    - CR_CONF_Database.Host=postgres
    - CR_CONF_Database.User=${SERVICE_USER_POSTGRES}
    - CR_CONF_Database.Password=${SERVICE_PASSWORD_POSTGRES}
    - CR_CONF_Database.Name=${POSTGRES_DB:-cloudreve-db}
    - CR_CONF_Database.Port=5432
    - CR_CONF_Redis.Server=redis:6379
    - CR_CONF_Redis.Password=${SERVICE_PASSWORD_REDIS}
    healthcheck:
      interval: 20s
      retries: 3
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5212'
      timeout: 10s
    image: cloudreve/cloudreve:4.10.1
    networks:
      appnet:
        aliases:
        - cloudreve-coolify_cloudreve_1
    restart: unless-stopped
    volumes:
    - cloudreve-data:/cloudreve/data
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-cloudreve-db}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
    image: postgres:18-alpine
    networks:
      appnet:
        aliases:
        - cloudreve-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql
  redis:
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - -a
      - ${SERVICE_PASSWORD_REDIS}
      - ping
      timeout: 5s
    image: redis:7-alpine
    networks:
      appnet:
        aliases:
        - cloudreve-coolify_redis_1
    restart: unless-stopped
    volumes:
    - redis-data:/data
volumes:
  cloudreve-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/cloudreve-data
      o: bind
      type: none
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
  redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis-data
      o: bind
      type: none
