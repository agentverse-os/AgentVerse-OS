- https://getumbrel.github.io/umbrel-apps-gallery/zerotier/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zerotier/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zerotier/3.webp
