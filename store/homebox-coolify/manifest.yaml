  options: null
  required: false
  type: text
- env: HBOX_MAILER_HOST
  hint: null
  label: hbox mailer host
  options: null
  required: false
  type: text
- env: HBOX_MAILER_PORT
  hint: 'по умолчанию: 587'
  label: hbox mailer port
  options: null
