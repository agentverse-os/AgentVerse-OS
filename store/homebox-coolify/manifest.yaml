# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/homebox-coolify
description: Homebox is the inventory and organization system built for the Home User.
endpoint:
  port: 7745
  service: homebox
env:
  HBOX_LOG_FORMAT: text
  HBOX_LOG_LEVEL: info
  HBOX_MAILER_FROM: ''
  HBOX_MAILER_HOST: ''
  HBOX_MAILER_PASSWORD: ''
  HBOX_MAILER_PORT: '587'
  HBOX_MAILER_USERNAME: ''
  HBOX_OPTIONS_ALLOW_REGISTRATION: 'false'
  HBOX_WEB_MAX_UPLOAD_SIZE: '10'
  SERVICE_URL_HOMEBOX_7745: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: homebox-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: HBOX_OPTIONS_ALLOW_REGISTRATION
  hint: 'по умолчанию: false'
  label: hbox options allow registration
  options: null
  required: false
  type: text
- env: HBOX_LOG_LEVEL
  hint: 'по умолчанию: info'
  label: hbox log level
  options: null
  required: false
  type: text
- env: HBOX_LOG_FORMAT
  hint: 'по умолчанию: text'
  label: hbox log format
  options: null
  required: false
  type: text
- env: HBOX_WEB_MAX_UPLOAD_SIZE
  hint: 'по умолчанию: 10'
