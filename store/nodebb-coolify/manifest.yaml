# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/nodebb-coolify
description: A next-generation discussion platform.
endpoint:
  port: 4567
  service: nodebb
env:
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_NODEBB_4567: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: nodebb-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRES_USER
  hint: null
  label: postgres user
  options: null
  required: false
  type: text
- env: POSTGRES_DB
  hint: null
  label: postgres db
  options: null
  required: false
  type: text
tags:
- communication
- forums
- discussion
title: Nodebb
type: app
upstream:
  categories:
  - messaging
  source: https://docs.nodebb.org/
  tags:
  - communication
  - forums
  - discussion
  template: nodebb.yaml
website: https://docs.nodebb.org/
