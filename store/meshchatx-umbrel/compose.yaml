# meshchatx-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      MESHCHAT_NO_HTTPS: 'true'
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 90s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status')
      timeout: 5s
    image: ghcr.io/quad4-software/meshchatx:4.8.5@sha256:ab9d73028f9da1c15274a08a8fe2d937f7f613e68289cdc28931af0df0c2cb63
    networks:
      appnet:
        aliases:
        - meshchatx_web_1
    restart: on-failure
    ulimits:
      nofile:
        hard: 65536
        soft: 65536
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/config
