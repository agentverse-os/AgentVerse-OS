# meshchatx-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      MESHCHAT_NO_HTTPS: 'true'
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 90s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status')
      timeout: 5s
    image: ghcr.io/quad4-software/meshchatx:4.10.7@sha256:051f8169e0b2950327fbe19327b946f48085b9c91f82bf13e617d13a9591685b
    networks:
      appnet:
        aliases:
        - meshchatx_web_1
    restart: on-failure
    ulimits:
      nofile:
        hard: 65536
        soft: 65536
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/config
