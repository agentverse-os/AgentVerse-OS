  release_notes: |-
    This update improves Docker/WebSocket resource handling for long-running sessions by raising file descriptor limits and cleaning up stale WebSocket connections and RNS ratchet writes.

    It also fixes conversation and thread loading while announces arrive, database connection recovery that could return HTTP 500, WebSocket ready-status broadcasts, and CSP/Permissions-Policy headers.

    Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.8.5
