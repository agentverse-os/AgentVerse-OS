# huly-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  account:
    environment:
    - SERVICE_URL_HULY_3000=${SERVICE_URL_HULY_3000}
    - SERVER_PORT=3000
    - SERVER_SECRET=$SERVICE_PASSWORD_SECRET
    - MONGO_URL=mongodb://mongodb:27017
    - TRANSACTOR_URL=ws://transactor:3333
    - ENDPOINT_URL=ws://transactor:3333
    - MINIO_ENDPOINT=minio
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
    - FRONT_URL=http://front:8080
    - INIT_WORKSPACE=demo-tracker
    - MODEL_ENABLED=*
    - ACCOUNTS_URL=http://localhost:3000
    image: hardcoreeng/account:v0.6.246
    networks:
      appnet:
        aliases:
        - huly-coolify_account_1
    restart: unless-stopped
  collaborator:
    environment:
    - COLLABORATOR_PORT=3078
    - SECRET=secret
    - ACCOUNTS_URL=http://account:3000
    - TRANSACTOR_URL=ws://transactor:3333
    - UPLOAD_URL=/files
    - MONGO_URL=mongodb://mongodb:27017
    - MINIO_ENDPOINT=minio
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
    image: hardcoreeng/collaborator:v0.6.246
    networks:
      appnet:
        aliases:
        - huly-coolify_collaborator_1
    restart: unless-stopped
  elastic:
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
    - ELASTICSEARCH_PORT_NUMBER=9200
    - BITNAMI_DEBUG=true
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    - http.cors.enabled=true
    - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 5s
      retries: 10
      test: curl -s http://127.0.0.1:9200/_cluster/health | grep -vq '"status":"red"'
    image: elasticsearch:7.14.2
    networks:
      appnet:
        aliases:
        - huly-coolify_elastic_1
    restart: unless-stopped
    volumes:
    - huly-elastic:/usr/share/elasticsearch/data
  front:
    environment:
    - SERVICE_URL_HULY_8080=${SERVICE_URL_HULY_8080}
    - MONGO_URL=mongodb://mongodb:27017
    - SERVER_PORT=8080
    - SERVER_SECRET=$SERVICE_PASSWORD_SECRET
    - ACCOUNTS_URL=http://account:3000
    - REKONI_URL=http://rekoni:4004
    - CALENDAR_URL=http://localhost:8095
    - GMAIL_URL=http://localhost:8088
    - TELEGRAM_URL=http://localhost:8086
    - UPLOAD_URL=/files
    - TRANSACTOR_URL=ws://transactor:3333
    - ELASTIC_URL=http://elastic:9200
    - COLLABORATOR_URL=ws://collaborator:3078
    - COLLABORATOR_API_URL=http://collaborator:3078
    - MINIO_ENDPOINT=minio
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
    - TITLE=Huly Self Hosted
    - DEFAULT_LANGUAGE=en
    - LAST_NAME_FIRST=true
    image: hardcoreeng/front:v0.6.246
    networks:
      appnet:
        aliases:
        - huly-coolify_front_1
    restart: unless-stopped
  minio:
    command: server /data --address ":9000" --console-address ":9001"
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 20s
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    networks:
      appnet:
        aliases:
        - huly-coolify_minio_1
    restart: unless-stopped
    volumes:
    - huly-files:/data
  mongodb:
    environment:
    - PUID=1000
    - PGID=1000
    image: mongo:7-jammy
    networks:
      appnet:
        aliases:
        - huly-coolify_mongodb_1
    restart: unless-stopped
    volumes:
    - huly-db:/data/db
  rekoni:
    deploy:
      resources:
        limits:
          memory: 500M
    image: hardcoreeng/rekoni-service:latest
    networks:
      appnet:
        aliases:
        - huly-coolify_rekoni_1
    restart: unless-stopped
  transactor:
    environment:
    - SERVER_PORT=3333
    - ELASTIC_INDEX_NAME=huly
    - SERVER_SECRET=$SERVICE_PASSWORD_SECRET
    - SERVER_CURSOR_MAXTIMEMS=30000
    - ELASTIC_URL=http://elastic:9200
    - MONGO_URL=mongodb://mongodb:27017
    - METRICS_CONSOLE=false
    - METRICS_FILE=metrics.txt
    - MINIO_ENDPOINT=minio
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
    - REKONI_URL=http://rekoni:4004
    - FRONT_URL=http://localhost:8087
    - SERVER_PROVIDER=ws
    - ACCOUNTS_URL=http://account:3000
    - LAST_NAME_FIRST=true
    - UPLOAD_URL=/files
    image: hardcoreeng/transactor:v0.6.246
    networks:
      appnet:
        aliases:
        - huly-coolify_transactor_1
    restart: unless-stopped
volumes:
  huly-db:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-db
      o: bind
      type: none
  huly-elastic:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-elastic
      o: bind
      type: none
  huly-files:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-files
      o: bind
      type: none
