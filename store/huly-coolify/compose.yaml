# huly-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
configs:
  nginx-inline-1:
    content: |
      server {
          listen 80;
          server_name _;
          client_max_body_size 100M;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          location / {
              proxy_pass http://front:8080;
          }

          location /_accounts {
              rewrite ^/_accounts(/.*)$ $1 break;
              proxy_pass http://account:3000/;
          }

          location /_collaborator {
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              rewrite ^/_collaborator(/.*)$ $1 break;
              proxy_pass http://collaborator:3078/;
          }

          location /_transactor {
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              rewrite ^/_transactor(/.*)$ $1 break;
              proxy_pass http://transactor:3333/;
          }

          location ~ ^/eyJ {
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://transactor:3333;
          }

          location /_rekoni {
              rewrite ^/_rekoni(/.*)$ $1 break;
              proxy_pass http://rekoni:4004/;
          }

          location /_stats {
              rewrite ^/_stats(/.*)$ $1 break;
              proxy_pass http://stats:4900/;
          }
      }
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  account:
    depends_on:
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
    - SERVER_PORT=3000
    - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
    - DB_URL=postgres://${CR_USERNAME:-huly}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
    - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    - FRONT_URL=${SERVICE_URL_HULY}
    - STATS_URL=${SERVICE_URL_HULY}/_stats
    - MODEL_ENABLED=*
    - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
    - ACCOUNT_PORT=3000
    - QUEUE_CONFIG=redpanda:9092
    image: hardcoreeng/account:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_account_1
    restart: unless-stopped
  cockroach:
    command: start-single-node --accept-sql-without-tls
    environment:
    - COCKROACH_DATABASE=${CR_DATABASE:-huly}
    - COCKROACH_USER=${CR_USERNAME:-huly}
    - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    healthcheck:
      interval: 10s
      retries: 20
      test:
      - CMD-SHELL
      - curl -fsk https://127.0.0.1:8080/health?ready=1 || curl -fs http://127.0.0.1:8080/health?ready=1
      timeout: 5s
    image: cockroachdb/cockroach:v24.2.10
    networks:
      appnet:
        aliases:
        - huly-coolify_cockroach_1
    restart: unless-stopped
    volumes:
    - huly-cockroach-data:/cockroach/cockroach-data
    - huly-cockroach-certs:/cockroach/certs
  collaborator:
    depends_on:
      minio:
        condition: service_healthy
    environment:
    - COLLABORATOR_PORT=3078
    - SECRET=${SERVICE_PASSWORD_SECRET}
    - ACCOUNTS_URL=http://account:3000
    - STATS_URL=http://stats:4900
    - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    image: hardcoreeng/collaborator:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_collaborator_1
    restart: unless-stopped
  elastic:
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
    - ELASTICSEARCH_PORT_NUMBER=9200
    - BITNAMI_DEBUG=true
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    - http.cors.enabled=true
    - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://127.0.0.1:9200/_cluster/health | grep -vq '"status":"red"'
    image: elasticsearch:7.14.2
    networks:
      appnet:
        aliases:
        - huly-coolify_elastic_1
    restart: unless-stopped
    volumes:
    - huly-elastic:/usr/share/elasticsearch/data
  front:
    environment:
    - SERVER_PORT=8080
    - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
    - LOVE_ENDPOINT=${SERVICE_URL_HULY}/_love
    - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
    - ACCOUNTS_URL_INTERNAL=http://account:3000
    - REKONI_URL=${SERVICE_URL_HULY}/_rekoni
    - CALENDAR_URL=${SERVICE_URL_HULY}/_calendar
    - GMAIL_URL=${SERVICE_URL_HULY}/_gmail
    - TELEGRAM_URL=${SERVICE_URL_HULY}/_telegram
    - STATS_URL=${SERVICE_URL_HULY}/_stats
    - UPLOAD_URL=/files
    - ELASTIC_URL=http://elastic:9200
    - COLLABORATOR_URL=wss://${SERVICE_FQDN_HULY}/_collaborator
    - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    - TITLE=${TITLE:-Huly Self Hosted}
    - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
    - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
    - DESKTOP_UPDATES_CHANNEL=0.7.426
    - DISABLED_FEATURES=auto-translate,mailboxes
    image: hardcoreeng/front:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_front_1
    restart: unless-stopped
  fulltext:
    depends_on:
      cockroach:
        condition: service_healthy
      elastic:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
    - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
    - DB_URL=postgres://${CR_USERNAME:-huly}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    - FULLTEXT_DB_URL=http://elastic:9200
    - ELASTIC_INDEX_NAME=huly_storage_index
    - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    - REKONI_URL=http://rekoni:4004
    - ACCOUNTS_URL=http://account:3000
    - STATS_URL=http://stats:4900
    - QUEUE_CONFIG=redpanda:9092
    image: hardcoreeng/fulltext:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_fulltext_1
    restart: unless-stopped
  kvs:
    depends_on:
      cockroach:
        condition: service_healthy
    environment:
    - HULY_DB_CONNECTION=postgres://${CR_USERNAME:-huly}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    - HULY_TOKEN_SECRET=${SERVICE_PASSWORD_SECRET}
    image: hardcoreeng/hulykvs:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_kvs_1
    restart: unless-stopped
  minio:
    command: server /data --address ":9000" --console-address ":9001"
    environment:
    - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
    - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 20s
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    networks:
      appnet:
        aliases:
        - huly-coolify_minio_1
    restart: unless-stopped
    volumes:
    - huly-files:/data
  nginx:
    configs:
    - source: nginx-inline-1
      target: /etc/nginx/conf.d/default.conf
    depends_on:
    - front
    - account
    - transactor
    - collaborator
    environment:
    - SERVICE_URL_HULY_80=${SERVICE_URL_HULY_80}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD-SHELL
      - curl -fs -o /dev/null http://127.0.0.1:80/ || exit 1
      timeout: 5s
    image: nginx:1.21.3
    networks:
      appnet:
        aliases:
        - huly-coolify_nginx_1
    restart: unless-stopped
    volumes: []
  redpanda:
    command:
    - redpanda
    - start
    - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
    - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
    - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    - --rpc-addr redpanda:33145
    - --advertise-rpc-addr redpanda:33145
    - --mode dev-container
    - --smp 1
    - --default-log-level=info
    environment:
    - REDPANDA_SUPERUSER_USERNAME=${SERVICE_USER_REDPANDA}
    - REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - rpk
      - cluster
      - info
      timeout: 5s
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    networks:
      appnet:
        aliases:
        - huly-coolify_redpanda_1
    restart: unless-stopped
    volumes:
    - huly-redpanda:/var/lib/redpanda/data
  rekoni:
    deploy:
      resources:
        limits:
          memory: 500M
    environment:
    - SECRET=${SERVICE_PASSWORD_SECRET}
    image: hardcoreeng/rekoni-service:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_rekoni_1
    restart: unless-stopped
  stats:
    environment:
    - PORT=4900
    - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
    image: hardcoreeng/stats:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_stats_1
    restart: unless-stopped
  transactor:
    depends_on:
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
    - SERVER_PORT=3333
    - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
    - DB_URL=postgres://${CR_USERNAME:-huly}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    - FRONT_URL=${SERVICE_URL_HULY}
    - ACCOUNTS_URL=http://account:3000
    - FULLTEXT_URL=http://fulltext:4700
    - STATS_URL=http://stats:4900
    - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
    - QUEUE_CONFIG=redpanda:9092
    image: hardcoreeng/transactor:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_transactor_1
    restart: unless-stopped
  workspace:
    depends_on:
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
    - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
    - DB_URL=postgres://${CR_USERNAME:-huly}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
    - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    - MODEL_ENABLED=*
    - ACCOUNTS_URL=http://account:3000
    - STATS_URL=http://stats:4900
    - QUEUE_CONFIG=redpanda:9092
    - ACCOUNTS_DB_URL=postgres://${CR_USERNAME:-huly}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    image: hardcoreeng/workspace:v0.7.426
    networks:
      appnet:
        aliases:
        - huly-coolify_workspace_1
    restart: unless-stopped
volumes:
  huly-cockroach-certs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-cockroach-certs
      o: bind
      type: none
  huly-cockroach-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-cockroach-data
      o: bind
      type: none
  huly-elastic:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-elastic
      o: bind
      type: none
  huly-files:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-files
      o: bind
      type: none
  huly-redpanda:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/huly-redpanda
      o: bind
      type: none
