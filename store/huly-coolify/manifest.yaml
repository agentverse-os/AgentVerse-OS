# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/huly-coolify
description: Open Source All-in-One Project Management Platform
endpoint:
  port: 80
  service: account
env:
  CR_DATABASE: huly
  CR_USERNAME: huly
  DEFAULT_LANGUAGE: en
  LAST_NAME_FIRST: 'true'
  SERVICE_FQDN_HULY: ${APP_DOMAIN}
  SERVICE_PASSWORD_COCKROACH:
    generate: password
  SERVICE_PASSWORD_MINIO:
    generate: password
  SERVICE_PASSWORD_REDPANDA:
    generate: password
  SERVICE_PASSWORD_SECRET:
    generate: password
  SERVICE_URL_HULY: https://${APP_DOMAIN}
  SERVICE_URL_HULY_80: https://${APP_DOMAIN}
  SERVICE_USER_MINIO:
    generate: password
  SERVICE_USER_REDPANDA:
    generate: password
  TITLE: Huly Self Hosted
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: null
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_REDPANDA
  path: null
  user: SERVICE_USER_REDPANDA
name: huly-coolify
