# trip-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    command:
    - fastapi
    - run
    - /app/trip/main.py
    - --host
    - 0.0.0.0
    image: ghcr.io/itskovacs/trip:1.49.0@sha256:31f51b2da3fe62ac9cd8d44caf111f531413f699da9ad16e7605e9631f9e3375
    networks:
      appnet:
        aliases:
        - trip_app_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/storage
