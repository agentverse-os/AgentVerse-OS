upstream:
  author: Suraj Verma
  categories:
  - files
  release_notes: |-
    Back up your data before updating. HomeHub automatically upgrades its database on first start.

    - Added a Trash page to restore deleted household items for up to seven days. Existing calendar trash moves there automatically.
    - Added weather information, expanded delete permissions, and full per-token activity history to the optional API and MCP integration. Existing tokens keep their previous permissions; restart your MCP client to discover the new tools.
    - Fixed chores disappearing when recurring schedules are disabled and improved calendar loading and dark-mode readability.
    - Prevented requests without a selected user from modifying items without a creator.

    Full release notes can be found at https://github.com/surajverma/homehub/releases/tag/v0.7.0
