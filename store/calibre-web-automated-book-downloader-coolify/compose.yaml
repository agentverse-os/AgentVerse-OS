# calibre-web-automated-book-downloader-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  calibre-web-automated:
    environment:
    - SERVICE_URL_CWA_8083=${SERVICE_URL_CWA_8083}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    - NETWORK_SHARE_MODE=${NETWORK_SHARE_MODE:-false}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - curl -fs http://localhost:8083 || exit 1
      timeout: 10s
    image: crocodilestick/calibre-web-automated:latest
    networks:
      appnet:
        aliases:
        - calibre-web-automated-book-downloader-coolify_calibre-web-automated_1
    restart: unless-stopped
    volumes:
    - cwa-config:/config
    - cwa-book-ingest:/cwa-book-ingest
    - calibre-library:/calibre-library
    - calibre-plugins:/config/.config/calibre/plugins
  calibre-web-downloader:
    environment:
    - SERVICE_URL_DOWNLOADER_8084=${SERVICE_URL_DOWNLOADER_8084}
    - FLASK_PORT=${FLASK_PORT:-8084}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - BOOK_LANGUAGE=${BOOK_LANGUAGE:-en}
    - USE_BOOK_TITLE=${USE_BOOK_TITLE:-true}
    - TZ=${TZ:-America/New_York}
    - APP_ENV=${APP_ENV:-prod}
    - UID=${UID:-1000}
    - GID=${GID:-100}
    - CWA_DB_PATH=${CWA_DB_PATH:-/cwa-config/app.db}
    image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
    networks:
      appnet:
        aliases:
        - calibre-web-automated-book-downloader-coolify_calibre-web-downloader_1
    restart: unless-stopped
    volumes:
    - cwa-book-ingest:/cwa-book-ingest
    - cwa-config:/cwa-config
volumes:
  calibre-library:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/calibre-library
      o: bind
      type: none
  calibre-plugins:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/calibre-plugins
      o: bind
      type: none
  cwa-book-ingest:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/cwa-book-ingest
      o: bind
      type: none
  cwa-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/cwa-config
      o: bind
      type: none
