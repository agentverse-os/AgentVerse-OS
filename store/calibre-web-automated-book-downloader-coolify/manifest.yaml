# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/calibre-web-automated-book-downloader-coolify
description: An intuitive web interface for searching and requesting book downloads, designed to work seamlessly with Calibre-Web-Automated.
endpoint:
  port: 8083
  service: calibre-web-automated
env:
  BOOK_LANGUAGE: en
  CWA_DB_PATH: /cwa-config/app.db
  FLASK_PORT: '8084'
  GID: '100'
  LOG_LEVEL: info
  NETWORK_SHARE_MODE: 'false'
  PGID: '1000'
  PUID: '1000'
  SERVICE_URL_CWA_8083: https://${APP_DOMAIN}
  SERVICE_URL_DOWNLOADER_8084: https://${APP_DOMAIN}
  UID: '1000'
  USE_BOOK_TITLE: 'true'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: calibre-web-automated-book-downloader-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
