upstream:
  author: s1t5
  categories:
  - files
  release_notes: |-
    ⚠️ Important: If you're updating from a pre-2606.1 version, create a backup before upgrading; the recent attachment deduplication migration may temporarily increase storage usage.

    New features:
      - Added date-windowed account offload into another mailbox with duplicate
        detection, dry-run reporting, and resumable locking.
      - Added a read-only stats API endpoint for aggregate archive statistics with
        account-scoped results for restricted API keys.


    Improvements and fixes:
      - Improved nested archive folder rendering, IMAP folder discovery, and
        clickable Archive rows.
      - Reduced offload memory usage and tightened ownership/scoping for job
        cancellation, stats, and self-manager access.
      - Fixed import, export, restore, retention, Message-ID, M365/Graph, and
        Outlook folder-discovery edge cases, including better handling of
        malformed or headerless messages.


    Full release notes can be found at https://github.com/s1t5/mail-archiver/releases/tag/2608.1
  source: https://github.com/s1t5/mail-archiver
  version: '2608.1'
  website: https://mail-archiver.org
