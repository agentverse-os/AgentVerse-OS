  release_notes: |-
    If you still use the configured initial admin password, you will now be required to change it when signing in, including on existing installations.

    Improvements and fixes:
      - EML exports now return the original message unchanged when original-message storage is enabled and an original is available.
      - Fixed a sign-in bypass that allowed local password logins when OAuth-only mode was configured.
      - Added a configurable OIDC response mode for compatibility with providers such as Synology SSO Server.
      - Improved OIDC login error messages and display-name handling.


    Full release notes can be found at https://github.com/s1t5/mail-archiver/releases/tag/2611.2
