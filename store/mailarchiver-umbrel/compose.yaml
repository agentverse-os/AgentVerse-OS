# mailarchiver-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    image: ghcr.io/s1t5/mailarchiver:2611.2@sha256:4baca9cb9dc6f97f2824f62489ba649ededc1095c4555f4d8b87da71349f7ebc
    networks:
      appnet:
        aliases:
        - mailarchiver_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/data-protection-keys:/app/DataProtection-Keys
    - ${APP_DATA_DIR}/data/appsettings.json:/app/appsettings.json
  postgres:
    environment:
      POSTGRES_DB: mailarchiver
      POSTGRES_PASSWORD: mailarchiver
      POSTGRES_USER: mailarchiver
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
      - CMD-SHELL
      - pg_isready -U mailarchiver -d mailarchiver
      timeout: 5s
    image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    networks:
      appnet:
        aliases:
        - mailarchiver_postgres_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/database:/var/lib/postgresql
