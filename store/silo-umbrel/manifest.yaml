  release_notes: |-
    Back up your data, access policies, configuration, and encryption keys before updating. Stop new batch jobs and finish or cancel existing jobs before upgrading; resubmit unfinished legacy jobs afterward. Do not downgrade while new-format jobs are pending or paused. If you use replication or multiple Silo servers, upgrade all participating servers together.

    - Security fixes strengthen bulk deletion, Object Lock, object-tag permissions, and signed uploads. - Fixed preservation of service-account policies and disabled account status when updating or importing access settings. - Fixed ranged reads of compressed, encrypted objects and improved lifecycle cleanup and restore reliability. - Invalid access-policy documents and encryption contexts are now rejected more strictly. Review custom automation if requests return validation errors.

    Full release notes: https://github.com/pgsty/silo/releases/tag/RELEASE.2026-11-12T00-00-00Z
