# silo-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_PASSWORD: ${APP_PASSWORD}
      MINIO_ROOT_USER: umbrel
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    networks:
      appnet:
        aliases:
        - silo_server_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/objects:/data
