# hermes-agent-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  hermes-agent:
    command: gateway run
    environment:
    - SERVICE_URL_HERMESAGENT_9119=${SERVICE_URL_HERMESAGENT_9119}
    - HERMES_DASHBOARD=1
    - HERMES_DASHBOARD_HOST=0.0.0.0
    - HERMES_DASHBOARD_PORT=9119
    - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${SERVICE_USER_HERMESAGENT}
    - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${SERVICE_PASSWORD_HERMESAGENT}
    - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${SERVICE_BASE64_64_HERMESAGENT}
    - HERMES_HOME=/opt/data
    - GATEWAY_ALLOW_ALL_USERS=true
    - HERMES_REDACT_SECRETS=true
    - HERMES_UID=1000
    - HERMES_GID=1000
    - HERMES_ENABLE_PROJECT_PLUGINS=${HERMES_ENABLE_PROJECT_PLUGINS:-true}
    - HERMES_ALLOW_PRIVATE_URLS=${HERMES_ALLOW_PRIVATE_URLS:-false}
    - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
    - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - test -d /opt/data || exit 1
      timeout: 5s
    image: nousresearch/hermes-agent:v2026.9.24
    networks:
      appnet:
        aliases:
        - hermes-agent-coolify_hermes-agent_1
    restart: unless-stopped
    volumes:
    - hermes-home:/opt/data
volumes:
  hermes-home:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/hermes-home
      o: bind
      type: none
