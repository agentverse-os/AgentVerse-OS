# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/docuseal-coolify
description: Document Signing for Everyone free forever for individuals, extensible for businesses and developers. Open Source Alternative to DocuSign, PandaDoc and more.
endpoint:
  port: 3000
  service: docuseal
env:
  SERVICE_URL_DOCUSEAL: https://${APP_DOMAIN}
  SERVICE_URL_DOCUSEAL_3000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: docuseal-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- documentation
title: Docuseal
type: app
upstream:
  categories:
  - productivity
  source: https://www.docuseal.co/
  tags:
  - documentation
  template: docuseal.yaml
website: https://www.docuseal.co/
