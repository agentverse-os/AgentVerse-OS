# adguard: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    networks:
      appnet:
        aliases:
        - adguard_adguard_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/work:/opt/adguardhome/work
    - ${APP_DATA_DIR}/data/conf:/opt/adguardhome/conf
