  service: netbird-dashboard
env:
  AUTH_CLIENT_SECRET: ''
  AUTH_SUPPORTED_SCOPES: openid profile email groups
  LETSENCRYPT_DOMAIN: none
  NETBIRD_AUTH_SECRET: ''
  NETBIRD_COOKIE_KEY: ''
  NETBIRD_LOG_LEVEL: info
  NETBIRD_PORT: ''
  NETBIRD_STORE_KEY: ''
  NETBIRD_URL: ''
  SERVICE_REALBASE64_32:
    generate: hex64
  SERVICE_URL_NETBIRD: https://${APP_DOMAIN}
  USE_AUTH0: 'false'
