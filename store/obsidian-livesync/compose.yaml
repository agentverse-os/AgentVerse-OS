# obsidian-livesync: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  obsidian-livesync:
    environment:
      COUCHDB_PASSWORD: ${OBSIDIAN_LIVESYNC_PASSWORD}
      COUCHDB_USER: ${OBSIDIAN_LIVESYNC_USER}
    image: couchdb:3.5.2
    networks:
      appnet:
        aliases:
        - obsidian-livesync_obsidian-livesync_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/couchdb:/opt/couchdb/data
    - ${APP_DATA_DIR}/data/local.ini:/opt/couchdb/etc/local.ini
