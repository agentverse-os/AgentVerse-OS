# rivet-engine-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  rivet-engine:
    environment:
    - SERVICE_URL_RIVET_6420=${SERVICE_URL_RIVET_6420}
    - RIVET__STORAGE__LOG_DIRECTORY=/var/lib/rivet/log
    - RIVET__STORAGE__AUTO_PROVISION_PARTITIONS=1
    - RIVET__STORAGE__BALANCING__ENABLED=false
    - RIVET__OBJECT_STORAGE__PRIMARY__FILE_SYSTEM__PATH=/var/lib/rivet/objects
    - RIVET__AUTH__ADMIN_TOKEN=${SERVICE_BASE64_TOKEN}
    healthcheck:
      interval: 2s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:6420/health
      timeout: 10s
    image: rivetdev/engine:3.1.1
    networks:
      appnet:
        aliases:
        - rivet-engine-coolify_rivet-engine_1
    restart: unless-stopped
    volumes:
    - rivet-log:/var/lib/rivet/log
    - rivet-objects:/var/lib/rivet/objects
volumes:
  rivet-log:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/rivet-log
      o: bind
      type: none
  rivet-objects:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/rivet-objects
      o: bind
      type: none
