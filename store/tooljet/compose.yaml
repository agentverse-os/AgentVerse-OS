# tooljet: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db-tooljet:
    environment:
      PGDATA: /data/postgres
      POSTGRES_DB: tooljet
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: tooljet
    image: postgres:11
    networks:
      appnet:
        aliases:
        - tooljet_db-tooljet_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  tooljet:
    command: openresty -g "daemon off;"
    depends_on:
    - tooljet-server
    environment:
      SERVER_HOST: tooljet-server
    image: tooljet/tooljet-client-ce:v2.4.2
    networks:
      appnet:
        aliases:
        - tooljet_tooljet_1
    restart: unless-stopped
    stdin_open: true
    tty: true
  tooljet-server:
    command: npm run start:prod
    environment:
      CHECK_FOR_UPDATES: check_if_updates_are_available
      DEFAULT_FROM_EMAIL: hello@tooljet.io
      LOCKBOX_MASTER_KEY: ${LOCKBOX_MASTER_KEY}
      PG_DB: tooljet
      PG_HOST: db-tooljet
      PG_PASS: ${DB_PASSWORD}
      PG_USER: tooljet
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SERVER_HOST: tooljet-server
      SERVE_CLIENT: 'false'
      TOOLJET_HOST: https://${APP_DOMAIN}
    image: tooljet/tooljet-server-ce:v2.24.0
    networks:
      appnet:
        aliases:
        - tooljet_tooljet-server_1
    restart: unless-stopped
    stdin_open: true
    tty: true
