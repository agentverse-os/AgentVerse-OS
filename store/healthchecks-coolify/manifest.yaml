  required: false
  type: text
- env: EMAIL_HOST
  hint: 'по умолчанию: my-smtp-server-here.com'
  label: email host
  options: null
  required: false
  type: text
- env: EMAIL_PORT
  hint: 'по умолчанию: 465'
  label: email port
  options: null
