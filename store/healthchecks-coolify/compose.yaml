# healthchecks-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  healthchecks:
    environment:
    - SERVICE_URL_HEALTHCHECKS_8000=${SERVICE_URL_HEALTHCHECKS_8000}
    - DB=sqlite
    - DB_NAME=/data/hc.sqlite
    - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    - REGISTRATION_OPEN=${REGISTRATION_OPEN:-True}
    - DEBUG=${DEBUG:-False}
    - SECRET_KEY=}
    - SITE_ROOT=${SERVICE_URL_HEALTHCHECKS}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-fixme-email-address-here}
    - EMAIL_HOST=${EMAIL_HOST:-my-smtp-server-here.com}
    - EMAIL_PORT=${EMAIL_PORT:-465}
    - EMAIL_HOST_USER=${EMAIL_HOST_USER:-my_username}
    - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-mypassword}
    - EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
    - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
    image: healthchecks/healthchecks:v4.2
    networks:
      appnet:
        aliases:
        - healthchecks-coolify_healthchecks_1
    restart: unless-stopped
    volumes:
    - healthchecks-data:/data
volumes:
  healthchecks-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/healthchecks-data
      o: bind
      type: none
