# slink-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      IMAGE_COMPRESSION_QUALITY: 80
      IMAGE_MAX_SIZE: 15M
      IMAGE_STRIP_EXIF_METADATA: 'true'
      ORIGIN: http://${DEVICE_DOMAIN_NAME}:8811
      PROTOCOL_HEADER: x-forwarded-proto
      REQUIRE_SSL: 'false'
      STORAGE_PROVIDER: local
      TZ: UTC
      USER_APPROVAL_REQUIRED: 'false'
      USER_PASSWORD_MIN_LENGTH: 8
      USER_PASSWORD_REQUIREMENTS: 15
    image: anirdev/slink:v1.14.6@sha256:7f7cab180971caeb83ce8818a676be04a7923dff6bf6e201ae0a9ce4f64be593
    networks:
      appnet:
        aliases:
        - slink_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/server.js:/services/client/svelte-kit/server.js:ro
    - ${APP_DATA_DIR}/data/var:/app/var/data
    - ${APP_DATA_DIR}/data/images:/app/slink/images
