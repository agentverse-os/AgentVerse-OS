# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/slink-umbrel
description: A powerful, privacy-first image sharing platform
endpoint:
  port: 3000
  service: web
env:
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/slink/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/slink/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/slink/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/slink/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/slink/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: slink-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Slink
type: app
upstream:
  author: Andrii Kryvoviaz
  categories:
  - files
  release_notes: |-
    This update fixes a security issue where image URLs could return non-media responses that a CDN or shared cache might store and serve.

    Full release notes can be found at https://github.com/andrii-kryvoviaz/slink/releases/tag/v1.14.6
  source: https://github.com/andrii-kryvoviaz/slink
  version: 1.14.6
  website: https://docs.slinkapp.io/
website: https://docs.slinkapp.io/
