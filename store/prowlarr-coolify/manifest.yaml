- tank/apps/prowlarr-coolify
description: Prowlarr⁠ is a indexer manager/proxy built on the popular arr .net/reactjs base stack to integrate with your various PVR apps.
endpoint:
  port: 9696
  service: prowlarr
env:
  SERVICE_URL_PROWLARR: https://${APP_DOMAIN}
  SERVICE_URL_PROWLARR_9696: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: prowlarr-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- media
- server
- movies
- tv
- indexer
- torrent
- nzb
- usenet
title: Prowlarr
type: app
upstream:
