requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: SB_USER
  hint: null
  label: Username
  options: null
  required: true
  type: text
- env: SB_PASSWORD
  hint: null
  label: Password
  options: null
  required: true
  type: password
tags: []
title: Silverbullet
type: app
upstream:
  author: zefhemel
  categories:
  - utilities
  source: https://github.com/silverbulletmd/silverbullet
