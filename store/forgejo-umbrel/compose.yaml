# forgejo-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_PASSWORD: forgejo
      POSTGRES_USER: forgejo
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U forgejo
      timeout: 5s
    image: postgres:17.3@sha256:0321e2252ebfeecb8bc1a899755084d29bce872953e1a5a3e25ec0860b739098
    networks:
      appnet:
        aliases:
        - forgejo_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  server:
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo_db_1:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__PASSWD: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__server__DOMAIN: ${APP_DOMAIN}
      FORGEJO__server__HTTP_PORT: 8101
      FORGEJO__server__SSH_DOMAIN: ${APP_DOMAIN}
      FORGEJO__server__SSH_LISTEN_PORT: ${APP_FORGEJO_SSH_PORT}
      FORGEJO__server__SSH_PORT: ${APP_FORGEJO_SSH_PORT}
      FORGEJO__server__START_SSH_SERVER: 'true'
    image: codeberg.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
    networks:
      appnet:
        aliases:
        - forgejo_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/forgejo/data:/var/lib/gitea
    - ${APP_DATA_DIR}/data/forgejo/config:/etc/gitea
