# forgejo-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_PASSWORD: forgejo
      POSTGRES_USER: forgejo
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U forgejo
      timeout: 5s
    image: postgres:17.3@sha256:0321e2252ebfeecb8bc1a899755084d29bce872953e1a5a3e25ec0860b739098
    networks:
      appnet:
        aliases:
        - forgejo_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  server:
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo_db_1:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__PASSWD: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__server__DOMAIN: ${APP_DOMAIN}
      FORGEJO__server__HTTP_PORT: 8101
      FORGEJO__server__SSH_DOMAIN: ${APP_DOMAIN}
      FORGEJO__server__SSH_LISTEN_PORT: ${APP_FORGEJO_SSH_PORT}
      FORGEJO__server__SSH_PORT: ${APP_FORGEJO_SSH_PORT}
      FORGEJO__server__START_SSH_SERVER: 'true'
    image: codeberg.org/forgejo/forgejo:16.0.3-rootless@sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
    networks:
      appnet:
        aliases:
        - forgejo_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/forgejo/data:/var/lib/gitea
    - ${APP_DATA_DIR}/data/forgejo/config:/etc/gitea
