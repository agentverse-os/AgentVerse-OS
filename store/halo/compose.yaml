# halo: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  halo:
    command:
    - --spring.r2dbc.url=r2dbc:pool:postgresql://halodb/halo
    - --spring.r2dbc.username=halo
    - --spring.r2dbc.password=${HALO_DATABASE_PASSWORD}
    - --spring.sql.init.platform=postgresql
    - --halo.external-url=${HALO_EXTERNAL_URL}
    depends_on:
      halodb:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 30s
      test: curl -f http://localhost:8090/actuator/health/readiness
      timeout: 5s
    image: halohub/halo:2.26.0
    networks:
      appnet:
        aliases:
        - halo_halo_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}:/root/.halo2
  halodb:
    environment:
      PGUSER: halo
      POSTGRES_DB: halo
      POSTGRES_PASSWORD: ${HALO_DATABASE_PASSWORD}
      POSTGRES_USER: halo
    healthcheck:
      interval: 10s
      retries: 5
      test: pg_isready
      timeout: 5s
    image: postgres:15.4
    networks:
      appnet:
        aliases:
        - halo_halodb_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/db:/var/lib/postgresql/data
