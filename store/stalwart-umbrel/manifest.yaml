- https://getumbrel.github.io/umbrel-apps-gallery/stalwart/4.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/stalwart/5.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/stalwart/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: admin
