  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Stalwart
type: app
upstream:
  author: Stalwart Labs
  categories:
  - files
  release_notes: |-
    If updating from Stalwart v0.15.x or earlier, Umbrel runs the v0.16 migration automatically as part of the update. Make sure you have a backup and leave Stalwart running until it comes back online. Upgrading guide: https://github.com/stalwartlabs/stalwart/blob/main/UPGRADING/v0_16.md

    Changes since v0.16.19 include:
      - Adds SCIM v2 support for Enterprise, JMAP calendar event update/delete support, conference links in calendar invites and email alarms, and additional calendar translations
      - Updates the calendar HTTP RSVP page
      - Fixes DANE/TLS delivery handling, S3 region configuration, setup-wizard SQL directory validation, CardDAV default address book cleanup, Redis Sentinel TLS, generated Message-ID hostnames, DMARC/inbound report handling, recovery-admin impersonation, WebUI failed-login behavior, and stale cluster node leases


    Full release notes can be found at https://github.com/stalwartlabs/stalwart/releases/tag/v0.16.20
  source: https://github.com/stalwartlabs/stalwart
  version: v0.16.20
  website: https://stalw.art/
website: https://stalw.art/
