# stalwart-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - STALWART_RECOVERY_ADMIN=admin:${APP_PASSWORD}
    - STALWART_PUBLIC_URL=http://${DEVICE_DOMAIN_NAME}:8745
    image: stalwartlabs/stalwart:v0.16.20@sha256:74ca4f7f6885fe302f38a99381f36a208547afce1033d8734d9e6d8d3eba7446
    networks:
      appnet:
        aliases:
        - stalwart_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/etc:/etc/stalwart
    - ${APP_DATA_DIR}/data/server:/var/lib/stalwart
