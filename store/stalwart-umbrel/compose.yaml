# stalwart-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - STALWART_RECOVERY_ADMIN=admin:${APP_PASSWORD}
    - STALWART_PUBLIC_URL=http://${DEVICE_DOMAIN_NAME}:8745
    image: stalwartlabs/stalwart:v1.1.1@sha256:5ebdf474b237161742fe4309396af4ae8797c938e8e6eb7e2d4837332c4f9851
    networks:
      appnet:
        aliases:
        - stalwart_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/etc:/etc/stalwart
    - ${APP_DATA_DIR}/data/server:/var/lib/stalwart
    - ${APP_DATA_DIR}/data/logs:/var/log/stalwart
