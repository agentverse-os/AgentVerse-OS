# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/invidious-umbrel
description: Browse YouTube without tracking or ads
endpoint:
  port: 3000
  service: web
env:
  APP_INV_SECRET_KEY: ''
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/invidious/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/invidious/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/invidious/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/invidious/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: invidious-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_INV_SECRET_KEY
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app inv secret key
  options: null
  required: false
  type: password
tags: []
title: Invidious
type: app
upstream:
  author: IV-Org
  categories:
  - social
  release_notes: |-
    This release improves channel navigation, playback, subscription exports, and companion proxying.

    Key highlights:
      - Custom channel handle URLs now support tab paths, including streams
      - Clicking a timestamp starts playback and scrolls to the video
      - Channel pages now support the shows tab
      - A minute badge has been added to the watch page
      - Subscriptions can now be exported as JSON for NewPipe
      - Published dates and view counts for collaborative videos are parsed correctly
      - FreeTube OPML subscription exports have been fixed
      - Companion proxying has been improved


    Breaking changes: Reddit integration and the hd720 quality option have been removed.

    For full release notes, visit https://github.com/iv-org/invidious/releases
  source: https://github.com/iv-org/invidious
  version: 2.20261103.0
  website: https://invidious.io/
website: https://invidious.io/
