# chroma-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chromadb:
    environment:
    - SERVICE_URL_CHROMA_8000=${SERVICE_URL_CHROMA_8000}
    - IS_PERSISTENT=TRUE
    - PERSIST_DIRECTORY=/data
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - /bin/bash
      - -c
      - cat < /dev/null > /dev/tcp/localhost/8000
      timeout: 10s
    image: chromadb/chroma:1.0.15
    networks:
      appnet:
        aliases:
        - chroma-coolify_chromadb_1
    restart: unless-stopped
    volumes:
    - chroma-data:/data
volumes:
  chroma-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/chroma-data
      o: bind
      type: none
