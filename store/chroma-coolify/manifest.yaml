# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/chroma-coolify
description: Chroma is the open-source search and retrieval database for AI applications.
endpoint:
  port: 8000
  service: chromadb
env:
  SERVICE_URL_CHROMA_8000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: chroma-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- ai
- vector-database
- semantic-search
- machine-learning
- bm25
- embeddings
- llm
title: Chroma
type: app
upstream:
  categories:
  - ai
  source: https://cookbook.chromadb.dev/
  tags:
  - ai
  - vector-database
  - semantic-search
  - machine-learning
  - bm25
  - embeddings
  - llm
  template: chroma.yaml
website: https://cookbook.chromadb.dev/
