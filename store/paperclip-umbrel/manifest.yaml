# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/paperclip-umbrel
description: A team of AI agents for every person
endpoint:
  port: 3100
  service: server
env:
  APP_HIDDEN_SERVICE: ''
  APP_PAPERCLIP_LOCAL_IPS: ${local_ips}
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/paperclip/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/paperclip/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/paperclip/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/paperclip/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/paperclip/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/paperclip/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: paperclip-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Paperclip
type: app
upstream:
  author: Paperclip Labs, Inc.
  categories:
  - ai
  release_notes: |-
    - Fixed first-run onboarding so creating an organization reliably advances to the first-agent step instead of appearing to refresh.
    - Onboarding is now shorter and starts with creating your first agent.
    - Skills can be enabled for agents and delivered to runs; Kimi Code is now available as an adapter.
    - Added operator controls for hiding settings surfaces and setting defaults, plus improved import, sandbox callback, and workspace reliability.
    - Includes automatic database migrations, auth/security fixes, and removal of the old company brand color and attachment size limit fields.
  source: https://github.com/paperclipai/paperclip
  version: 2026.831.1
  website: https://paperclip.ing/
website: https://paperclip.ing/
