# glasshome-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      DATA_DIR: /data
      PORT: 3123
      TRUSTED_PROXIES: 127.0.0.0/8,::1,${GATEWAY_IP}/32
    image: ghcr.io/glasshome/dash:1.4.5@sha256:173777a0d0f575907486448f339e33c8268ff8497d8292c59989bb8294540307
    networks:
      appnet:
        aliases:
        - glasshome_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
