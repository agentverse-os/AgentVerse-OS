# glasshome-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      DATA_DIR: /data
      PORT: 3123
    image: ghcr.io/glasshome/dash:1.2.0@sha256:0ca541fcd07bfaec96687b73ffb0a41eda83c7d7e33c3cf7652097168c948e20
    networks:
      appnet:
        aliases:
        - glasshome_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
