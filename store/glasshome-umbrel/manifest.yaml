  release_notes: |-
    Wall displays and phones paired with Quick-Connect need to sign in again after this update. Their sign-in is now kept out of reach of widgets.

    This update fixes dashboards showing a black screen on older built-in browsers, including the Shelly Wall Display. It also fixes accidental selections when opening menus with Reduce motion enabled, and adds smoother highlights in menus and pickers.

    Full release notes can be found at https://github.com/glasshome/homeassistant-addon/blob/main/glasshome/CHANGELOG.md#145.
