# it-tools: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  it-tools:
    image: corentinth/it-tools:latest
    networks:
      appnet:
        aliases:
        - it-tools_it-tools_1
    restart: unless-stopped
