# wiki-js: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  wiki-js:
    depends_on:
    - wiki-js-db
    environment:
      ADMIN_EMAIL: ${WIKI_JS_ADMIN_EMAIL}
      ADMIN_PASS: ${WIKI_JS_ADMIN_PASSWORD}
      DB_HOST: wiki-js-db
      DB_NAME: wiki
      DB_PASS: ${WIKI_JS_DB_PASS}
      DB_PORT: 5432
      DB_TYPE: postgres
      DB_USER: wikijs
    image: ghcr.io/requarks/wiki:3.4.0
    networks:
      appnet:
        aliases:
        - wiki-js_wiki-js_1
    restart: unless-stopped
  wiki-js-db:
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${WIKI_JS_DB_PASS}
      POSTGRES_USER: wikijs
    image: postgres:18-alpine
    networks:
      appnet:
        aliases:
        - wiki-js_wiki-js-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
