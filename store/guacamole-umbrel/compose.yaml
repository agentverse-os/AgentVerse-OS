# guacamole-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db-init:
    entrypoint:
    - /bin/sh
    - -c
    - /opt/guacamole/bin/initdb.sh --postgresql > /initdb/001-schema.sql
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    networks:
      appnet:
        aliases:
        - guacamole_db-init_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/initdb:/initdb
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    networks:
      appnet:
        aliases:
        - guacamole_guacd_1
    restart: on-failure
  postgres:
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      GUACADMIN_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: guacamole
      POSTGRES_PASSWORD: ${APP_GUACAMOLE_DB_PASSWORD}
      POSTGRES_USER: guacamole
    image: postgres:18.7-alpine@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    networks:
      appnet:
        aliases:
        - guacamole_postgres_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql
    - ${APP_DATA_DIR}/data/initdb:/docker-entrypoint-initdb.d:ro
  web:
    depends_on:
    - guacd
    - postgres
    environment:
      BAN_ENABLED: 'false'
      GUACD_HOSTNAME: guacd
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PASSWORD: ${APP_GUACAMOLE_DB_PASSWORD}
      POSTGRESQL_USERNAME: guacamole
      WEBAPP_CONTEXT: ROOT
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    networks:
      appnet:
        aliases:
        - guacamole_web_1
    restart: on-failure
