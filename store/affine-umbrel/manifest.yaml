  release_notes: |-
    This is a follow-up to AFFiNE 0.27. If you're updating from a pre-0.27 version, only clients on version 0.26 or newer are supported for sync, and advanced self-host configuration should be migrated to config.json per AFFiNE's docs.

    Key improvements in 0.27.4 include:
      - Improved BYOK model editing
      - Fixed code block line-number triggers and trashed-doc journal visibility
      - Improved OneNote imports and Android keyboard compatibility
      - Improved backend stability for long records and reduced memory usage during server-side garbage collection
      - Updated AI model support for GPT 5.6 and Gemini 3.7


    Full release notes can be found at https://github.com/toeverything/AFFiNE/releases/tag/v0.27.4
