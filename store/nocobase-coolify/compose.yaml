# nocobase-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  nocobase:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_NOCOBASE_13000=${SERVICE_URL_NOCOBASE_13000}
    - APP_KEY=${SERVICE_BASE64_64_APPKEY}
    - DB_DIALECT=postgres
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_DATABASE=${POSTGRES_DB:-nocobase-db}
    - DB_USER=$SERVICE_USER_POSTGRES
    - DB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    image: nocobase/nocobase:1.9.33
    networks:
      appnet:
        aliases:
        - nocobase-coolify_nocobase_1
    restart: unless-stopped
    volumes:
    - nocobase-storage:/app/nocobase/storage
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-nocobase-db}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:17-alpine
    networks:
      appnet:
        aliases:
        - nocobase-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql/data
volumes:
  nocobase-storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/nocobase-storage
      o: bind
      type: none
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
