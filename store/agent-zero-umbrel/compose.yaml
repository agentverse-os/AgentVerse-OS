# agent-zero-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - ALLOWED_ORIGINS=http://${DEVICE_DOMAIN_NAME}:${APP_AGENTZERO_PORT},https://${DEVICE_DOMAIN_NAME}:${APP_AGENTZERO_PORT},http://${DEVICE_HOSTNAME}:${APP_AGENTZERO_PORT},https://${DEVICE_HOSTNAME}:${APP_AGENTZERO_PORT},${APP_AGENTZERO_LOCAL_URLS}
    extra_hosts:
    - host.docker.internal:host-gateway
    image: agent0ai/agent-zero:v2.16@sha256:0490714bf25bf481ea50d59ead21acec04344cee410a86b4e159908cb92ed8a2
    networks:
      appnet:
        aliases:
        - agent-zero_web_1
    restart: on-failure
    ulimits:
      nofile:
        hard: 65535
        soft: 65535
    volumes:
    - ${APP_DATA_DIR}/data/usr:/a0/usr
