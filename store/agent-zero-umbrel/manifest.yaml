# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/agent-zero-umbrel
description: A personal, organic agentic framework that grows and learns with you
endpoint:
  port: 80
  service: web
env:
  APP_AGENTZERO_LOCAL_IPS: ${local_ips}
  APP_AGENTZERO_LOCAL_URLS: ${ips_with_port}
  APP_AGENTZERO_PORT: '3015'
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/agent-zero/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/agent-zero/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/agent-zero/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/agent-zero/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: agent-zero-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Agent Zero
type: app
upstream:
  author: Agent Zero AI
  categories:
  - ai
  release_notes: |-
    ⚠️ Time Travel now expires older snapshots by default, keeping up to 500 recent snapshots within 30 days plus checkpoints. Existing explicit opt-outs are preserved. Custom clients calling local OAuth model proxies must now authenticate, and A2A connections must supply credentials explicitly.

    - Added automatic cleanup of old caches and temporary files, with per-area controls. - Scheduled tasks missed during downtime now run once when Agent Zero returns. - Improved secret handling, backup restore safety, and Time Travel capture and restore. - Restored scoped Telegram configuration and improved chat loading and startup performance. - Released idle browser resources while preserving saved tabs and sign-in profiles.

    Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.16
  source: https://github.com/agent0ai/agent-zero
  version: v2.16
  website: https://github.com/agent0ai/agent-zero
website: https://github.com/agent0ai/agent-zero
