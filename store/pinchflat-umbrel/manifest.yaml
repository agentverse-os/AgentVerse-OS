gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/pinchflat/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/pinchflat/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/pinchflat/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/pinchflat/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: pinchflat-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Pinchflat
type: app
upstream:
  author: Kieran Eglin
  categories:
  - media
  release_notes: null
  source: https://github.com/kieraneglin/pinchflat
  version: 2025.6.6
