    ⚠️ Reitti 5 is a recent major update. If you're updating from a pre-5.0 version, back up your app data first, let the first-start migration finish, and then verify your devices, API tokens, and map style selection in Settings.

    This release improves GPX import performance on lower-power hardware by reducing database recalculation load, fixes Workbench point editing when Spatial Coverage is disabled, and restores complete French translations.

