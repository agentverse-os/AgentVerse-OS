# reitti-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      postgis:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
      tile-cache:
        condition: service_healthy
    environment:
      POSTGIS_DB: reittidb
      POSTGIS_HOST: reitti_postgis_1
      POSTGIS_PASSWORD: reitti
      POSTGIS_USER: reitti
    image: dedicatedcode/reitti:5.3.1@sha256:e4fee662cd571e3a0763d2c46ed2421cad8258e266ec63d7637e9dc4e7079bac
    networks:
      appnet:
        aliases:
        - reitti_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
  postgis:
    environment:
      POSTGRES_DB: reittidb
      POSTGRES_PASSWORD: reitti
      POSTGRES_USER: reitti
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U reitti -d reittidb
      timeout: 5s
    image: imresamu/postgis:17-3.5-alpine@sha256:ba5f5012ffe7a01a78e85404d3e081ed7e961013161bb09d39ff09c867ada17b
    networks:
      appnet:
        aliases:
        - reitti_postgis_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/postgis:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    networks:
      appnet:
        aliases:
        - reitti_redis_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
  tile-cache:
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 5s
      test:
      - CMD-SHELL
      - 'curl -f -s -o /dev/null -H "X-Reitti-Upstream-Url: https://tiles.dedicatedcode.com" http://localhost/custom/planet/latest/0/0/0.pbf || exit 1'
      timeout: 5s
    image: dedicatedcode/reitti-tile-cache:5.3.1@sha256:0fe2d0c7420b249b408182f3a13cd01a71dd56cc4578ea784ffb847e445d1236
    networks:
      appnet:
        aliases:
        - reitti_tile-cache_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/title-cache:/var/cache/nginx
