# unleash-with-postgresql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=db
    healthcheck:
      interval: 2s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - pg_isready
      - --username=$SERVICE_USER_POSTGRES
      - --host=127.0.0.1
      - --port=5432
      - --dbname=db
      timeout: 1m
    image: postgres:15
    networks:
      appnet:
        aliases:
        - unleash-with-postgresql-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgresql-data:/var/lib/postgresql/data
  unleash:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_UNLEASH_4242=${SERVICE_URL_UNLEASH_4242}
    - UNLEASH_URL=${SERVICE_URL_UNLEASH}
    - UNLEASH_DEFAULT_ADMIN_PASSWORD=${SERVICE_PASSWORD_UNLEASH}
    - DATABASE_URL=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres/db
    - DATABASE_SSL=false
    - LOG_LEVEL=warn
    - INIT_FRONTEND_API_TOKENS=default:default:development.unleash-insecure-frontend-api-token
    - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token
    healthcheck:
      interval: 1s
      retries: 5
      start_period: 15s
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit 1
      timeout: 1m
    image: unleashorg/unleash-server:latest
    networks:
      appnet:
        aliases:
        - unleash-with-postgresql-coolify_unleash_1
    restart: unless-stopped
volumes:
  postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgresql-data
      o: bind
      type: none
