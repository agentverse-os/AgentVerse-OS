# grocy: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  grocy:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: lscr.io/linuxserver/grocy:4.6.0
    networks:
      appnet:
        aliases:
        - grocy_grocy_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/config
