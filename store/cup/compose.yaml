# cup: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cup:
    command: serve
    image: ghcr.io/sergi0g/cup:v3.5.1
    networks:
      appnet:
        aliases:
        - cup_cup_1
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
