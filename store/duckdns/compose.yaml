# duckdns: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  duckdns:
    environment:
      LOG_FILE: ${DUCKDNS_ENABLE_LOG_FILE}
      PGID: '1000'
      PUID: '1000'
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: ${TZ}
      UPDATE_IP: ${DUCKDNS_UPDATE_IP}
    image: lscr.io/linuxserver/duckdns:b14c520a-ls8
    networks:
      appnet:
        aliases:
        - duckdns_duckdns_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
