# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/dify-coolify
description: Dify is an open-source LLM app development platform. Dify's intuitive interface combines AI workflow, RAG pipeline, agent capabilities, model management, observability features and more, letting you quickly go from prototype to production.
endpoint:
  port: 80
  service: agent_backend
env:
  ALLOW_EMBED: 'false'
  API_SENTRY_DSN: ''
  CELERY_WORKER_AMOUNT: '4'
  CONSOLE_API_URL: ''
  CONSOLE_CORS_ALLOW_ORIGINS: '*'
  CONSOLE_WEB_URL: ''
  CSP_WHITELIST: ''
  DEBUG: 'false'
  DIFY_AGENT_E2B_API_KEY: ''
  DIFY_AGENT_RUNTIME_BACKEND: local
  FLASK_DEBUG: 'false'
  FORCE_VERIFYING_SIGNATURE: 'true'
  GUNICORN_TIMEOUT: '360'
  INTERNAL_FILES_URL: http://api:5001
  LOG_LEVEL: INFO
  MAIL_DEFAULT_SEND_FROM: ''
  MAIL_TYPE: ''
  MARKETPLACE_API_URL: https://marketplace.dify.ai
  MARKETPLACE_ENABLED: 'true'
  MARKETPLACE_URL: https://marketplace.dify.ai
  MIGRATION_ENABLED: 'true'
  NEXT_PUBLIC_ENABLE_AGENT_V2: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  OPENDAL_FS_ROOT: storage
  OPENDAL_SCHEME: fs
  PIP_MIRROR_URL: ''
  PLUGIN_DAEMON_TIMEOUT: '600.0'
  PLUGIN_MAX_EXECUTION_TIMEOUT: '600'
  PLUGIN_MAX_PACKAGE_SIZE: '52428800'
  PLUGIN_PYTHON_ENV_INIT_TIMEOUT: '120'
  POSTGRES_DB: ''
  POSTGRES_EFFECTIVE_CACHE_SIZE: 4096MB
  POSTGRES_MAINTENANCE_WORK_MEM: 64MB
  POSTGRES_MAX_CONNECTIONS: '200'
  POSTGRES_SHARED_BUFFERS: 128MB
  POSTGRES_USER: ''
  POSTGRES_WORK_MEM: 4MB
  REDIS_KEEPALIVE: 'true'
  RESPECT_XFORWARD_HEADERS_ENABLED: 'true'
  SANDBOX_ENABLE_NETWORK: 'true'
  SANDBOX_GIN_MODE: release
  SANDBOX_WORKER_TIMEOUT: '15'
  SERVER_WORKER_CLASS: gevent
  SERVICE_PASSWORD_64_AGENTAPI:
    generate: hex64
  SERVICE_PASSWORD_64_AGENTSANDBOX:
    generate: hex64
  SERVICE_PASSWORD_64_AGENTSERVER:
    generate: hex64
  SERVICE_PASSWORD_64_PLUGINDAEMON:
    generate: hex64
  SERVICE_PASSWORD_64_PLUGININNER:
    generate: hex64
  SERVICE_PASSWORD_64_SECRETKEY:
    generate: hex64
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_PASSWORD_SANDBOX:
    generate: password
  SERVICE_PASSWORD_WEAVIATE:
    generate: password
  SERVICE_URL_DIFY: https://${APP_DOMAIN}
  SERVICE_URL_DIFY_80: https://${APP_DOMAIN}
  SERVICE_USER_INITPASSWORD:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
  SERVICE_USER_WEAVIATE:
    generate: password
  SHELLCTL_ENABLE_PATH_ISOLATION: 'true'
  SMTP_OPPORTUNISTIC_TLS: 'false'
  SMTP_PASSWORD: ''
  SMTP_PORT: '465'
  SMTP_SERVER: ''
  SMTP_USERNAME: ''
  SMTP_USE_TLS: 'true'
  STORAGE_TYPE: opendal
  TEXT_GENERATION_TIMEOUT_MS: '60000'
  WEAVIATE_DISABLE_TELEMETRY: 'false'
  WEAVIATE_QUERY_DEFAULTS_LIMIT: '25'
  WEB_API_CORS_ALLOW_ORIGINS: '*'
  WEB_SENTRY_DSN: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
