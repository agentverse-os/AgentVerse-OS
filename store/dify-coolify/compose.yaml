# dify-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
configs:
  agent-backend-inline-1:
    content: |
      #!/bin/sh
      # DIFY_AGENT_SERVER_SECRET_KEY must be unpadded base64url of 32 bytes. Derive it from the generated secret.
      if [ -z "$DIFY_AGENT_SERVER_SECRET_KEY" ]; then
        DIFY_AGENT_SERVER_SECRET_KEY=$(python -c 'import base64, hashlib, os; print(base64.urlsafe_b64encode(hashlib.sha256(os.environ["DIFY_AGENT_SERVER_SECRET"].encode()).digest()).rstrip(b"=").decode())')
        export DIFY_AGENT_SERVER_SECRET_KEY
      fi
      exec uvicorn dify_agent.server.app:app --host 0.0.0.0 --port 5050
  agent-ssrf-proxy-inline-2:
    content: |
      # All traffic on this proxy is restricted to:
      #   - agent_backend /agent-stub/* endpoints
      #   - Dify API /files/* endpoints (signed upload/download URLs)
      # External internet is allowed; all other private-network destinations are denied.
      include /etc/squid/dify_common.conf

      acl dst_agent_backend dstdomain agent_backend
      acl dst_dify_api dstdomain api
      acl path_files urlpath_regex -i ^/files/
      acl path_agent_stub urlpath_regex -i ^/agent-stub/

      http_port 3128

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      http_access allow dst_agent_backend path_agent_stub
      http_access allow dst_dify_api path_files
      http_access deny to_private_networks
      http_access allow all
  agent-ssrf-proxy-inline-3:
    content: |
      acl client_localnet src 0.0.0.1-0.255.255.255
      acl client_localnet src 10.0.0.0/8
      acl client_localnet src 100.64.0.0/10
      acl client_localnet src 169.254.0.0/16
      acl client_localnet src 172.16.0.0/12
      acl client_localnet src 192.168.0.0/16
      acl client_localnet src fc00::/7
      acl client_localnet src fe80::/10

      acl to_private_networks dst 0.0.0.0/8
      acl to_private_networks dst 10.0.0.0/8
      acl to_private_networks dst 100.64.0.0/10
      acl to_private_networks dst 127.0.0.0/8
      acl to_private_networks dst 169.254.0.0/16
      acl to_private_networks dst 172.16.0.0/12
      acl to_private_networks dst 192.168.0.0/16
      acl to_private_networks dst 224.0.0.0/4
      acl to_private_networks dst 240.0.0.0/4
      acl to_private_networks dst ::/128
      acl to_private_networks dst ::1/128
      acl to_private_networks dst ::ffff:0:0/96
      acl to_private_networks dst ::/96
      acl to_private_networks dst fc00::/7
      acl to_private_networks dst fe80::/10

      acl SSL_ports port 443
      acl Safe_ports port 80
      acl Safe_ports port 21
      acl Safe_ports port 443
      acl Safe_ports port 70
      acl Safe_ports port 210
      acl Safe_ports port 1025-65535
      acl Safe_ports port 280
      acl Safe_ports port 488
      acl Safe_ports port 591
      acl Safe_ports port 777
      acl CONNECT method CONNECT

      tcp_outgoing_address 0.0.0.0

      coredump_dir /var/spool/squid
      refresh_pattern ^ftp: 1440 20% 10080
      refresh_pattern ^gopher: 1440 0% 1440
      refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
      refresh_pattern . 0 20% 4320

      client_request_buffer_max_size 100 MB

      max_filedescriptors 65536
      connect_timeout 30 seconds
      request_timeout 2 minutes
      read_timeout 2 minutes
      client_lifetime 5 minutes
      shutdown_lifetime 30 seconds

      server_persistent_connections on
      client_persistent_connections on
      persistent_request_timeout 30 seconds
      pconn_timeout 1 minute

      client_db on
      server_idle_pconn_timeout 2 minutes
      client_idle_pconn_timeout 2 minutes

      quick_abort_min 16 KB
      quick_abort_max 16 MB
      quick_abort_pct 95

      memory_cache_mode disk
      cache_mem 256 MB
      maximum_object_size_in_memory 512 KB

      dns_timeout 30 seconds
      dns_retransmit_interval 5 seconds

      access_log daemon:/var/log/squid/access.log
  nginx-inline-4:
    content: |
      server {
        listen 80;
        server_name _;
        resolver 127.0.0.11 valid=30s ipv6=off;
        client_max_body_size 100M;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location /console/api {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /api {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /v1 {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /openapi {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /files {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /mcp {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /triggers {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /callbacks/human-input/v2/im/ {
          set $api_upstream api:5001;
          proxy_pass http://$api_upstream;
        }

        location /e/ {
          set $plugin_daemon_upstream plugin_daemon:5002;
          proxy_pass http://$plugin_daemon_upstream;
          proxy_set_header Dify-Hook-Url $http_x_forwarded_proto://$host$request_uri;
        }

        location /explore {
          set $web_upstream web:3000;
          proxy_pass http://$web_upstream;
        }

        location / {
          set $web_upstream web:3000;
          proxy_pass http://$web_upstream;
        }
      }
  sandbox-inline-5:
    content: |
      app:
        port: 8194
        debug: False
        key: dify-sandbox
      max_workers: 4
      max_requests: 50
      worker_timeout: 5
      enable_network: True
      allowed_syscalls:
      proxy:
        socks5: ''
        http: ''
        https: ''
  ssrf-proxy-inline-6:
    content: |
      include /etc/squid/dify_common.conf

      acl allowed_domains dstdomain .marketplace.dify.ai

      http_port 3128

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      http_access allow localhost manager
      http_access deny manager
      http_access deny to_private_networks
      http_access allow allowed_domains
      http_access allow client_localnet
      http_access allow localhost
      http_access deny all
  ssrf-proxy-inline-7:
    content: |
      acl client_localnet src 0.0.0.1-0.255.255.255
      acl client_localnet src 10.0.0.0/8
      acl client_localnet src 100.64.0.0/10
      acl client_localnet src 169.254.0.0/16
      acl client_localnet src 172.16.0.0/12
      acl client_localnet src 192.168.0.0/16
      acl client_localnet src fc00::/7
      acl client_localnet src fe80::/10

      acl to_private_networks dst 0.0.0.0/8
      acl to_private_networks dst 10.0.0.0/8
      acl to_private_networks dst 100.64.0.0/10
      acl to_private_networks dst 127.0.0.0/8
      acl to_private_networks dst 169.254.0.0/16
      acl to_private_networks dst 172.16.0.0/12
      acl to_private_networks dst 192.168.0.0/16
      acl to_private_networks dst 224.0.0.0/4
      acl to_private_networks dst 240.0.0.0/4
      acl to_private_networks dst ::/128
      acl to_private_networks dst ::1/128
      acl to_private_networks dst ::ffff:0:0/96
      acl to_private_networks dst ::/96
      acl to_private_networks dst fc00::/7
      acl to_private_networks dst fe80::/10

      acl SSL_ports port 443
      acl Safe_ports port 80
      acl Safe_ports port 21
      acl Safe_ports port 443
      acl Safe_ports port 70
      acl Safe_ports port 210
      acl Safe_ports port 1025-65535
      acl Safe_ports port 280
      acl Safe_ports port 488
      acl Safe_ports port 591
      acl Safe_ports port 777
      acl CONNECT method CONNECT

      tcp_outgoing_address 0.0.0.0

      coredump_dir /var/spool/squid
      refresh_pattern ^ftp: 1440 20% 10080
      refresh_pattern ^gopher: 1440 0% 1440
      refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
      refresh_pattern . 0 20% 4320

      client_request_buffer_max_size 100 MB

      max_filedescriptors 65536
      connect_timeout 30 seconds
      request_timeout 2 minutes
      read_timeout 2 minutes
      client_lifetime 5 minutes
      shutdown_lifetime 30 seconds

      server_persistent_connections on
      client_persistent_connections on
      persistent_request_timeout 30 seconds
      pconn_timeout 1 minute

      client_db on
      server_idle_pconn_timeout 2 minutes
      client_idle_pconn_timeout 2 minutes

      quick_abort_min 16 KB
      quick_abort_max 16 MB
      quick_abort_pct 95

      memory_cache_mode disk
      cache_mem 256 MB
      maximum_object_size_in_memory 512 KB

      dns_timeout 30 seconds
      dns_retransmit_interval 5 seconds

      access_log daemon:/var/log/squid/access.log
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  agent_backend:
    configs:
    - source: agent-backend-inline-1
      target: /coolify-entrypoint.sh
    depends_on:
      plugin_daemon:
        condition: service_started
      redis:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /coolify-entrypoint.sh
    environment:
      DIFY_AGENT_API_TOKEN: $SERVICE_PASSWORD_64_AGENTAPI
      DIFY_AGENT_E2B_API_KEY: ${DIFY_AGENT_E2B_API_KEY:-}
      DIFY_AGENT_INNER_API_KEY: $SERVICE_PASSWORD_64_PLUGININNER
      DIFY_AGENT_INNER_API_URL: http://api:5001
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: $SERVICE_PASSWORD_64_AGENTSANDBOX
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: $SERVICE_PASSWORD_64_PLUGINDAEMON
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      DIFY_AGENT_REDIS_URL: redis://:$SERVICE_PASSWORD_REDIS@redis:6379/2
      DIFY_AGENT_RUNTIME_BACKEND: ${DIFY_AGENT_RUNTIME_BACKEND:-local}
      DIFY_AGENT_SANDBOX_FILES_BASE_URL: http://api:5001
      DIFY_AGENT_SERVER_SECRET: $SERVICE_PASSWORD_64_AGENTSERVER
      DIFY_AGENT_STUB_API_BASE_URL: http://agent_backend:5050/agent-stub
    image: langgenius/dify-agent-backend:1.19.0
    networks:
      appnet:
        aliases:
        - dify-coolify_agent_backend_1
    restart: unless-stopped
    volumes: []
  agent_ssrf_proxy:
    configs:
    - source: agent-ssrf-proxy-inline-2
      target: /etc/squid/squid.conf
    - source: agent-ssrf-proxy-inline-3
      target: /etc/squid/dify_common.conf
    entrypoint:
    - /bin/sh
    - -c
    - /usr/sbin/squid -Nz -f /etc/squid/squid.conf && exec /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
    image: ubuntu/squid:latest
    networks:
      appnet:
        aliases:
        - dify-coolify_agent_ssrf_proxy_1
    restart: unless-stopped
    volumes: []
  api:
    depends_on:
      db:
        condition: service_healthy
      init_permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<:
        AGENT_BACKEND_API_TOKEN: $SERVICE_PASSWORD_64_AGENTAPI
        AGENT_BACKEND_BASE_URL: http://agent_backend:5050
        APP_WEB_URL: ${APP_WEB_URL:-}
        CELERY_BROKER_URL: redis://:$SERVICE_PASSWORD_REDIS@redis:6379/1
        CELERY_WORKER_AMOUNT: ${CELERY_WORKER_AMOUNT:-4}
        CODE_EXECUTION_API_KEY: $SERVICE_PASSWORD_SANDBOX
        CODE_EXECUTION_ENDPOINT: http://sandbox:8194
        CONSOLE_API_URL: ${CONSOLE_API_URL:-}
        CONSOLE_CORS_ALLOW_ORIGINS: ${CONSOLE_CORS_ALLOW_ORIGINS:-*}
        CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-}
        DB_DATABASE: dify
        DB_HOST: db
        DB_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        DB_PORT: 5432
        DB_TYPE: postgresql
        DB_USERNAME: $SERVICE_USER_POSTGRES
        DEBUG: ${DEBUG:-false}
        DIFY_AGENT_API_TOKEN: $SERVICE_PASSWORD_64_AGENTAPI
        ENDPOINT_URL_TEMPLATE: ${SERVICE_URL_DIFY}/e/{hook_id}
        FILES_URL: ${SERVICE_URL_DIFY}
        FLASK_DEBUG: ${FLASK_DEBUG:-false}
        GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-360}
        INIT_PASSWORD: $SERVICE_USER_INITPASSWORD
        INNER_API_KEY_FOR_PLUGIN: $SERVICE_PASSWORD_64_PLUGININNER
        INTERNAL_FILES_URL: ${INTERNAL_FILES_URL:-http://api:5001}
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        MAIL_DEFAULT_SEND_FROM: ${MAIL_DEFAULT_SEND_FROM:-}
        MAIL_TYPE: ${MAIL_TYPE:-}
        MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
        MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-true}
        MIGRATION_ENABLED: ${MIGRATION_ENABLED:-true}
        NEXT_PUBLIC_ENABLE_AGENT_V2: ${NEXT_PUBLIC_ENABLE_AGENT_V2:-true}
        OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-storage}
        OPENDAL_SCHEME: ${OPENDAL_SCHEME:-fs}
        PLUGIN_DAEMON_KEY: $SERVICE_PASSWORD_64_PLUGINDAEMON
        PLUGIN_DAEMON_TIMEOUT: ${PLUGIN_DAEMON_TIMEOUT:-600.0}
        PLUGIN_DAEMON_URL: http://plugin_daemon:5002
        PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
        REDIS_HOST: redis
        REDIS_KEEPALIVE: ${REDIS_KEEPALIVE:-true}
        REDIS_PASSWORD: $SERVICE_PASSWORD_REDIS
        REDIS_PORT: 6379
        RESPECT_XFORWARD_HEADERS_ENABLED: ${RESPECT_XFORWARD_HEADERS_ENABLED:-true}
        SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
        SENTRY_DSN: ${API_SENTRY_DSN:-}
        SERVER_WORKER_CLASS: ${SERVER_WORKER_CLASS:-gevent}
        SERVICE_API_URL: ${SERVICE_API_URL:-}
        SMTP_OPPORTUNISTIC_TLS: ${SMTP_OPPORTUNISTIC_TLS:-false}
        SMTP_PASSWORD: ${SMTP_PASSWORD:-}
        SMTP_PORT: ${SMTP_PORT:-465}
        SMTP_SERVER: ${SMTP_SERVER:-}
        SMTP_USERNAME: ${SMTP_USERNAME:-}
        SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
        SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
        SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
        STORAGE_TYPE: ${STORAGE_TYPE:-opendal}
        TRIGGER_URL: ${SERVICE_URL_DIFY}
        VECTOR_STORE: weaviate
        WEAVIATE_API_KEY: $SERVICE_PASSWORD_WEAVIATE
        WEAVIATE_ENDPOINT: http://weaviate:8080
        WEAVIATE_GRPC_ENDPOINT: grpc://weaviate:50051
        WEB_API_CORS_ALLOW_ORIGINS: ${WEB_API_CORS_ALLOW_ORIGINS:-*}
      MODE: api
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      timeout: 5s
    image: langgenius/dify-api:1.19.0
    networks:
      appnet:
        aliases:
        - dify-coolify_api_1
    restart: unless-stopped
    volumes:
    - dify-storage:/app/api/storage
  db:
    command: |
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-200}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: dify
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      POSTGRES_USER: $SERVICE_USER_POSTGRES
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
    image: postgres:15-alpine
    networks:
      appnet:
        aliases:
        - dify-coolify_db_1
    restart: unless-stopped
    volumes:
    - dify-db-data:/var/lib/postgresql/data
  init_permissions:
    command:
    - sh
    - -c
    - '[ -f /app/api/storage/.init_permissions ] || (chown -R 1001:1001 /app/api/storage && touch /app/api/storage/.init_permissions)'
    image: busybox:latest
    networks:
      appnet:
        aliases:
        - dify-coolify_init_permissions_1
    restart: no
    volumes:
    - dify-storage:/app/api/storage
  local_sandbox:
    command:
    - shellctl
    - serve
    - --listen
    - 0.0.0.0:5004
    - --require-auth-token
    environment:
      HTTPS_PROXY: http://agent_ssrf_proxy:3128
      HTTP_PROXY: http://agent_ssrf_proxy:3128
      NO_PROXY: localhost,127.0.0.1
      SHELLCTL_AUTH_TOKEN: $SERVICE_PASSWORD_64_AGENTSANDBOX
      SHELLCTL_ENABLE_PATH_ISOLATION: ${SHELLCTL_ENABLE_PATH_ISOLATION:-true}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5004/healthz
      timeout: 5s
    image: langgenius/dify-agent-local-sandbox:1.19.0
    networks:
      appnet:
        aliases:
        - dify-coolify_local_sandbox_1
    restart: unless-stopped
    volumes:
    - dify-agent-local-sandbox-home:/home/dify
    - dify-agent-local-sandbox-workspace:/workspace
  nginx:
    configs:
    - source: nginx-inline-4
      target: /etc/nginx/conf.d/default.conf
    depends_on:
    - api
    - web
    environment:
    - SERVICE_URL_DIFY_80=${SERVICE_URL_DIFY_80}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1/
      timeout: 10s
    image: nginx:latest
    networks:
      appnet:
        aliases:
        - dify-coolify_nginx_1
    restart: unless-stopped
    volumes: []
  plugin_daemon:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_DATABASE: dify_plugin
      DB_HOST: db
      DB_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      DB_PORT: 5432
      DB_SSL_MODE: disable
      DB_TYPE: postgresql
      DB_USERNAME: $SERVICE_USER_POSTGRES
      DIFY_INNER_API_KEY: $SERVICE_PASSWORD_64_PLUGININNER
      DIFY_INNER_API_URL: http://api:5001
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-true}
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_MEDIA_CACHE_PATH: assets
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PPROF_ENABLED: false
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      REDIS_HOST: redis
      REDIS_PASSWORD: $SERVICE_PASSWORD_REDIS
      REDIS_PORT: 6379
      SERVER_KEY: $SERVICE_PASSWORD_64_PLUGINDAEMON
      SERVER_PORT: 5002
    image: langgenius/dify-plugin-daemon:0.6.14-local
    networks:
      appnet:
        aliases:
        - dify-coolify_plugin_daemon_1
    restart: unless-stopped
    volumes:
    - dify-plugin-daemon:/app/storage
  redis:
    command: redis-server --requirepass "$SERVICE_PASSWORD_REDIS"
    environment:
      REDISCLI_AUTH: $SERVICE_PASSWORD_REDIS
      REDIS_PASSWORD: $SERVICE_PASSWORD_REDIS
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      timeout: 5s
    image: redis:6-alpine
    networks:
      appnet:
        aliases:
        - dify-coolify_redis_1
    restart: unless-stopped
    volumes:
    - dify-redis-data:/data
  sandbox:
    configs:
    - source: sandbox-inline-5
      target: /conf/config.yaml
    environment:
      API_KEY: $SERVICE_PASSWORD_SANDBOX
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      GIN_MODE: ${SANDBOX_GIN_MODE:-release}
      HTTPS_PROXY: http://ssrf_proxy:3128
      HTTP_PROXY: http://ssrf_proxy:3128
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
      SANDBOX_PORT: 8194
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8194/health
      timeout: 5s
    image: langgenius/dify-sandbox:0.2.15
    networks:
      appnet:
        aliases:
        - dify-coolify_sandbox_1
    restart: unless-stopped
    volumes:
    - dify-sandbox-dependencies:/dependencies
  ssrf_proxy:
    configs:
    - source: ssrf-proxy-inline-6
      target: /etc/squid/squid.conf
    - source: ssrf-proxy-inline-7
      target: /etc/squid/dify_common.conf
    entrypoint:
    - /bin/sh
    - -c
    - /usr/sbin/squid -Nz -f /etc/squid/squid.conf && exec /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
    image: ubuntu/squid:latest
    networks:
      appnet:
        aliases:
        - dify-coolify_ssrf_proxy_1
    restart: unless-stopped
    volumes: []
  weaviate:
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: false
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: $SERVICE_PASSWORD_WEAVIATE
      AUTHENTICATION_APIKEY_ENABLED: true
