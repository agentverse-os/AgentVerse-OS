# tubearchivist-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  elasticsearch:
    environment:
    - ELASTIC_PASSWORD=verysecret
    - ES_JAVA_OPTS=-Xms1g -Xmx1g
    - xpack.security.enabled=true
    - discovery.type=single-node
    - path.repo=/usr/share/elasticsearch/data/snapshot
    image: elasticsearch:8.19.6@sha256:e2d7e20893ad820bcad241bf47b89958787f6b38225478dfe100b66937840b0f
    networks:
      appnet:
        aliases:
        - tubearchivist_elasticsearch_1
    restart: on-failure
    ulimits:
      memlock:
        hard: -1
        soft: -1
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/elasticsearch:/usr/share/elasticsearch/data
  redis:
    depends_on:
    - elasticsearch
    image: redis:8.2.2-bookworm@sha256:4521b581dbddea6e7d81f8fe95ede93f5648aaa66a9dacd581611bf6fe7527bd
    networks:
      appnet:
        aliases:
        - tubearchivist_redis_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
  server:
    depends_on:
    - elasticsearch
    - redis
    environment:
    - ES_URL=http://tubearchivist_elasticsearch_1:9200
    - REDIS_CON=redis://tubearchivist_redis_1:6379
    - HOST_UID=1000
    - HOST_GID=1000
    - TA_HOST=http://${DEVICE_DOMAIN_NAME}:8079
    - TA_USERNAME=admin
    - TA_PASSWORD=${APP_PASSWORD}
    - ELASTIC_PASSWORD=verysecret
    - TZ=UTC
    image: bbilly1/tubearchivist:v0.5.12@sha256:ba1c846ddd0c6fdd0f040727129d2466e03b7a0c26499223839d450c7586ac09
    networks:
      appnet:
        aliases:
        - tubearchivist_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/media:/youtube
    - ${APP_DATA_DIR}/data/cache:/cache
