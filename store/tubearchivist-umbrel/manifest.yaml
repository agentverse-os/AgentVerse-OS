# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/tubearchivist-umbrel
description: Self hosted YouTube media server
endpoint:
  port: 8000
  service: server
env:
  APP_PASSWORD:
    generate: password
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/tubearchivist/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/tubearchivist/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/tubearchivist/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/tubearchivist/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: admin
name: tubearchivist-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Tube Archivist
type: app
upstream:
  author: tubearchivist
  categories:
  - media
  release_notes: |-
    This update improves playlist artwork, manual imports, and subtitle handling.

    Update normally through Umbrel. Tube Archivist now runs as a non-root user, and Umbrel adjusts file permissions automatically during the first startup after updating. This may take longer for large libraries.

    Saved direct links to videos, subtitles, and artwork have changed. Refresh these links in any external integrations using the current URLs returned by Tube Archivist's API.

    Turning off Tube Archivist's built-in database snapshots now deletes existing snapshots.

    Full release notes can be found at https://github.com/tubearchivist/tubearchivist/releases/tag/v0.6.0
  source: https://github.com/tubearchivist/tubearchivist
  version: 0.6.0
  website: https://www.tubearchivist.com/
website: https://www.tubearchivist.com/
