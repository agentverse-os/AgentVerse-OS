# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/emby-umbrel
description: A personal media server
endpoint:
  port: 8096
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/emby/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/emby/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/emby/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/emby/4.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/emby/5.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/emby/6.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/emby/7.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/emby/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: emby-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Emby
type: app
upstream:
  author: Emby LLC
  categories:
  - media
  release_notes: |-
    Fixes a port conflict that could prevent Emby from running alongside Blockstream Blind Oracle.

    Opening Emby from Umbrel will use the new address automatically. If you use a saved bookmark or configured Emby clients with your Umbrel's old Emby address, update them to use port 8103.
  source: https://github.com/MediaBrowser/Emby
  version: 4.9.5.0-1
  website: https://emby.media/
website: https://emby.media/
