type: app
upstream:
  author: Emby LLC
  categories:
  - media
  release_notes: |-
    This update improves search performance and fixes playback from the albums tab, subtitle preferences not being remembered, and temporary subtitles when skipping back.

    It also adds an option to disable folder outlines in folder view, fixes Spotlight on older devices, and improves the live TV tuner detection dialog.

    Full release notes can be found at https://github.com/MediaBrowser/Emby.Releases/releases/tag/4.10.2.0
  source: https://github.com/MediaBrowser/Emby
  version: 4.10.2.0
  website: https://emby.media/
