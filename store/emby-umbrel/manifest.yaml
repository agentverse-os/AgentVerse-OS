- https://getumbrel.github.io/umbrel-apps-gallery/emby/6.webp
- https://getumbrel.github.io/umbrel-apps-gallery/emby/7.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/emby/icon.svg
login:
