# emby-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      GID: 1000
      TZ: Europe/Berlin
      UID: 1000
    image: linuxserver/emby:version-4.10.2.0@sha256:af9197e44a9f8acdeb3ce06d8d77f406a866bd99253eaaaca7c7cfbe1b47970a
    networks:
      appnet:
        aliases:
        - emby_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config:rw
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
