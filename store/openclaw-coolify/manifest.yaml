# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/openclaw-coolify
description: AI-powered coding assistant with multi-provider support and browser automation.
endpoint:
  port: 8080
  service: openclaw
env:
  AI_GATEWAY_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  AWS_ACCESS_KEY_ID: ''
  AWS_REGION: us-east-1
  AWS_SECRET_ACCESS_KEY: ''
  AWS_SESSION_TOKEN: ''
  BEDROCK_PROVIDER_FILTER: anthropic
  BROWSER_DEFAULT_PROFILE: openclaw
  BROWSER_EVALUATE_ENABLED: 'true'
  BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS: '3000'
  BROWSER_REMOTE_TIMEOUT_MS: '1500'
  BROWSER_SNAPSHOT_MODE: efficient
  CEREBRAS_API_KEY: ''
  COPILOT_GITHUB_TOKEN: ''
  DEEPGRAM_API_KEY: ''
  GEMINI_API_KEY: ''
  GROQ_API_KEY: ''
  HOOKS_ENABLED: 'false'
  HOOKS_PATH: /hooks
  KIMI_API_KEY: ''
  KIMI_BASE_URL: https://api.moonshot.ai/anthropic
  MINIMAX_API_KEY: ''
  MISTRAL_API_KEY: ''
  MOONSHOT_API_KEY: ''
  MOONSHOT_BASE_URL: https://api.moonshot.ai/v1
  OLLAMA_BASE_URL: ''
  OPENAI_API_KEY: ''
  OPENCLAW_GATEWAY_BIND: loopback
  OPENCLAW_PRIMARY_MODEL: ''
  OPENCODE_API_KEY: ''
  OPENROUTER_API_KEY: ''
  SERVICE_FQDN_OPENCLAW_8080: ${APP_DOMAIN}
  SERVICE_PASSWORD_64_GATEWAYTOKEN:
    generate: hex64
  SERVICE_PASSWORD_OPENCLAW:
    generate: password
  SERVICE_USER_OPENCLAW:
    generate: password
  SYNTHETIC_API_KEY: ''
  VENICE_API_KEY: ''
  XAI_API_KEY: ''
  XIAOMI_API_KEY: ''
  ZAI_API_KEY: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_OPENCLAW
  path: null
  user: SERVICE_USER_OPENCLAW
name: openclaw-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
