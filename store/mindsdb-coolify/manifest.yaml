# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/mindsdb-coolify
description: MindsDB is the platform for building AI from enterprise data, enabling smarter organizations.
endpoint:
  port: 47334
  service: mindsdb
env:
  FLASK_DEBUG: '1'
  LANGFUSE_DEBUG: 'False'
  LANGFUSE_HOST: ''
  LANGFUSE_PUBLIC_KEY: ''
  LANGFUSE_RELEASE: local
  LANGFUSE_SAMPLE_RATE: '1.0'
  LANGFUSE_SECRET_KEY: ''
  LANGFUSE_TIMEOUT: '10'
  OPENAI_API_KEY: ''
  POSTGRES_DB: mindsdb-db
  POSTGRES_USER: ''
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_API_47335: https://${APP_DOMAIN}
  SERVICE_URL_MINDSDB_47334: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
