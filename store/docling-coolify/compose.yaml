# docling-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  docling-serve:
    environment:
    - SERVICE_URL_DOCLING_5001=${SERVICE_URL_DOCLING_5001}
    - DOCLING_SERVE_ENABLE_UI=${DOCLING_SERVE_ENABLE_UI:-true}
    - DOCLING_SERVE_LOG_LEVEL=${DOCLING_SERVE_LOG_LEVEL:-WARNING}
    - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-4}
    healthcheck:
      interval: 30s
      retries: 10
      start_period: 120s
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:5001/health
      timeout: 30s
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2
    networks:
      appnet:
        aliases:
        - docling-coolify_docling-serve_1
    restart: unless-stopped
