compose: ./compose.yaml
data:
- tank/apps/immich-umbrel
description: High-performance photo and video backup solution
endpoint:
  port: 2283
  service: server
env:
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/immich/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/immich/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/immich/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/immich/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: immich-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Immich
type: app
upstream:
  author: Alex Tran
  categories:
  - files
  release_notes: |-
    This update keeps the new umbrelOS storage-management options introduced in recent packages, including optional read-only access to an existing photo or video library.

    ⚠️ If you're updating from a pre-v3 version, Immich v3 includes breaking API changes mostly affecting third-party tools. Check that your mobile app and any Immich integrations are compatible with this release; the Immich mobile app no longer supports iOS 14.

    This patch fixes several photo-management and video-playback issues:

    - Fixes camera filters when a photo has an unknown camera make
    - Improves filename alignment in the photo information panel
    - Hides slideshow play/pause controls when autoplay is disabled
    - Fixes integrity report downloads and VAAPI video transcoding

    Full release notes can be found at https://github.com/immich-app/immich/releases/tag/v3.4.2
  source: https://github.com/immich-app/immich
  version: v3.4.2
  website: https://www.immich.app
website: https://www.immich.app
