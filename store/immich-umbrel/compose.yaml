# immich-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  machine-learning:
    environment:
      <<:
        DB_DATABASE_NAME: immich
        DB_HOSTNAME: immich_postgres_1
        DB_PASSWORD: moneyprintergobrrr
        DB_USERNAME: immich
        DISABLE_REVERSE_GEOCODING: 'false'
        IMMICH_MACHINE_LEARNING_URL: http://immich_machine-learning_1:3003
        JWT_SECRET: ${APP_SEED}
        LOG_LEVEL: log
        NODE_ENV: production
        PUBLIC_LOGIN_PAGE_MESSAGE: ''
        REDIS_HOSTNAME: immich_redis_1
        REVERSE_GEOCODING_PRECISION: '3'
      MACHINE_LEARNING_MODEL_REVISION: v2
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    networks:
      appnet:
        aliases:
        - immich_machine-learning_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/model-cache:/cache
  postgres:
    environment:
      <<:
        DB_DATABASE_NAME: immich
        DB_HOSTNAME: immich_postgres_1
        DB_PASSWORD: moneyprintergobrrr
        DB_USERNAME: immich
        DISABLE_REVERSE_GEOCODING: 'false'
        IMMICH_MACHINE_LEARNING_URL: http://immich_machine-learning_1:3003
        JWT_SECRET: ${APP_SEED}
        LOG_LEVEL: log
        NODE_ENV: production
        PUBLIC_LOGIN_PAGE_MESSAGE: ''
        REDIS_HOSTNAME: immich_redis_1
        REVERSE_GEOCODING_PRECISION: '3'
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD: moneyprintergobrrr
      POSTGRES_USER: immich
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:41eacbe83eca995561fe43814fd4891e16e39632806253848efaf04d3c8a8b84
    networks:
      appnet:
        aliases:
        - immich_postgres_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
  redis:
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    networks:
      appnet:
        aliases:
        - immich_redis_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
  server:
    depends_on:
    - redis
    - postgres
    environment:
      <<:
        DB_DATABASE_NAME: immich
        DB_HOSTNAME: immich_postgres_1
        DB_PASSWORD: moneyprintergobrrr
        DB_USERNAME: immich
        DISABLE_REVERSE_GEOCODING: 'false'
        IMMICH_MACHINE_LEARNING_URL: http://immich_machine-learning_1:3003
        JWT_SECRET: ${APP_SEED}
        LOG_LEVEL: log
        NODE_ENV: production
        PUBLIC_LOGIN_PAGE_MESSAGE: ''
        REDIS_HOSTNAME: immich_redis_1
        REVERSE_GEOCODING_PRECISION: '3'
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    networks:
      appnet:
        aliases:
        - immich_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/upload:/data
x-environment:
  DB_DATABASE_NAME: immich
  DB_HOSTNAME: immich_postgres_1
  DB_PASSWORD: moneyprintergobrrr
  DB_USERNAME: immich
