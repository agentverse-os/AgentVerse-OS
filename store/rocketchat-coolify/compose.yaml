# rocketchat-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mongodb:
    command: |
      sh -c "
        mongod --replSet ${MONGODB_REPLICA_SET_NAME:-rs0} --bind_ip_all &
        sleep 5 &&
        mongosh --eval 'rs.initiate({_id:\"${MONGODB_REPLICA_SET_NAME:-rs0}\", members:[{_id:0, host:\"mongodb:27017\"}]})' ||
        true &&
        wait
      "
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping')
      timeout: 10s
    image: mongo:7
    networks:
      appnet:
        aliases:
        - rocketchat-coolify_mongodb_1
    restart: unless-stopped
    volumes:
    - mongodb_data:/data/db
  rocketchat:
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
    - SERVICE_URL_ROCKETCHAT_3000=${SERVICE_URL_ROCKETCHAT_3000}
    - MONGO_URL=mongodb://${MONGODB_ADVERTISED_HOSTNAME:-mongodb}:${MONGODB_INITIAL_PRIMARY_PORT_NUMBER:-27017}/${MONGODB_DATABASE:-rocketchat}?replicaSet=${MONGODB_REPLICA_SET_NAME:-rs0}
    - MONGO_OPLOG_URL=mongodb://${MONGODB_ADVERTISED_HOSTNAME:-mongodb}:${MONGODB_INITIAL_PRIMARY_PORT_NUMBER:-27017}/local?replicaSet=${MONGODB_REPLICA_SET_NAME:-rs0}
    - ROOT_URL=$SERVICE_URL_ROCKETCHAT
    - DEPLOY_METHOD=docker
    - REG_TOKEN=$REG_TOKEN
    - MAIL_URL=${MAIL_URL:-test@example.com}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - node
      - --eval
      - 'const http = require(''http''); const options = { host: ''0.0.0.0'', port: 3000, timeout: 2000, path: ''/health'' }; const healthCheck = http.request(options, (res) => { console.log(''HEALTHCHECK STATUS:'', res.statusCode); if (res.statusCode == 200) { process.exit(0); } else { process.exit(1); } }); healthCheck.on(''error'', function (err) { console.error(''ERROR''); process.exit(1); }); healthCheck.end();'
      timeout: 10s
    image: registry.rocket.chat/rocketchat/rocket.chat:8.0.1
    networks:
      appnet:
        aliases:
        - rocketchat-coolify_rocketchat_1
    restart: unless-stopped
volumes:
  mongodb_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mongodb_data
      o: bind
      type: none
