# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/romm-umbrel
description: A beautiful, powerful, self-hosted rom manager
endpoint:
  port: 8080
  service: server
env:
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/romm/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/romm/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/romm/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/romm/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: romm-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: RomM
type: app
upstream:
  author: rommapp
  categories:
  - media
  release_notes: |-
    This update lets you add metadata provider credentials, such as IGDB, ScreenScraper, SteamGridDB and RetroAchievements, in RomM's app settings on umbrelOS 2.0, so RomM can fetch game metadata, artwork and achievements.

    Previous RomM 5.4.1 release notes:

    RomM 5.4 includes database migrations that may take 15-20 minutes on large libraries. Do not restart RomM while the first start after upgrading is still migrating.

    This security update distrusts compromised eMudhra certificate intermediates and updates dependencies with security fixes. Upstream recommends upgrading promptly.

    If you're updating from a pre-4.9 version and manually enabled gamelist exports in config.yml, follow RomM's official config docs to update that setting: https://docs.romm.app/4.9.0/reference/configuration-file/#scangamelistexport

    Full release notes can be found at https://github.com/rommapp/romm/releases/tag/5.4.1
  source: https://github.com/rommapp/romm
  version: 5.4.1-patch.1
  website: https://github.com/rommapp/romm
website: https://github.com/rommapp/romm
