# downtify-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  downtify:
    image: ghcr.io/henriquesebastiao/downtify:3.11.0@sha256:65db7768cbf8e67c2f73429420e799771dfdb60469be332f19440a7427e77933
    networks:
      appnet:
        aliases:
        - downtify_downtify_1
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
    - ${UMBREL_ROOT}/data/storage/downloads/downtify:/downloads
    - ${APP_DATA_DIR}/data:/data
