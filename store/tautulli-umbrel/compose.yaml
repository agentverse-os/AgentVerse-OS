# tautulli-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - PUID=1000
    - PGID=1000
    - TAUTULLI_HTTP_PROXY=1
    image: linuxserver/tautulli:2.19.1@sha256:5e8f80cc18f03c606a3567c8a9b37d80812ed8017d2e2f8ff2e2a91b54a3aef1
    networks:
      appnet:
        aliases:
        - tautulli_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
