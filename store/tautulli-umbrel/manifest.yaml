  open: iframe
schema: 1
settings: []
tags: []
title: tautulli
type: app
upstream:
  author: Tautulli
  categories:
  - media
  release_notes: |-
    This update fixes activity and history issues, including empty session rows and detailed history expansion when Current Activity in History Tables is enabled.

    It also fixes notification settings bugs, including email passwords being overwritten on save, repeated new-device notifications for local users, and sentinel values appearing in notification text.

    API and security fixes include preventing guest users from retrieving another user's history through the API, restoring the get_plex_logs response shape, and adding X-Frame-Options support to the config.
  source: https://github.com/Tautulli/Tautulli
  version: 2.18.1
  website: https://tautulli.com/
