upstream:
  author: dotCooCoo
  categories:
  - files
  release_notes: |-
    This update checks every name an uploaded archive entry can be extracted under, stops the server from decompressing a connecting client's certificate before it has been verified, and keeps connections to S3 storage open between requests. Full vault key rotation now works when the data directory is a Docker volume, and the key-check tool no longer reports a healthy database as corrupted.

    Uploads are now refused if an archive holds a Windows device name such as aux.c or CON, a name that ends in a dot or a space, or two spellings of the same path.

    If you moved files from local storage to S3 on 1.15.9, check the bucket for objects of 0 bytes and restore those files from a backup.

    If you are updating from 1.15.9 or earlier, the first start rebuilds the database once, which needs free space of about the database's size.

    Full release notes can be found at https://github.com/dotCooCoo/hermitstash/releases/tag/v1.15.13
