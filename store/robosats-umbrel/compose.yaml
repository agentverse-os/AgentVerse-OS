# robosats-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    command:
    - sh
    - -ec
    - |
      sed -i 's/listen 12596 ssl;/listen 12596;/' /etc/nginx/nginx.conf
      exec sh robosats-client.sh
    environment:
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
    image: recksato/robosats-client:v0.8.8-alpha@sha256:22efbf7d7e88b83878d9f57f7335d81c24e657b4add183af812db462ec012f15
    init: true
    networks:
      appnet:
        aliases:
        - robosats_web_1
    restart: on-failure
    stop_grace_period: 1m
