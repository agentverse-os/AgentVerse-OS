schema: 1
settings: []
tags: []
title: RoboSats
type: app
upstream:
  author: RoboSats
  categories:
  - bitcoin
  release_notes: |-
    ⚠️ Before updating, back up the tokens for any robots you want to keep, especially robots with active trades. Open RoboSats and click the download button beside “Robot Garage”. Repeat this in each browser or device where those robots are saved, and keep the downloaded file private.

    This update requires umbrelOS 2.0 or later and opens RoboSats over HTTPS.

    If you previously used RoboSats over HTTP, your saved robots will not appear automatically at the HTTPS address. To keep using an existing robot, use Recovery with its saved token from your garage download. If you do not need your existing robots, simply create a new one; recovery is optional.

    After updating, hard-refresh RoboSats once (Ctrl/Cmd + Shift + R) to load the new client.

    Highlights:
    - New garage key introduced as a replacement of the robot key. Switching to Garage Key mode removes saved robots, so save your robot tokens first.
    - Nostr encrypted chat is now enabled
    - Reward withdrawal UI now shows when withdrawals can be made again
    - Multiple libraries security updates
    Full release notes are available at https://github.com/RoboSats/robosats/releases/tag/v0.8.8-alpha
  source: https://github.com/RoboSats/robosats
  version: v0.8.8-alpha
  website: https://learn.robosats.org
website: https://learn.robosats.org
