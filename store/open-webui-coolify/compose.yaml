# open-webui-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  open-webui:
    environment:
    - SERVICE_URL_OPENWEBUI_8080=${SERVICE_URL_OPENWEBUI_8080}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080
      timeout: 30s
    image: ghcr.io/open-webui/open-webui:main
    networks:
      appnet:
        aliases:
        - open-webui-coolify_open-webui_1
    restart: unless-stopped
    volumes:
    - open-webui:/app/backend/data
volumes:
  open-webui:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/open-webui
      o: bind
      type: none
