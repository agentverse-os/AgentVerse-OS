# wikijs-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: linuxserver/wikijs:2.5.315@sha256:1cbb7cd39f62b12025b6cb5fea4f95629833162c72bf0604c568090f343c8665
    networks:
      appnet:
        aliases:
        - wikijs_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/repo:/app/wiki/data/repo
    - ${APP_DATA_DIR}/config:/config
