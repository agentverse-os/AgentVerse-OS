# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/opnform-coolify
description: OpnForm is an open-source form builder that lets you create beautiful forms and share them anywhere. It's super fast, you don't need to know how to code
endpoint:
  port: 80
  service: nginx
env:
  AWS_ACCESS_KEY_ID: ''
  AWS_BUCKET: ''
  AWS_DEFAULT_REGION: us-east-1
  AWS_SECRET_ACCESS_KEY: ''
  FILESYSTEM_DRIVER: local
  H_CAPTCHA_SECRET_KEY: ''
  H_CAPTCHA_SITE_KEY: ''
  JWT_SKIP_IP_UA_VALIDATION: 'false'
  JWT_TTL: '1440'
  LOG_LEVEL: debug
  MAIL_ENCRYPTION: ''
  MAIL_FROM_ADDRESS: your@email.com
  MAIL_FROM_NAME: OpnForm
  MAIL_HOST: ''
  MAIL_MAILER: log
  MAIL_PASSWORD: ''
  MAIL_PORT: ''
  MAIL_USERNAME: your@email.com
  NUXT_PUBLIC_LICENSE_API_ENDPOINT: https://api.opnform.com
  OPEN_AI_API_KEY: ''
  POSTGRESQL_DATABASE: opnform
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  PUBLIC_UPLOADS_RATE_LIMIT_PER_HOUR: '300'
  PUBLIC_UPLOADS_RATE_LIMIT_PER_MINUTE: '30'
  RE_CAPTCHA_SECRET_KEY: ''
  RE_CAPTCHA_SITE_KEY: ''
  SERVICE_BASE64_APIKEY:
    generate: hex64
  SERVICE_PASSWORD_64_REDIS:
    generate: hex64
  SERVICE_PASSWORD_FRONTAPISECRET:
    generate: password
  SERVICE_PASSWORD_JWTSECRET:
    generate: password
  SERVICE_PASSWORD_POSTGRESQL:
    generate: password
  SERVICE_URL_NGINX: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRESQL:
    generate: password
  SHOW_OFFICIAL_TEMPLATES: 'true'
  TELEGRAM_BOT_ID: ''
  TELEGRAM_BOT_TOKEN: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: null
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: opnform-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
