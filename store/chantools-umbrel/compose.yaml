# chantools-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chantools:
    command:
    - ttyd
    - -W
    - -p
    - '7682'
    - bash
    - -c
    - /bash-wrapper.sh
    image: guggero/chantools:v0.14.1-umbrel@sha256:8994745086ab1708205f030f70e37dcfbe57154c72f27782089b229069fd8043
    networks:
      appnet:
        aliases:
        - chantools_chantools_1
    restart: on-failure
    stop_grace_period: 1s
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/chantools
    - ${UMBREL_ROOT}/app-data/lightning/data/lnd:/lnd:ro
