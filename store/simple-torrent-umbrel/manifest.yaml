# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/simple-torrent-umbrel
description: Download torrents with your Umbrel
endpoint:
  port: 8086
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/simple-torrent/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/simple-torrent/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/simple-torrent/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/simple-torrent/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: simple-torrent-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: SimpleTorrent
type: app
upstream:
  author: Preston
  categories:
  - networking
  release_notes: '- SimpleTorrent now utilizes the shared downloads folder that can be accessed by other apps on Umbrel, such as Jellyfin, File Browser, Transmission, Plex, and more.'
  source: https://github.com/boypt/simple-torrent
  version: 1.3.9-hotfix-1
  website: https://github.com/boypt
website: https://github.com/boypt
