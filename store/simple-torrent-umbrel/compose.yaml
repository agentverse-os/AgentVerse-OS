# simple-torrent-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    command: |
      --port=8086 --config-path /config/simple-torrent.json
    image: boypt/cloud-torrent:1.3.9@sha256:90cc62869ebaabbdba31535cdff4c66ede98b341956d2ebcd6650610a37e9819
    networks:
      appnet:
        aliases:
        - simple-torrent_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/torrents:/torrents
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    - ${APP_DATA_DIR}/data/config:/config
