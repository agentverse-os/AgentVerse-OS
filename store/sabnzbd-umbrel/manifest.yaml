title: SABnzbd
type: app
upstream:
  author: sabnzbd
  categories:
  - networking
  release_notes: |-
    This update fixes two security vulnerabilities: an API dispatch bypass that could allow unauthenticated API access, and a PAR2 symlink bypass that could allow remote code execution when processing untrusted NZBs. Update promptly if untrusted parties can reach your SABnzbd web interface or if SABnzbd processes NZBs from sources you do not fully trust.

    It also includes the security fixes from SABnzbd 5.1.1 and 5.1.2 for anyone updating from an older version. If your SABnzbd setup was exposed and you relied on SABnzbd's username and password for network or internet access, rotate sensitive credentials after updating, including the SABnzbd username/password, API key, Usenet server passwords, RSS indexer API keys, and notification credentials.

    Other fixes include tighter Compact display mode, clearer Usenet server errors, avoiding a database-is-locked error when re-evaluating stored RSS jobs, and a new tooltip explaining search filters in Queue and History.

    Full release notes are available at https://github.com/sabnzbd/sabnzbd/releases/tag/5.1.3
  source: https://github.com/sabnzbd/sabnzbd
  version: 5.1.3
  website: https://sabnzbd.org/
website: https://sabnzbd.org/
