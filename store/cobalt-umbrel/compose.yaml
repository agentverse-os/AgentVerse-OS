# cobalt-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      API_AUTH_REQUIRED: 0
      API_URL: http://${DEVICE_DOMAIN_NAME}:9013/
      DURATION_LIMIT: 86400
    image: dennysubke/cobalt:11.5@sha256:e3b1626d6026f1f714643ad9b0b14257b0ce9ab4cedb3a5e041eb540f2e12798
    networks:
      appnet:
        aliases:
        - cobalt_web_1
    read_only: true
    restart: on-failure
    user: 1000:1000
