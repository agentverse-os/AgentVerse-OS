# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/signoz-coolify
description: An observability platform native to OpenTelemetry with logs, traces and metrics.
endpoint:
  port: 8080
  service: clickhouse
env:
  SERVICE_REALBASE64_JWTSECRET:
    generate: hex64
  SERVICE_URL_OTELCOLLECTORHTTP_4318: https://${APP_DOMAIN}
  SERVICE_URL_SIGNOZ_8080: https://${APP_DOMAIN}
  SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__AUTH__PASSWORD: ''
  SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__AUTH__USERNAME: ''
  SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__FROM: ''
  SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__SMARTHOST: ''
  SIGNOZ_EMAILING_ENABLED: 'false'
  SIGNOZ_EMAILING_SMTP_ADDRESS: ''
  SIGNOZ_EMAILING_SMTP_AUTH_PASSWORD: ''
  SIGNOZ_EMAILING_SMTP_AUTH_USERNAME: ''
  SIGNOZ_EMAILING_SMTP_FROM: ''
  SIGNOZ_STATSREPORTER_ENABLED: 'true'
  ZOO_ALLOW_ANONYMOUS_LOGIN: yes
  ZOO_AUTOPURGE_INTERVAL: '1'
  ZOO_ENABLE_PROMETHEUS_METRICS: yes
  ZOO_PROMETHEUS_METRICS_PORT_NUMBER: '9141'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: ZOO_ALLOW_ANONYMOUS_LOGIN
name: signoz-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
