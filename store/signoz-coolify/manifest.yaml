- env: ZOO_ALLOW_ANONYMOUS_LOGIN
  hint: 'по умолчанию: yes'
  label: zoo allow anonymous login
  options: null
  required: false
  type: text
- env: ZOO_AUTOPURGE_INTERVAL
  hint: 'по умолчанию: 1'
  label: zoo autopurge interval
  options: null
  required: false
  type: text
- env: ZOO_ENABLE_PROMETHEUS_METRICS
