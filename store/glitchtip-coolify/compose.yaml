# glitchtip-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
    - POSTGRES_DB=${POSTGRESQL_DATABASE:-glitchtip}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - glitchtip-postgres-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 20s
    image: redis:8.10.3
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_redis_1
    restart: unless-stopped
  web:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_GLITCHTIP_8000=${SERVICE_URL_GLITCHTIP_8000}
    - DATABASE_URL=postgres://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - GLITCHTIP_DOMAIN=${SERVICE_URL_GLITCHTIP}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 30s
      test:
      - CMD-SHELL
      - python3 /code/healthcheck.py || exit 1
      timeout: 5s
    image: glitchtip/glitchtip:7.0
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_web_1
    restart: unless-stopped
    volumes:
    - uploads:/code/uploads
volumes:
  glitchtip-postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/glitchtip-postgres-data
      o: bind
      type: none
  uploads:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/uploads
      o: bind
      type: none
