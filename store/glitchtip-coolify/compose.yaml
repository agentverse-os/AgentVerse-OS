# glitchtip-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  migrate:
    command: ./manage.py migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - DATABASE_URL=postgres://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
    - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    image: glitchtip/glitchtip:6.0
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_migrate_1
    restart: no
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
    - POSTGRES_DB=${POSTGRESQL_DATABASE:-glitchtip}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - glitchtip-postgres-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 20s
    image: redis
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_redis_1
    restart: unless-stopped
  web:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_GLITCHTIP_8000=${SERVICE_URL_GLITCHTIP_8000}
    - DATABASE_URL=postgres://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - GLITCHTIP_DOMAIN=${SERVICE_URL_GLITCHTIP}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
    - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - echo
      - ok
      timeout: 20s
    image: glitchtip/glitchtip:6.0
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_web_1
    restart: unless-stopped
    volumes:
    - uploads:/code/uploads
  worker:
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - DATABASE_URL=postgres://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - GLITCHTIP_DOMAIN=${SERVICE_URL_GLITCHTIP}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
    - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - echo
      - ok
      timeout: 20s
    image: glitchtip/glitchtip:6.0
    networks:
      appnet:
        aliases:
        - glitchtip-coolify_worker_1
    restart: unless-stopped
    volumes:
    - uploads:/code/uploads
volumes:
  glitchtip-postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/glitchtip-postgres-data
      o: bind
      type: none
  uploads:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/uploads
      o: bind
      type: none
