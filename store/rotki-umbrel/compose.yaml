# rotki-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: rotki/rotki:v1.44.3@sha256:4f07e8114b4450665b64a964ffa106dfb3c36a50e3664c93b8aafe1c1e1a0735
    init: true
    networks:
      appnet:
        aliases:
        - rotki_web_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    - ${APP_DATA_DIR}/data/logs:/logs
