  release_notes: |-
    ⚠️ If you use premium sync, update every device to rotki 1.44.2 or later. Older versions cannot restore backups created by this release. Existing old-format backups can still be restored.

    This release fixes balance snapshots and strengthens local API security:
      - Restored fiat exchange rates and balance snapshots, with European Central Bank rates as a fallback
      - Added Solana v1 transactions to history and automatic recovery of previously missed transactions
      - Blocked other websites from changing data in unlocked accounts
      - Improved Morpho Blue balances, Lido rewards, and transaction decoding
      - Fixed interrupted premium restores, partial accounting-rule imports, and overlapping profit and loss reports


    Full release notes are found at https://github.com/rotki/rotki/releases/tag/v1.44.3
