  release_notes: |-
    This major release adds new portfolio analysis workflows, expanded exchange/protocol support, and a Docker runtime overhaul.

    Key highlights include:
      - Added a local MCP server for premium users to analyze rotki data with compatible AI assistants
      - Redesigned filters, saved views, and history-event actions across the app
      - Added cross-chain bridge matching, a rebuilt balance snapshot editor, and support for Gate, CoinEx, and Bit2Me
      - Added new decoders and support for Project X, Frankencoin Savings, Kinetiq, Yearn vesting escrows, Solana staking, Jupiter Lend Earn, Across, LI.FI, and more
      - History events may need to be redecoded after upgrade; edited events are left untouched
      - The Docker image now uses a distroless runtime, stops more cleanly, and keeps existing ports, volumes, and environment variables working


    Full release notes are found at https://github.com/rotki/rotki/releases/tag/v1.44.0
