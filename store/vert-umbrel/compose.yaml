# vert-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      PUB_ENV: production
      PUB_HOSTNAME: http://${DEVICE_DOMAIN_NAME}:3884
      PUB_VERTD_URL: http://${DEVICE_DOMAIN_NAME}:3884
    image: ghcr.io/vert-sh/vert:sha-35ebeb1@sha256:df3a22efeccf0e37adc3b4d01ecc1bd4ad2bc00ec44dc4672f74b23ba8f3ede9
    networks:
      appnet:
        aliases:
        - vert_web_1
    restart: on-failure
