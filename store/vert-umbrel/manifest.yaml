# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/vert-umbrel
description: A file conversion utility
endpoint:
  port: 80
  service: web
env:
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/vert/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/vert/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/vert/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/vert/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: vert-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: VERT
type: app
upstream:
  author: VERT
  categories:
  - files
  release_notes: |-
    This update adds controls to stop queued conversions and clear completed or failed files. You can also download completed files even when other files have not converted successfully.

    It also fixes translations reverting to English on page reloads, improves Turkish translations, and fixes MIDI converter initialization.

    Full changes: https://github.com/VERT-sh/VERT/compare/257bcb3...35ebeb1
  source: https://github.com/VERT-sh/VERT
  version: 35ebeb1
  website: https://vert.sh/
website: https://vert.sh/
