# freshrss: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  freshrss:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: lscr.io/linuxserver/freshrss:1.29.1
    networks:
      appnet:
        aliases:
        - freshrss_freshrss_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/freshrss:/config
