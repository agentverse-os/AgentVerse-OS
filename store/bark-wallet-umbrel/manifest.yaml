  release_notes: |-
    This update brings Bark 0.8.1 and fixes issues with sending, receiving, and wallet creation.

    - Fixed wallet creation getting stuck when the recovery phrase repeats a word
    - Fixed a fast double click on send confirm sending the payment twice
    - Send labels and tags now always go to the destination that was paid
    - Fixed the receive dialog closing on its own when reopened right after a payment
    - Fixed the emergency exit button staying disabled after a failed exit of all VTXOs
    - Removed the "Loose privacy" Branta mode, which Branta no longer supports. Wallets that used it switch to "Strict privacy"
    - Updated the Bark wallet daemon to version 0.8.1

    Full release notes can be found at https://gitlab.com/ark-bitcoin/bark-web/-/releases/v0.11.0
