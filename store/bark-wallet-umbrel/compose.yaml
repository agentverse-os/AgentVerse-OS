# bark-wallet-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  api:
    depends_on:
    - barkd
    environment:
      ARK_SERVER: https://ark.second.tech
      BARKD_URL: http://barkd:4000
      BARK_NETWORK: mainnet
      CHAIN_SOURCE: https://mempool.second.tech/api
      PORT: 4001
      WALLET_DATA_PATH: /Apps/bark-wallet/data/wallet/.bark/
      WALLET_DIR: /wallet-data/.bark
    image: secondark/bark-web-api:0.11.0@sha256:6204c778e5de59e062e72ebe00ec5c93a81b638390227982af188aabad511543
    networks:
      appnet:
        aliases:
        - bark-wallet_api_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/wallet:/wallet-data:ro
  barkd:
    command: |
      sh -c "mkdir -p /data/.bark && chown -R 1000:1000 /data && exec setpriv --reuid 1000 --regid 1000 --clear-groups /usr/local/bin/barkd --port 4000 --host 0.0.0.0 --datadir /data/.bark --expose-mnemonic"
    image: secondark/bark:0.8.1@sha256:461620508b3105a417bbe2369bc16ed486561e7218f41046bb6169c432fe357c
    networks:
      appnet:
        aliases:
        - bark-wallet_barkd_1
    restart: on-failure
    stop_grace_period: 1m
    user: 0:0
    volumes:
    - ${APP_DATA_DIR}/data/wallet:/data
  web:
    depends_on:
    - api
    - barkd
    image: secondark/bark-web:0.11.0@sha256:062fba4e388cfc33f603f773c2b75b2462ae0797b52085839fd4dc8118463381
    networks:
      appnet:
        aliases:
        - bark-wallet_web_1
    restart: on-failure
    stop_grace_period: 1m
