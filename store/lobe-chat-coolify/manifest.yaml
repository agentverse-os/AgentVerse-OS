# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/lobe-chat-coolify
description: LobeHub (formerly Lobe Chat) is an open-source AI chat and agent workspace for many model providers.
endpoint:
  port: 3210
  service: rustfs
env:
  OPENAI_API_KEY: ''
  OPENAI_BASE_URL: https://api.openai.com/v1
  POSTGRES_DB: lobechat
  S3_BUCKET: lobe
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_RUSTFS:
    generate: password
  SERVICE_REALBASE64_32:
    generate: hex64
  SERVICE_URL_LOBECHAT: https://${APP_DOMAIN}
  SERVICE_URL_LOBECHAT_3210: https://${APP_DOMAIN}
  SERVICE_URL_RUSTFS: https://${APP_DOMAIN}
  SERVICE_URL_RUSTFS_9000: https://${APP_DOMAIN}
  SERVICE_USER_RUSTFS:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: lobe-chat-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRES_DB
  hint: 'по умолчанию: lobechat'
  label: postgres db
  options: null
  required: false
  type: text
- env: S3_BUCKET
  hint: 'по умолчанию: lobe'
  label: s3 bucket
  options: null
  required: false
  type: text
- env: OPENAI_API_KEY
  hint: null
  label: openai api key
  options: null
