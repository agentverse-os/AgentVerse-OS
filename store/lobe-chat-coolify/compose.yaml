# lobe-chat-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  lobe-chat:
    environment:
    - SERVICE_URL_LOBECHAT_3210=${SERVICE_URL_LOBECHAT_3210}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - OPENAI_PROXY_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    - ACCESS_CODE=${SERVICE_PASSWORD_ACCESSCODE}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3210/ || exit 1
      timeout: 20s
    image: lobehub/lobe-chat:1.135.5
    networks:
      appnet:
        aliases:
        - lobe-chat-coolify_lobe-chat_1
    restart: unless-stopped
