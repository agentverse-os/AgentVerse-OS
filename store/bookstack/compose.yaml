# bookstack: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  bookstack:
    depends_on:
    - bookstack-db
    environment:
    - TZ=${TZ}
    - APP_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
    - APP_KEY=base64:${APP_KEY}
    - DB_HOST=bookstack-db
    - DB_USERNAME=tipi
    - DB_PASSWORD=${BOOKSTACK_DB_PASS}
    - DB_DATABASE=bookstackapp
    image: lscr.io/linuxserver/bookstack:26.09.20260929
    networks:
      appnet:
        aliases:
        - bookstack_bookstack_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
  bookstack-db:
    environment:
    - TZ=${TZ}
    - MYSQL_ROOT_PASSWORD=${ROOT_ACCESS_PASSWORD}
    - MYSQL_DATABASE=bookstackapp
    - MYSQL_USER=tipi
    - MYSQL_PASSWORD=${BOOKSTACK_DB_PASS}
    image: lscr.io/linuxserver/mariadb
    networks:
      appnet:
        aliases:
        - bookstack_bookstack-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/config
