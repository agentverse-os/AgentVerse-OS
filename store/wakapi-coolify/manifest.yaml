# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/wakapi-coolify
description: A minimalist, self-hosted WakaTime-compatible backend for coding statistics
endpoint:
  port: 3000
  service: wakapi
env:
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  SERVICE_BASE64_64_PASSWORDSALT:
    generate: hex64
  SERVICE_PASSWORD_DATABASE:
    generate: password
  SERVICE_URL_WAKAPI_3000: https://${APP_DOMAIN}
  SERVICE_USER_DATABASE:
    generate: password
  TIMEZONE: Europe/Berlin
  WAKAPI_ALLOW_SIGNUP: 'true'
  WAKAPI_DB_HOST: postgres
  WAKAPI_DB_NAME: wakapi
  WAKAPI_DB_PORT: '5432'
  WAKAPI_DISABLE_FRONTPAGE: 'true'
  WAKAPI_ENVIRONMENT: production
  WAKAPI_LEADERBOARD_ENABLED: 'true'
  WAKAPI_MAIL_ENABLED: 'false'
  WAKAPI_MAIL_SENDER: ''
  WAKAPI_MAIL_SMTP_HOST: ''
  WAKAPI_MAIL_SMTP_PASSWORD: ''
  WAKAPI_MAIL_SMTP_PORT: '587'
  WAKAPI_MAIL_SMTP_TLS: 'true'
  WAKAPI_MAIL_SMTP_USERNAME: ''
  WAKAPI_PUBLIC_URL: ''
  WAKAPI_SECURITY_EXPOSE_METRICS: 'false'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: wakapi-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
