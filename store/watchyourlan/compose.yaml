# watchyourlan: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  watchyourlan:
    environment:
      IFACES: ${WATCHYOURLAN_IFACES}
      TZ: ${TZ}
    image: aceberg/watchyourlan:2.1.4
    network_mode: host
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data/WatchYourLAN
