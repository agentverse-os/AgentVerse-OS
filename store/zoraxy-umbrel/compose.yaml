# zoraxy-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      DOCKER: 'false'
      FASTGEOIP: 'false'
      NOAUTH: 'true'
      ZEROTIER: 'false'
    image: zoraxydocker/zoraxy:v3.3.5@sha256:2dfc5acf4c84e3e477a8f1fcb7d05a600a8c3cd5fd1296a848372375910ae9dd
    networks:
      appnet:
        aliases:
        - zoraxy_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config/:/opt/zoraxy/config
    - /etc/localtime:/etc/localtime:ro
