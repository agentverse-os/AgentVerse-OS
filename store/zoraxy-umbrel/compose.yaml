# zoraxy-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      DOCKER: 'false'
      FASTGEOIP: 'false'
      NOAUTH: 'true'
      ZEROTIER: 'false'
    image: zoraxydocker/zoraxy:v3.3.4@sha256:c64ed57e10631d8f7482ce1ed6b337e653052a05646bd5dd77b009dcf0ae786d
    networks:
      appnet:
        aliases:
        - zoraxy_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config/:/opt/zoraxy/config
    - /etc/localtime:/etc/localtime:ro
