# openwa-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  openwa:
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
    cap_drop:
    - ALL
    environment:
    - SERVICE_URL_OPENWA_2785=${SERVICE_URL_OPENWA_2785}
    - NODE_ENV=production
    - HOME=/tmp
    - XDG_CONFIG_HOME=/tmp/.config
    - XDG_CACHE_HOME=/tmp/.cache
    - PORT=2785
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - BASE_URL=${SERVICE_URL_OPENWA}
    - DASHBOARD_URL=${SERVICE_URL_OPENWA}
    - API_MASTER_KEY=${SERVICE_PASSWORD_OPENWA}
    - DATABASE_TYPE=sqlite
    - DATABASE_NAME=./data/openwa.sqlite
    - DATABASE_SYNCHRONIZE=true
    - DATABASE_LOGGING=false
    - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
    - SESSION_DATA_PATH=./data/sessions
    - PUPPETEER_HEADLESS=true
    - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
    - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
    - STORAGE_TYPE=local
    - STORAGE_LOCAL_PATH=./data/media
    - REDIS_ENABLED=false
    - QUEUE_ENABLED=false
    - CACHE_ENABLED=false
    - AUTO_START_SESSIONS=${AUTO_START_SESSIONS:-false}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:2785/api/health/ready'', (r) => process.exit(r.statusCode === 200 ? 0 : 1))'
      timeout: 10s
    image: ghcr.io/rmyndharis/openwa:0.30.3
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    networks:
      appnet:
        aliases:
        - openwa-coolify_openwa_1
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 75s
    tmpfs:
    - /tmp
    volumes:
    - openwa-data:/app/data
volumes:
  openwa-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/openwa-data
      o: bind
      type: none
