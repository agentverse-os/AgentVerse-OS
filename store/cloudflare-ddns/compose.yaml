# cloudflare-ddns: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cloudflare-ddns:
    environment:
      CF_DNS__AUTH__SCOPED_TOKEN: ${CF_DNS__AUTH__SCOPED_TOKEN}
      CF_DNS__DOMAINS_0__NAME: ${CF_DNS__DOMAINS_0__NAME}
      CF_DNS__DOMAINS_0__PROXIED: 'false'
      CF_DNS__LOG_TYPE: json
    image: ghcr.io/joshuaavalon/cloudflare-ddns:3.3.0
    networks:
      appnet:
        aliases:
        - cloudflare-ddns_cloudflare-ddns_1
    restart: unless-stopped
