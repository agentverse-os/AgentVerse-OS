# Импортировано из каталога runtipi командой `cloudd store import runtipi`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/cloudflare-ddns
description: Update DNS records on Cloudflare.
endpoint:
  port: 80
  service: cloudflare-ddns
env:
  CF_DNS__AUTH__SCOPED_TOKEN:
    generate: password
  CF_DNS__DOMAINS_0__NAME: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.jpg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: cloudflare-ddns
notes: []
origin: runtipi
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: CF_DNS__DOMAINS_0__NAME
  hint: null
  label: Domain
  options: null
  required: true
  type: fqdn
- env: CF_DNS__AUTH__SCOPED_TOKEN
  hint: null
  label: Token
  options: null
  required: true
  type: password
tags: []
title: Cloudflare DDNS
type: app
upstream:
  author: Joshua Avalon
  categories:
  - network
  source: https://github.com/joshuaavalon/docker-cloudflare
  tipi_version: 7
  version: 3.3.0
website: https://github.com/joshuaavalon/docker-cloudflare
