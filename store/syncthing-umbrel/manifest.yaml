# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/syncthing-umbrel
description: Peer-to-peer file synchronization between your devices
endpoint:
  port: 8384
  service: server
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/syncthing/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/syncthing/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/syncthing/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/syncthing/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: syncthing-umbrel
notes:
- 'порт 22000:22000/tcp (server) не публикуется: доступ только через edge/gate'
- 'порт 22000:22000/udp (server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Syncthing
type: app
upstream:
  author: The Syncthing Foundation
  categories:
  - files
  release_notes: |-
    This release includes several fixes:
      - Improved folder health checks for up-to-date folders
      - Fixed ignore pattern handling behind symlinks and with empty patterns
      - Improved database connection and puller handling to avoid deadlocks
      - Fixed GUI folder grouping and spacing edge cases
      - Hardened UPnP, versioner command, and static request handling


    Full release notes can be found at https://github.com/syncthing/syncthing/releases/tag/v2.1.3
  source: https://github.com/syncthing/syncthing
  version: 2.1.3
  website: https://syncthing.net
website: https://syncthing.net
