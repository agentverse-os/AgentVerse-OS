# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/transmute-umbrel
description: An efficient tool for transforming files on your Umbrel
endpoint:
  port: 3313
  service: web
env:
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/transmute/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/transmute/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/transmute/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/transmute/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: transmute-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Transmute
type: app
upstream:
  author: Transmute
  categories:
  - files
  release_notes: |-
    This maintenance update disables telemetry from the onnxruntime dependency used by document conversions.

    It also cleans up failed, completed, and cancelled jobs through the cleanup TTL and Clear Conversions/Compressions settings, adds Korean translations, and updates conversion dependencies including Pandoc and Draw.io.

    No configuration changes are required. After upgrading, the first cleanup run may remove old finished jobs according to your configured TTL.
  source: https://github.com/transmute-app/transmute
  version: 2.1.1
  website: https://transmute.sh/
website: https://transmute.sh/
