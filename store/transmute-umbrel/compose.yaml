# transmute-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      AUTH_SECRET_KEY: ${APP_SEED}
    image: ghcr.io/transmute-app/transmute:2.1.1@sha256:87b669d835d9e68bdbc4082ab061cb361cd3ecee69c14ccfa9a3814d326b6707
    networks:
      appnet:
        aliases:
        - transmute_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
