# transmute-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      AUTH_SECRET_KEY: ${APP_SEED}
    image: ghcr.io/transmute-app/transmute:2.0.0@sha256:51a32b28e0cb84cde624ca41570f069d91ee7e83fac5c9d0b970e7a583b3abde
    networks:
      appnet:
        aliases:
        - transmute_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
