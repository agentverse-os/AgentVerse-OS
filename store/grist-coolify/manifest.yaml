# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/grist-coolify
description: Grist is a modern relational spreadsheet. It combines the flexibility of a spreadsheet with the robustness of a database.
endpoint:
  port: 8484
  service: grist
env:
  ALLOWED_WEBHOOK_DOMAINS: ''
  COMMENTS: 'true'
  CONTACT_SUPPORT_URL: ''
  COOKIE_MAX_AGE: '86400000'
  DEFAULT_EMAIL: '?'
  FORCE_LOGIN: 'true'
  FREE_COACHING_CALL_URL: ''
  HIDE_UI_ELEMENTS: billing,sendToDrive,supportGrist,multiAccounts,tutorials
  HOME_INCLUDE_STATIC: 'true'
  OIDC_IDP_SCOPES: openid profile email
  OIDC_IDP_SKIP_END_SESSION_ENDPOINT: 'false'
  ORG_IN_PATH: 'true'
  PAGE_TITLE_SUFFIX: ' - Suffix'
  POSTGRES_DATABASE: grist-db
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  REDIS_URL: redis://redis:6379
  SANDBOX_FLAVOR: gvisor
  SERVICE_FQDN_GRIST: ${APP_DOMAIN}
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_REALBASE64_128:
    generate: hex64
  SERVICE_URL_GRIST: https://${APP_DOMAIN}
  SERVICE_URL_GRIST_8484: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  SUPPORT_ANON: 'false'
  TYPEORM_HOST: postgres
  TYPEORM_LOGGING: 'false'
  TYPEORM_PORT: '5432'
  TYPEORM_TYPE: postgres
  UI_FEATURES: helpCenter,billing,templates,createSite,multiSite,sendToDrive,tutorials,supportGrist
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: FORCE_LOGIN
name: grist-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
