# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/umami-coolify
description: Umami is web analytics platform which provides insights into visitor behavior without compromising user privacy.
endpoint:
  port: 3000
  service: umami
env:
  POSTGRES_DB: umami
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_UMAMI:
    generate: hex64
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_UMAMI_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: umami-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRES_DB
  hint: 'по умолчанию: umami'
  label: postgres db
  options: null
  required: false
  type: text
- env: POSTGRES_USER
  hint: null
  label: postgres user
  options: null
  required: false
  type: text
tags:
- analytics
- insights
- privacy
title: Umami
type: app
upstream:
  categories:
  - analytics
  source: https://umami.is
  tags:
  - analytics
  - insights
  - privacy
  template: umami.yaml
website: https://umami.is
