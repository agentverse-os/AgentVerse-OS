# calibre-web-automated-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      PGID: '1000'
      PUID: '1000'
    image: crocodilestick/calibre-web-automated:v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679
    networks:
      appnet:
        aliases:
        - calibre-web-automated_server_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/book-ingest:/cwa-book-ingest
    - ${APP_DATA_DIR}/data/calibre-library:/calibre-library
