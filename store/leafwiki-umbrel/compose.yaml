# leafwiki-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      LEAFWIKI_ADMIN_PASSWORD: ${APP_PASSWORD}
      LEAFWIKI_ALLOW_INSECURE: 'true'
      LEAFWIKI_JWT_SECRET: ${APP_SEED}
    image: ghcr.io/perber/leafwiki:v0.14.2@sha256:bc07b7d0f3de916233a570f6d4b54fe14de0e2cb77e179e6a07bf417fb109585
    networks:
      appnet:
        aliases:
        - leafwiki_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
