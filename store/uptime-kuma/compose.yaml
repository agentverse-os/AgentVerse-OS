# uptime-kuma: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
  dockerro:
    external: true
    name: cloudos-docker-ro-net
services:
  uptime-kuma:
    environment:
      DOCKER_HOST: tcp://cloudos-docker-ro:2375
    image: louislam/uptime-kuma:2
    networks:
      appnet:
        aliases:
        - uptime-kuma_uptime-kuma_1
      dockerro: {}
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
