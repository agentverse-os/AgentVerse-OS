# pocketbase-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    image: ghcr.io/muchobien/pocketbase:0.40.6@sha256:9a0be68a80ca1348ba8d15f217b3f983be4c094b3c571a09b3ebdeb357259338
    networks:
      appnet:
        aliases:
        - pocketbase_app_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/data:/pb_data
    - ${APP_DATA_DIR}/data/public:/pb_public
    - ${APP_DATA_DIR}/data/hooks:/pb_hooks
    - ${APP_DATA_DIR}/data/migrations:/pb_migrations
