# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/pocketbase-umbrel
description: Open Source backend for your next SaaS and Mobile app in 1 file
endpoint:
  port: 8090
  service: app
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/pocketbase/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/pocketbase/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/pocketbase/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/pocketbase/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/pocketbase/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: umbrel-pocketbase
  path: null
  user: umbrel@umbrel.local
name: pocketbase-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: PocketBase
type: app
upstream:
  author: PocketBase
  categories:
  - developer
  release_notes: |-
    This update improves file storage safety and limits the source image size used for thumbnail generation to reduce excessive memory usage. It also includes security-related dependency updates and small dashboard fixes.

    If you're updating from a pre-0.40 version and run custom PocketBase applications or chained commands, test them before relying on this update in production.

    Full release notes can be found at https://github.com/pocketbase/pocketbase/releases/tag/v0.40.6
  source: https://github.com/pocketbase/pocketbase
  version: 0.40.6
  website: https://pocketbase.io/
website: https://pocketbase.io/
