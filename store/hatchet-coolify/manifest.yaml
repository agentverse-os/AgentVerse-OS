- env: POSTGRES_DB
  hint: 'по умолчанию: hatchet'
  label: postgres db
  options: null
  required: false
  type: text
- env: POSTGRES_USER
  hint: null
  label: postgres user
  options: null
  required: false
  type: text
- env: RABBITMQ_PORT
  hint: 'по умолчанию: 5672'
  label: rabbitmq port
  options: null
  required: false
  type: text
- env: SERVER_AUTH_COOKIE_DOMAIN
  hint: 'по умолчанию: localhost:8080'
  label: server auth cookie domain
  options: null
