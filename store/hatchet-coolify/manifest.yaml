- env: SERVER_GRPC_BIND_ADDRESS
  hint: 'по умолчанию: 0.0.0.0'
  label: server grpc bind address
  options: null
  required: false
  type: text
- env: SERVER_GRPC_INSECURE
  hint: 'по умолчанию: t'
  label: server grpc insecure
  options: null
  required: false
