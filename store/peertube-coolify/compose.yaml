# peertube-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  peertube:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_PEERTUBE_9000=${SERVICE_URL_PEERTUBE_9000}
    - PEERTUBE_WEBSERVER_HOSTNAME=${SERVICE_FQDN_PEERTUBE}
    - PEERTUBE_WEBSERVER_PORT=${PEERTUBE_WEBSERVER_PORT:-443}
    - PEERTUBE_WEBSERVER_HTTPS=${PEERTUBE_WEBSERVER_HTTPS:-true}
    - PEERTUBE_TRUST_PROXY=["127.0.0.1", "loopback", "172.16.0.0/12"]
    - PEERTUBE_SECRET=${SERVICE_HEX_32_PEERTUBESECRET}
    - PEERTUBE_DB_HOSTNAME=postgres
    - PEERTUBE_DB_USERNAME=${SERVICE_USER_POSTGRESQL}
    - PEERTUBE_DB_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
    - PEERTUBE_DB_NAME=${POSTGRES_DB:-peertube}
    - PEERTUBE_DB_SSL=false
    - PEERTUBE_REDIS_HOSTNAME=redis
    - PEERTUBE_SMTP_HOSTNAME=postfix
    - PEERTUBE_SMTP_PORT=25
    - PEERTUBE_SMTP_FROM=noreply@${SERVICE_FQDN_PEERTUBE}
    - PEERTUBE_SMTP_TLS=false
    - PEERTUBE_SMTP_DISABLE_STARTTLS=false
    - PEERTUBE_ADMIN_EMAIL=
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/api/v1/ping
      timeout: 5s
    image: chocobozzz/peertube:v8.3.2
    networks:
      appnet:
        aliases:
        - peertube-coolify_peertube_1
    restart: always
    volumes:
    - peertube-data:/data
    - peertube-config:/config
  postfix:
    environment:
    - POSTFIX_myhostname=${SERVICE_FQDN_PEERTUBE}
    image: mwader/postfix-relay:1.2.17
    networks:
      appnet:
        aliases:
        - peertube-coolify_postfix_1
    restart: always
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
    - POSTGRES_DB=${POSTGRES_DB:-peertube}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-peertube}
      timeout: 5s
    image: postgres:17-alpine
    networks:
      appnet:
        aliases:
        - peertube-coolify_postgres_1
    restart: always
    volumes:
    - db-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:8-alpine
    networks:
      appnet:
        aliases:
        - peertube-coolify_redis_1
    restart: always
    volumes:
    - redis-data:/data
volumes:
  db-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/db-data
      o: bind
      type: none
  peertube-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/peertube-config
      o: bind
      type: none
  peertube-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/peertube-data
      o: bind
      type: none
  redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis-data
      o: bind
      type: none
