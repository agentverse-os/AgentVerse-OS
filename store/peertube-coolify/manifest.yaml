  hint: 'по умолчанию: 443'
  label: peertube webserver port
  options: null
  required: false
  type: text
- env: PEERTUBE_WEBSERVER_HTTPS
  hint: 'по умолчанию: true'
  label: peertube webserver https
  options: null
