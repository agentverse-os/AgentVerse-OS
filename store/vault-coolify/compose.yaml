# vault-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  vault:
    command: server
    environment:
    - SERVICE_URL_VAULT_8200=${SERVICE_URL_VAULT_8200}
    - VAULT_ADDR=http://127.0.0.1:8200
    - VAULT_API_ADDR=${SERVICE_URL_VAULT_8200}
    - VAULT_LOCAL_CONFIG={"ui":true,"disable_mlock":true,"storage":{"file":{"path":"/vault/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}}
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 15s
      test:
      - CMD-SHELL
      - wget -qO- "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200" >/dev/null || exit 1
      timeout: 5s
    image: hashicorp/vault:${VAULT_VERSION:-latest}
    networks:
      appnet:
        aliases:
        - vault-coolify_vault_1
    restart: unless-stopped
    volumes:
    - vault-data:/vault/file
volumes:
  vault-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/vault-data
      o: bind
      type: none
