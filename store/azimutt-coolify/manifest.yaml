# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/azimutt-coolify
description: 'Next-Gen ERD: Design, Explore, Document and Analyze your database.'
endpoint:
  port: 4000
  service: backend
env:
  AUTH_PASSWORD: 'true'
  EMAIL_ADAPTER: smtp
  FILE_STORAGE_ADAPTER: s3
  PORT: '4000'
  POSTGRES_DB: azimutt
  POSTGRES_USER: ''
  PUBLIC_SITE: 'false'
  RELAY_PORT: '587'
  S3_BUCKET: ''
  S3_HOST: ''
  S3_KEY_ID: ''
  S3_KEY_SECRET: ''
  SERVICE_BASE64_64_AZIMUTT:
    generate: hex64
  SERVICE_PASSWORD_MINIO:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_SMTP:
    generate: password
  SERVICE_URL_AZIMUTT: https://${APP_DOMAIN}
  SERVICE_URL_AZIMUTT_4000: https://${APP_DOMAIN}
  SERVICE_URL_SMTP: https://${APP_DOMAIN}
  SERVICE_USER_MINIO:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
  SKIP_EMAIL_CONFIRMATION: 'true'
  SKIP_ONBOARDING_FUNNEL: 'true'
  SMTP_PORT: '587'
