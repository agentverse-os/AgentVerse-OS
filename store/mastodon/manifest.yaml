  MASTODON_POSTGRES_PASSWORD:
    generate: token
  MASTODON_REDIS_PASSWORD:
    generate: token
  MASTODON_SECRET_KEY_BASE:
    generate: hex64
  MASTODON_SMTP_FROM_ADDRESS: ''
  MASTODON_SMTP_LOGIN: ''
