upstream:
  author: Sajjad Ali
  categories:
  - files
  release_notes: |-
    ⚠️ Back up your library database before updating. Stop Foldergram before copying the database, or take a consistent snapshot including its WAL and SHM files. If upgrading from before 1.3.0 with folders named "carousels", review the migration choice in Settings → General Settings, then run Scan Library.

    - Connect an Immich library from Settings → Sources while keeping Foldergram edits separate from your originals. - Manage local media sources together; your existing gallery becomes Primary gallery with its metadata preserved. Additional locations must first be mounted into the container. - Optionally import supported HEIC/HEIF still photos and generate previews. - Choose an instance theme and accent color, and revisit liked posts from folder pages. - Improved feed, navigation, and Reels layouts, with collection saving directly from Reels.

    Full release notes: https://github.com/foldergram/foldergram/releases/tag/v1.3.2
