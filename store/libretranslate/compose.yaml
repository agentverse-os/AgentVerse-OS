# libretranslate: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    networks:
      appnet:
        aliases:
        - libretranslate_libretranslate_1
    restart: unless-stopped
