  NEXT_PUBLIC_DISCORD_SUPPORT: ''
  NEXT_PUBLIC_POLOTNO: ''
  NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
  NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: ''
  NOT_SECURED: 'false'
  NX_ADD_PLUGINS: 'false'
  POSTGRESQL_DATABASE: postiz-db
  POSTGRES_DB: postiz-db
  POSTGRES_USER: ''
  RESEND_API_KEY: ''
  SERVICE_PASSWORD_JWTSECRET:
    generate: password
  SERVICE_PASSWORD_POSTGRESQL:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_URL_POSTIZ: https://${APP_DOMAIN}
  SERVICE_URL_POSTIZ_5000: https://${APP_DOMAIN}
  SLACK_SIGNING_SECRET: ''
  STORAGE_PROVIDER: local
  STRIPE_PUBLISHABLE_KEY: ''
  STRIPE_SECRET_KEY: ''
  STRIPE_SIGNING_KEY: ''
