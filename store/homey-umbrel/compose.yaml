# homey-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: ghcr.io/athombv/homey-shs:13.5.4@sha256:dbe1f5d3acd994869d18dd75930e96d9e35e824ecbde4fd66efe49bfd8c9301f
    network_mode: host
    privileged: true
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/homey/user
