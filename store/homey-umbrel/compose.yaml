# homey-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: ghcr.io/athombv/homey-shs:13.4.1@sha256:268b146973bddce7ee14ed5a5a8225a1b58419c15941f54916f352ff8015283f
    network_mode: host
    privileged: true
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/homey/user
