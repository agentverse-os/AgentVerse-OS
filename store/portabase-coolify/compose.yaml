# portabase-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  portabase:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_PORTABASE_80=${SERVICE_URL_PORTABASE_80}
    - PROJECT_URL=$SERVICE_URL_PORTABASE
    - PROJECT_SECRET=$SERVICE_PASSWORD_64_PORTABASE
    - DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/${POSTGRES_DB:-portabase}?schema=public
    - PROJECT_NAME=${PROJECT_NAME:-Portabase}
    - TZ=${TZ:-Europe/Paris}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - RETENTION_CRON=${RETENTION_CRON:-0 7 * * *}
    - STALE_BACKUP_THRESHOLD_HOURS=${STALE_BACKUP_THRESHOLD_HOURS:-6}
    - BACKUP_FOLDER_NAME=${BACKUP_FOLDER_NAME:-backups}
    - TELEMETRY=${TELEMETRY:-true}
    - SKIP_ONBOARDING=${SKIP_ONBOARDING:-false}
    - API_ENABLED=${API_ENABLED:-false}
    - OPENAPI_ENABLED=${OPENAPI_ENABLED:-false}
    - MCP_ENABLED=${MCP_ENABLED:-false}
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
    - SMTP_FROM=${SMTP_FROM}
    - SMTP_SECURE=${SMTP_SECURE:-false}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD-SHELL
      - curl -f http://localhost/api/health
      timeout: 5s
    image: portabase/portabase:1.36.2
    networks:
      appnet:
        aliases:
        - portabase-coolify_portabase_1
    restart: always
    volumes:
    - portabase-data:/data
  postgres:
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-portabase}
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $POSTGRES_USER -d ${POSTGRES_DB}
      timeout: 5s
    image: postgres:18-alpine
    networks:
      appnet:
        aliases:
        - portabase-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql
volumes:
  portabase-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/portabase-data
      o: bind
      type: none
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
