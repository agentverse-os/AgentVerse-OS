# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/cap-captcha-coolify
description: The self-hosted CAPTCHA for the modern web.
endpoint:
  port: 3000
  service: cap
env:
  SERVICE_PASSWORD_ADMIN:
    generate: password
  SERVICE_URL_CAP_3000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: cap-captcha-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- captcha
- security
- privacy
- proof-of-work
title: Cap Captcha
type: app
upstream:
  categories:
  - security
  source: https://capjs.js.org/guide/
  tags:
  - captcha
  - security
  - privacy
  - proof-of-work
  template: cap-captcha.yaml
website: https://capjs.js.org/guide/
