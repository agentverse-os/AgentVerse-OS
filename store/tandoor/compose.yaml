# tandoor: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  tandoor:
    depends_on:
      tandoor-db:
        condition: service_healthy
    environment:
      DB_ENGINE: django.db.backends.postgresql
      GUNICORN_MEDIA: '1'
      POSTGRES_DB: tandoordb
      POSTGRES_HOST: tandoor-db
      POSTGRES_PASSWORD: ${TANDOOR_POSTGRESS_PASSWORD}
      POSTGRES_PORT: '5432'
      POSTGRES_USER: tandoor
      SECRET_KEY: ${TANDOOR_SECRET_KEY}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: wget --no-verbose --tries=1 --spider http://localhost:80
      timeout: 5s
    image: ghcr.io/tandoorrecipes/recipes:2.6.13
    networks:
      appnet:
        aliases:
        - tandoor_tandoor_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/staticfiles:/opt/recipes/staticfiles
    - ${APP_DATA_DIR}/data/mediafiles:/opt/recipes/mediafiles
  tandoor-db:
    environment:
      POSTGRES_DB: tandoordb
      POSTGRES_PASSWORD: ${TANDOOR_POSTGRESS_PASSWORD}
      POSTGRES_PORT: '5432'
      POSTGRES_USER: tandoor
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: postgres:15-alpine
    networks:
      appnet:
        aliases:
        - tandoor_tandoor-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgresql:/var/lib/postgresql/data
