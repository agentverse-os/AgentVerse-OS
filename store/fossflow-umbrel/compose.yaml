# fossflow-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - NODE_ENV=production
    - ENABLE_SERVER_STORAGE=true
    - STORAGE_PATH=/data/diagrams
    - ENABLE_GIT_BACKUP=false
    image: stnsmith/fossflow:master-b69fc2e@sha256:c0813b19a9c8a3b8d13901de0e35edf7d9300ae8327a905ff520239d5624dafc
    networks:
      appnet:
        aliases:
        - fossflow_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/diagrams:/data/diagrams
