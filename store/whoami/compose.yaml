# The network is created by cloudd and marked external (ADR-005, decision 3); ports are not
# published outside.
services:
  whoami:
    image: traefik/whoami:v1.11
    restart: unless-stopped
    environment:
      WHOAMI_NAME: ${APP_NAME}
    networks: [appnet]
networks:
  appnet:
    external: true
    name: ${APP_NET}
