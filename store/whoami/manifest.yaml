# Store test app: an HTTP echo. Shows the whole manifest contract (2.6) on the simplest service.
schema: 1
origin: manual
name: whoami
title: whoami
description: "HTTP echo for checking edge and gate routes"
i18n:
  ru: { description: "HTTP-эхо для проверки маршрутов edge и gate" }
  uk: { description: "HTTP-ехо для перевірки маршрутів edge і gate" }
  es: { description: "Eco HTTP para comprobar las rutas de edge y gate" }
icon: 🪞
type: app
compose: ./compose.yaml
provides: [demo.http]            # a project with capabilities: [demo.http] gets http://demo.http.gate
requires: []
route: { mode: port, open: iframe }
auth: own
env: {}
data: []
health: http://whoami:80/
endpoint: { service: whoami, port: 80 }

# no sign-in: access is limited by the Cloud
# OS network
login:
  mode: none
