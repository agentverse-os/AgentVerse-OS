# ntfy-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    entrypoint:
    - /bin/sh
    - /entrypoint.sh
    environment:
      GODEBUG: multipathtcp=0
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_BASE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ENABLE_LOGIN: 'true'
      NTFY_PASSWORD: ${APP_PASSWORD}
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    image: binwiederhier/ntfy:v2.38.1@sha256:038da2be5e668fee6d36a62884eea48975e1b71c29a56964e5298c1b9165a573
    networks:
      appnet:
        aliases:
        - ntfy_app_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
    - ${APP_DATA_DIR}/data/cache:/var/cache/ntfy
    - ${APP_DATA_DIR}/data/data:/etc/ntfy
    - ${APP_DATA_DIR}/data/lib:/var/lib/ntfy
