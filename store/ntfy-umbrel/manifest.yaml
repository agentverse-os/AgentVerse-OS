# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/ntfy-umbrel
description: Send notifications to your phone or desktop via scripts from any computer, and/or using a REST API
endpoint:
  port: 80
  service: app
env:
  APP_PASSWORD:
    generate: password
  APP_PROXY_PORT: ''
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/ntfy/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ntfy/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ntfy/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/ntfy/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: umbrel
name: ntfy-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_PROXY_PORT
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app proxy port
  options: null
  required: false
  type: text
tags: []
title: ntfy
type: app
upstream:
  author: ntfy LLC
  categories:
  - automation
  release_notes: |-
    This security update protects message templates against additional denial-of-service attacks that could crash the server or exhaust its resources. It also prevents slow web push endpoints from tying up connections and improves template error messages.

    Custom message templates using html, js, urlquery, or advanced printf formatting must be adjusted to use supported functions and plain formatting directives.

    Daily usage counts reset once when upgrading from before v2.36.0. Custom server configurations are checked more strictly at startup.

    The message cache is upgraded automatically. Downgrading to v2.31.0 or earlier requires a manual database schema adjustment; see the upstream upgrade notes before rolling back.

    Custom scripts upgrading from before v2.31.0 and reconnecting with a message ID may receive duplicate messages from the same second. The ntfy mobile and web apps automatically remove these duplicates.

    Full release notes can be found at https://github.com/binwiederhier/ntfy/releases/tag/v2.38.1
  source: https://github.com/binwiederhier/ntfy
  version: 2.38.1
  website: https://ntfy.sh/
website: https://ntfy.sh/
