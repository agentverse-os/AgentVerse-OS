# anse: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  anse:
    environment:
    - PORT=8014
    image: ddiu8081/anse:v1.1.11
    networks:
      appnet:
        aliases:
        - anse_anse_1
    restart: unless-stopped
