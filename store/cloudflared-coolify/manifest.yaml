  note: null
  password: null
  path: null
  user: null
name: cloudflared-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: CLOUDFLARE_TUNNEL_TOKEN
  hint: null
  label: cloudflare tunnel token
  options: null
  required: false
  type: password
tags: []
title: Cloudflared
type: app
