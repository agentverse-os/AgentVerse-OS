# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/litequeen-coolify
description: Lite Queen is an open-source SQLite database management software that runs on your server.
endpoint:
  port: 8000
  service: litequeen
env:
  SERVICE_URL_LITEQUEEN_8000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: litequeen-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- sqlite
- sqlite-database-management
- self-hosted
- VPS
- database
title: Litequeen
type: app
upstream:
  categories:
  - database
  source: https://litequeen.com/
  tags:
  - sqlite
  - sqlite-database-management
  - self-hosted
  - VPS
  - database
  template: litequeen.yaml
website: https://litequeen.com/
