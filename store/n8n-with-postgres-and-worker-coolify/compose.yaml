# n8n-with-postgres-and-worker-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  n8n:
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_N8N_5678=${SERVICE_URL_N8N_5678}
    - N8N_EDITOR_BASE_URL=${SERVICE_URL_N8N}
    - WEBHOOK_URL=${SERVICE_URL_N8N}
    - N8N_HOST=${SERVICE_URL_N8N}
    - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
    - TZ=${TZ:-UTC}
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
    - DB_POSTGRESDB_HOST=postgresql
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_USER=$SERVICE_USER_POSTGRES
    - DB_POSTGRESDB_SCHEMA=public
    - DB_POSTGRESDB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}
    - N8N_RUNNERS_ENABLED=true
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}
    - N8N_RUNNERS_BROKER_PORT=${N8N_RUNNERS_BROKER_PORT:-5679}
    - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
    - N8N_NATIVE_PYTHON_RUNNER=${N8N_NATIVE_PYTHON_RUNNER:-true}
    - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
    - N8N_GIT_NODE_DISABLE_BARE_REPOS=${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
    - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-1}
    - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=${N8N_SKIP_AUTH_ON_OAUTH_CALLBACK:-false}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5678/healthz
      timeout: 20s
    image: n8nio/n8n:2.10.4
    networks:
      appnet:
        aliases:
        - n8n-with-postgres-and-worker-coolify_n8n_1
    restart: unless-stopped
    volumes:
    - n8n-data:/home/node/.n8n
  n8n-worker:
    command: worker
    depends_on:
      n8n:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
    - TZ=${TZ:-UTC}
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
    - DB_POSTGRESDB_HOST=postgresql
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_USER=$SERVICE_USER_POSTGRES
    - DB_POSTGRESDB_SCHEMA=public
    - DB_POSTGRESDB_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}
    - N8N_RUNNERS_ENABLED=true
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}
    - N8N_RUNNERS_BROKER_PORT=${N8N_RUNNERS_BROKER_PORT:-5679}
    - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
    - N8N_NATIVE_PYTHON_RUNNER=${N8N_NATIVE_PYTHON_RUNNER:-true}
    - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
    - N8N_GIT_NODE_DISABLE_BARE_REPOS=${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
    - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-1}
    - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=${N8N_SKIP_AUTH_ON_OAUTH_CALLBACK:-false}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5678/healthz
      timeout: 20s
    image: n8nio/n8n:2.10.4
    networks:
      appnet:
        aliases:
        - n8n-with-postgres-and-worker-coolify_n8n-worker_1
    restart: unless-stopped
    volumes:
    - n8n-data:/home/node/.n8n
  postgresql:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=${POSTGRES_DB:-n8n}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - n8n-with-postgres-and-worker-coolify_postgresql_1
    restart: unless-stopped
    volumes:
    - postgresql-data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:6-alpine
    networks:
      appnet:
        aliases:
        - n8n-with-postgres-and-worker-coolify_redis_1
    restart: unless-stopped
    volumes:
    - redis-data:/data
  task-runners:
    depends_on:
    - n8n
    environment:
    - N8N_RUNNERS_TASK_BROKER_URI=${N8N_RUNNERS_TASK_BROKER_URI:-http://n8n-worker:5679}
    - N8N_RUNNERS_AUTH_TOKEN=$SERVICE_PASSWORD_N8N
    - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-15}
    - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:5680/healthz
      timeout: 20s
    image: n8nio/runners:2.10.4
    networks:
      appnet:
        aliases:
        - n8n-with-postgres-and-worker-coolify_task-runners_1
    restart: unless-stopped
volumes:
  n8n-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/n8n-data
      o: bind
      type: none
  postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgresql-data
      o: bind
      type: none
  redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis-data
      o: bind
      type: none
