# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/appflowy-coolify
description: AppFlowy is the AI collaborative workspace where you achieve more without losing control of your data.
endpoint:
  port: 80
  service: admin_frontend
env:
  AI_OPENAI_API_KEY: ''
  APPFLOWY_MAILER_SMTP_EMAIL: notify@appflowy.io
  APPFLOWY_MAILER_SMTP_HOST: smtp.gmail.com
  APPFLOWY_MAILER_SMTP_PASSWORD: email_sender_password
  APPFLOWY_MAILER_SMTP_PORT: '587'
  APPFLOWY_MAILER_SMTP_TLS_KIND: none
  APPFLOWY_MAILER_SMTP_USERNAME: notify@appflowy.io
  APPFLOWY_S3_BUCKET: appflowy
  APPFLOWY_S3_CREATE_BUCKET: 'true'
  APPFLOWY_S3_REGION: us-east-1
  AZURE_OPENAI_API_KEY: ''
  AZURE_OPENAI_API_VERSION: ''
  AZURE_OPENAI_ENDPOINT: ''
  GOTRUE_ADMIN_EMAIL: admin@example.com
  GOTRUE_JWT_EXP: '7200'
  GOTRUE_SMTP_ADMIN_EMAIL: ''
  GOTRUE_SMTP_HOST: ''
  GOTRUE_SMTP_PASS: ''
  GOTRUE_SMTP_PORT: '587'
  GOTRUE_SMTP_USER: ''
  POSTGRES_DB: appflowy
  RUST_LOG: info
  SERVICE_PASSWORD_ADMIN:
    generate: password
  SERVICE_PASSWORD_JWT:
    generate: password
  SERVICE_PASSWORD_MINIO:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_ADMIN: https://${APP_DOMAIN}
  SERVICE_URL_APPFLOWYWEB: https://${APP_DOMAIN}
  SERVICE_USER_MINIO:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_ADMIN
  path: null
  user: GOTRUE_ADMIN_EMAIL
name: appflowy-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
