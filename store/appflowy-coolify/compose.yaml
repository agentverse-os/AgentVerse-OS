# appflowy-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
configs:
  nginx-inline-1:
    content: "# Please do not directly edit this file.\n\nerror_log  /var/log/nginx/error.log notice;\npid        /var/run/nginx.pid;\n\n\nevents {\n    worker_connections  1024;\n}\n\n\nhttp {\n    resolver 127.0.0.11 valid=10s;\n    map $http_upgrade $connection_upgrade {\n        default upgrade;\n        '' close;\n    }\n\n    server {\n        listen 80;\n        client_max_body_size 10M;\n        underscores_in_headers on;\n\n        # Backend services\n        set $appflowy_cloud_backend \"http://appflowy_cloud:8000\";\n        set $gotrue_backend \"http://gotrue:9999\";\n        set $admin_frontend_backend \"http://admin_frontend:3000\";\n        set $minio_api_backend \"http://minio:9000\";\n        # Host name for minio, used internally within docker compose\n        set $minio_internal_host \"minio:9000\";\n        # GoTrue Authentication Service\n        location /gotrue/ {\n            proxy_pass $gotrue_backend;\n\n            rewrite ^/gotrue(/.*)$ $1 break;\n            \n            # Allow headers like redirect_to to be handed over to the gotrue\n            # for correct redirecting\n            proxy_set_header Host $http_host;\n            proxy_pass_request_headers on;\n        }\n\n        # WebSocket endpoint - handle both /ws and /ws/v2\n        location /ws {\n            proxy_pass $appflowy_cloud_backend;\n\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"Upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_read_timeout 86400s;\n        }\n\n        # API endpoints\n        location /api {\n            proxy_pass $appflowy_cloud_backend;\n            proxy_set_header X-Request-Id $request_id;\n            proxy_set_header Host $http_host;\n\n            # Special handling for publish endpoint\n            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {\n                proxy_pass $appflowy_cloud_backend;\n                proxy_request_buffering off;\n                client_max_body_size 256M;\n            }\n\n            # Chat endpoint (streaming)\n            location /api/chat {\n                proxy_pass $appflowy_cloud_backend;\n\n                proxy_http_version 1.1;\n                proxy_set_header Connection \"\";\n                chunked_transfer_encoding on;\n                proxy_buffering off;\n                proxy_cache off;\n\n                proxy_read_timeout 600s;\n                proxy_connect_timeout 600s;\n                proxy_send_timeout 600s;\n            }\n\n            # Import endpoint\n            location /api/import {\n                proxy_pass $appflowy_cloud_backend;\n\n                proxy_set_header X-Request-Id $request_id;\n                proxy_set_header Host $http_host;\n\n                proxy_read_timeout 600s;\n                proxy_connect_timeout 600s;\n                proxy_send_timeout 600s;\n\n                proxy_request_buffering off;\n                proxy_buffering off;\n                proxy_cache off;\n                client_max_body_size 2G;\n            }\n        }\n\n        # Used for presigned URLs, which must be reachable by the AppFlowy client application\n        location /minio-api/ {\n            proxy_pass $minio_api_backend;\n\n            # Set the host to the internal host because the presigned URL was signed against it\n            proxy_set_header Host $minio_internal_host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            rewrite ^/minio-api/(.*) /$1 break;\n\n            proxy_connect_timeout 300s;\n            proxy_read_timeout 600s;\n            proxy_send_timeout 600s;\n            proxy_request_buffering off;\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n            chunked_transfer_encoding off;\n            client_max_body_size 0;\n        }\n\n        # Admin Frontend\n        # Optional Module, comment this section if you did not deploy admin_frontend in docker-compose.yml\n        location /console {\n            proxy_pass $admin_frontend_backend;\n\n            proxy_set_header X-Scheme $scheme;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n\n            proxy_buffering off;\n            proxy_cache off;\n\n            proxy_read_timeout 60s;\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n        }\n\n        # Redirect root path to /console\n        location = / {\n            return 301 /console;\n        }\n\n        # Health check endpoint\n        location /health {\n            access_log off;\n            return 200 \"healthy\\n\";\n            add_header Content-Type text/plain;\n        }\n    }\n}\n"
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  admin_frontend:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      gotrue:
        condition: service_healthy
    environment:
    - APPFLOWY_GOTRUE_BASE_URL=${SERVICE_URL_ADMIN}/gotrue
    - APPFLOWY_BASE_URL=${SERVICE_URL_ADMIN}
    image: appflowyinc/admin_frontend:0.20.3
    networks:
      appnet:
        aliases:
        - appflowy-coolify_admin_frontend_1
    restart: unless-stopped
  ai:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
    - OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
    - AI_SERVER_PORT=5001
    - DEFAULT_AI_MODEL=gpt-4.1-mini
    - DEFAULT_AI_COMPLETION_MODEL=gpt-4.1-mini
    - AI_APPFLOWY_HOST=${SERVICE_URL_APPFLOWYWEB}
    - APPFLOWY_GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
    - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
    - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
    - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
    - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
    - AI_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
    - AI_REDIS_URL=redis://redis:6379
    - AI_USE_MINIO=true
    - AI_MINIO_URL=http://minio:9000
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      timeout: 10s
    image: appflowyinc/appflowy_ai:0.21.7
    networks:
      appnet:
        aliases:
        - appflowy-coolify_ai_1
    restart: unless-stopped
  appflowy_cloud:
    depends_on:
      gotrue:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
    - RUST_LOG=${RUST_LOG:-info}
    - APPFLOWY_BASE_URL=https://${SERVICE_FQDN_ADMIN}
    - APPFLOWY_ENVIRONMENT=production
    - APPFLOWY_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
    - APPFLOWY_REDIS_URI=redis://redis:6379
    - APPFLOWY_GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
    - APPFLOWY_S3_CREATE_BUCKET=${APPFLOWY_S3_CREATE_BUCKET:-true}
    - APPFLOWY_S3_USE_MINIO=true
    - APPFLOWY_S3_MINIO_URL=http://minio:9000
    - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
    - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
    - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
    - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=https://${SERVICE_FQDN_ADMIN}/minio-api
    - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST:-smtp.gmail.com}
    - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT:-587}
    - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME:-notify@appflowy.io}
    - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL:-notify@appflowy.io}
    - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD:-email_sender_password}
    - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND:-none}
    - APPFLOWY_ACCESS_CONTROL=true
    - APPFLOWY_DATABASE_MAX_CONNECTIONS=40
    - AI_SERVER_HOST=ai
    - AI_SERVER_PORT=5001
    - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
    - APPFLOWY_WEB_URL=${SERVICE_URL_APPFLOWYWEB}
    - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
    - ASSEMBLYAI_API_BASE=${ASSEMBLYAI_API_BASE:-https://api.assemblyai.com/v2}
    - ASSEMBLYAI_STREAMING_API_BASE=${ASSEMBLYAI_STREAMING_API_BASE:-https://streaming.assemblyai.com/v3}
    - APPFLOWY_SEARCH_SERVICE_URL=http://appflowy_search:4002
    - APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS=${APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS:-10}
    - AI_ENABLED=${AI_ENABLED:-true}
    - SIGNUP_WHITELIST_ENABLED=${SIGNUP_WHITELIST_ENABLED:-false}
    - GUEST_INVITES_REQUIRE_ADMIN_APPROVAL=${GUEST_INVITES_REQUIRE_ADMIN_APPROVAL:-false}
    healthcheck:
      interval: 5s
      retries: 12
      test: curl --fail http://127.0.0.1:8000/api/health || exit 1
      timeout: 5s
    image: appflowyinc/appflowy_cloud:0.21.7
    networks:
      appnet:
        aliases:
        - appflowy-coolify_appflowy_cloud_1
    restart: unless-stopped
  appflowy_search:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
    - RUST_LOG=${RUST_LOG:-info}
    - APPFLOWY_SEARCH_HOST=[::]
    - APPFLOWY_SEARCH_PORT=4002
    - APPFLOWY_SEARCH_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
    - APPFLOWY_SEARCH_REDIS_URL=redis://redis:6379
    - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY:-}
    - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
    - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
    - APPFLOWY_S3_USE_MINIO=true
    - APPFLOWY_S3_MINIO_URL=http://minio:9000
    - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
    - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
    - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
    - APPFLOWY_BACKGROUND_INDEXER_ENABLED=true
    - APPFLOWY_INDEXER_DATABASE_ENABLED=${APPFLOWY_INDEXER_DATABASE_ENABLED:-false}
    - APPFLOWY_KEYWORD_SEARCH_ENABLED=${APPFLOWY_KEYWORD_SEARCH_ENABLED:-true}
    - APPFLOWY_KEYWORD_WORKER_ENABLED=true
    - APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES=${APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES:-2147483648}
    - APPFLOWY_KEYWORD_INDEX_DIR=/var/lib/appflowy/keyword_index
    - APPFLOWY_GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 40s
      test:
      - CMD
      - bash
      - -ec
      - |
        exec 3<>/dev/tcp/127.0.0.1/4002
        printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
        read -r _ status _ <&3
        [ "$$status" = 200 ]
      timeout: 5s
    image: appflowyinc/appflowy_search:0.21.7
    networks:
      appnet:
        aliases:
        - appflowy-coolify_appflowy_search_1
    restart: unless-stopped
    volumes:
    - keyword_index_data:/var/lib/appflowy/keyword_index
  appflowy_web:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
    - SERVICE_URL_APPFLOWYWEB=${SERVICE_URL_APPFLOWYWEB}
    - APPFLOWY_BASE_URL=${SERVICE_URL_ADMIN}
    - APPFLOWY_GOTRUE_BASE_URL=${SERVICE_URL_ADMIN}/gotrue
    - APPFLOWY_WS_BASE_URL=${SERVICE_URL_ADMIN}/ws/v2
    image: appflowyinc/appflowy_web:0.20.14
    networks:
      appnet:
        aliases:
        - appflowy-coolify_appflowy_web_1
    restart: unless-stopped
  appflowy_worker:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
    - RUST_LOG=info
    - APPFLOWY_ENVIRONMENT=production
    - APPFLOWY_WORKER_ENVIRONMENT=production
    - APPFLOWY_WORKER_REDIS_URL=redis://redis:6379
    - APPFLOWY_WORKER_DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}
    - APPFLOWY_WORKER_DATABASE_NAME=${POSTGRES_DB:-appflowy}
    - APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=30
    - APPFLOWY_S3_USE_MINIO=true
    - APPFLOWY_S3_MINIO_URL=http://minio:9000
    - APPFLOWY_S3_ACCESS_KEY=${SERVICE_USER_MINIO}
    - APPFLOWY_S3_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    - APPFLOWY_S3_BUCKET=${APPFLOWY_S3_BUCKET:-appflowy}
    - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION:-us-east-1}
    - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST:-smtp.gmail.com}
    - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT:-587}
    - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME:-notify@appflowy.io}
    - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL:-notify@appflowy.io}
    - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD:-email_sender_password}
    - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND:-none}
    image: appflowyinc/appflowy_worker:0.21.7
    networks:
      appnet:
        aliases:
        - appflowy-coolify_appflowy_worker_1
    restart: unless-stopped
  gotrue:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - GOTRUE_API_HOST=0.0.0.0
    - GOTRUE_API_PORT=9999
    - PORT=9999
    - GOTRUE_ADMIN_EMAIL=${GOTRUE_ADMIN_EMAIL:-admin@example.com}
    - GOTRUE_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    - GOTRUE_DISABLE_SIGNUP=false
    - GOTRUE_SITE_URL=appflowy-flutter://
    - GOTRUE_URI_ALLOW_LIST=**
    - GOTRUE_CORS_ALLOWED_HEADERS=redirect_to
    - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - GOTRUE_JWT_EXP=${GOTRUE_JWT_EXP:-7200}
    - GOTRUE_JWT_ADMIN_GROUP_NAME=supabase_admin
    - GOTRUE_DB_DRIVER=postgres
    - API_EXTERNAL_URL=${SERVICE_URL_ADMIN}/gotrue
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-appflowy}?search_path=auth
    - GOTRUE_SMTP_HOST=${GOTRUE_SMTP_HOST}
    - GOTRUE_SMTP_PORT=${GOTRUE_SMTP_PORT:-587}
    - GOTRUE_SMTP_USER=${GOTRUE_SMTP_USER}
    - GOTRUE_SMTP_PASS=${GOTRUE_SMTP_PASS}
    - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/gotrue/verify
    - GOTRUE_MAILER_URLPATHS_INVITE=/gotrue/verify
    - GOTRUE_MAILER_URLPATHS_RECOVERY=/gotrue/verify
    - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/gotrue/verify
    - GOTRUE_SMTP_ADMIN_EMAIL=${GOTRUE_SMTP_ADMIN_EMAIL}
    - GOTRUE_SMTP_MAX_FREQUENCY=1ns
    - GOTRUE_RATE_LIMIT_EMAIL_SENT=100
    - GOTRUE_MAILER_AUTOCONFIRM=true
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 40s
      test: curl --fail http://127.0.0.1:9999/health || exit 1
      timeout: 5s
    image: appflowyinc/gotrue:0.20.6
    networks:
      appnet:
        aliases:
        - appflowy-coolify_gotrue_1
    restart: unless-stopped
  minio:
    command: server /data --console-address ":9001"
    environment:
    - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
    - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 20s
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    networks:
      appnet:
        aliases:
        - appflowy-coolify_minio_1
    restart: unless-stopped
    volumes:
    - minio_data:/data
  nginx:
    configs:
    - source: nginx-inline-1
      target: /etc/nginx/nginx.conf
    depends_on:
    - appflowy_cloud
    - gotrue
    - admin_frontend
    environment:
    - SERVICE_URL_ADMIN=${SERVICE_URL_ADMIN}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - curl
      - -f
      - http://localhost/health
      timeout: 10s
    image: nginx:1.31.8
    networks:
      appnet:
        aliases:
        - appflowy-coolify_nginx_1
    restart: unless-stopped
    volumes: []
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-appflowy}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_HOST=postgres
    healthcheck:
      interval: 5s
      retries: 12
      test:
      - CMD
      - pg_isready
      - -U
      - ${SERVICE_USER_POSTGRES}
      - -d
      - ${POSTGRES_DB:-appflowy}
      timeout: 5s
    image: pgvector/pgvector:0.8.7-pg16
    networks:
      appnet:
        aliases:
        - appflowy-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - redis-cli -h localhost -p 6379 ping
      timeout: 5s
    image: redis:8.4.8-alpine3.22
    networks:
      appnet:
        aliases:
        - appflowy-coolify_redis_1
    restart: unless-stopped
    volumes:
    - redis_data:/data
volumes:
  keyword_index_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/keyword_index_data
      o: bind
      type: none
  minio_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/minio_data
      o: bind
      type: none
  postgres_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres_data
      o: bind
      type: none
  redis_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis_data
      o: bind
      type: none
