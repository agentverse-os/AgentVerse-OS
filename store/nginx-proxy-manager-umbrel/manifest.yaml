  release_notes: |-
    This update moves Nginx Proxy Manager 2.17.0 to upstream's rebuilt image with Node.js 26.13.1, which includes the November 2026 Node.js security fixes. There are no changes to Nginx Proxy Manager itself.

    ⚠️ Certbot has been updated. Check your DNS plugin configuration after upgrading. EdgeDNS, Beget, and Infomaniak have breaking changes; you may need to create new DNS SSL certificates and remove the old ones.

    This release improves proxy-host permissions and authentication security, fixes access lists and SSL settings when host configurations are regenerated, and fixes reloads after certificate renewal. It also protects unsaved form changes, shows clearer certificate errors and details, and adds more DNS provider support.

    Full release notes can be found at https://github.com/NginxProxyManager/nginx-proxy-manager/releases/tag/v2.17.0
