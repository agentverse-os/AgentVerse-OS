# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/etherpad-umbrel
description: An intuitive tool for real-time collaborative writing
endpoint:
  port: 9001
  service: app
env:
  APP_PASSWORD:
    generate: password
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/etherpad/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/etherpad/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/etherpad/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/etherpad/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: admin
name: etherpad-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Etherpad
type: app
upstream:
  author: The Etherpad Foundation
  categories:
  - files
  release_notes: |-
    This update improves collaborative editing reliability and fixes plugin icons.

    - Prevents unnecessary disconnections and dropped chat messages when multiple tabs or users share an IP address.
    - Fixes scrambled text in watching browsers when edits come from clients that send multi-line changes.
    - Fixes overlapping pad joins and restores plugin icon fonts in production mode.
    - Makes the Colibris home page follow your dark-mode preference.

    Full release notes can be found at https://github.com/ether/etherpad/releases/tag/v3.3.19
  source: https://github.com/ether/etherpad
  version: 3.3.19
  website: https://etherpad.org/
website: https://etherpad.org/
