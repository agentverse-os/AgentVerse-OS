# etherpad-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
    - postgres
    environment:
      ADMIN_PASSWORD: ${APP_PASSWORD}
      ALLOW_UNKNOWN_FILE_ENDS: 'true'
      CI: 'true'
      DB_CHARSET: utf8mb4
      DB_HOST: etherpad_postgres_1
      DB_NAME: etherpad
      DB_PASS: admin
      DB_PORT: 5432
      DB_TYPE: postgres
      DB_USER: admin
      DEFAULT_PAD_TEXT: null
      DISABLE_IP_LOGGING: 'false'
      LOGLEVEL: INFO
      NODE_ENV: production
      SHOW_SETTINGS_IN_ADMIN_PAGE: 'true'
      SKIN_NAME: colibris
      SKIN_VARIANTS: super-light-toolbar super-light-editor light-background
      SOFFICE: null
      SUPPRESS_ERRORS_IN_PAD_TEXT: 'false'
      TRUST_PROXY: 'true'
    image: etherpad/etherpad:3.3.3@sha256:6020e7b57f4b17389ef000a5a2b04e6ab3ea6659c7c7ab83b81587010fa58be4
    networks:
      appnet:
        aliases:
        - etherpad_app_1
    restart: on-failure
    user: 5001:0
    volumes:
    - ${APP_DATA_DIR}/data/plugins:/opt/etherpad-lite/src/plugin_packages
    - ${APP_DATA_DIR}/data/etherpad-var:/opt/etherpad-lite/var:rw
  postgres:
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: etherpad
      POSTGRES_PASSWORD: admin
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
    image: postgres:15-alpine@sha256:93a6166360be8f1d116b7ea97ebb8dea9e2c9c746349e952738bbba72a961d7c
    networks:
      appnet:
        aliases:
        - etherpad_postgres_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/postgres_data:/var/lib/postgresql/data/pgdata
