# planning-poker: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  planning-poker:
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8000
      timeout: 5s
    image: axeleroy/self-host-planning-poker:1.2.1
    networks:
      appnet:
        aliases:
        - planning-poker_planning-poker_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
