# perplexica-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: itzcrazykns1337/vane:v1.12.2@sha256:61f2bbf3386ff3df08911fb3de0e1893b04702a4d49ef13fbadbda937b47ab7c
    networks:
      appnet:
        aliases:
        - perplexica_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app_data:/home/perplexica/data
    - ${APP_DATA_DIR}/data/uploads:/home/perplexica/uploads
