# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/swetrix-coolify
description: Privacy-friendly and cookieless European web analytics alternative to Google Analytics.
endpoint:
  port: 3000
  service: swetrix
env:
  CLICKHOUSE_DATABASE: analytics
  CLICKHOUSE_PORT: '8123'
  CLICKHOUSE_USER: default
  CLOUDFLARE_PROXY_ENABLED: 'false'
  DEBUG_MODE: 'false'
  DISABLE_REGISTRATION: 'false'
  FROM_EMAIL: ''
  IP_GEOLOCATION_DB_PATH: ''
  OIDC_CLIENT_ID: ''
  OIDC_CLIENT_SECRET: ''
  OIDC_DISCOVERY_URL: ''
  OIDC_ENABLED: 'false'
  OIDC_ONLY_AUTH: 'false'
  REDIS_PORT: '6379'
  REDIS_USER: default
  SERVICE_BASE64_64_SECRETKEYBASE:
    generate: hex64
  SERVICE_PASSWORD_CLICKHOUSE:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_URL_SWETRIXAPI: https://${APP_DOMAIN}
  SERVICE_URL_SWETRIX_3000: https://${APP_DOMAIN}
  SMTP_HOST: ''
  SMTP_MOCK: 'false'
  SMTP_PASSWORD: ''
  SMTP_PORT: ''
  SMTP_USER: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: swetrix-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
