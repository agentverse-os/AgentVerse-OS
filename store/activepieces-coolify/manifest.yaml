# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/activepieces-coolify
description: Open source no-code business automation.
endpoint:
  port: 80
  service: activepieces
env:
  AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
  AP_ENVIRONMENT: prod
  AP_EXECUTION_MODE: UNSANDBOXED
  AP_SANDBOX_RUN_TIME_SECONDS: '600'
  AP_SIGN_UP_ENABLED: 'true'
  AP_TELEMETRY_ENABLED: 'false'
  AP_TEMPLATES_SOURCE_URL: https://cloud.activepieces.com/api/v1/flow-templates
  AP_TRIGGER_DEFAULT_POLL_INTERVAL: '5'
  AP_WEBHOOK_TIMEOUT_SECONDS: '30'
  POSTGRES_DB: activepieces
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ''
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  SERVICE_PASSWORD_64_APIKEY:
    generate: hex64
  SERVICE_PASSWORD_64_JWT:
    generate: hex64
  SERVICE_PASSWORD_ENCRYPTIONKEY:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_ACTIVEPIECES: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: activepieces-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
