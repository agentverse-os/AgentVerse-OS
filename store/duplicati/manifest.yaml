  mode: app
  note: null
  password: null
  path: null
  user: null
name: duplicati
notes: []
origin: runtipi
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: DUPLICATI_ENCRYPTION_KEY
  hint: null
  label: Encryption Key
  options: null
  required: false
  type: random
tags: []
title: Duplicati
type: app
upstream:
  author: https://github.com/duplicati
  categories:
  - data
  source: https://github.com/linuxserver/docker-duplicati
