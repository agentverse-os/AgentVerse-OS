# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/nocodb-coolify
description: NocoDB is an open source Airtable alternative. Turns any MySQL, PostgreSQL, SQL Server, SQLite & MariaDB into a smart-spreadsheet.
endpoint:
  port: 8080
  service: nocodb
env:
  SERVICE_URL_NOCODB_8080: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: nocodb-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- nocodb
- airtable
- mysql
- postgresql
- sqlserver
- sqlite
- mariadb
title: Nocodb
type: app
upstream:
  categories:
  - productivity
  source: https://nocodb.com/
  tags:
  - nocodb
  - airtable
  - mysql
  - postgresql
  - sqlserver
  - sqlite
  - mariadb
  template: nocodb.yaml
website: https://nocodb.com/
