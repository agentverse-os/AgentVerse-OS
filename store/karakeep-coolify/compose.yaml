# karakeep-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chrome:
    command:
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
    image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.78-r1
    init: true
    networks:
      appnet:
        aliases:
        - karakeep-coolify_chrome_1
    restart: unless-stopped
  meilisearch:
    environment:
    - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-true}
    - NEXTAUTH_SECRET=${SERVICE_PASSWORD_KARAKEEPNEXTAUTH}
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    - NEXTAUTH_URL=${SERVICE_URL_KARAKEEP}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:7700/health
      timeout: 10s
    image: getmeili/meilisearch:v1.55.0
    networks:
      appnet:
        aliases:
        - karakeep-coolify_meilisearch_1
    restart: unless-stopped
    volumes:
    - karakeep-meilisearch:/meili_data
  web:
    environment:
    - SERVICE_URL_KARAKEEP=${SERVICE_URL_KARAKEEP}
    - NEXTAUTH_URL=${SERVICE_URL_KARAKEEP}
    - NEXTAUTH_SECRET=${SERVICE_PASSWORD_KARAKEEPNEXTAUTH}
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
    - MEILI_ADDR=http://meilisearch:7700
    - BROWSER_WEB_URL=http://chrome:9222
    - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY}
    - DISABLE_SIGNUPS=${SERVICE_DISABLE_SIGNUPS:-false}
    - DATA_DIR=/data
    image: ghcr.io/karakeep-app/karakeep:0.35.0
    networks:
      appnet:
        aliases:
        - karakeep-coolify_web_1
    restart: unless-stopped
    volumes:
    - karakeep-data:/data
volumes:
  karakeep-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/karakeep-data
      o: bind
      type: none
  karakeep-meilisearch:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/karakeep-meilisearch
      o: bind
      type: none
