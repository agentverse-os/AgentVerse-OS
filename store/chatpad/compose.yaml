# chatpad: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chatpad:
    image: ghcr.io/deiucanta/chatpad:latest
    networks:
      appnet:
        aliases:
        - chatpad_chatpad_1
    restart: unless-stopped
