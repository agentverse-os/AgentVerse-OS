# freshrss-with-mariadb-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  freshrss:
    depends_on:
      freshrss-db:
        condition: service_healthy
    environment:
    - SERVICE_URL_FRESHRSS_80=${SERVICE_URL_FRESHRSS_80}
    - CRON_MIN=${CRON_MIN:-1,31}
    - MARIADB_DB=${MARIADB_DATABASE:-freshrss}
    - MARIADB_USER=${SERVICE_USER_MARIADB}
    - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      timeout: 20s
    image: freshrss/freshrss:latest
    networks:
      appnet:
        aliases:
        - freshrss-with-mariadb-coolify_freshrss_1
    restart: unless-stopped
    volumes:
    - freshrss-data:/var/www/FreshRSS/data
    - freshrss-extensions:/var/www/FreshRSS/extensions
  freshrss-db:
    environment:
    - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
    - MYSQL_DATABASE=${MARIADB_DATABASE:-freshrss}
    - MYSQL_USER=${SERVICE_USER_MARIADB}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - freshrss-with-mariadb-coolify_freshrss-db_1
    restart: unless-stopped
    volumes:
    - mariadb-data:/var/lib/mysql
volumes:
  freshrss-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/freshrss-data
      o: bind
      type: none
  freshrss-extensions:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/freshrss-extensions
      o: bind
      type: none
  mariadb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mariadb-data
      o: bind
      type: none
