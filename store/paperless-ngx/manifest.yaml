  PAPERLESS_TIKA_ENABLED: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.jpg
login:
  mode: generated
  note: null
  password: PAPERLESS_ADMIN_PASSWORD
