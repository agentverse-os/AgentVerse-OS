  label: Enable Tika
  options: null
  required: false
  type: boolean
- env: PAPERLESS_SECRET_KEY
  hint: null
  label: App Secret Key
  options: null
  required: false
  type: random
tags: []
title: Paperless-ngx
type: app
upstream:
  author: Daniel Quinn, Jonas Winkler, and the Paperless-ngx team
  categories:
  - utilities
  source: https://github.com/paperless-ngx/paperless-ngx
