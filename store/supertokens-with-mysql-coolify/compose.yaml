# supertokens-with-mysql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mysql:
    environment:
    - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_MYSQL
    - MYSQL_USER=$SERVICE_USER_MYSQL
    - MYSQL_PASSWORD=$SERVICE_PASSWORD_MYSQL
    - MYSQL_DATABASE=${MYSQL_DATABASE:-supertokens}
    healthcheck:
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      timeout: 20s
    image: mysql:latest
    networks:
      appnet:
        aliases:
        - supertokens-with-mysql-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - supertokens-mysql-data:/var/lib/mysql
  supertokens:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SERVICE_URL_SUPERTOKENS_3567=${SERVICE_URL_SUPERTOKENS_3567}
    - API_KEYS=${API_KEYS:-}
    - MYSQL_CONNECTION_URI=mysql://$SERVICE_USER_MYSQL:$SERVICE_PASSWORD_MYSQL@mysql:3306/${MYSQL_DATABASE:-supertokens}
    healthcheck:
      interval: 10s
      retries: 5
      test: |
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      timeout: 5s
    image: registry.supertokens.io/supertokens/supertokens-mysql:latest
    networks:
      appnet:
        aliases:
        - supertokens-with-mysql-coolify_supertokens_1
    restart: unless-stopped
volumes:
  supertokens-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/supertokens-mysql-data
      o: bind
      type: none
