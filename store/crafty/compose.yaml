# crafty: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  crafty:
    environment:
      TZ: ${TZ}
    image: registry.gitlab.com/crafty-controller/crafty-4:4.10.8
    labels:
      traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto: https
      traefik.http.services.{{RUNTIPI_APP_ID}}.loadbalancer.server.scheme: https
      traefik.http.services.{{RUNTIPI_APP_ID}}.loadbalancer.serverstransport: insecuretransport@file
    networks:
      appnet:
        aliases:
        - crafty_crafty_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/backups:/crafty/backups
    - ${APP_DATA_DIR}/data/logs:/crafty/logs
    - ${APP_DATA_DIR}/data/servers:/crafty/servers
    - ${APP_DATA_DIR}/data/config:/crafty/app/config
    - ${APP_DATA_DIR}/data/import:/crafty/import
