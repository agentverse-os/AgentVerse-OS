# librespeed: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  librespeed:
    environment:
      PASSWORD: ${APP_PASSWORD}
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: lscr.io/linuxserver/librespeed:6.2.1
    networks:
      appnet:
        aliases:
        - librespeed_librespeed_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/config
