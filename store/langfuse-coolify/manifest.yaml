# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/langfuse-coolify
description: Langfuse is an open-source LLM engineering platform that helps teams collaboratively debug, analyze, and iterate on their LLM applications.
endpoint:
  port: 3000
  service: langfuse
env:
  AUTH_DISABLE_SIGNUP: 'true'
  CLICKHOUSE_DB: default
  EMAIL_FROM_ADDRESS: admin@example.com
  HOSTNAME: 0.0.0.0
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: '1000'
  LANGFUSE_INGESTION_QUEUE_DELAY_MS: '1'
  LANGFUSE_INIT_ORG_ID: my-org
  LANGFUSE_INIT_ORG_NAME: My Org
  LANGFUSE_INIT_PROJECT_ID: my-project
  LANGFUSE_INIT_PROJECT_NAME: My Project
  LANGFUSE_INIT_USER_EMAIL: admin@example.com
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ''
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ''
  LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ''
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
  LANGFUSE_S3_BATCH_EXPORT_REGION: auto
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ''
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ''
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ''
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ''
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ''
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ''
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ''
  LANGFUSE_USE_AZURE_BLOB: 'false'
  POSTGRES_DB: langfuse-db
  POSTGRES_USER: ''
  SERVICE_BASE64_NEXTAUTHSECRET:
    generate: hex64
  SERVICE_PASSWORD_64_LANGFUSE:
    generate: hex64
  SERVICE_PASSWORD_CLICKHOUSE:
    generate: password
  SERVICE_PASSWORD_LANGFUSE:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_PASSWORD_SALT:
    generate: password
  SERVICE_URL_LANGFUSE: https://${APP_DOMAIN}
  SERVICE_URL_LANGFUSE_3000: https://${APP_DOMAIN}
  SERVICE_USER_CLICKHOUSE:
    generate: password
  SERVICE_USER_LANGFUSE:
    generate: password
  SERVICE_USER_POSTGRES:
    generate: password
  SMTP_CONNECTION_URL: ''
  TELEMETRY_ENABLED: 'false'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_LANGFUSE
  path: null
  user: SERVICE_USER_LANGFUSE
name: langfuse-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
