- https://getumbrel.github.io/umbrel-apps-gallery/bitwatch/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bitwatch/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bitwatch/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/bitwatch/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: bitwatch-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Bitwatch
type: app
upstream:
  author: Zap-O-Matic
  categories:
  - bitcoin
  release_notes: |-
    Telegram controls, per-recipient alerts, and hardened xpub support:

      - route telegram alerts to different chats per collection, extended key, descriptor, or address
      - new telegram bot commands from the main chat: /status, /address, /accept, /addaddress, /refresh, /backup
      - choose where alert address links point (local mempool, public mempool.space, or plain text) and toggle link previews
      - support account-level xpubs with hardened origin paths (e.g. m/84'/0'/0')
      - new installs alert on all balance directions by default, so spends reported by Fulcrum-backed mempool instances are not missed
      - fix collection not auto-expanding when its first address is added
  source: https://github.com/zapomatic/bitwatch
  version: 1.8.0
  website: https://github.com/zapomatic/bitwatch
website: https://github.com/zapomatic/bitwatch
