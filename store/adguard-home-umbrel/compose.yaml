# adguard-home-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    cap_add:
    - NET_ADMIN
    command:
    - --no-check-update
    - -c
    - /opt/adguardhome/conf/AdGuardHome.yaml
    - -w
    - /opt/adguardhome/work
    - --web-addr
    - 0.0.0.0:8095
    image: adguard/adguardhome:v1.0.0-b.1@sha256:34150c1a1dc9e1aff3a33c0cf3e93a0bbcbda2eb9608b6f5fdec417a45f2f588
    network_mode: host
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/work:/opt/adguardhome/work
    - ${APP_DATA_DIR}/data/conf:/opt/adguardhome/conf
