  release_notes: |-
    This release updates Go to address upstream Go security fixes and improves DNS-over-QUIC resistance to resource exhaustion attacks.

    Bootstrap server configuration now supports comments, install API configuration accepts a language property, and static DHCP lease hostnames can be removed through the HTTP API.

    It also fixes DNS64 handling of unresolved CNAME/DNAME chains and blocked requests without EDNS(0) OPT records. The `strict_sni_check` option is now deprecated.

    Full release notes can be found at https://github.com/AdguardTeam/AdGuardHome/releases/tag/v0.107.79
