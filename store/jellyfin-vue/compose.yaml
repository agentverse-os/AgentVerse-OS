# jellyfin-vue: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  jellyfin-vue:
    image: ghcr.io/jellyfin/jellyfin-vue:unstable.2024-10-14.a47a7d5
    networks:
      appnet:
        aliases:
        - jellyfin-vue_jellyfin-vue_1
    restart: unless-stopped
