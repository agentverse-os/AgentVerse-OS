# esphome-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  esphome:
    environment:
    - SERVICE_URL_ESPHOME_6052=${SERVICE_URL_ESPHOME_6052}
    - ESPHOME_USERNAME=${SERVICE_USER_ADMIN}
    - ESPHOME_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    image: ghcr.io/esphome/esphome:2026.10.2
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
    - esp_config:/config
    - /etc/localtime:/etc/localtime:ro
volumes:
  esp_config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/esp_config
      o: bind
      type: none
