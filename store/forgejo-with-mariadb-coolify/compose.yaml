# forgejo-with-mariadb-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  forgejo:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
    - SERVICE_URL_FORGEJO_3000=${SERVICE_URL_FORGEJO_3000}
    - FORGEJO__server__ROOT_URL=${SERVICE_URL_FORGEJO}
    - FORGEJO__migrations__ALLOWED_DOMAINS=${FORGEJO__migrations__ALLOWED_DOMAINS}
    - FORGEJO__migrations__ALLOW_LOCALNETWORKS=${FORGEJO__migrations__ALLOW_LOCALNETWORKS-false}
    - USER_UID=1000
    - USER_GID=1000
    - FORGEJO__database__DB_TYPE=mysql
    - FORGEJO__database__HOST=mariadb
    - FORGEJO__database__NAME=${MYSQL_DATABASE-forgejo}
    - FORGEJO__database__USER=$SERVICE_USER_MYSQL
    - FORGEJO__database__PASSWD=$SERVICE_PASSWORD_MYSQL
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000
      timeout: 10s
    image: codeberg.org/forgejo/forgejo:15
    networks:
      appnet:
        aliases:
        - forgejo-with-mariadb-coolify_forgejo_1
    restart: unless-stopped
    volumes:
    - forgejo-data:/data
    - forgejo-timezone:/etc/timezone:ro
    - forgejo-localtime:/etc/localtime:ro
  mariadb:
    environment:
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - forgejo-with-mariadb-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - forgejo-mariadb-data:/var/lib/mysql
volumes:
  forgejo-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-data
      o: bind
      type: none
  forgejo-localtime:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-localtime
      o: bind
      type: none
  forgejo-mariadb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-mariadb-data
      o: bind
      type: none
  forgejo-timezone:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/forgejo-timezone
      o: bind
      type: none
