# wizarr-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - PUID=1000
    - PGID=1000
    - DISABLE_BUILTIN_AUTH=false
    - PORT=5690
    - TZ=UTC
    image: ghcr.io/wizarrrr/wizarr:v2026.9.0@sha256:0627e8e13f0fa76ab3a0348153bdcba5083c9f86745299a81394b8099900758e
    networks:
      appnet:
        aliases:
        - wizarr_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
