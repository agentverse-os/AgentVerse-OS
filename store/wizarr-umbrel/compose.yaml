# wizarr-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - PUID=1000
    - PGID=1000
    - DISABLE_BUILTIN_AUTH=false
    - PORT=5690
    - TZ=UTC
    image: ghcr.io/wizarrrr/wizarr:v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
    networks:
      appnet:
        aliases:
        - wizarr_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
