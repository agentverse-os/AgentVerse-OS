# trilium: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  trilium:
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    image: ghcr.io/triliumnext/trilium:v0.105.0
    networks:
      appnet:
        aliases:
        - trilium_trilium_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/home/node/trilium-data
