# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/phpmyadmin-coolify
description: phpMyAdmin is a web-based database management tool for administering your MySQL and MariaDB databases through a user-friendly interface.
endpoint:
  port: 80
  service: phpmyadmin
env:
  SERVICE_URL_PHPMYADMIN: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: phpmyadmin-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- database management
title: Phpmyadmin
type: app
upstream:
  categories:
  - database
  source: https://phpmyadmin.net
  tags:
  - database management
  template: phpmyadmin.yaml
website: https://phpmyadmin.net
