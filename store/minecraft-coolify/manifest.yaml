# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/minecraft-coolify
description: Minecraft Server that will automatically download selected version at startup.
endpoint:
  port: 25565
  service: mc
env:
  MINECRAFT_ALLOW_NETHER: 'true'
  MINECRAFT_ANNOUNCE_PLAYER_ACHIEVEMENTS: 'true'
  MINECRAFT_DIFFICULTY: normal
  MINECRAFT_ENABLE_AUTOPAUSE: 'false'
  MINECRAFT_ENABLE_COMMAND_BLOCK: 'false'
  MINECRAFT_FORCE_GAMEMODE: 'false'
  MINECRAFT_GAME_MODE: survival
  MINECRAFT_GENERATE_STRUCTURES: 'true'
  MINECRAFT_GUI: 'false'
  MINECRAFT_HARDCORE: 'false'
  MINECRAFT_INIT_MEMORY: 256M
  MINECRAFT_MAX_BUILD_HEIGHT: '256'
  MINECRAFT_MAX_MEMORY: 1G
  MINECRAFT_MAX_PLAYERS: '10'
  MINECRAFT_MAX_TICK_TIME: '60000'
  MINECRAFT_MAX_WORLD_SIZE: '10000'
  MINECRAFT_MOTD: Minecraft Server powered by §aCoolify§r
  MINECRAFT_ONLINE_MODE: 'true'
  MINECRAFT_PLAYER_IDLE_TIMEOUT: '0'
  MINECRAFT_PVP: 'true'
  MINECRAFT_SERVER_NAME: Minecraft Server
  MINECRAFT_SNOOPER_ENABLED: 'false'
  MINECRAFT_SPAWN_ANIMALS: 'true'
  MINECRAFT_SPAWN_MONSTERS: 'true'
  MINECRAFT_SPAWN_NPCS: 'true'
  MINECRAFT_TYPE: VANILLA
  MINECRAFT_VERSION: latest
  MINECRAFT_VIEW_DISTANCE: '10'
  PORT: ''
  SERVICE_PASSWORD_RCON:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_RCON
  path: null
  user: null
name: minecraft-coolify
notes:
- 'порт ${PORT}:25565 (mc) не публикуется: доступ только через edge/gate'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
