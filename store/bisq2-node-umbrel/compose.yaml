# bisq2-node-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: ghcr.io/bisq-network/bisq2-api:2.1.15.0@sha256:a92a692dc374e2645aba37bdade2d9c8ab042a010f0e0c7147b7ea540337c312
    mem_limit: 2g
    networks:
      appnet:
        aliases:
        - bisq2-node_server_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/data
  web:
    image: ghcr.io/bisq-network/bisq2-api-web-ui:2.1.15.0@sha256:f2ede0b24183e37f97773da7b1f95c61779cffac11ffebb069b33b5018fe91f3
    network_mode: service:server
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data:ro
