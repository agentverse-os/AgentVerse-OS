# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/weaviate-coolify
description: Weaviate is an open-source vector database that stores both objects and vectors, allowing for combining vector search with structured filtering.
endpoint:
  port: 8080
  service: weaviate
env:
  AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
  AUTHENTICATION_APIKEY_ENABLED: 'true'
  AUTHENTICATION_APIKEY_USERS: admin@example.com
  AUTHORIZATION_ADMINLIST_USERS: admin@example.com
  CLUSTER_HOSTNAME: node1
  DEFAULT_VECTORIZER_MODULE: none
  DISABLE_TELEMETRY: 'true'
  ENABLE_MODULES: text2vec-openai,generative-openai,qna-openai
  GOMAXPROCS: '2'
  GOMEMLIMIT: 1024MiB
  LOG_LEVEL: info
  QUERY_DEFAULTS_LIMIT: '1000'
  SERVICE_PASSWORD_APIKEYS:
    generate: password
  SERVICE_URL_WEAVIATE_8080: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_APIKEYS
  path: null
  user: null
name: weaviate-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
