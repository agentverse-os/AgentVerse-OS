  supabase-edge-functions-inline-10:
    content: |
      const CHECK_INTERVAL_MS = 1_000
      const PRESSURE_THRESHOLD = 0.8
      const CLEANUP_TIMEOUT_MS = 1_000
      const RETRY_INTERVAL_MS = 5_000

      function parseBytes(value: string, minimum: number): number {
        const bytes = Number(value)
        if (!/^\d+$/.test(value) || !Number.isSafeInteger(bytes) || bytes < minimum) {
          throw new Error('Invalid cgroup memory value')
        }
        return bytes
      }

      export function startMemoryPressureLoop(): void {
        let errorReported = false
        let activeReported = false

        const tick = async () => {
          let delay = CHECK_INTERVAL_MS
          try {
            const max = (await Deno.readTextFile('/sys/fs/cgroup/memory.max')).trim()
            if (max === 'max') {
              console.warn('Memory pressure monitor disabled: a finite memory limit is required')
              return
            }
            const current = (await Deno.readTextFile('/sys/fs/cgroup/memory.current')).trim()
            const stat = await Deno.readTextFile('/sys/fs/cgroup/memory.stat')
            const limitBytes = parseBytes(max, 1)
            const currentBytes = parseBytes(current, 0)
            const inactiveFileBytes = parseBytes(stat.match(/^inactive_file[ \t]+(\S+)[ \t]*$/m)?.[1] ?? '', 0)
            // Exclude inactive file cache that the kernel can reclaim under pressure.
            const workingSetBytes = Math.max(0, currentBytes - inactiveFileBytes)
            // Logged once so operators (and test-container-logs.sh) can confirm monitoring is on.
            if (!activeReported) {
              console.log(`Memory pressure monitor active (limit ${limitBytes} bytes)`)
              activeReported = true
            }

            if (workingSetBytes / limitBytes >= PRESSURE_THRESHOLD) {
              delay = RETRY_INTERVAL_MS
              const acknowledged = await EdgeRuntime.userWorkers.tryCleanupIdleWorkers(CLEANUP_TIMEOUT_MS)
              EdgeRuntime.miCollect()
              if (acknowledged > 0) {
                console.warn(
                  `Memory pressure: working set ${workingSetBytes} / ${limitBytes} bytes before cleanup; ` +
                    `${acknowledged} worker(s) acknowledged retirement`
                )
              }
            }
            errorReported = false
          } catch (error) {
            if (error instanceof Deno.errors.NotFound || error instanceof Deno.errors.PermissionDenied) {
              console.warn(`Memory pressure monitor disabled: ${error}`)
              return
            }
            delay = RETRY_INTERVAL_MS
            if (!errorReported) {
              console.warn(`Memory pressure monitor failed; retrying: ${error}`)
              errorReported = true
            }
          }
          // Schedule only after this cycle finishes: no overlapping work or queued ticks.
          setTimeout(() => void tick(), delay)
        }

        setTimeout(() => void tick(), CHECK_INTERVAL_MS)
      }
  supabase-edge-functions-inline-11:
    content: |
      {
        "imports": {
          "@supabase/functions-js": "jsr:@supabase/functions-js@^2",
          "@supabase/server": "npm:@supabase/server@^1"
        }
      }
  supabase-edge-functions-inline-12:
    content: |
      // Follow this setup guide to integrate the Deno language server with your editor:
      // https://deno.land/manual/getting_started/setup_your_environment
      // This enables autocomplete, go to definition, etc.

      Deno.serve(async () => {
        return new Response(
          `"Hello from Edge Functions!"`,
          { headers: { "Content-Type": "application/json" } },
        )
      })

      // To invoke:
      // curl 'http://localhost:<KONG_HTTP_PORT>/functions/v1/hello' \
      //   --header 'Authorization: Bearer <anon/service_role API key>'
  supabase-edge-functions-inline-9:
    content: "import * as jose from 'jsr:@panva/jose@6'\nimport { startMemoryPressureLoop } from './memory-pressure.ts'\n\nconsole.log('main function started')\nstartMemoryPressureLoop()\n\naddEventListener('unhandledrejection', (ev) => {\n  // Without preventDefault(), a floating rejection destroys the main worker and the process exits.\n  // Sync throws inside timer callbacks are still fatal; wrap them in try/catch.\n  ev.preventDefault()\n  console.error('unhandled promise rejection in main worker', ev.reason)\n})\n\nconst MAX_WORKER_RETRIES = 3\n\nconst JWT_SECRET = Deno.env.get('JWT_SECRET')\nconst SUPABASE_JWKS = parseJwks(Deno.env.get('SUPABASE_JWKS'))\nconst LOCAL_JWKS = SUPABASE_JWKS ? jose.createLocalJWKSet(SUPABASE_JWKS) : null\nconst VERIFY_JWT = Deno.env.get('VERIFY_JWT') === 'true'\n\ntype AuthFailure = {\n  code: RequestErrors\n  message?: string\n}\n\ntype FunctionFailure = {\n  code: RequestErrors\n  message: string\n  status: number\n}\n\nexport enum RequestErrors {\n  InvalidLegacyJWT = 'UNAUTHORIZED_LEGACY_JWT',\n  InvalidAsymmetricJWT = 'UNAUTHORIZED_ASYMMETRIC_JWT',\n  InvalidTokenFormat = 'UNAUTHORIZED_INVALID_JWT_FORMAT',\n  UnsupportedTokenAlgorithm = 'UNAUTHORIZED_UNSUPPORTED_TOKEN_ALGORITHM',\n  MissingAuthHeader = 'UNAUTHORIZED_NO_AUTH_HEADER',\n  NotFound = 'NOT_FOUND',\n  BootError = 'BOOT_ERROR',\n  EdgeFunctionError = 'EDGE_FUNCTION_ERROR',\n  IdleTimeout = 'IDLE_TIMEOUT',\n  WorkerResourceLimit = 'WORKER_RESOURCE_LIMIT',\n  WorkerError = 'WORKER_ERROR',\n  InvalidResponseStatusCode = 'INVALID_RESPONSE_STATUS_CODE',\n}\n\n// Errors from this router stay readable from browsers, as on the platform.\n// Function responses keep the function's own CORS headers.\nconst ERROR_CORS_HEADERS = {\n  'Access-Control-Allow-Origin': '*',\n  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey',\n  'Access-Control-Expose-Headers': 'sb-error-code',\n}\n\nfunction getFunctionErrorResponse({ code, message, status }: FunctionFailure): Response {\n  return Response.json(\n    { code, message },\n    {\n      status,\n      headers: {\n        ...ERROR_CORS_HEADERS,\n        'sb-error-code': code,\n      },\n    }\n  )\n}\n\nfunction onError(e: unknown): Response {\n  const ref = crypto.randomUUID()\n  console.error(`unhandled error in request handler (ref: ${ref})`, e)\n  return getFunctionErrorResponse({\n    code: RequestErrors.BootError,\n    message: `Internal Server Error (ref: ${ref})`,\n    status: 503,\n  })\n}\n\nfunction handleWorkerResponse(response: Response): Response {\n  if (response.status < 500) return response\n\n  const headers = new Headers(response.headers)\n  headers.set('sb-error-code', RequestErrors.EdgeFunctionError)\n\n  const exposedHeaders = (headers.get('Access-Control-Expose-Headers') ?? '')\n    .split(',')\n    .map((name) => name.trim())\n    .filter(Boolean)\n  if (!exposedHeaders.some((name) => name.toLowerCase() === 'sb-error-code')) {\n    exposedHeaders.push('sb-error-code')\n  }\n  headers.set('Access-Control-Expose-Headers', exposedHeaders.join(', '))\n\n  return new Response(response.body, {\n    status: response.status,\n    statusText: response.statusText,\n    headers,\n  })\n}\n\nfunction resolveRuntimeError(e: unknown): FunctionFailure {\n  // These error classes are supplied by Edge Runtime, rather than stock Deno.\n  if (e instanceof Deno.errors.InvalidWorkerCreation) {\n    return {\n      code: RequestErrors.BootError,\n      message: 'Function failed to start (please check logs)',\n      status: 503,\n    }\n  }\n  if (e instanceof Deno.errors.WorkerRequestCancelled) {\n    return {\n      code: RequestErrors.WorkerResourceLimit,\n      message: 'Function failed due to not having enough compute resources (please check logs)',\n      status: 546,\n    }\n  }\n  if (e instanceof Deno.errors.WorkerRequestIdleTimeout) {\n    return {\n      code: RequestErrors.IdleTimeout,\n      message: 'Request idle timeout limit (150s) reached',\n      status: 504,\n    }\n  }\n  // No dedicated runtime error class exists for invalid response statuses.\n  // The Response constructor throws directly here or inside the user worker.\n  if (\n    (e instanceof RangeError || e instanceof Deno.errors.InvalidWorkerResponse) &&\n    e.message.includes('is not equal to 101 and outside the range [200, 599]')\n  ) {\n    return {\n      code: RequestErrors.InvalidResponseStatusCode,\n      message: 'Function returned an invalid HTTP status code (please check logs)',\n      status: 500,\n    }\n  }\n  if (\n    e instanceof Deno.errors.WorkerAlreadyRetired ||\n    e instanceof Deno.errors.InvalidWorkerResponse\n  ) {\n    return {\n      code: RequestErrors.WorkerError,\n      message: 'Function exited due to an error (please check logs)',\n      status: 500,\n    }\n  }\n  return { code: RequestErrors.EdgeFunctionError, message: 'Internal Server Error', status: 500 }\n}\n\n// NOTE:(kallebysantos) We don't check for valid keys but just the bare array parsing,\n// let this for 'jose' lib verification\nexport function parseJwks(raw: string | undefined): jose.JSONWebKeySet | null {\n  if (!raw) return null\n  try {\n    const parsed = JSON.parse(raw)\n    if (parsed?.keys && Array.isArray(parsed.keys)) {\n      return parsed as jose.JSONWebKeySet\n    }\n    return null\n  } catch {\n    return null\n  }\n}\n\n/**\n * Extract JWT token from 'Authorization' header or fallback to 'sb-api-key' compatibility\n *\n * Parses the Authorization header to extract the Bearer token.\n * Expects format: \"Bearer <token>\"\n *\n * @param req - The HTTP request object\n * @returns The JWT token string or an authentication failure\n */\nfunction extractBearerToken(authHeader: string | null): string | null {\n  const tokenParts = (authHeader ?? '').trim().split(/\\s+/)\n  const [bearer, token] = tokenParts\n  if (bearer.toLowerCase() !== 'bearer' || tokenParts.length !== 2 || !token) {\n    return null\n  }\n  return token\n}\n\nfunction getAuthToken(req: Request): string | AuthFailure {\n  const authHeader = req.headers.get('authorization')\n  const sbApiKeyCompatibilityToken = req.headers.get('sb-api-key')\n\n  if (!authHeader && !sbApiKeyCompatibilityToken) {\n    return {\n      code: RequestErrors.MissingAuthHeader,\n      message: 'Missing authorization header',\n    }\n  }\n\n  // NOTE:(kallebysantos) Compatibility mode is triggered when all conditions match:\n  // - API proxy mints a temp token\n  // - Original bearer is not present or is ApiKey\n  const bearerToken = extractBearerToken(authHeader)\n  const token = !bearerToken || bearerToken.startsWith('sb_')\n    ? sbApiKeyCompatibilityToken\n    : bearerToken\n\n  if (!token) {\n    return {\n      code: RequestErrors.InvalidTokenFormat,\n      message: 'Invalid JWT format',\n    }\n  }\n\n  return token\n}\n\nfunction getAuthErrorResponse({ code, message = 'Invalid JWT' }: AuthFailure) {\n  return Response.json(\n    {\n      code,\n      message,\n      // DEPRECATED: Retained for backward compatibility.\n      msg: message,\n    },\n    {\n      status: 401,\n      headers: {\n        ...ERROR_CORS_HEADERS,\n        'sb-error-code': code,\n      },\n    }\n  )\n}\n\nasync function isValidLegacyJWT(jwt: string): Promise<AuthFailure | null> {\n  if (!JWT_SECRET) {\n    console.error('JWT_SECRET not available for HS256 token verification')\n    return { code: RequestErrors.InvalidLegacyJWT }\n  }\n\n  const encoder = new TextEncoder();\n  const secretKey = encoder.encode(JWT_SECRET);\n\n  try {\n    await jose.jwtVerify(jwt, secretKey);\n  } catch (e) {\n    console.error('Symmetric Legacy JWT verification error', e);\n    return { code: RequestErrors.InvalidLegacyJWT }\n  }\n  return null\n}\n\nasync function isValidJWT(jwt: string): Promise<AuthFailure | null> {\n  if (!LOCAL_JWKS) {\n    console.error('JWKS not available for ES256/RS256 token verification')\n    return { code: RequestErrors.InvalidAsymmetricJWT }\n  }\n\n  try {\n    await jose.jwtVerify(jwt, LOCAL_JWKS);\n  } catch (e) {\n    console.error('Asymmetric JWT verification error', e);\n    return { code: RequestErrors.InvalidAsymmetricJWT }\n  }\n\n  return null\n}\n\n/**\n * Verify JWT token, handling both legacy (HS256) and newer (ES256/RS256) algorithms\n * \n * This function automatically detects the algorithm used in the token and applies\n * the appropriate verification method:\n * - HS256: Uses JWT_SECRET (symmetric key)\n * - ES256/RS256: Uses JWKS endpoint (asymmetric public keys)\n * \n * This fix ensures compatibility with both legacy tokens and newer asymmetric tokens,\n * resolving the \"Key for the ES256 algorithm must be of type CryptoKey\" error.\n * \n * @param jwt - The JWT token string to verify\n * @returns Authentication failure details, or null when verification succeeds\n */\nasync function isValidHybridJWT(jwt: string): Promise<AuthFailure | null> {\n  let jwtAlgorithm: string | undefined\n  try {\n    jwtAlgorithm = jose.decodeProtectedHeader(jwt).alg\n  } catch (e) {\n    console.error('JWT format error', e)\n    return {\n      code: RequestErrors.InvalidTokenFormat,\n      message: 'Invalid JWT format',\n    }\n  }\n\n  if (typeof jwtAlgorithm !== 'string' || !jwtAlgorithm) {\n    return {\n      code: RequestErrors.InvalidTokenFormat,\n      message: 'Invalid JWT format',\n    }\n  }\n\n  if (jwtAlgorithm === 'HS256') {\n    console.log(`Legacy token type detected, attempting ${jwtAlgorithm} verification.`)\n\n    return await isValidLegacyJWT(jwt)\n  }\n\n  if (jwtAlgorithm === 'ES256' || jwtAlgorithm === 'RS256') {\n    return await isValidJWT(jwt)\n  }\n\n  return {\n    code: RequestErrors.UnsupportedTokenAlgorithm,\n    message: `Unsupported JWT algorithm ${jwtAlgorithm}`,\n  }\n}\n\nDeno.serve({ onError }, async (req: Request) => {\n  if (req.method !== 'OPTIONS' && VERIFY_JWT) {\n    const token = getAuthToken(req)\n    if (typeof token !== 'string') {\n      return getAuthErrorResponse(token)\n    }\n    const authFailure = await isValidHybridJWT(token)\n    if (authFailure) {\n      return getAuthErrorResponse(authFailure)\n    }\n  }\n\n  const url = new URL(req.url)\n  const { pathname } = url\n  const path_parts = pathname.split('/')\n  const service_name = path_parts[1]\n\n  if (!service_name || service_name === '') {\n    return getFunctionErrorResponse({\n      code: RequestErrors.NotFound,\n      message: 'Requested function was not found',\n      status: 404,\n    })\n  }\n\n  const servicePath = `/home/deno/functions/${service_name}`\n  console.error(`serving the request with ${servicePath}`)\n\n  try {\n    const serviceInfo = await Deno.stat(servicePath)\n    if (!serviceInfo.isDirectory) {\n      return getFunctionErrorResponse({\n        code: RequestErrors.NotFound,\n        message: 'Requested function was not found',\n        status: 404,\n      })\n    }\n  } catch (e) {\n    if (e instanceof Deno.errors.NotFound) {\n      return getFunctionErrorResponse({\n        code: RequestErrors.NotFound,\n        message: 'Requested function was not found',\n        status: 404,\n      })\n    }\n    console.error(e)\n    return getFunctionErrorResponse({\n      code: RequestErrors.BootError,\n      message: 'Function failed to start (please check logs)',\n      status: 503,\n    })\n  }\n\n  const memoryLimitMb = 256\n  // Keep the wall clock above the 150s request idle timeout configured in Compose.\n  const workerTimeoutMs = 400_000\n  const requestAbsentTimeoutMs = 60_000\n  const noModuleCache = false\n  // Using a common Import Map for all functions \n  // to use a scope 'deno.json' it must be dinamically resolved base on the 'service_name'\n  const importMapPath = `/home/deno/functions/deno.jsonc`\n  // SUPABASE_FUNCTION_SLUG is listed after the container env snapshot so\n  // nothing in it can shadow the value, and it is per-request because only this\n  // worker knows which function the request resolved to.\n  const envVarsObj = { ...Deno.env.toObject(), SUPABASE_FUNCTION_SLUG: service_name }\n  const envVars = Object.keys(envVarsObj).map((k) => [k, envVarsObj[k]])\n\n  const callWorker = async (req: Request, retriesLeft = MAX_WORKER_RETRIES): Promise<Response> => {\n    // Preserve the body before fetch() can consume it, even on a failed attempt.\n    // Must run before `new Request(req)` below, which takes over the body.\n    // The unread retry branch can buffer the entire body in main-worker memory,\n    // even when the first attempt succeeds.\n    const retryReq = retriesLeft > 0 ? req.clone() : null\n\n    try {\n      const worker = await EdgeRuntime.userWorkers.create({\n        servicePath,\n        memoryLimitMb,\n        workerTimeoutMs,\n        context: { supervisor: { requestAbsentTimeoutMs } },\n        noModuleCache,\n        importMapPath,\n        envVars,\n      })\n      // Gateway-minted internal JWT is for this router only; never expose it to user functions.\n      const userReq = new Request(req)\n      userReq.headers.delete('sb-api-key')\n      EdgeRuntime.applySupabaseTag(req, userReq)\n      return handleWorkerResponse(await worker.fetch(userReq))\n    } catch (e) {\n      // Retirement rejects before dispatch, so user code has not run yet.\n      if (e instanceof Deno.errors.WorkerAlreadyRetired && retryReq) {\n        console.warn(`${service_name}: worker retired before dispatch; retrying (${retriesLeft} left)`)\n        // Request.clone() does not copy the tag that connects streaming to the client.\n        EdgeRuntime.applySupabaseTag(req, retryReq)\n        return await callWorker(retryReq, retriesLeft - 1)\n      }\n\n      console.error(e)\n      return getFunctionErrorResponse(resolveRuntimeError(e))\n    }\n  }\n\n  return await callWorker(req)\n})\n"
  supabase-kong-inline-13:
    content: |
      #!/bin/sh
      # Custom entrypoint for Kong that builds Lua expressions for request-transformer
      # and performs environment variable substitution in the declarative config.

      # Build Lua expressions for translating opaque API keys to asymmetric JWTs.
      # When opaque keys are not configured (empty env vars), expressions fall through
      # to legacy-only behavior - just passing apikey as-is.
      #
      # Full expression logic (when opaque keys are configured):
      #   1. If Authorization header exists and is NOT an sb_ key -> pass through (user session JWT)
      #   2. If apikey matches secret key -> set service_role asymmetric JWT internal "API key"
      #   3. If apikey matches publishable key -> set anon asymmetric JWT internal "API key"
      #   4. Fallback: pass apikey as-is (legacy HS256 JWT)

      if [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
          # Opaque keys configured -> full translation expressions
          export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)"

          # Realtime WebSocket: reads from query_params.apikey (supabase-js sends apikey
          # via query string), outputs to x-api-key header which Realtime checks first.
          export LUA_RT_WS_EXPR="\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or query_params.apikey)"

          # Functions: translate opaque sb_ keys to the pre-signed internal asymmetric
          # JWT and emit it as a raw `sb-api-key` header (no Bearer prefix), leaving
          # Authorization untouched. The key is read from the apikey header or an
          # Authorization `Bearer sb_...` fallback (header only, matching platform
          # behavior. On no match the expression yields nil (rendered as an empty
          # header) which the route's post-function then strips.
          export LUA_FUNCTIONS_EXPR="\$((headers.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or (headers.authorization == 'Bearer $SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.authorization == 'Bearer $SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or nil)"
      else
          # Legacy API keys, not sb_ API keys -> pass apikey through unchanged
          export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
          export LUA_RT_WS_EXPR="\$(query_params.apikey)"

          # Functions: no opaque keys configured -> never set sb-api-key (the empty
          # value is stripped by the route's post-function).
          export LUA_FUNCTIONS_EXPR="\$(nil)"
      fi

      # Substitute environment variables in the Kong declarative config.
      # Uses awk instead of eval/echo to preserve YAML quoting (eval strips double
      # quotes, breaking "Header: value" patterns that YAML parses as mappings).
      awk '{
        result = ""
        rest = $0
        while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
          varname = substr(rest, RSTART + 1, RLENGTH - 1)
          if (varname in ENVIRON) {
            result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
          } else {
            result = result substr(rest, 1, RSTART + RLENGTH - 1)
          }
          rest = substr(rest, RSTART + RLENGTH)
        }
        print result rest
      }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"

      # Remove empty key-auth credentials (unconfigured opaque keys)
      sed -i '/^[[:space:]]*- key:[[:space:]]*$/d' "$KONG_DECLARATIVE_CONFIG"

      exec /entrypoint.sh kong docker-start
  supabase-kong-inline-14:
    content: |
      _format_version: '2.1'
      _transform: true

      ###
      ### Consumers / Users
      ###
      consumers:
        - username: DASHBOARD
        - username: anon
          keyauth_credentials:
            - key: $SUPABASE_ANON_KEY
            - key: $SUPABASE_PUBLISHABLE_KEY
        - username: service_role
          keyauth_credentials:
            - key: $SUPABASE_SERVICE_KEY
            - key: $SUPABASE_SECRET_KEY

      ###
      ### Access Control List
      ###
      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      ###
      ### Dashboard credentials
      ###
      basicauth_credentials:
        - consumer: DASHBOARD
          username: '$DASHBOARD_USERNAME'
          password: '$DASHBOARD_PASSWORD'

      ###
      ### API Routes
      ###
      services:
        ## Open Auth routes
        - name: auth-v1-open
          _comment: 'Auth: /auth/v1/verify* -> http://supabase-auth:9999/verify*'
          url: http://supabase-auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          _comment: 'Auth: /auth/v1/callback* -> http://supabase-auth:9999/callback*'
          url: http://supabase-auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          _comment: 'Auth: /auth/v1/authorize* -> http://supabase-auth:9999/authorize*'
          url: http://supabase-auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors
        - name: auth-v1-open-jwks
          _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://supabase-auth:9999/.well-known/jwks.json'
          url: http://supabase-auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-open-jwks
              strip_path: true
              paths:
                - /auth/v1/.well-known/jwks.json
          plugins:
            - name: cors
        - name: auth-v1-open-well-known-oauth
          _comment: 'Auth: /auth/v1/.well-known/oauth-authorization-server -> http://supabase-auth:9999/.well-known/oauth-authorization-server'
          url: http://supabase-auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: auth-v1-open-well-known-oauth
              strip_path: true
              paths:
                - /auth/v1/.well-known/oauth-authorization-server
          plugins:
            - name: cors
        - name: auth-v1-open-well-known-openid
          _comment: 'Auth: /auth/v1/.well-known/openid-configuration -> http://supabase-auth:9999/.well-known/openid-configuration'
          url: http://supabase-auth:9999/.well-known/openid-configuration
          routes:
            - name: auth-v1-open-well-known-openid
              strip_path: true
              paths:
                - /auth/v1/.well-known/openid-configuration
          plugins:
            - name: cors

        - name: auth-v1-open-sso-acs
          url: "http://supabase-auth:9999/sso/saml/acs"
          routes:
            - name: auth-v1-open-sso-acs
              strip_path: true
              paths:
              - /auth/v1/sso/saml/acs
          plugins:
            - name: cors

        - name: auth-v1-open-sso-metadata
          url: "http://supabase-auth:9999/sso/saml/metadata"
          routes:
            - name: auth-v1-open-sso-metadata
              strip_path: true
              paths:
              - /auth/v1/sso/saml/metadata
          plugins:
            - name: cors

        ## Secure Auth routes
        - name: auth-v1
          _comment: 'Auth: /auth/v1/* -> http://supabase-auth:9999/*'
          url: http://supabase-auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## OpenAPI root - admin only
        - name: rest-v1-openapi
          _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://supabase-rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
          url: http://supabase-rest:3000/
          routes:
            - name: rest-v1-openapi-root
              strip_path: true
              expression: 'http.path == "/rest/v1/"'
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Secure PostgREST routes
        - name: rest-v1
          _comment: 'PostgREST: /rest/v1/* -> http://supabase-rest:3000/*'
          url: http://supabase-rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure GraphQL routes
        - name: graphql-v1
          _comment: 'PostgREST: /graphql/v1/* -> http://supabase-rest:3000/rpc/graphql'
          url: http://supabase-rest:3000/rpc/graphql
          routes:
            - name: graphql-v1-all
              strip_path: true
              paths:
                - /graphql/v1
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Content-Profile: graphql_public"
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure Realtime routes
        - name: realtime-v1-ws
          _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
          url: http://realtime-dev:4000/socket
          protocol: ws
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths:
                - /realtime/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "x-api-key:$LUA_RT_WS_EXPR"
                replace:
                  querystring:
                    - "apikey:$LUA_RT_WS_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # Block access to /realtime/v1/api/openapi
        - name: realtime-v1-rest-openapi
          _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime:4000/api/openapi/* (blocked)'
          url: http://realtime-dev:4000/api/openapi
          protocol: http
          routes:
            - name: realtime-v1-rest-openapi
              strip_path: true
              paths:
                - /realtime/v1/api/openapi
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        # Block access to /realtime/v1/api/tenants
        - name: realtime-v1-rest-tenants
          _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime:4000/api/tenants/* (blocked)'
          url: http://realtime-dev:4000/api/tenants
          protocol: http
          routes:
            - name: realtime-v1-rest-tenants
              strip_path: true
              paths:
                - /realtime/v1/api/tenants
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        - name: realtime-v1-rest
          _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
          url: http://realtime-dev:4000/api
          protocol: http
          routes:
            - name: realtime-v1-rest
              strip_path: true
              paths:
                - /realtime/v1/api
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Storage API endpoint (with Authorization header transformation).
        ## No key-auth - S3 protocol requests don't carry an apikey header.
        ##
        ## The request-transformer translates opaque API keys to asymmetric JWTs
        ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
        ## When no Authorization or apikey header is present (S3 presigned URLs),
        ## the Lua expression evaluates to nil which Kong renders as empty string.
        ## The post-function strips this empty header so Storage's S3 signature
        ## verification falls through to query-parameter parsing.
        - name: storage-v1
          _comment: 'Storage: /storage/v1/* -> http://supabase-storage:5000/*'
          connect_timeout: $KONG_STORAGE_CONNECT_TIMEOUT
          write_timeout: $KONG_STORAGE_WRITE_TIMEOUT
          read_timeout: $KONG_STORAGE_READ_TIMEOUT
          url: http://supabase-storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths:
                - /storage/v1/
              request_buffering: $KONG_STORAGE_REQUEST_BUFFERING
              response_buffering: $KONG_STORAGE_RESPONSE_BUFFERING
          plugins:
            - name: cors
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: post-function
              config:
                access:
                  - |
                    local auth = kong.request.get_header("authorization")
                    if auth == nil or auth == "" or auth:find("^%s*$") then
                      kong.service.request.clear_header("authorization")
                    end

        ## Edge Functions routes
        ##
        ## Functions header handling: opaque sb_ keys are translated to the pre-signed
        ## internal asymmetric JWT and injected as a raw `sb-api-key` header (no
        ## `Bearer` prefix), while `Authorization` is left untouched so user-session
        ## JWTs and legacy bearers flow through to the runtime.
        ##
        ## No `key-auth`: Functions is a passthrough that does NOT validate keys. Kong
        ## cannot reject an invalid key while still letting unauthenticated requests
        ## through (key-auth's `anonymous` fallback accepts missing AND invalid keys
        ## alike), so unknown/invalid keys simply pass to the runtime, which handles
        ## verify_jwt itself.
        ##
        ## The request-transformer strips any client-supplied `sb-api-key` (anti-spoof)
        ## and re-adds the translated value; on no match the Lua expression yields nil
        ## (an empty header) which the post-function then removes.
        ##
        ## No `cors`: functions handle CORS themselves, as on the platform. Preflights
        ## reach the function and its responses pass through unchanged.
        - name: functions-v1
          _comment: 'Edge Functions: /functions/v1/* -> http://supabase-edge-functions:9000/*'
          url: http://supabase-edge-functions:9000/
          # Limit inactivity between reads, leaving 10s for the runtime's 150s idle timeout.
          read_timeout: 160000
          routes:
            - name: functions-v1-all
              strip_path: true
              paths:
                - /functions/v1/
          plugins:
            - name: request-transformer
              config:
                remove:
                  headers:
                    - "sb-api-key"
                add:
                  headers:
                    - "sb-api-key:$LUA_FUNCTIONS_EXPR"
            - name: post-function
              config:
                access:
                  - |
                    local v = kong.request.get_header("sb-api-key")
                    if v == nil or v == "" or v:find("^%s*$") then
                      kong.service.request.clear_header("sb-api-key")
                    end

        ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
        - name: well-known-oauth
          _comment: 'Auth: /.well-known/oauth-authorization-server/auth/v1 -> http://supabase-auth:9999/.well-known/oauth-authorization-server'
          url: http://supabase-auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: well-known-oauth
              strip_path: true
              paths:
                - /.well-known/oauth-authorization-server/auth/v1
          plugins:
            - name: cors

        ## Analytics routes
        ## Not used - Studio and Vector talk directly to analytics via Docker networking.
        ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
        # - name: analytics-v1-api
        #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
        #   url: http://supabase-analytics:4000/api/endpoints
        #   routes:
        #     - name: analytics-v1-api
        #       strip_path: true
        #       paths:
        #         - /analytics/v1/api/endpoints/
        # - name: analytics-v1
        #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
        #   url: http://supabase-analytics:4000/
        #   routes:
        #     - name: dashboard-v1-all
        #       strip_path: true
        #       paths:
        #         - /analytics/v1
        #   plugins:
        #     - name: cors
        #     - name: basic-auth
        #       config:
        #         hide_credentials: true

        ## Secure Database routes
        - name: meta
          _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
          url: http://supabase-meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths:
                - /pg/
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Block access to /api/mcp
        - name: mcp-blocker
          _comment: 'Block direct access to /api/mcp'
          url: http://supabase-studio:3000/api/mcp
          routes:
            - name: mcp-blocker-route
              strip_path: true
              paths:
                - /api/mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        ## MCP endpoint - local access
        - name: mcp
          _comment: 'MCP: /mcp -> http://supabase-studio:3000/api/mcp (local access)'
          url: http://supabase-studio:3000/api/mcp
          routes:
            - name: mcp
              strip_path: true
              paths:
                - /mcp
          plugins:
            # Block access to /mcp by default
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."
            # Enable local access (danger zone!)
            # 1. Comment out the 'request-termination' section above
            # 2. Uncomment the entire section below, including 'deny'
            # 3. Add your local IPs to the 'allow' list
            #- name: cors
            #- name: ip-restriction
            #  config:
            #    allow:
            #      - 127.0.0.1
            #      - ::1
            #    deny: []

        ## Protected Dashboard - catch all remaining routes
        - name: dashboard
          _comment: 'Studio: /* -> http://supabase-studio:3000/*'
          url: http://supabase-studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths:
                - /
          plugins:
            - name: cors
            - name: basic-auth
              config:
                hide_credentials: true
  supabase-supavisor-inline-15:
    content: |
      {:ok, _} = Application.ensure_all_started(:supavisor)
      {:ok, version} =
          case Supavisor.Repo.query!("select version()") do
          %{rows: [[ver]]} -> Supavisor.Helpers.parse_pg_version(ver)
          _ -> nil
          end
      params = %{
          "external_id" => System.get_env("POOLER_TENANT_ID"),
          "db_host" => System.get_env("POSTGRES_HOST") || "supabase-db",
          "db_port" => System.get_env("POSTGRES_PORT") |> String.to_integer(),
          "db_database" => System.get_env("POSTGRES_DB"),
          "require_user" => false,
          "auth_query" => "SELECT * FROM pgbouncer.get_auth($1)",
          "default_max_clients" => System.get_env("POOLER_MAX_CLIENT_CONN"),
          "default_pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
          "default_parameter_status" => %{"server_version" => version},
          "users" => [%{
          "db_user" => "pgbouncer",
          "db_password" => System.get_env("POSTGRES_PASSWORD"),
          "mode_type" => System.get_env("POOLER_POOL_MODE"),
          "pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
          "is_manager" => true
          }]
      }

      tenant = Supavisor.Tenants.get_tenant_by_external_id(params["external_id"])

      if tenant do
        {:ok, _} = Supavisor.Tenants.update_tenant(tenant, params)
      else
        {:ok, _} = Supavisor.Tenants.create_tenant(params)
      end
  supabase-vector-inline-16:
    content: |
      api:
        enabled: true
        address: 0.0.0.0:9001

      sources:
        docker_host:
          type: docker_logs
          # Only collect logs of this stack. Other Supabase stacks on the same server have their own Vector.
          include_labels:
            - 'com.docker.compose.project=${COOLIFY_RESOURCE_UUID?COOLIFY_RESOURCE_UUID is required}'
          exclude_containers:
            - supabase-vector

      transforms:
        project_logs:
          type: remap
          inputs:
            - docker_host
          source: |-
            .project = "default"
            .event_message = del(.message)
            .appname = del(.container_name)
            del(.container_created_at)
            del(.container_id)
            del(.source_type)
            del(.stream)
            del(.label)
            del(.image)
            del(.host)
            del(.stream)
        router:
          type: route
          inputs:
            - project_logs
          route:
            kong: 'contains(string!(.appname), "supabase-kong")'
            auth: 'contains(string!(.appname), "supabase-auth")'
            rest: 'contains(string!(.appname), "supabase-rest")'
            realtime: 'contains(string!(.appname), "realtime-dev")'
            storage: 'contains(string!(.appname), "supabase-storage")'
            functions: 'contains(string!(.appname), "supabase-edge-functions")'
            db: 'contains(string!(.appname), "supabase-db")'
        # Ignores non nginx errors since they are related with kong booting up
        kong_logs:
          type: remap
          inputs:
            - router.kong
          source: |-
            req, err = parse_nginx_log(.event_message, "combined")
            if err == null {
                .timestamp = req.timestamp
                .metadata.request.headers.referer = req.referer
                .metadata.request.headers.user_agent = req.agent
                .metadata.request.headers.cf_connecting_ip = req.client
                .metadata.response.status_code = req.status
                url, split_err = split(req.request, " ")
                if split_err == null {
                    .metadata.request.method = url[0]
                    .metadata.request.path = url[1]
                    .metadata.request.protocol = url[2]
                }
            }
            if err != null {
              abort
            }
        # Ignores non nginx errors since they are related with kong booting up
        kong_err:
          type: remap
          inputs:
            - router.kong
          source: |-
            .metadata.request.method = "GET"
            .metadata.response.status_code = 200
            parsed, err = parse_nginx_log(.event_message, "error")
            if err == null {
                .timestamp = parsed.timestamp
                .severity = parsed.severity
                .metadata.request.host = parsed.host
                .metadata.request.headers.cf_connecting_ip = parsed.client
                url, err = split(parsed.request, " ")
                if err == null {
                    .metadata.request.method = url[0]
                    .metadata.request.path = url[1]
                    .metadata.request.protocol = url[2]
                }
            }
            if err != null {
              abort
            }
        # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
        auth_logs:
          type: remap
          inputs:
            - router.auth
          source: |-
            parsed, err = parse_json(.event_message)
            if err == null {
                .metadata.timestamp = parsed.time
                .metadata = merge!(.metadata, parsed)
            }
        # PostgREST logs are structured so we separate timestamp from message using regex
        rest_logs:
          type: remap
          inputs:
            - router.rest
          source: |-
            parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
            if err == null {
                .event_message = parsed.msg
                .timestamp = parse_timestamp!(value: parsed.time, format: "%d/%b/%Y:%H:%M:%S %z")
                .metadata.host = .project
            }
        # Filter out healthcheck logs from Realtime
        realtime_logs_filtered:
          type: filter
          inputs:
            - router.realtime
          condition: '!contains(string!(.event_message), "/health")'
        # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
        realtime_logs:
          type: remap
          inputs:
            - realtime_logs_filtered
          source: |-
            .metadata.project = del(.project)
            .metadata.external_id = .metadata.project
            parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
            if err == null {
                .event_message = parsed.msg
                .metadata.level = parsed.level
            }
        # Storage logs may contain json objects so we parse them for completeness
        storage_logs:
          type: remap
          inputs:
            - router.storage
          source: |-
            .metadata.project = del(.project)
            .metadata.tenantId = .metadata.project
            parsed, err = parse_json(.event_message)
            if err == null {
                .event_message = parsed.msg
                .metadata.level = parsed.level
                .metadata.timestamp = parsed.time
                .metadata.context[0].host = parsed.hostname
                .metadata.context[0].pid = parsed.pid
            }
        # Function logs are unstructured messages on stderr
        functions_logs:
          type: remap
          inputs:
            - router.functions
          source: |-
            .metadata.project_ref = del(.project)
        # Postgres logs some messages to stderr which we map to warning severity level
        db_logs:
          type: remap
          inputs:
            - router.db
          source: |-
            .metadata.host = "db-default"
            .metadata.parsed.timestamp = .timestamp

            parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

            if err != null || parsed == null {
              .metadata.parsed.error_severity = "info"
            }
            if parsed.level != null {
             .metadata.parsed.error_severity = parsed.level
            }
            if .metadata.parsed.error_severity == "info" {
                .metadata.parsed.error_severity = "log"
            }
            .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

      sinks:
        logflare_auth:
          type: 'http'
          inputs:
            - auth_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=gotrue.logs.prod'
        logflare_realtime:
          type: 'http'
          inputs:
            - realtime_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=realtime.logs.prod'
        logflare_rest:
          type: 'http'
          inputs:
            - rest_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=postgREST.logs.prod'
        logflare_db:
          type: 'http'
          inputs:
            - db_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=postgres.logs'
        logflare_functions:
          type: 'http'
          inputs:
            - functions_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=deno-relay-logs'
        logflare_storage:
          type: 'http'
          inputs:
            - storage_logs
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=storage.logs.prod.2'
        logflare_kong:
          type: 'http'
          inputs:
            - kong_logs
            - kong_err
          encoding:
            codec: 'json'
          method: 'post'
          request:
            retry_max_duration_secs: 30
            retry_initial_backoff_secs: 1
            headers:
              x-api-key: '${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}'
          uri: 'http://supabase-analytics:4000/api/logs?source_name=cloudflare.logs.prod'
networks:
  appnet:
    external: true
    name: ${APP_NET}
  dockerro:
    external: true
    name: cloudos-docker-ro-net
services:
  imgproxy:
    environment:
    - IMGPROXY_BIND=:8080
    - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
    - IMGPROXY_USE_ETAG=true
    - IMGPROXY_AUTO_WEBP=${IMGPROXY_AUTO_WEBP:-true}
    - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD
      - imgproxy
      - health
      timeout: 5s
    image: darthsim/imgproxy:v4.0.21
    networks:
      appnet:
        aliases:
        - supabase-coolify_imgproxy_1
    restart: unless-stopped
    volumes:
    - ./volumes/storage:/var/lib/storage
  minio-createbucket:
    configs:
    - source: minio-createbucket-inline-1
      target: /entrypoint.sh
    depends_on:
      supabase-minio:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /entrypoint.sh
    environment:
    - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
    - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    networks:
      appnet:
        aliases:
        - supabase-coolify_minio-createbucket_1
    restart: no
    volumes: []
  realtime-dev:
    depends_on:
      supabase-analytics:
        condition: service_healthy
      supabase-db:
        condition: service_healthy
    environment:
    - PORT=4000
    - DB_HOST=${POSTGRES_HOSTNAME:-supabase-db}
    - DB_PORT=${POSTGRES_PORT:-5432}
    - DB_USER=supabase_admin
    - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - DB_NAME=${POSTGRES_DB:-postgres}
    - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
    - DB_ENC_KEY=${REALTIME_DB_ENC_KEY:-supabaserealtime}
    - API_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - SECRET_KEY_BASE=${SERVICE_PASSWORD_64_REALTIME}
    - METRICS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - ERL_AFLAGS=-proto_dist inet_tcp
    - DNS_NODES=''
    - RLIMIT_NOFILE=10000
    - APP_NAME=realtime
    - SEED_SELF_HOST=true
    - LOG_LEVEL=error
    - RUN_JANITOR=true
    - JANITOR_INTERVAL=60000
    - DISABLE_HEALTHCHECK_LOGGING=true
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -sSfL
      - --head
      - -o
      - /dev/null
      - -H
      - 'Authorization: Bearer ${SERVICE_SUPABASEANON_KEY}'
      - http://127.0.0.1:4000/api/tenants/realtime-dev/health
      timeout: 5s
    image: supabase/realtime:v2.148.3
    networks:
      appnet:
        aliases:
        - supabase-coolify_realtime-dev_1
    restart: unless-stopped
  supabase-analytics:
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
    - LOGFLARE_NODE_HOST=127.0.0.1
    - DB_USERNAME=supabase_admin
    - DB_DATABASE=_supabase
    - DB_HOSTNAME=${POSTGRES_HOSTNAME:-supabase-db}
    - DB_PORT=${POSTGRES_PORT:-5432}
    - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - DB_SCHEMA=_analytics
    - LOGFLARE_PUBLIC_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLARE}
    - LOGFLARE_PRIVATE_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLAREPRIVATE}
    - LOGFLARE_SINGLE_TENANT=true
    - LOGFLARE_SUPABASE_MODE=true
    - POSTGRES_BACKEND_URL=postgresql://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase
    - POSTGRES_BACKEND_SCHEMA=_analytics
    - LOGFLARE_FEATURE_FLAG_OVERRIDE=multibackend=true
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 30s
      test:
      - CMD
      - curl
      - -sSfL
      - -o
      - /dev/null
      - http://127.0.0.1:4000/health
      timeout: 5s
    image: supabase/logflare:1.50.15
    networks:
      appnet:
        aliases:
        - supabase-coolify_supabase-analytics_1
    restart: unless-stopped
  supabase-auth:
    depends_on:
      supabase-analytics:
        condition: service_healthy
      supabase-db:
        condition: service_healthy
    environment:
    - GOTRUE_API_HOST=0.0.0.0
    - GOTRUE_API_PORT=9999
    - API_EXTERNAL_URL=${API_EXTERNAL_URL:-${SERVICE_URL_SUPABASEKONG}/auth/v1}
    - GOTRUE_DB_DRIVER=postgres
    - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
    - GOTRUE_SITE_URL=${GOTRUE_SITE_URL:-${SERVICE_URL_SUPABASEKONG}}
    - GOTRUE_URI_ALLOW_LIST=${ADDITIONAL_REDIRECT_URLS}
    - GOTRUE_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    - GOTRUE_JWT_ADMIN_ROLES=service_role
    - GOTRUE_JWT_AUD=authenticated
    - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
    - GOTRUE_JWT_EXP=${JWT_EXPIRY:-3600}
    - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
    - GOTRUE_JWT_ISSUER=${API_EXTERNAL_URL:-${SERVICE_URL_SUPABASEKONG}/auth/v1}
    - GOTRUE_EXTERNAL_EMAIL_ENABLED=${ENABLE_EMAIL_SIGNUP:-true}
    - GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=${ENABLE_ANONYMOUS_USERS:-false}
    - GOTRUE_MAILER_AUTOCONFIRM=${ENABLE_EMAIL_AUTOCONFIRM:-false}
    - GOTRUE_SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL}
    - GOTRUE_SMTP_HOST=${SMTP_HOST}
    - GOTRUE_SMTP_PORT=${SMTP_PORT:-587}
    - GOTRUE_SMTP_USER=${SMTP_USER}
    - GOTRUE_SMTP_PASS=${SMTP_PASS}
    - GOTRUE_SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
    - GOTRUE_MAILER_URLPATHS_INVITE=${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
    - GOTRUE_MAILER_URLPATHS_CONFIRMATION=${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
    - GOTRUE_MAILER_URLPATHS_RECOVERY=${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
    - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
    - GOTRUE_MAILER_TEMPLATES_INVITE=${MAILER_TEMPLATES_INVITE}
    - GOTRUE_MAILER_TEMPLATES_CONFIRMATION=${MAILER_TEMPLATES_CONFIRMATION}
    - GOTRUE_MAILER_TEMPLATES_RECOVERY=${MAILER_TEMPLATES_RECOVERY}
    - GOTRUE_MAILER_TEMPLATES_MAGIC_LINK=${MAILER_TEMPLATES_MAGIC_LINK}
    - GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE=${MAILER_TEMPLATES_EMAIL_CHANGE}
    - GOTRUE_MAILER_SUBJECTS_CONFIRMATION=${MAILER_SUBJECTS_CONFIRMATION}
    - GOTRUE_MAILER_SUBJECTS_RECOVERY=${MAILER_SUBJECTS_RECOVERY}
    - GOTRUE_MAILER_SUBJECTS_MAGIC_LINK=${MAILER_SUBJECTS_MAGIC_LINK}
    - GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE=${MAILER_SUBJECTS_EMAIL_CHANGE}
    - GOTRUE_MAILER_SUBJECTS_INVITE=${MAILER_SUBJECTS_INVITE}
    - GOTRUE_EXTERNAL_PHONE_ENABLED=${ENABLE_PHONE_SIGNUP:-true}
    - GOTRUE_SMS_AUTOCONFIRM=${ENABLE_PHONE_AUTOCONFIRM:-true}
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:9999/health
      timeout: 5s
    image: supabase/gotrue:v2.197.0
    networks:
      appnet:
        aliases:
        - supabase-coolify_supabase-auth_1
    restart: unless-stopped
  supabase-db:
    command:
    - postgres
    - -c
    - config_file=/etc/postgresql/postgresql.conf
    - -c
    - log_min_messages=fatal
    configs:
    - source: supabase-db-inline-2
      target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
    - source: supabase-db-inline-3
      target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
    - source: supabase-db-inline-4
      target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
    - source: supabase-db-inline-5
      target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
    - source: supabase-db-inline-6
      target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
    - source: supabase-db-inline-7
      target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
    - source: supabase-db-inline-8
      target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
    depends_on:
      supabase-vector:
        condition: service_healthy
    environment:
    - POSTGRES_HOST=/var/run/postgresql
    - PGPORT=${POSTGRES_PORT:-5432}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - PGDATABASE=${POSTGRES_DB:-postgres}
    - POSTGRES_DB=${POSTGRES_DB:-postgres}
    - JWT_EXP=${JWT_EXPIRY:-3600}
    healthcheck:
      interval: 5s
      retries: 10
