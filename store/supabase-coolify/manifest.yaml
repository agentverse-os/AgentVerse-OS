# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/supabase-coolify
description: The open source Firebase alternative.
endpoint:
  port: 8000
  service: supabase-kong
env:
  ADDITIONAL_REDIRECT_URLS: ''
  ANON_KEY_ASYMMETRIC: ''
  API_EXTERNAL_URL: http://supabase-kong:8000
  DISABLE_SIGNUP: 'false'
  ENABLE_ANONYMOUS_USERS: 'false'
  ENABLE_EMAIL_AUTOCONFIRM: 'false'
  ENABLE_EMAIL_SIGNUP: 'true'
  ENABLE_PHONE_AUTOCONFIRM: 'true'
