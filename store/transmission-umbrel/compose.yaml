# transmission-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/transmission:4.1.4@sha256:5b3c27a96c8a37c878a525ebf377a32032c3a3acfe845ecaa7c3eb10b09c2caa
    networks:
      appnet:
        aliases:
        - transmission_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
  widget-server:
    environment:
    - TRANSMISSION_URL=http://transmission_server_1
    - TRANSMISSION_PORT=9091
    image: ghcr.io/getumbrel/umbrel-transmission-widget:v1.0.1@sha256:4f65b7fc1940fd7c6604a3f6180edbd163d4add06c6601f195f29105630d709e
    networks:
      appnet:
        aliases:
        - transmission_widget-server_1
    restart: on-failure
