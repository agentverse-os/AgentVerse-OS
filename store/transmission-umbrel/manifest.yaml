# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/transmission-umbrel
description: A fast, easy and free BitTorrent client
endpoint:
  port: 9091
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/transmission/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/transmission/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/transmission/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/transmission/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: transmission-umbrel
notes:
- 'порт 51413:51413 (server) не публикуется: доступ только через edge/gate'
- 'порт 51413:51413/udp (server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Transmission
type: app
upstream:
  author: Transmission
  categories:
  - networking
  release_notes: |-
    This release improves download reliability and fixes several bugs:
      - Fixed handling of torrents with zero-byte files that could lose downloaded progress
      - Fixed downloads from webseeds sometimes failing to finish
      - Fixed per-torrent speed-limit overrides for downloads and uploads
      - Fixed torrent names sometimes appearing as "Unknown" in the web interface
      - Hardened torrent-add requests and fixed a rare shutdown hang


    Full release notes are available at https://github.com/transmission/transmission/releases/tag/4.1.4
  source: https://github.com/transmission/transmission
  version: 4.1.4
  website: https://transmissionbt.com/
website: https://transmissionbt.com/
