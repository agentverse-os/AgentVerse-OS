upstream:
  author: NocoDB Inc.
  categories:
  - files
  release_notes: |-
    New features and improvements in this release:
      - Adds realtime presence in Grid views so collaborators can see where others are working
      - Adds folders for grouping tables, documents, dashboards, and views
      - Adds support for freezing multiple fields in Grid views
      - Improves Interfaces with copied view settings, field sizing, dashboard permissions, and layout polish
      - Improves API support for v3 records upsert link fields and currency-field schema details
      - Fixes two-factor sign-in in the installed app, scheduled snapshot naming, rich text previews, AI response recovery, API field updates, link-field permissions, and interface permissions


    Full release notes can be found at https://github.com/nocodb/nocodb/releases/tag/2026.08.1
  source: https://github.com/nocodb/nocodb
  version: 2026.08.1
  website: https://nocodb.com
