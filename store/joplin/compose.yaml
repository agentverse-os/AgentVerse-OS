# joplin: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db-joplin:
    environment:
      POSTGRES_DB: joplin
      POSTGRES_PASSWORD: ${JOPLIN_DB_PASSWORD}
      POSTGRES_USER: tipi
    image: postgres:14.2
    networks:
      appnet:
        aliases:
        - joplin_db-joplin_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
  joplin:
    depends_on:
    - db-joplin
    environment:
      APP_BASE_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}/
      APP_PORT: '22300'
      DB_CLIENT: pg
      MAX_TIME_DRIFT: '0'
      POSTGRES_DATABASE: joplin
      POSTGRES_HOST: db-joplin
      POSTGRES_PASSWORD: ${JOPLIN_DB_PASSWORD}
      POSTGRES_PORT: '5432'
      POSTGRES_USER: tipi
    image: joplin/server:3.7.1
    networks:
      appnet:
        aliases:
        - joplin_joplin_1
    restart: unless-stopped
