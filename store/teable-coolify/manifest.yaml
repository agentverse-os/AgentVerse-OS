# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/teable-coolify
description: Teable is a powerful visual interface built on relational databases (PostgreSQL).
endpoint:
  port: 3000
  service: teable
env:
  BACKEND_MAIL_AUTH_PASS: ''
  BACKEND_MAIL_AUTH_USER: ''
  BACKEND_MAIL_HOST: ''
  BACKEND_MAIL_PORT: ''
  BACKEND_MAIL_SECURE: ''
  BACKEND_MAIL_SENDER: ''
  BACKEND_MAIL_SENDER_NAME: ''
  POSTGRES_DB: ''
  POSTGRES_PORT: ''
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_SECRET:
    generate: hex64
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_URL_TEABLE: https://${APP_DOMAIN}
  SERVICE_URL_TEABLE_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  TIMEZONE: ''
gallery: []
health: null
