# neko-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      NEKO_DESKTOP_SCREEN: 1920x1080@30
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: $APP_PASSWORD
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: neko
      NEKO_WEBRTC_EPR: 52000-52100
      NEKO_WEBRTC_ICELITE: 0
      PGID: 1000
      PUID: 1000
    image: ghcr.io/m1k1o/neko/firefox:3.2.0@sha256:415730ef9e3c35d850fdbbb95aa150cb9eda0b9c260c61d1974fb3af39cb71c3
    networks:
      appnet:
        aliases:
        - neko_web_1
    restart: on-failure
    shm_size: 2gb
