# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/kan-umbrel
description: The open source Trello alternative
endpoint:
  port: 3000
  service: server
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/kan/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/kan/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/kan/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/kan/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: kan-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: kan
type: app
upstream:
  author: kanbn
  categories:
  - files
  release_notes: |-
    Kan 0.7.0 adds a calendar view, board invitations, and the ability to move boards between workspaces. Existing workspace members keep access to existing boards after the update.

    You can now submit comments with a keyboard shortcut, choose the order of card activity, and copy board links from the board menu.

    This release also improves drag-and-drop, board filters and scrolling, preserves custom label colours, and fixes card descriptions, login redirects, and MCP tools.

    Security improvements protect stored Trello tokens, redact secrets from request logs, and restrict card labels and member assignments to the appropriate board and workspace.

    Full release notes can be found at https://github.com/kanbn/kan/releases/tag/v0.7.0
  source: https://github.com/kanbn/kan
  version: 0.7.0
  website: https://kan.bn/
website: https://kan.bn/
