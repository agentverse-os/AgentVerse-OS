# kan-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: kan
      POSTGRES_PASSWORD: kanpassword
      POSTGRES_USER: kanuser
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U kanuser -d kan
      timeout: 5s
    image: postgres:17.3@sha256:0321e2252ebfeecb8bc1a899755084d29bce872953e1a5a3e25ec0860b739098
    networks:
      appnet:
        aliases:
        - kan_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
  migrate:
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://kanuser:kanpassword@kan_db_1:5432/kan?sslmode=disable
    image: ghcr.io/kanbn/kan-migrate:0.7.0@sha256:dc92e02b8714df0ab844ebed74e1d053318fce15d847bc271659d0852b044e83
    networks:
      appnet:
        aliases:
        - kan_migrate_1
    restart: on-failure
  server:
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      BETTER_AUTH_SECRET: ${APP_SEED}
      NEXT_PUBLIC_ALLOW_CREDENTIALS: 'true'
      NEXT_PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME}:8373
      POSTGRES_URL: postgresql://kanuser:kanpassword@kan_db_1:5432/kan?sslmode=disable
    image: ghcr.io/kanbn/kan:0.7.0@sha256:99d60e0b539ae70c76d1a02d04e96fd17cfe1d1a6c6bab6e9f9107e644dd8038
    networks:
      appnet:
        aliases:
        - kan_server_1
    restart: on-failure
