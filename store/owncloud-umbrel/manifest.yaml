# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/owncloud-umbrel
description: A smart cloud for your files
endpoint:
  port: 8080
  service: server
env:
  APP_OWNCLOUD_LOCAL_IPS: ${local_ips}
  APP_PASSWORD:
    generate: password
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/owncloud/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/owncloud/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/owncloud/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/owncloud/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/owncloud/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: admin
name: owncloud-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: ownCloud
type: app
upstream:
  author: ownCloud GmbH
  categories:
  - files
  release_notes: |-
    This update improves account security and certificate handling:
    - Temporarily locks local accounts for ten minutes after five repeated failed login attempts. - Verifies signatures when installing or updating ownCloud app packages. - Refreshes trusted certificates and rebuilds certificate bundles during upgrades. - Fixes errors when accessing Google Drive external storage.

    The updated certificate store removes older trusted roots. External HTTPS services relying only on a removed root may require certificate updates or an administrator-managed certificate import.

    If you are upgrading from an older 10.x package, review the ownCloud 11 release notes before updating if you rely on group-admin/subadmin behavior or deprecated occ commands.

    Full release notes: https://github.com/owncloud/core/releases/tag/v11.1.0
  source: https://github.com/owncloud-docker/server
  version: 11.1.0
  website: https://owncloud.com
website: https://owncloud.com
