# changedetection: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  changedetection:
    hostname: changedetection
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.8
    networks:
      appnet:
        aliases:
        - changedetection_changedetection_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/datastore
