# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/metamcp-coolify
description: MCP Aggregator, Orchestrator, Middleware, Gateway in one app
endpoint:
  port: 12008
  service: app
env:
  POSTGRES_DB: metamcp_db
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  SERVICE_PASSWORD_AUTH:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_METAMCP: https://${APP_DOMAIN}
  SERVICE_URL_METAMCP_12008: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: 'true'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: metamcp-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRES_HOST
  hint: 'по умолчанию: postgres'
  label: postgres host
  options: null
  required: false
  type: text
- env: POSTGRES_PORT
  hint: 'по умолчанию: 5432'
  label: postgres port
  options: null
  required: false
  type: text
- env: POSTGRES_DB
  hint: 'по умолчанию: metamcp_db'
  label: postgres db
  options: null
  required: false
  type: text
- env: TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL
  hint: 'по умолчанию: true'
  label: transform localhost to docker internal
  options: null
  required: false
  type: text
tags:
- mcp
- ai
- sse
- aggregator
- orchestrator
- middleware
title: Metamcp
type: app
upstream:
  categories:
  - mcp
  source: https://github.com/metatool-ai/metamcp
  tags:
  - mcp
  - ai
  - sse
  - aggregator
  - orchestrator
  - middleware
  template: metamcp.yaml
website: https://github.com/metatool-ai/metamcp
