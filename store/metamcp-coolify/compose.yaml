# metamcp-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_METAMCP_12008=${SERVICE_URL_METAMCP_12008}
    - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-metamcp_db}
    - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}
    - APP_URL=${SERVICE_URL_METAMCP}
    - NEXT_PUBLIC_APP_URL=${SERVICE_URL_METAMCP}
    - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_AUTH}
    - TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL=${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - curl
      - -f
      - http://localhost:12008/health
      timeout: 5s
    image: ghcr.io/metatool-ai/metamcp:2.4
    networks:
      appnet:
        aliases:
        - metamcp-coolify_app_1
    restart: unless-stopped
  postgres:
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-metamcp_db}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-metamcp_db}
      timeout: 5s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - metamcp-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres_data
      o: bind
      type: none
