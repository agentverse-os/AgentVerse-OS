# pyload-ng-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    image: linuxserver/pyload-ng:0.5.0@sha256:8505c2a9b6ef6dafb7e57daa91d896b8bb11f3a396c939a7dc6c47533b89ec79
    networks:
      appnet:
        aliases:
        - pyload-ng_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
