# searxng-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
configs:
  searxng-inline-1:
    content: |
      # see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
      use_default_settings: true
      server:
        limiter: false
        image_proxy: true
      search:
        formats:
          - html
          - csv
          - json
          - rss
      ui:
        static_use_hash: true
  searxng-inline-2:
    content: |
      # This configuration file updates the default configuration file
      # See https://github.com/searxng/searxng/blob/master/searx/botdetection/limiter.toml

      [botdetection.ip_limit]
      # activate link_token method in the ip_limit method
      link_token = true
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  searxng:
    configs:
    - source: searxng-inline-1
      target: /etc/searxng/settings.yml
    - source: searxng-inline-2
      target: /etc/searxng/limiter.toml
    depends_on:
      valkey:
        condition: service_healthy
    environment:
    - SERVICE_URL_SEARXNG_8080=${SERVICE_URL_SEARXNG_8080}
    - INSTANCE_NAME=${INSTANCE_NAME:-coolify}
    - BASE_URL=${SERVICE_URL_SEARXNG_8080}
    - SEARXNG_URL=${SERVICE_URL_SEARXNG_8080}
    - SEARXNG_BIND_ADDRESS=${SEARXNG_BIND_ADDRESS:-0.0.0.0}
    - SEARXNG_SECRET=${SERVICE_PASSWORD_SEARXNGSECRET}
    - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/healthz
      timeout: 5s
    image: searxng/searxng:2026.11.15-2d500cb6b
    networks:
      appnet:
        aliases:
        - searxng-coolify_searxng_1
    restart: unless-stopped
    volumes: []
  valkey:
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    healthcheck:
      interval: 5s
      retries: 3
      test:
      - CMD
      - valkey-cli
      - ping
      timeout: 5s
    image: valkey/valkey:9-alpine
    networks:
      appnet:
        aliases:
        - searxng-coolify_valkey_1
    restart: always
    volumes:
    - valkey-data:/data
volumes:
  valkey-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/valkey-data
      o: bind
      type: none
