# usesend-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${SERVICE_DB_POSTGRES:-usesend}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16
    networks:
      appnet:
        aliases:
        - usesend-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - usesend-postgres-data:/var/lib/postgresql/data
  redis:
    command:
    - redis-server
    - --maxmemory-policy
    - noeviction
    healthcheck:
      interval: 5s
      retries: 20
      test:
      - CMD
      - redis-cli
      - PING
      timeout: 10s
    image: redis:7
    networks:
      appnet:
        aliases:
        - usesend-coolify_redis_1
    restart: unless-stopped
    volumes:
    - usesend-redis-data:/data
  usesend:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_USESEND_3000=${SERVICE_URL_USESEND_3000}
    - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${SERVICE_DB_POSTGRES:-usesend}
    - NEXTAUTH_URL=${SERVICE_URL_USESEND}
    - NEXTAUTH_SECRET=${SERVICE_BASE64_64_NEXTAUTHSECRET}
    - AWS_ACCESS_KEY=
    - AWS_SECRET_KEY=
    - AWS_DEFAULT_REGION=
    - GITHUB_ID=
    - GITHUB_SECRET=
    - REDIS_URL=redis://redis:6379
    - NEXT_PUBLIC_IS_CLOUD=${NEXT_PUBLIC_IS_CLOUD:-false}
    - API_RATE_LIMIT=${API_RATE_LIMIT:-1}
    - HOSTNAME=0.0.0.0
    expose:
    - 3000
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://usesend:3000 || exit 1
      timeout: 2s
    image: usesend/usesend:latest
    networks:
      appnet:
        aliases:
        - usesend-coolify_usesend_1
    restart: unless-stopped
volumes:
  usesend-postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/usesend-postgres-data
      o: bind
      type: none
  usesend-redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/usesend-redis-data
      o: bind
      type: none
