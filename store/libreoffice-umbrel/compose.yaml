# libreoffice-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    hostname: libreoffice
    image: linuxserver/libreoffice:25.8.7@sha256:cd95f41ecfc36dab3af29eb9dba21271a0d828dc512f2c46294cf3341e0cd0c3
    networks:
      appnet:
        aliases:
        - libreoffice_server_1
    restart: on-failure
    shm_size: 1gb
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
