# pingvin-share: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  pingvin-share:
    image: ghcr.io/smp46/pingvin-share-x:v2.1.1
    networks:
      appnet:
        aliases:
        - pingvin-share_pingvin-share_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/opt/app/backend/data
    - ${APP_DATA_DIR}/data/images:/opt/app/frontend/public/img
