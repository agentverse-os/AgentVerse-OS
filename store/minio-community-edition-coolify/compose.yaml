# minio-community-edition-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  minio:
    command: server /data --console-address ":9001"
    environment:
    - MINIO_SERVER_URL=$MINIO_SERVER_URL
    - MINIO_BROWSER_REDIRECT_URL=$MINIO_BROWSER_REDIRECT_URL
    - MINIO_ROOT_USER=$SERVICE_USER_MINIO
    - MINIO_ROOT_PASSWORD=$SERVICE_PASSWORD_MINIO
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 20s
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    networks:
      appnet:
        aliases:
        - minio-community-edition-coolify_minio_1
    restart: unless-stopped
    volumes:
    - minio-data:/data
volumes:
  minio-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/minio-data
      o: bind
      type: none
