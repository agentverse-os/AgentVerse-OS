  port: 8086
  service: influxdb
env:
  SERVICE_PASSWORD_INFLUXDB:
    generate: password
  SERVICE_URL_INFLUXDB_8086: https://${APP_DOMAIN}
  SERVICE_USER_INFLUXDB:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: null
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_INFLUXDB
  path: null
  user: SERVICE_USER_INFLUXDB
name: influxdb-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- influxdb
- time series
- metrics
- iot
- monitoring
- telegraf
title: Influxdb
type: app
upstream:
  categories:
  - databases
  source: https://docs.influxdata.com/influxdb/
  tags:
  - influxdb
  - time series
  - metrics
  - iot
  - monitoring
  - telegraf
