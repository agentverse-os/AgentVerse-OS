  hint: 'по умолчанию: false'
  label: prefect experimental enable schedule concurrency
  options: null
  required: false
  type: text
- env: PREFECT_RUNNER_SERVER_ENABLE
  hint: 'по умолчанию: false'
  label: prefect runner server enable
  options: null
  required: false
  type: text
- env: DEFAULT_POOL_NAME
  hint: 'по умолчанию: default'
  label: default pool name
