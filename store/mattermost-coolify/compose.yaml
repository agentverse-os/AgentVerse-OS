# mattermost-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mattermost:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_MATTERMOST_8065=${SERVICE_URL_MATTERMOST_8065}
    - MM_SERVICESETTINGS_SITEURL=${SERVICE_URL_MATTERMOST}
    - TZ=${TZ:-UTC}
    - MM_SQLSETTINGS_DRIVERNAME=postgres
    - MM_SQLSETTINGS_DATASOURCE=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/$POSTGRES_DB?sslmode=disable&connect_timeout=10
    - MM_BLEVESETTINGS_INDEXDIR=/mattermost/bleve-indexes
    image: mattermost/mattermost-team-edition:release-10
    networks:
      appnet:
        aliases:
        - mattermost-coolify_mattermost_1
    platform: linux/amd64
    restart: unless-stopped
    volumes:
    - mattermost-data-config:/mattermost/config:rw
    - mattermost-data-data:/mattermost/data:rw
    - mattermost-data-logs:/mattermost/logs:rw
    - mattermost-data-plugins:/mattermost/plugins:rw
    - mattermost-data-client-plugins:/mattermost/client/plugins:rw
    - mattermost-data-bleve-indexes:/mattermost/bleve-indexes:rw
  postgres:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=${POSTGRES_DB:-mattermost}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - mattermost-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgresql-data:/var/lib/postgresql/data
volumes:
  mattermost-data-bleve-indexes:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mattermost-data-bleve-indexes
      o: bind
      type: none
  mattermost-data-client-plugins:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mattermost-data-client-plugins
      o: bind
      type: none
  mattermost-data-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mattermost-data-config
      o: bind
      type: none
  mattermost-data-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mattermost-data-data
      o: bind
      type: none
  mattermost-data-logs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mattermost-data-logs
      o: bind
      type: none
  mattermost-data-plugins:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mattermost-data-plugins
      o: bind
      type: none
  postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgresql-data
      o: bind
      type: none
