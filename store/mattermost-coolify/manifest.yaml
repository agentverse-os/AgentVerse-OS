# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/mattermost-coolify
description: Mattermost is an open source, self-hosted Slack-alternative.
endpoint:
  port: 8065
  service: mattermost
env:
  POSTGRES_DB: mattermost
  POSTGRES_USER: ''
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_MATTERMOST: https://${APP_DOMAIN}
  SERVICE_URL_MATTERMOST_8065: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: mattermost-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: POSTGRES_DB
  hint: 'по умолчанию: mattermost'
  label: postgres db
  options: null
  required: false
  type: text
- env: POSTGRES_USER
  hint: null
  label: postgres user
  options: null
  required: false
  type: text
tags:
- mattermost
- slack
- alternative
title: Mattermost
type: app
upstream:
  categories:
  - messaging
  source: https://docs.mattermost.com
  tags:
  - mattermost
  - slack
  - alternative
  template: mattermost.yaml
website: https://docs.mattermost.com
