# wordpress-with-mysql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mysql:
    environment:
    - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
    - MYSQL_DATABASE=wordpress
    - MYSQL_USER=$SERVICE_USER_WORDPRESS
    - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:8
    networks:
      appnet:
        aliases:
        - wordpress-with-mysql-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - mysql-data:/var/lib/mysql
  wordpress:
    depends_on:
    - mysql
    environment:
    - SERVICE_URL_WORDPRESS=${SERVICE_URL_WORDPRESS}
    - WORDPRESS_DB_HOST=mysql
    - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
    - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    - WORDPRESS_DB_NAME=wordpress
    healthcheck:
      interval: 2s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1
      timeout: 10s
    image: wordpress:latest
    networks:
      appnet:
        aliases:
        - wordpress-with-mysql-coolify_wordpress_1
    restart: unless-stopped
    volumes:
    - wordpress-files:/var/www/html
volumes:
  mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mysql-data
      o: bind
      type: none
  wordpress-files:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/wordpress-files
      o: bind
      type: none
