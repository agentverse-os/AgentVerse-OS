# overseerr-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  overseerr:
    environment:
    - SERVICE_URL_OVERSEERR_5055=${SERVICE_URL_OVERSEERR_5055}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - TZ=${TZ:-America/Toronto}
    - PORT=5055
    healthcheck:
      interval: 10s
      retries: 15
      start_period: 20s
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      timeout: 5s
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    networks:
      appnet:
        aliases:
        - overseerr-coolify_overseerr_1
    restart: unless-stopped
    volumes:
    - overseerr-config:/app/config
volumes:
  overseerr-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/overseerr-config
      o: bind
      type: none
