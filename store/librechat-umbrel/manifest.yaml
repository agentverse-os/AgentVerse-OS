upstream:
  author: Danny Avila
  categories:
  - ai
  release_notes: |-
    This update adds chat projects for organizing conversations, a context-usage gauge for tokens and optional cost tracking, pinned conversations/tools, keyboard shortcuts, and a redesigned settings experience.

    It also improves Agent Skills and subagents, adds GitHub/local skill sync, expands provider support with Claude Fable 5, Anthropic custom endpoints, Google URL Context, and prompt-cache TTL controls, and hardens shared links, OpenID, MCP, and auth flows.

    Full release notes can be found at https://www.librechat.ai/changelog/v0.8.7
  source: https://github.com/danny-avila/LibreChat
  version: 0.8.7
  website: https://librechat.ai/
