# satoshi-dashboard-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8410
      SERVE_STATIC: 'true'
    image: ghcr.io/satoshi-dashboard/main:v1.1.0@sha256:35ae82af78d972aeb621689e0a1e7dd76fa1c2835dca054c489179a09a279506
    networks:
      appnet:
        aliases:
        - satoshi-dashboard_web_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/server/.runtime-cache
