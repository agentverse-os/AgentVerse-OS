    networks:
      appnet:
        aliases:
        - plane_admin_1
    restart: on-failure
  api:
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    environment:
      <<:
        AWS_ACCESS_KEY_ID: umbrel
        AWS_S3_BUCKET_NAME: uploads
        AWS_S3_ENDPOINT_URL: http://plane-minio-1:9000
        AWS_SECRET_ACCESS_KEY: $APP_PASSWORD
