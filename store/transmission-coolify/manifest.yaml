# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/transmission-coolify
description: Fast, easy, and free BitTorrent client.
endpoint:
  port: 9091
  service: transmission
env:
  SERVICE_PASSWORD_ADMIN:
    generate: password
  SERVICE_URL_TRANSMISSION_9091: https://${APP_DOMAIN}
  SERVICE_USER_ADMIN:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_ADMIN
  path: null
  user: SERVICE_USER_ADMIN
name: transmission-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- bittorrent
- torrent
- peer-to-peer
title: Transmission
type: app
upstream:
  categories:
  - media
  source: https://docs.linuxserver.io/images/docker-transmission/
  tags:
  - bittorrent
  - torrent
  - peer-to-peer
  template: transmission.yaml
website: https://docs.linuxserver.io/images/docker-transmission/
