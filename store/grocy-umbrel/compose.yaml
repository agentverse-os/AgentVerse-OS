# grocy-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - GROCY_BASE_URL=/
    image: linuxserver/grocy:4.7.1@sha256:d63bffe9afb2ef1a23fa7ce0749cdaeba9c169fb644b16eed270884a1b2f4ac9
    networks:
      appnet:
        aliases:
        - grocy_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
