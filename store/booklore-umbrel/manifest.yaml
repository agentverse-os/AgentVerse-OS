  release_notes: |-
    This update adds support for new storage management and configuration options introduced with umbrelOS 2.0.

    Previous BookLore 2.4.0 release notes:

    This update moves BookLore into maintenance mode while adding a built-in BookOrbit transition announcement for administrators. Migration to BookOrbit is optional and can be done later with BookLore's guided migration path.

    BookLore now supports drag-and-drop ordering for dashboard scrollers, includes audiobooks in reading statistics and Reading DNA progress, and fixes password-change protection, token refresh deadlocks, duplicate read navigation, sorting/filtering edge cases, Reading DNA calculations, and publication-date handling across time zones.

    This release also updates the PDF viewer dependency to address CVE-2026-16633.

    Full release notes can be found at https://github.com/booklore-app/booklore/releases/tag/v2.4.0
