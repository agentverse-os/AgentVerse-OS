# celld-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  celld:
    environment:
    - SERVICE_URL_CELLD_8080=${SERVICE_URL_CELLD_8080}
    - CELLD_BUCKET=
    - S3_ENDPOINT=${S3_ENDPOINT:-}
    - AWS_REGION=${AWS_REGION:-us-east-1}
    - AWS_ACCESS_KEY_ID=
    - AWS_SECRET_ACCESS_KEY=
    - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    - CELLD_ADDR=0.0.0.0:8080
    - CELLD_ADVERTISE=celld:8080
    - CELLD_WATCH=/var/lib/celld/state
    - RUST_LOG=${RUST_LOG:-info}
    image: ghcr.io/denoland/celld:${CELLD_VERSION:-latest}
    networks:
      appnet:
        aliases:
        - celld-coolify_celld_1
    restart: unless-stopped
    volumes:
    - celld-data:/var/lib/celld
volumes:
  celld-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/celld-data
      o: bind
      type: none
