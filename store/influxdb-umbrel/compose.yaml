# influxdb-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chronograf:
    depends_on:
    - influxdb
    environment:
      INFLUXDB_PASSWORD: $APP_PASSWORD
      INFLUXDB_URL: http://influxdb_influxdb_1:8086
      INFLUXDB_USERNAME: admin
    image: chronograf:1.11.2@sha256:a6db91a1ba1d88d19b04ca4cad6db77d90ded5d9c7bec3ef5a793a967c23c04d
    networks:
      appnet:
        aliases:
        - influxdb_chronograf_1
    restart: unless-stopped
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/chronograf:/var/lib/chronograf
  influxdb:
    environment:
      INFLUXDB_ADMIN_PASSWORD: $APP_PASSWORD
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_HTTP_AUTH_ENABLED: 'true'
    image: influxdb:1.12.4@sha256:e9363fd88d67f8ae6f019f37a30cc136e3644f2cbaea5abd71ad63c96dc6ae08
    networks:
      appnet:
        aliases:
        - influxdb_influxdb_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/influxdb:/var/lib/influxdb
