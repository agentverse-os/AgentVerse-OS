# influxdb-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  chronograf:
    depends_on:
    - influxdb
    environment:
      INFLUXDB_PASSWORD: $APP_PASSWORD
      INFLUXDB_URL: http://influxdb_influxdb_1:8086
      INFLUXDB_USERNAME: admin
    image: chronograf:1.11.4@sha256:1aa585346868ef0859c507b2c8544a175ad308024765929f5df5b64a9679031d
    networks:
      appnet:
        aliases:
        - influxdb_chronograf_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/chronograf:/var/lib/chronograf
  influxdb:
    environment:
      INFLUXDB_ADMIN_PASSWORD: $APP_PASSWORD
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_HTTP_AUTH_ENABLED: 'true'
    image: influxdb:1.13.2@sha256:b33525b2fa01ee40ad93e318f299e76286a3de2271333c441b4a224c1ac42194
    networks:
      appnet:
        aliases:
        - influxdb_influxdb_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/influxdb:/var/lib/influxdb
