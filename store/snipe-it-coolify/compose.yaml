# snipe-it-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
    - SERVICE_URL_SNIPEIT_80=${SERVICE_URL_SNIPEIT_80}
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_KEY=base64:${SERVICE_REALBASE64_32_APPKEY}
    - APP_URL=${SERVICE_URL_SNIPEIT}
    - APP_TIMEZONE=${APP_TIMEZONE:-UTC}
    - APP_LOCALE=${APP_LOCALE:-en-US}
    - DB_CONNECTION=mysql
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_DATABASE=${MYSQL_DATABASE:-snipeit}
    - DB_USERNAME=${SERVICE_USER_MARIADB}
    - DB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - MAIL_MAILER=${MAIL_MAILER:-smtp}
    - MAIL_HOST=${MAIL_HOST:-null}
    - MAIL_PORT=${MAIL_PORT:-1025}
    - MAIL_USERNAME=${MAIL_USERNAME:-null}
    - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
    - MAIL_FROM_ADDR=${MAIL_FROM_ADDR:-you@example.com}
    - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Snipe-IT}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://localhost/health
      timeout: 5s
    image: snipe/snipe-it:v8.8.3
    networks:
      appnet:
        aliases:
        - snipe-it-coolify_app_1
    restart: unless-stopped
    volumes:
    - storage:/var/lib/snipeit
  mariadb:
    environment:
    - MYSQL_DATABASE=${MYSQL_DATABASE:-snipeit}
    - MYSQL_USER=${SERVICE_USER_MARIADB}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 1s
    image: mariadb:11.8
    networks:
      appnet:
        aliases:
        - snipe-it-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - db_data:/var/lib/mysql
volumes:
  db_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/db_data
      o: bind
      type: none
  storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/storage
      o: bind
      type: none
