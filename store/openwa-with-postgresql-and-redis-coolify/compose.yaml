# openwa-with-postgresql-and-redis-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  openwa:
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
    cap_drop:
    - ALL
    depends_on:
      openwa-redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
    - SERVICE_URL_OPENWA_2785=${SERVICE_URL_OPENWA_2785}
    - NODE_ENV=production
    - HOME=/tmp
    - XDG_CONFIG_HOME=/tmp/.config
    - XDG_CACHE_HOME=/tmp/.cache
    - PORT=2785
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - BASE_URL=${SERVICE_URL_OPENWA}
    - DASHBOARD_URL=${SERVICE_URL_OPENWA}
    - API_MASTER_KEY=${SERVICE_PASSWORD_OPENWA}
    - DATABASE_TYPE=postgres
    - DATABASE_HOST=postgresql
    - DATABASE_PORT=5432
    - DATABASE_USERNAME=$SERVICE_USER_POSTGRES
    - DATABASE_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - DATABASE_NAME=${POSTGRES_DB:-openwa}
    - DATABASE_SYNCHRONIZE=false
    - POSTGRES_SCHEMA=public
    - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
    - SESSION_DATA_PATH=./data/sessions
    - PUPPETEER_HEADLESS=true
    - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
    - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
    - STORAGE_TYPE=local
    - STORAGE_LOCAL_PATH=./data/media
    - REDIS_ENABLED=true
    - REDIS_HOST=openwa-redis
    - REDIS_PORT=6379
    - QUEUE_ENABLED=true
    - CACHE_ENABLED=true
    - AUTO_START_SESSIONS=${AUTO_START_SESSIONS:-false}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 45s
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:2785/api/health/ready'', (r) => process.exit(r.statusCode === 200 ? 0 : 1))'
      timeout: 10s
    image: ghcr.io/rmyndharis/openwa:0.30.3
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    networks:
      appnet:
        aliases:
        - openwa-with-postgresql-and-redis-coolify_openwa_1
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 75s
    tmpfs:
    - /tmp
    volumes:
    - openwa-data:/app/data
  openwa-redis:
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis:7-alpine
    networks:
      appnet:
        aliases:
        - openwa-with-postgresql-and-redis-coolify_openwa-redis_1
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - redis-data:/data
  postgresql:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRES
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    - POSTGRES_DB=${POSTGRES_DB:-openwa}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 3s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - openwa-with-postgresql-and-redis-coolify_postgresql_1
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - postgresql-data:/var/lib/postgresql/data
volumes:
  openwa-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/openwa-data
      o: bind
      type: none
  postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgresql-data
      o: bind
      type: none
  redis-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis-data
      o: bind
      type: none
