# matter-server: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
    network_mode: host
    restart: unless-stopped
    security_opt:
    - apparmor=unconfined
    volumes:
    - /run/dbus:/run/dbus:ro
    - ${APP_DATA_DIR}/data:/data
