# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/bookstack-umbrel
description: A simple, self-hosted platform for organizing documentation
endpoint:
  port: 80
  service: server
env:
  APP_BOOKSTACK_APP_KEY: ''
  APP_BOOKSTACK_DB_PASSWORD: ''
  APP_BOOKSTACK_DB_ROOT_PASSWORD: ''
  GATEWAY_IP: ''
  MARIADB_ROOT_PASSWORD: ''
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/bookstack/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bookstack/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bookstack/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bookstack/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bookstack/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/bookstack/icon.svg
login:
  mode: default
  note: пароль по умолчанию из образа приложения — смените после первого входа
  password: password
  path: null
  user: admin@admin.com
name: bookstack-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_BOOKSTACK_DB_PASSWORD
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bookstack db password
  options: null
  required: false
  type: password
- env: APP_BOOKSTACK_DB_ROOT_PASSWORD
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bookstack db root password
  options: null
  required: false
  type: password
- env: MARIADB_ROOT_PASSWORD
  hint: переменная каталога Umbrel без значения по умолчанию
  label: mariadb root password
  options: null
  required: false
  type: password
- env: APP_BOOKSTACK_APP_KEY
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bookstack app key
  options: null
  required: false
  type: password
tags: []
title: BookStack
type: app
upstream:
  author: BookStack
  categories:
  - files
  release_notes: |-
    This update lets you connect an SMTP email provider in BookStack's app settings on umbrelOS 2.0, for notifications, invitations and password resets.

    Previous BookStack 26.09.3 release notes:

    This security update improves protection of private content. Updating is recommended.
      - Fixed access to images and drawings attached to inaccessible draft or deleted pages.
      - Fixed personal editor drafts being visible to other users in certain situations.
      - Fixed book and chapter conversions incorrectly deleting content in the recycle bin.
      - Prevented attachment responses from revealing whether inaccessible pages exist.


    Full release notes can be found at https://github.com/BookStackApp/BookStack/releases/tag/v26.09.3
  source: https://github.com/BookStackApp/BookStack
  version: 26.09.3-patch.1
  website: https://www.bookstackapp.com/
website: https://www.bookstackapp.com/
