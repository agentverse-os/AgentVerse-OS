  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_REALBASE64_64_SALT:
    generate: hex64
  SERVICE_URL_CASTOPOD: https://${APP_DOMAIN}
  SERVICE_URL_CASTOPOD_8080: https://${APP_DOMAIN}
  SERVICE_USER_MYSQL:
    generate: password
