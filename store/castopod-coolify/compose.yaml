# castopod-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  castopod:
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_CASTOPOD_8080=${SERVICE_URL_CASTOPOD_8080}
    - MYSQL_DATABASE=castopod
    - MYSQL_USER=$SERVICE_USER_MYSQL
    - MYSQL_PASSWORD=$SERVICE_PASSWORD_MYSQL
    - CP_DISABLE_HTTPS=${CP_DISABLE_HTTPS:-1}
    - CP_BASEURL=$SERVICE_URL_CASTOPOD
    - CP_ANALYTICS_SALT=$SERVICE_REALBASE64_64_SALT
    - CP_CACHE_HANDLER=redis
    - CP_REDIS_HOST=redis
    - CP_REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      timeout: 20s
    image: castopod/castopod:1.15.4
    networks:
      appnet:
        aliases:
        - castopod-coolify_castopod_1
    restart: unless-stopped
    volumes:
    - castopod-media:/var/www/castopod/public/media
  mariadb:
    environment:
    - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_MYSQL
    - MYSQL_DATABASE=castopod
    - MYSQL_USER=$SERVICE_USER_MYSQL
    - MYSQL_PASSWORD=$SERVICE_PASSWORD_MYSQL
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11.2
    networks:
      appnet:
        aliases:
        - castopod-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - castopod-db:/var/lib/mysql
  redis:
    command: --requirepass $SERVICE_PASSWORD_REDIS
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - redis-cli -a $SERVICE_PASSWORD_REDIS ping | grep PONG
      timeout: 20s
    image: redis:7.2-alpine
    networks:
      appnet:
        aliases:
        - castopod-coolify_redis_1
    restart: unless-stopped
    volumes:
    - castopod-cache:/data
volumes:
  castopod-cache:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/castopod-cache
      o: bind
      type: none
  castopod-db:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/castopod-db
      o: bind
      type: none
  castopod-media:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/castopod-media
      o: bind
      type: none
