# portainer-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  docker:
    command: |
      dockerd
        --bridge dind0
        --data-root /data/data
        --exec-root /data/exec
        --host unix:///data/docker.sock
        --pidfile /data/docker.pid
    entrypoint: /entrypoint.sh
    environment:
      DOCKER_ENSURE_BRIDGE: dind0:10.32.0.1/16
    image: docker:27.2.0-dind@sha256:f9f72ad901a78f27be922b2d320bbc263174f12919c1b37e6a01f828fa904565
    network_mode: host
    privileged: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
    - ${APP_DATA_DIR}/data/docker:/data
  portainer:
    command: --host unix:///var/run/docker.sock --admin-password-file=/default-password
    image: portainer/portainer-ce:2.45.0-alpine@sha256:e6b0225f4bbc989e398c85062f7426f8cf4b61f8aca6f40bf44789d1dada1949
    networks:
      appnet:
        aliases:
        - portainer_portainer_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/default-password:/default-password
    - ${APP_DATA_DIR}/data/portainer:/data
    - ${APP_DATA_DIR}/data/docker:/var/run
