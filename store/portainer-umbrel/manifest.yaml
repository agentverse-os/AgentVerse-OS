  open: iframe
schema: 1
settings: []
tags: []
title: Portainer
type: app
upstream:
  author: Portainer
  categories:
  - developer
  release_notes: |-
    ⚠️ Portainer no longer trusts compromised eMudhra (emSign) certificates. Before upgrading, check certificates used by your login providers, registries, and Git hosts. Affected connections will fail; if your login provider is affected, only the initial administrator can sign in.

    This release improves security by preventing restricted users from inheriting hidden bind mounts through stacks and limiting Kubernetes access tokens to their intended environment.

    It also fixes container startup failures, overlapping GitOps deployments, and Docker Hub rate-limit detection on newer Docker engines.

    Full release notes can be found at https://github.com/portainer/portainer/releases/tag/2.45.3
