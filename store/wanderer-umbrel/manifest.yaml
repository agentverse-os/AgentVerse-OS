# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/wanderer-umbrel
description: A self-hosted trail database
endpoint:
  port: 3000
  service: web
env:
  APP_PASSWORD:
    generate: password
  APP_SEED:
    generate: hex64
  APP_WANDERER_ENCRYPTION_KEY: ''
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/5.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/6.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wanderer/7.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/wanderer/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: admin
name: wanderer-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_WANDERER_ENCRYPTION_KEY
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app wanderer encryption key
  options: null
  required: false
  type: password
tags: []
title: Wanderer
type: app
upstream:
  author: Flomp
  categories:
  - files
  release_notes: |-
    On first startup, this update cleans existing rich text and tag names. Text that exceeds its field limit after cleaning is shortened; downgrading does not restore removed content. Back up your data before updating.

    Security improvements strengthen validation of federated content, remote attachments, and file downloads.

    Remote trails, lists, comments, and summit logs synchronize more reliably, with limits that protect against slow or oversized remote content. Previously downloaded content remains readable if a refresh fails.

    If a federated delivery is rejected shortly after upgrading, repeat the action on the sending instance. Accounts created before changing your instance hostname or port cannot publish new federated content to updated peers.

    Full release notes: https://github.com/open-wanderer/wanderer/releases/tag/v0.21.2
  source: https://github.com/Flomp/wanderer
  version: 0.21.2
  website: https://wanderer.to/
website: https://wanderer.to/
