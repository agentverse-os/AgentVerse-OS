# originless-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - NODE_ENV=production
    - STORAGE_MAX=${STORAGE_MAX:-20GB}
    image: ghcr.io/besoeasy/originless:0.1.0@sha256:f4f232052e2763eb23bd9019da885f5700fae947b8760a695be6774bfc9c38b9
    networks:
      appnet:
        aliases:
        - originless_app_1
    restart: on-failure
    stop_grace_period: 5m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
