# freshrss-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/freshrss:1.30.4@sha256:3bdf970c2baebb4e8c8753c84e44c87991888311a437466d669b0016bb7e89c5
    networks:
      appnet:
        aliases:
        - freshrss_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/config
