# openpanel-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
configs:
  clickhouse-inline-1:
    content: |
      <clickhouse>
          <logger>
              <level>warning</level>
              <console>true</console>
          </logger>
          <keep_alive_timeout>10</keep_alive_timeout>
          <!-- Stop all the unnecessary logging -->
          <query_thread_log remove="remove"/>
          <query_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
          <listen_host>0.0.0.0</listen_host>
          <interserver_listen_host>0.0.0.0</interserver_listen_host>
          <interserver_http_host>opch</interserver_http_host>
          <!-- Disable cgroup memory observer -->
          <cgroups_memory_usage_observer_wait_time>0</cgroups_memory_usage_observer_wait_time>
          <!-- Not used anymore, but kept for backwards compatibility -->
          <macros>
              <shard>1</shard>
              <replica>replica1</replica>
              <cluster>openpanel_cluster</cluster>
          </macros>
      </clickhouse>
  clickhouse-inline-2:
    content: |
      <clickhouse>
          <profiles>
              <default>
                  <log_queries>0</log_queries>
                  <log_query_threads>0</log_query_threads>
              </default>
          </profiles>
      </clickhouse>
  clickhouse-inline-3:
    content: |
      #!/bin/sh
      set -e

      clickhouse client -n <<-EOSQL
        CREATE DATABASE IF NOT EXISTS openpanel;
      EOSQL
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  clickhouse:
    configs:
    - source: clickhouse-inline-1
      target: /etc/clickhouse-server/config.d/op-config.xml
    - source: clickhouse-inline-2
      target: /etc/clickhouse-server/users.d/op-user-config.xml
    - source: clickhouse-inline-3
      target: /docker-entrypoint-initdb.d/init-db.sh
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - clickhouse-client --query "SELECT 1"
      timeout: 5s
    image: clickhouse/clickhouse-server:25.10.2.65
    networks:
      appnet:
        aliases:
        - openpanel-coolify_clickhouse_1
    restart: unless-stopped
    ulimits:
      nofile:
        hard: 262144
        soft: 262144
    volumes:
    - openpanel_clickhouse_data:/var/lib/clickhouse
    - openpanel_clickhouse_logs:/var/log/clickhouse-server
  openpanel-api:
    command: |
      sh -c "
        echo 'Running migrations...'
        CI=true pnpm -r run migrate:deploy

        pnpm start
      "
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - NODE_ENV=production
    - SELF_HOSTED=true
    - SERVICE_URL_OPAPI=${SERVICE_URL_OPAPI}
    - API_URL=${SERVICE_URL_OPAPI}
    - DASHBOARD_URL=${SERVICE_URL_OPDASHBOARD}
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
    - DATABASE_URL_DIRECT=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
    - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
    - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
    - COOKIE_SECRET=${SERVICE_BASE64_COOKIESECRET}
    - ALLOW_REGISTRATION=${OPENPANEL_ALLOW_REGISTRATION:-false}
    - ALLOW_INVITATION=${OPENPANEL_ALLOW_INVITATION:-false}
    - EMAIL_SENDER=${OPENPANEL_EMAIL_SENDER}
    - RESEND_API_KEY=${RESEND_API_KEY}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/healthcheck || exit 1
      timeout: 5s
    image: lindesvard/openpanel-api:2
    networks:
      appnet:
        aliases:
        - openpanel-coolify_openpanel-api_1
    restart: unless-stopped
  openpanel-dashboard:
    depends_on:
      clickhouse:
        condition: service_healthy
      openpanel-api:
        condition: service_healthy
      openpanel-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - NODE_ENV=production
    - SELF_HOSTED=true
    - SERVICE_URL_OPDASHBOARD_3000=${SERVICE_URL_OPDASHBOARD_3000}
    - API_URL=${SERVICE_URL_OPAPI}
    - DASHBOARD_URL=${SERVICE_URL_OPDASHBOARD}
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
    - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
    - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/healthcheck || exit 1
      timeout: 5s
    image: lindesvard/openpanel-dashboard:2
    networks:
      appnet:
        aliases:
        - openpanel-coolify_openpanel-dashboard_1
    restart: unless-stopped
  openpanel-worker:
    depends_on:
      clickhouse:
        condition: service_healthy
      openpanel-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - DISABLE_BULLBOARD=${DISABLE_BULLBOARD:-1}
    - NODE_ENV=production
    - SELF_HOSTED=true
    - SERVICE_URL_OPBULLBOARD=${SERVICE_URL_OPBULLBOARD}
    - API_URL=${SERVICE_URL_OPAPI}
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
    - DATABASE_URL_DIRECT=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
    - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
    - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 5s
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/healthcheck || exit 1
      timeout: 5s
    image: lindesvard/openpanel-worker:2
    networks:
      appnet:
        aliases:
        - openpanel-coolify_openpanel-worker_1
    restart: unless-stopped
  postgres:
    environment:
    - POSTGRES_DB=${OPENPANEL_POSTGRES_DB:-openpanel-db}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - openpanel-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - openpanel_postgres_data:/var/lib/postgresql/data
  redis:
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS} --maxmemory-policy noeviction
    environment:
    - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - -a
      - ${SERVICE_PASSWORD_REDIS}
      - ping
      timeout: 5s
    image: redis:7.4-alpine
    networks:
      appnet:
        aliases:
        - openpanel-coolify_redis_1
    restart: unless-stopped
    volumes:
    - openpanel_redis_data:/data
volumes:
  openpanel_clickhouse_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/openpanel_clickhouse_data
      o: bind
      type: none
  openpanel_clickhouse_logs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/openpanel_clickhouse_logs
      o: bind
      type: none
  openpanel_postgres_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/openpanel_postgres_data
      o: bind
      type: none
  openpanel_redis_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/openpanel_redis_data
      o: bind
      type: none
