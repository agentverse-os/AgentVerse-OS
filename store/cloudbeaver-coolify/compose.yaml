# cloudbeaver-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cloudbeaver:
    environment:
    - SERVICE_URL_CLOUDBEAVER_8978=${SERVICE_URL_CLOUDBEAVER_8978}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/8978 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      timeout: 20s
    image: dbeaver/cloudbeaver:26
    networks:
      appnet:
        aliases:
        - cloudbeaver-coolify_cloudbeaver_1
    restart: unless-stopped
    volumes:
    - cloudbeaver-data:/opt/cloudbeaver/workspace
volumes:
  cloudbeaver-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/cloudbeaver-data
      o: bind
      type: none
