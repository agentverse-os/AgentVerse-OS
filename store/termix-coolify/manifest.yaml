# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/termix-coolify
description: All-in-One SSH & Remote Desktop management app.
endpoint:
  port: 8080
  service: termix
env:
  LOG_LEVEL: info
  SERVICE_URL_TERMIX_8080: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: null
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: termix-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: LOG_LEVEL
  hint: 'по умолчанию: info'
  label: log level
  options: null
  required: false
  type: text
tags:
- ssh
- terminal
- remote-desktop
- rdp
- vnc
- server-management
- remote-access
title: Termix
type: app
upstream:
  categories:
  - developer-tools
  source: https://docs.termix.site/install/server/docker
  tags:
  - ssh
  - terminal
  - remote-desktop
  - rdp
  - vnc
  - server-management
  - remote-access
  template: termix.yaml
website: https://docs.termix.site/install/server/docker
