# termix-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  termix:
    environment:
    - SERVICE_URL_TERMIX_8080=${SERVICE_URL_TERMIX_8080}
    - PORT=8080
    - LOG_LEVEL=${LOG_LEVEL:-info}
    image: ghcr.io/termix-ssh/termix:26.11.1
    networks:
      appnet:
        aliases:
        - termix-coolify_termix_1
    restart: unless-stopped
    volumes:
    - termix-data:/app/data
volumes:
  termix-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/termix-data
      o: bind
      type: none
