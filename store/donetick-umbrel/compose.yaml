# donetick-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - DT_ENV=selfhosted
    - DT_JWT_SECRET=${APP_SEED}
    - DT_SQLITE_PATH=/donetick-data/donetick.db
    image: donetick/donetick:v0.1.86@sha256:66253a32a8e8ed8c49c49418b43abe1181db23e07defe97748d2cb7508c487cd
    networks:
      appnet:
        aliases:
        - donetick_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app:/donetick-data
    - ${APP_DATA_DIR}/data/config:/config
