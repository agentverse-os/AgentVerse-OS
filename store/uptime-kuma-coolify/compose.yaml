# uptime-kuma-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  uptime-kuma:
    environment:
    - SERVICE_URL_UPTIMEKUMA_3001=${SERVICE_URL_UPTIMEKUMA_3001}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - extra/healthcheck
      timeout: 5s
    image: louislam/uptime-kuma:2
    networks:
      appnet:
        aliases:
        - uptime-kuma-coolify_uptime-kuma_1
    restart: unless-stopped
    volumes:
    - uptime-kuma-data:/app/data
volumes:
  uptime-kuma-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/uptime-kuma-data
      o: bind
      type: none
