# classicpress-with-mysql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  classicpress:
    depends_on:
    - mysql
    environment:
    - SERVICE_URL_CLASSICPRESS=${SERVICE_URL_CLASSICPRESS}
    - CLASSICPRESS_DB_HOST=mysql
    - CLASSICPRESS_DB_USER=$SERVICE_USER_CLASSICPRESS
    - CLASSICPRESS_DB_PASSWORD=$SERVICE_PASSWORD_CLASSICPRESS
    - CLASSICPRESS_DB_NAME=classicpress
    healthcheck:
      interval: 2s
      retries: 10
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1
      timeout: 10s
    image: classicpress/classicpress:latest
    networks:
      appnet:
        aliases:
        - classicpress-with-mysql-coolify_classicpress_1
    restart: unless-stopped
    volumes:
    - classicpress-files:/var/www/html
  mysql:
    environment:
    - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
    - MYSQL_DATABASE=classicpress
    - MYSQL_USER=$SERVICE_USER_CLASSICPRESS
    - MYSQL_PASSWORD=$SERVICE_PASSWORD_CLASSICPRESS
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:8
    networks:
      appnet:
        aliases:
        - classicpress-with-mysql-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - mysql-data:/var/lib/mysql
volumes:
  classicpress-files:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/classicpress-files
      o: bind
      type: none
  mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mysql-data
      o: bind
      type: none
