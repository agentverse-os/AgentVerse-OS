# valorgrid-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      HOST: 0.0.0.0
      PORT: 1325
      PORTFOLIO_DB_PATH: /data/portfolio.sqlite
      VALORGRID_ALPHA_VANTAGE_API_KEY: ''
      VALORGRID_AUTH_PASSWORD: ''
      VALORGRID_AUTH_USER: valorgrid
      VALORGRID_BACKUP_DIR: /data/backups
    image: ghcr.io/aivm23/valorgrid:v3.36.3@sha256:e02967996cee5376e71578d8e97d6d756a48f7cf9c30e3548bad8396f95bd3c6
    networks:
      appnet:
        aliases:
        - valorgrid_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
