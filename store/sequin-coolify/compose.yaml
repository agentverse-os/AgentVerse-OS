# sequin-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    command:
    - postgres
    - -c
    - wal_level=logical
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-sequin-db}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      interval: 10s
      retries: 5
      start_interval: 1s
      start_period: 2s
      test:
      - CMD-SHELL
      - pg_isready -U ${SERVICE_USER_POSTGRES} -d sequin
      timeout: 2s
    image: postgres:16
    networks:
      appnet:
        aliases:
        - sequin-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    command:
    - redis-server
    - --port
    - '6379'
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 20s
    image: redis:7
    networks:
      appnet:
        aliases:
        - sequin-coolify_redis_1
    restart: unless-stopped
    volumes:
    - redis_data:/data
  sequin:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - SERVICE_URL_SEQUIN_7376=${SERVICE_URL_SEQUIN_7376}
    - SERVER_HOST=${SERVICE_FQDN_SEQUIN}
    - PG_HOSTNAME=postgres
    - PG_DATABASE=${POSTGRES_DB:-sequin-db}
    - PG_PORT=5432
    - PG_USERNAME=${SERVICE_USER_POSTGRES}
    - PG_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - PG_POOL_SIZE=20
    - SECRET_KEY_BASE=${SERVICE_REALBASE64_64_SECRETKEY}
    - VAULT_KEY=${SERVICE_REALBASE64_VAULTKEY}
    - REDIS_URL=redis://redis:6379
    - CONFIG_FILE_PATH=/config/playground.yml
    - FEATURE_ACCOUNT_SELF_SIGNUP=${FEATURE_ACCOUNT_SELF_SIGNUP:-false}
    - SEQUIN_TELEMETRY_DISABLED=${SEQUIN_TELEMETRY_DISABLED:-false}
    - CRASH_REPORTING_DISABLED=${CRASH_REPORTING_DISABLED:-false}
    healthcheck:
      test:
      - CMD
      - curl
      - http://localhost:7376/health
    image: sequin/sequin:latest
    networks:
      appnet:
        aliases:
        - sequin-coolify_sequin_1
    restart: unless-stopped
volumes:
  postgres_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres_data
      o: bind
      type: none
  redis_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/redis_data
      o: bind
      type: none
