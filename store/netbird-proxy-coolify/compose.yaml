# netbird-proxy-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  netbird-proxy:
    environment:
    - NB_PROXY_TOKEN=
    - NB_PROXY_MANAGEMENT_ADDRESS=${NB_PROXY_MANAGEMENT_ADDRESS:-https://api.netbird.io:443}
    - NB_PROXY_DOMAIN=
    - NB_PROXY_PRIVATE=${NB_PROXY_PRIVATE:-true}
    - NB_PROXY_ACME_CERTIFICATES=${NB_PROXY_ACME_CERTIFICATES:-true}
    - NB_PROXY_ALLOW_INSECURE=${NB_PROXY_ALLOW_INSECURE:-false}
    - NB_PROXY_LOG_LEVEL=${NB_PROXY_LOG_LEVEL:-info}
    - NB_PROXY_ADDRESS=:443
    - NB_PROXY_CERTIFICATE_DIRECTORY=/certs
    - NB_PROXY_HEALTH_ADDRESS=127.0.0.1:8080
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 20s
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/healthz/ready
      timeout: 5s
    image: netbirdio/reverse-proxy:0.83.1
    networks:
      appnet:
        aliases:
        - netbird-proxy-coolify_netbird-proxy_1
    restart: unless-stopped
    volumes:
    - netbird-proxy-certs:/certs
volumes:
  netbird-proxy-certs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/netbird-proxy-certs
      o: bind
      type: none
