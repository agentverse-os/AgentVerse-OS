# gitlab-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gitlab:
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Add any other gitlab.rb configuration here, each on its own line
        gitlab_rails['initial_root_password'] = '${APP_PASSWORD}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        nginx['listen_port'] = 8929
        nginx['listen_https'] = false
      PGID: 1000
      PUID: 1000
    image: gitlab/gitlab-ce:19.5.6-ce.0@sha256:0f93f5fdb28a5ae0f2713ef5d40d9438615b8b21a42841a2fe7bd56813934e0b
    networks:
      appnet:
        aliases:
        - gitlab_gitlab_1
    restart: on-failure
    shm_size: 256m
    ulimits:
      nofile:
        hard: 8192
        soft: 4096
    volumes:
    - ${APP_DATA_DIR}/data/config:/etc/gitlab
    - ${APP_DATA_DIR}/data/logs:/var/log/gitlab
    - ${APP_DATA_DIR}/data/data:/var/opt/gitlab
