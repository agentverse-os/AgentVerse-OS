# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/gitlab-umbrel
description: Software. Faster.
endpoint:
  port: 8929
  service: gitlab
env:
  APP_PASSWORD:
    generate: password
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/gitlab/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/gitlab/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/gitlab/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/gitlab/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: root
name: gitlab-umbrel
notes:
- 'порт 2424:22 (gitlab) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: GitLab
type: app
upstream:
  author: GitLab
  categories:
  - developer
  release_notes: |-
    Updates GitLab CE to 19.5.6. Required migrations run automatically during the update. GitLab may take some time to come back online; leave it running until the update finishes.

    This security release strengthens access checks for private repository content, discussions, build artifacts, and Git LFS. It also fixes cross-site scripting in error tracking, hardens project imports, and improves protected-branch push performance.

    Full changelog: https://gitlab.com/gitlab-org/gitlab-foss/-/blob/v19.5.6/CHANGELOG.md
    Full upgrade notes are available at: https://docs.gitlab.com/update/versions/gitlab_19_changes/
  source: https://gitlab.com/gitlab-org/omnibus-gitlab/tree/master/docker
  version: 19.5.6
  website: https://about.gitlab.com
website: https://about.gitlab.com
