title: Passky Server
type: app
upstream:
  author: Rabbit Company LLC
  categories:
  - files
  release_notes: |-
    Passky Server has been rewritten in TypeScript and now runs on Bun. Existing accounts and passwords are kept, and Passky clients keep working without an update.

    Key highlights in this release:

      - A lighter server that uses fewer resources
      - Account passwords are now protected with Argon2id
      - A redesigned administrator interface with account search, license management, reports, and health checks
      - Many security improvements, including stricter two-factor authentication checks and administrator sign-in limits


    All users will need to sign in again once after updating.

    Full release notes are found at https://github.com/Rabbit-Company/Passky-Server/releases
