# supertokens-with-postgresql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_USER=$SERVICE_USER_POSTGRESQL
    - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRESQL
    - POSTGRES_DB=${POSTGRES_DB:-supertokens}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - pg_isready
      - -U
      - $SERVICE_USER_POSTGRESQL
      - -d
      - ${POSTGRES_DB:-supertokens}
      timeout: 5s
    image: postgres:16
    networks:
      appnet:
        aliases:
        - supertokens-with-postgresql-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - supertokens-postgres-data:/var/lib/postgresql/data
  supertokens:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_SUPERTOKENS_3567=${SERVICE_URL_SUPERTOKENS_3567}
    - API_KEYS=${API_KEYS:-}
    - POSTGRESQL_CONNECTION_URI="postgresql://$SERVICE_USER_POSTGRESQL:$SERVICE_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRES_DB:-supertokens}"
    healthcheck:
      interval: 10s
      retries: 5
      test: |
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      timeout: 5s
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    networks:
      appnet:
        aliases:
        - supertokens-with-postgresql-coolify_supertokens_1
    restart: unless-stopped
volumes:
  supertokens-postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/supertokens-postgres-data
      o: bind
      type: none
