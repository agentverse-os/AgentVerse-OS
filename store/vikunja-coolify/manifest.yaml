# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/vikunja-coolify
description: The open-source, self-hostable to-do app. Organize everything, on all platforms.
endpoint:
  port: 3456
  service: vikunja
env:
  SERVICE_PASSWORD_JWTSECRET:
    generate: password
  SERVICE_URL_VIKUNJA: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: vikunja-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- productivity
- todo
title: Vikunja
type: app
upstream:
  categories:
  - productivity
  source: https://vikunja.io
  tags:
  - productivity
  - todo
  template: vikunja.yaml
website: https://vikunja.io
