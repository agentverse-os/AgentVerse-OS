# albyhub-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      COOKIE_SECRET: ${APP_SEED}
      HIDE_UPDATE_BANNER: 'true'
      LND_ADDRESS: ${APP_ALBYHUB_LND_ADDRESS}
      LND_CERT_FILE: ${APP_ALBYHUB_LND_CERT_FILE}
      LND_MACAROON_FILE: ${APP_ALBYHUB_LND_MACAROON_FILE}
      LN_BACKEND_TYPE: ${APP_ALBYHUB_LN_BACKEND:-LDK}
      LOG_EVENTS: 'true'
      WORK_DIR: /data/albyhub
    image: ghcr.io/getalby/hub:v1.24.0@sha256:0227bdc79afd20eb689c922c96cf0546576b608c5cbb07b13658956d54e8133d
    networks:
      appnet:
        aliases:
        - albyhub_server_1
    restart: on-failure
    stop_grace_period: 3m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${UMBREL_ROOT}/app-data/lightning/data/lnd:/lnd:ro
