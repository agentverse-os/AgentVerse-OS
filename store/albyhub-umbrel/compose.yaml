# albyhub-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      COOKIE_SECRET: ${APP_SEED}
      HIDE_UPDATE_BANNER: 'true'
      LND_ADDRESS: ${APP_ALBYHUB_LND_ADDRESS}
      LND_CERT_FILE: ${APP_ALBYHUB_LND_CERT_FILE}
      LND_MACAROON_FILE: ${APP_ALBYHUB_LND_MACAROON_FILE}
      LN_BACKEND_TYPE: ${APP_ALBYHUB_LN_BACKEND:-LDK}
      LOG_EVENTS: 'true'
      WORK_DIR: /data/albyhub
    image: ghcr.io/getalby/hub:v1.24.7@sha256:7e3de6dac330fb8a426c02a247d81ebaf07deece22634e97d8f20dd48c3a8e38
    networks:
      appnet:
        aliases:
        - albyhub_server_1
    restart: on-failure
    stop_grace_period: 3m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${UMBREL_ROOT}/app-data/lightning/data/lnd:/lnd:ro
