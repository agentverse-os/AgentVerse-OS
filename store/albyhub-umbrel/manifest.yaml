# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/albyhub-umbrel
description: Self-custodial Lightning wallet with integrated node and app connections
endpoint:
  port: 8080
  service: server
env:
  APP_ALBYHUB_LND_ADDRESS: 10.21.21.9:10009
  APP_ALBYHUB_LND_CERT_FILE: /lnd/tls.cert
  APP_ALBYHUB_LND_MACAROON_FILE: /lnd/data/chain/bitcoin/mainnet/admin.macaroon
  APP_ALBYHUB_LN_BACKEND: LND
  APP_SEED:
    generate: hex64
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/albyhub/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/albyhub/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/albyhub/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/albyhub/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/albyhub/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: albyhub-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Alby Hub ✨
type: app
upstream:
  author: Alby
  categories:
  - bitcoin
  release_notes: |-
    This patch includes bug fixes and security updates.

    Key changes in this release:
      - Prevent crashes from malformed Nostr Wallet Connect requests and authorization headers
      - Improve error handling for invalid requests, unknown invoices, and unknown swaps
      - Improve swap validation and claim retries
      - Prevent settling canceled self-paid hold invoices
      - Add OpenReceive to the app store


    Full release notes are found at https://github.com/getAlby/hub/releases/tag/v1.24.7
  source: https://github.com/getAlby/hub
  version: 1.24.7
  website: https://albyhub.com
website: https://albyhub.com
