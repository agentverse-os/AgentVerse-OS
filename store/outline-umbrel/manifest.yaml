# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/outline-umbrel
description: A modern team knowledge base and wiki
endpoint:
  port: 3000
  service: web
env:
  APP_OUTLINE_PORT: '8942'
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/outline/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/outline/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/outline/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/outline/4.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/outline/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: umbrel@umbrel.local
name: outline-umbrel
notes:
- 'порт 8943:5556 (dex) не публикуется: доступ только через edge/gate'
- 'web: env_file из каталога проигнорирован (значения — через настройки приложения)'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Outline
type: app
upstream:
  author: Outline
  categories:
  - files
  release_notes: |-
    New features and improvements in this release:
      - Per-share branding lets you override the title and logo on individual public shares
      - MCP responses now include breadcrumbs, summaries, and title guidance
      - Added delete_document and delete_collection tools to MCP
      - Self-hosted instances can now tune rate limiting with the new RATE_LIMITER_MULTIPLIER option
      - Default model creation rate limits raised from 10/min to 25/min
      - Added a UI element to clear search highlights when navigating to a document from search results
      - Improved table-of-contents positioning on shared documents
      - Improved sidebar performance
      - Shift-Tab on a list item inside a toggle block no longer outdents the entire block
      - Code blocks now expand correctly when printing
      - API keys created with global read/write scope are now saved correctly
      - Republishing a document now correctly updates the last modified user
      - Suspended users are no longer counted toward the cached group member count
      - Post-login redirects with invalid paths are now handled correctly in Firefox
      - Autofocus now works inside lazy-loaded modals and popovers


    Full release notes can be found at https://github.com/outline/outline
  source: https://github.com/outline/outline
  version: 1.7.1
  website: https://www.getoutline.com/
website: https://www.getoutline.com/
