# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/outline-umbrel
description: A modern team knowledge base and wiki
endpoint:
  port: 3000
  service: web
env:
  APP_OUTLINE_PORT: '8942'
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/outline/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/outline/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/outline/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/outline/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/outline/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: umbrel@umbrel.local
name: outline-umbrel
notes:
- 'порт 8943:5556 (dex) не публикуется: доступ только через edge/gate'
- 'web: env_file из каталога проигнорирован (значения — через настройки приложения)'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Outline
type: app
upstream:
  author: Outline
  categories:
  - files
  release_notes: |-
    Outline now opens over HTTPS on umbrelOS 2.0. Bookmarks and links to the old http:// address will redirect to sign-in again.

    New features and improvements:
      - Redesigned search filters and faster document search indexing
      - Gitea and Forgejo integration, expiry dates for public share links, and preview cards for links, documents, and collections
      - Choose a destination when importing, and filter menu items by typing
      - Settings save automatically, with a refreshed settings layout
      - Fixes for editing, imports, exports, and shared documents, including PDF imports on ARM64 devices
      - Security improvements for sign-in, sharing, permissions, and attachments, plus MCP and OAuth compatibility fixes


    If upgrading from an older release, collapsible headings have been replaced by toggle headings.

    Full release notes can be found at https://github.com/outline/outline/releases/tag/v1.13.0
  source: https://github.com/outline/outline
  version: 1.13.0
  website: https://www.getoutline.com/
website: https://www.getoutline.com/
