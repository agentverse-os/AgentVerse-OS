# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/databasus-coolify
description: Databasus is a free, open source and self-hosted tool to backup PostgreSQL, MySQL, and MongoDB.
endpoint:
  port: 4005
  service: databasus
env:
  SERVICE_URL_DATABASUS_4005: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: databasus-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- postgres
- mysql
- mongo
- backup
title: Databasus
type: app
upstream:
  categories:
  - devtools
  source: https://databasus.com/installation
  tags:
  - postgres
  - mysql
  - mongo
  - backup
  template: databasus.yaml
website: https://databasus.com/installation
