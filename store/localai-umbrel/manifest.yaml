upstream:
  author: Ettore Di Giacinto
  categories:
  - ai
  release_notes: |-
    LocalAI 5.0 adds server-side chats, projects, file management, and a refreshed interface.

    Chats are now stored on the server. Without separate LocalAI accounts, people with access to this app share the same chat history. To keep older browser-only chats, follow the upgrade guide to export and import them from the browser that holds them.

    New chats turn on agent tools by default, which need more context than small models have. If a chat fails with a context window error, turn tools off in the chat or use a model with a larger context size.

    Studio and Talk are now available as separate add-ons. Models configured with the removed liquid-audio backend need a compatible replacement.

    Upgrade guide: https://localai.io/docs/features/chats-migration/
    Full release notes: https://github.com/mudler/LocalAI/releases/tag/v5.0.0
