# booksonic: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  booksonic:
    environment:
      CONTEXT_PATH: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: lscr.io/linuxserver/booksonic-air:2201.1.0
    networks:
      appnet:
        aliases:
        - booksonic_booksonic_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${ROOT_FOLDER_HOST}/media/data/books/spoken:/audiobooks
    - ${ROOT_FOLDER_HOST}/media/data/podcasts:/podcasts
