# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/leantime-coolify
description: Leantime is a goals focused project management system for non-project managers.
endpoint:
  port: 8080
  service: leantime
env:
  DB_NAME: leantime-db
  REDIS_PORT: '6379'
  REDIS_SCHEME: tcp
  SERVICE_PASSWORD_64_SALT:
    generate: hex64
  SERVICE_PASSWORD_MYSQLDB:
    generate: password
  SERVICE_PASSWORD_MYSQLROOT:
    generate: password
  SERVICE_URL_LEANTIME: https://${APP_DOMAIN}
  SERVICE_URL_LEANTIME_8080: https://${APP_DOMAIN}
  SERVICE_USER_MYSQLDB:
    generate: password
  SESSION_EXPIRATION: '28800'
  USE_REDIS: 'true'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
