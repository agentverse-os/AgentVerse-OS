- env: LOG_ENABLED
  hint: 'по умолчанию: true'
  label: log enabled
  options: null
  required: false
  type: text
tags:
- bluesky
- pds
- platform
title: Bluesky Pds
type: app
upstream:
  categories:
  - backend
  source: https://github.com/bluesky-social/pds
  tags:
  - bluesky
  - pds
  - platform
  template: bluesky-pds.yaml
website: https://github.com/bluesky-social/pds
