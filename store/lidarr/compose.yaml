# lidarr: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  lidarr:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: ghcr.io/linuxserver/lidarr:3.1.0
    networks:
      appnet:
        aliases:
        - lidarr_lidarr_1
    restart: unless-stopped
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - ${APP_DATA_DIR}/data:/config
    - ${ROOT_FOLDER_HOST}/media:/media
