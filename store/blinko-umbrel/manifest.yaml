# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/blinko-umbrel
description: An AI-powered hub for your ideas and notes
endpoint:
  port: 1111
  service: app
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/blinko/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/blinko/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/blinko/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/blinko/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/blinko/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/blinko/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: blinko-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Blinko
type: app
upstream:
  author: Blinko
  categories:
  - files
  release_notes: |-
    This update improves Blinko’s security and compatibility. No extra setup is needed for regular note-taking or AI features.

    If you use Blinko’s desktop or mobile apps, update those too. If you were halfway through signing in with two-factor authentication, start the sign-in again.

    🔧 **Only for users of MCP integrations that run local commands (stdio):** These integrations now need your approval before they can run. MCP integrations that connect through a URL (HTTP) are unaffected.

    To approve a local integration, open Blinko’s app settings **in Umbrel** → Advanced → Environment variables. Set `BLINKO_MCP_STDIO_ALLOWLIST` to a JSON array containing the integration’s exact `command`, `args`, and `env` values. Only approve commands you trust, as they can access your Blinko data.

    Saving restarts Blinko. Your approvals are kept across restarts and app updates. This setting requires umbrelOS 2.0 or later.

    Back up your Blinko data before updating.

    [Full release notes](https://github.com/blinko-space/blinko/releases/tag/1.8.9)
  source: https://github.com/blinko-space/blinko
  version: 1.8.9
  website: https://blinko-demo.vercel.app/
website: https://blinko-demo.vercel.app/
