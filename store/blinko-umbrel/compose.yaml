# blinko-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blinkouser:blinkopass@blinko_db_1:5432/blinko
      NEXTAUTH_SECRET: ${APP_SEED}
      NEXTAUTH_URL: http://${DEVICE_DOMAIN_NAME}:1111
      NEXT_PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME}:1111
      NODE_ENV: production
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:1111
      timeout: 10s
    image: blinkospace/blinko:1.8.8@sha256:31c3bc9f4fc00c82328c098c0c1120fe7fe43152a9f3cbc04b0303c32a2e60d3
    logging:
      options:
        max-file: '3'
        max-size: 10m
    networks:
      appnet:
        aliases:
        - blinko_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/.blinko:rw
  db:
    environment:
      POSTGRES_DB: blinko
      POSTGRES_PASSWORD: blinkopass
      POSTGRES_USER: blinkouser
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD
      - pg_isready
      - -q
      - -d
      - blinko
      - -U
      - blinkouser
      timeout: 45s
    image: postgres:17.3@sha256:6e3358e46e34dae6c184f48fd06fe1b3dbf958ad5b83480031907e52b9ec2a7d
    networks:
      appnet:
        aliases:
        - blinko_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data:rw
