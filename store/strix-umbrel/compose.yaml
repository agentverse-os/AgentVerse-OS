# strix-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: eduard256/strix:2.2.0@sha256:c000c723b985a5f4a98e8d738dc1b04294e6b7343fcf2576031c2732abb82789
    networks:
      appnet:
        aliases:
        - strix_web_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
