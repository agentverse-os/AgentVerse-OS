- https://getumbrel.github.io/umbrel-apps-gallery/jellyfin/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/jellyfin/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/jellyfin/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/jellyfin/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: jellyfin-umbrel
notes:
- 'порт 7359:7359/udp (server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Jellyfin
type: app
upstream:
  author: Jellyfin
  categories:
  - media
  release_notes: |-
    Jellyfin 12 is a major upgrade. Back up your Jellyfin data before updating because the database changes cannot be rolled back without restoring a backup. Direct upgrades from Jellyfin 10.11.x are supported, but repository plugins should be removed before migrating and re-added only after compatible versions are available.

    This maintenance release updates Jellyfin's underlying .NET runtime to 10.0.14.

    After upgrading, run a full library scan to restore alternative versions.

    Full release notes can be found at https://github.com/jellyfin/jellyfin/releases/tag/v12.4
  source: https://github.com/jellyfin/jellyfin
  version: '12.4'
  website: https://jellyfin.org/
website: https://jellyfin.org/
