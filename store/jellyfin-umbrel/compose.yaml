# jellyfin-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/jellyfin:version-12.4ubu2604@sha256:3894d9eae88418d3cf9ac6349392d2c4dad818365a59565d19edc38098897044
    networks:
      appnet:
        aliases:
        - jellyfin_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
