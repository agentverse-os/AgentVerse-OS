# gupt-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: ghcr.io/besoeasy/gupt:6.1.32@sha256:0cb58e2f88c350c35b8c639f394075701d0b63e9d9859c11970f17867127fdc1
    networks:
      appnet:
        aliases:
        - gupt_web_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
