# changedetection-io-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      BASE_URL: http://${DEVICE_DOMAIN_NAME}:5037
      DISABLE_VERSION_CHECK: 'true'
      HIDE_REFERER: 'true'
      TZ: Etc/UTC
      USE_X_SETTINGS: '1'
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.3@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
    networks:
      appnet:
        aliases:
        - changedetection-io_app_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/datastore
