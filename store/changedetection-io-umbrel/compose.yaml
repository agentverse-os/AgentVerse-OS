# changedetection-io-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      BASE_URL: http://${DEVICE_DOMAIN_NAME}:5037
      DISABLE_VERSION_CHECK: 'true'
      HIDE_REFERER: 'true'
      TZ: Etc/UTC
      USE_X_SETTINGS: '1'
    image: ghcr.io/dgtlmoon/changedetection.io:0.55.8@sha256:5438423d5e906eff4e8f7886823482ad23f472bf7b8530ccaca89fb48c337882
    networks:
      appnet:
        aliases:
        - changedetection-io_app_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/datastore
