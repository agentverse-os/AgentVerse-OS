# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/n8n-with-postgresql-coolify
description: n8n is an extendable workflow automation tool.
endpoint:
  port: 5678
  service: n8n
env:
  GENERIC_TIMEZONE: UTC
  N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
  N8N_GIT_NODE_DISABLE_BARE_REPOS: 'true'
  N8N_NATIVE_PYTHON_RUNNER: 'true'
  N8N_PROTOCOL: https
  N8N_PROXY_HOPS: '1'
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_BROKER_PORT: '5679'
  N8N_RUNNERS_MAX_CONCURRENCY: '5'
  N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
  N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: 'false'
  POSTGRES_DB: n8n
  POSTGRES_USER: ''
  SERVICE_PASSWORD_N8N:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_N8N: https://${APP_DOMAIN}
  SERVICE_URL_N8N_5678: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: n8n-with-postgresql-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
