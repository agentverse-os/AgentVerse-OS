# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/dashy-coolify
description: A self-hostable personal dashboard built for you. Includes status-checking, widgets, themes, icon packs, a UI editor and tons more!
endpoint:
  port: 8080
  service: dashy
env:
  SERVICE_URL_DASHY_8080: https://${APP_DOMAIN}
  TIMEZONE: UTC
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: dashy-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: TIMEZONE
  hint: 'по умолчанию: UTC'
  label: timezone
  options: null
  required: false
  type: text
tags:
- dashboard
- personal
- self-hostable
title: Dashy
type: app
upstream:
  categories:
  - productivity
  source: https://dashy.to/docs
  tags:
  - dashboard
  - personal
  - self-hostable
  template: dashy.yaml
website: https://dashy.to/docs
