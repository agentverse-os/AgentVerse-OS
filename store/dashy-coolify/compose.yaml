# dashy-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  dashy:
    environment:
    - SERVICE_URL_DASHY_8080=${SERVICE_URL_DASHY_8080}
    - PUID=1000
    - PGID=1000
    - TZ=${TIMEZONE:-UTC}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/
      timeout: 20s
    image: lissy93/dashy:4.9.18
    networks:
      appnet:
        aliases:
        - dashy-coolify_dashy_1
    restart: unless-stopped
    volumes:
    - dashy-user-data:/app/user-data
volumes:
  dashy-user-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/dashy-user-data
      o: bind
      type: none
