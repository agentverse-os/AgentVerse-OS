# elasticsearch-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  elasticsearch:
    environment:
    - SERVICE_URL_ELASTICSEARCH_9200=${SERVICE_URL_ELASTICSEARCH_9200}
    - ELASTIC_PASSWORD=${SERVICE_PASSWORD_ELASTICSEARCH}
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    - discovery.type=single-node
    - bootstrap.memory_lock=true
    - xpack.security.http.ssl.enabled=false
    healthcheck:
      interval: 10s
      retries: 24
      test:
      - CMD-SHELL
      - curl --user elastic:${SERVICE_PASSWORD_ELASTICSEARCH} --silent --fail http://localhost:9200/_cluster/health
      timeout: 10s
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.0
    networks:
      appnet:
        aliases:
        - elasticsearch-coolify_elasticsearch_1
    restart: unless-stopped
    volumes:
    - elasticsearch-data:/usr/share/elasticsearch/data
volumes:
  elasticsearch-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/elasticsearch-data
      o: bind
      type: none
