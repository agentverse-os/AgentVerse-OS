title: Lobe Hub
type: app
upstream:
  author: LobeHub
  categories:
  - ai
  release_notes: |-
    Open Lobe Hub over HTTP. If it opens with https://, change that to http:// in the address bar. HTTPS access is not supported by this Umbrel package yet.

    Back up your Lobe Hub data before updating. This update runs automatic database migrations on startup. Leave Lobe Hub running until they finish. Upstream has not verified downgrading after these migrations.

    Large memory databases may take longer to upgrade while new indexes are created. Review goal and subscription-account visibility after upgrading: upstream adds workspace visibility with public defaults for existing records.

    Bots now participate proactively by default. Turn off Proactive participation in each bot's channel settings if you prefer keyword-only wake-ups.

    - Added richer agent conversations and threads in Channels
    - Added device-hosted MCP connectors, webhook automations, and multiple OAuth accounts per connector
    - Improved coding follow-ups, branch selection, and worktree management
    - Added more voice providers, music generation, and audio previews
    - Simplified message sending and improved uploads
    - Improved upload security and server-side MCP request protection

    Review connector sharing after upgrading if you use shared workspaces: existing connectors gain public workspace visibility by default. Personal connectors remain account-scoped.

    Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.3.4
  source: https://github.com/lobehub/lobehub
  version: 2.3.4
  website: https://lobehub.com/
website: https://lobehub.com/
