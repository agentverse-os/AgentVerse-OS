# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/apprise-api-coolify
description: Push Notifications API
endpoint:
  port: 8000
  service: apprise-api
env:
  SERVICE_URL_APPRISE_8000: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: apprise-api-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- api
- apprise
title: Apprise Api
type: app
upstream:
  categories:
  - automation
  source: https://docs.linuxserver.io/images/docker-apprise-api/
  tags:
  - api
  - apprise
  template: apprise-api.yaml
website: https://docs.linuxserver.io/images/docker-apprise-api/
