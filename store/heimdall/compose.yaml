# heimdall: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  heimdall:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: lscr.io/linuxserver/heimdall:2.8.2
    networks:
      appnet:
        aliases:
        - heimdall_heimdall_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
