# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/orangehrm-coolify
description: OrangeHRM open source HR management software.
endpoint:
  port: 80
  service: orangehrm
env:
  MYSQL_DATABASE: orangehrm-db
  SERVICE_PASSWORD_MYSQL:
    generate: password
  SERVICE_PASSWORD_MYSQLROOT:
    generate: password
  SERVICE_URL_ORANGEHRM_80: https://${APP_DOMAIN}
  SERVICE_USER_MYSQL:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: orangehrm-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: MYSQL_DATABASE
  hint: 'по умолчанию: orangehrm-db'
  label: mysql database
  options: null
  required: false
  type: text
tags:
- HR
- HRIS
- HRMS
- human resource management
- OrangeHRM
- HR management
title: Orangehrm
type: app
upstream:
  categories:
  - productivity
  source: https://starterhelp.orangehrm.com/hc/en-us
  tags:
  - HR
  - HRIS
  - HRMS
  - human resource management
  - OrangeHRM
  - HR management
  template: orangehrm.yaml
website: https://starterhelp.orangehrm.com/hc/en-us
