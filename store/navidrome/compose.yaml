# navidrome: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  navidrome:
    environment:
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: 1h
      ND_SESSIONTIMEOUT: 24h
    image: deluan/navidrome:0.63.2
    networks:
      appnet:
        aliases:
        - navidrome_navidrome_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/navidrome/data:/data
    - ${ROOT_FOLDER_HOST}/media/data/music:/music:ro
