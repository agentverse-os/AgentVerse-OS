# homarr-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      SECRET_ENCRYPTION_KEY: ${APP_SEED}
    image: ghcr.io/homarr-labs/homarr:v1.76.2@sha256:7d87f7fdd35f8bbee1b922b9b74fad8ce9967a1a66b8c6db1a168780c03d693b
    networks:
      appnet:
        aliases:
        - homarr_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/appdata
