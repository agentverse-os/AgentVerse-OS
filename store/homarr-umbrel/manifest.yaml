upstream:
  author: homarr-labs
  categories:
  - files
  release_notes: |-
    If you're updating from before Homarr 2.8.0, Custom Widget HTTP sources can reach any address accessible to Homarr, including private, loopback, and link-local addresses. Existing network-scope settings no longer restrict requests.

    This update fixes dashboard connections and display issues:

    - Restores WebSocket connections in production.
    - Keeps board tab names visible and improves renaming with custom themes.
    - Fixes widget previews on scaled boards.
    - Keeps Beszel chart tooltips visible outside widgets and thermostat controls inside narrow tiles.

    Full release notes can be found at https://github.com/homarr-labs/homarr/releases/tag/v2.13.1
