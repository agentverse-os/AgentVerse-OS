# node-red-standalone-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
      PORT: 1881
    image: nodered/node-red:5.0.10@sha256:0ed181c867c9ef19cf51dc4707f7fb54d1ad58a0227ab4e19732f6a3630c1b00
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/data
