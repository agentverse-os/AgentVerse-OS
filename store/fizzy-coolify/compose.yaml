# fizzy-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  fizzy:
    environment:
    - SERVICE_FQDN_FIZZY_80=${SERVICE_FQDN_FIZZY_80}
    - SECRET_KEY_BASE=$SERVICE_PASSWORD_FIZZY
    - RAILS_MASTER_KEY=$SERVICE_PASSWORD_64_MASTERKEY
    - RAILS_ENV=production
    - RAILS_LOG_TO_STDOUT=true
    - RAILS_SERVE_STATIC_FILES=true
    - DATABASE_ADAPTER=sqlite
    - SOLID_QUEUE_CONNECTS_TO=false
    - VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
    - VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80/up
      timeout: 5s
    image: ghcr.io/basecamp/fizzy:main
    networks:
      appnet:
        aliases:
        - fizzy-coolify_fizzy_1
    restart: unless-stopped
    volumes:
    - fizzy-data:/rails/db
    - fizzy-storage:/rails/storage
volumes:
  fizzy-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/fizzy-data
      o: bind
      type: none
  fizzy-storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/fizzy-storage
      o: bind
      type: none
