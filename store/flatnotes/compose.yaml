# flatnotes: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  flatnotes:
    environment:
      FLATNOTES_AUTH_TYPE: ${FLATNOTES_AUTH_TYPE}
      FLATNOTES_PASSWORD: ${FLATNOTES_PASSWORD}
      FLATNOTES_SECRET_KEY: ${FLATNOTES_SECRET_KEY}
      FLATNOTES_TOTP_KEY: ${FLATNOTES_TOTP_KEY}
      FLATNOTES_USERNAME: ${FLATNOTES_USERNAME}
    image: dullage/flatnotes:v5.5.5
    networks:
      appnet:
        aliases:
        - flatnotes_flatnotes_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
