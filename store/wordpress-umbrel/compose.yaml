# wordpress-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
    - db
    environment:
    - WORDPRESS_DB_HOST=wordpress_db_1
    - WORDPRESS_DB_NAME=wordpress
    - WORDPRESS_DB_USER=umbrel
    - WORDPRESS_DB_PASSWORD=umbrelwordpress
    image: wordpress:7.1@sha256:65919a9ca10940feb10d9400fead0d639bf86241f47c91e2b9ea4703aa8452cf
    networks:
      appnet:
        aliases:
        - wordpress_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/wordpress:/var/www/html
  db:
    environment:
    - MYSQL_ROOT_PASSWORD=umbrelwordpressroot
    - MYSQL_DATABASE=wordpress
    - MYSQL_USER=umbrel
    - MYSQL_PASSWORD=umbrelwordpress
    image: mariadb:11.5.2@sha256:2d50fe0f77dac919396091e527e5e148a9de690e58f32875f113bef6506a17f5
    networks:
      appnet:
        aliases:
        - wordpress_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql
