# ddns-updater: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  ddns-updater:
    image: qmcgaw/ddns-updater:v2.10.0
    networks:
      appnet:
        aliases:
        - ddns-updater_ddns-updater_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/config:/updater/data
