# mealie-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mealie:
    environment:
    - SERVICE_URL_MEALIE_9000=${SERVICE_URL_MEALIE_9000}
    - ALLOW_SIGNUP=${ALLOW_SIGNUP:-true}
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Berlin}
    - MAX_WORKERS=${MAX_WORKERS:-1}
    - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      timeout: 10s
    image: ghcr.io/mealie-recipes/mealie:3.17.0
    networks:
      appnet:
        aliases:
        - mealie-coolify_mealie_1
    restart: unless-stopped
    volumes:
    - mealie_data:/app/data
volumes:
  mealie_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mealie_data
      o: bind
      type: none
