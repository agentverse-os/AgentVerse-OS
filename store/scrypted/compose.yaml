# scrypted: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  scrypted:
    environment:
      SCRYPTED_DOCKER_AVAHI: 'false'
      SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION: ${SCRYPTED_BEARER_TOKEN}
    image: koush/scrypted:20-jammy-full.s6-v0.94.5
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/scrypted/database:/server/volume
    - ${ROOT_FOLDER_HOST}/media/data/NVR/scrypted:/nvr
