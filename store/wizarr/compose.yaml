# wizarr: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2026.7.1
    networks:
      appnet:
        aliases:
        - wizarr_wizarr_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/database:/data/database
