# firefly-iii-data-importer: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  firefly-iii-data-importer:
    environment:
      APP_DEBUG: 'false'
      APP_ENV: local
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_III_ACCESS_TOKEN}
      FIREFLY_III_CLIENT_ID: ${FIREFLY_III_CLIENT_ID}
      FIREFLY_III_URL: ${FIREFLY_III_URL}
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      TRUSTED_PROXIES: '**'
      TZ: ${TZ}
      VERIFY_TLS_SECURITY: 'false'
    image: fireflyiii/data-importer:version-2
    networks:
      appnet:
        aliases:
        - firefly-iii-data-importer_firefly-iii-data-importer_1
    restart: unless-stopped
