# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/homebox-umbrel
description: An inventory and organization system built for the home user
endpoint:
  port: 7745
  service: web
env:
  APP_SEED:
    generate: hex64
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/homebox/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/homebox/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/homebox/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/homebox/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: homebox-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: HomeBox
type: app
upstream:
  author: SysAdmins Media
  categories:
  - files
  release_notes: |-
    ⚠️ Notifications to internal IP addresses are now blocked by default. If you use local webhook services, review the notifier network security settings at https://homebox.software/en/user-guide/notifiers/#network-security-for-notifiers.

    If you're updating from a pre-0.26 version, back up your HomeBox database and files first because 0.26 introduced a significant database rework. Integrations using the old /v1/items* or /v1/locations* API endpoints must migrate to /v1/entities*.

    This maintenance update fixes connections to optional Meilisearch servers on local networks and in Docker, while continuing to reject insecure HTTP connections to public IP addresses.

    Full release notes can be found at https://github.com/sysadminsmedia/homebox/releases/tag/v0.27.1
  source: https://github.com/sysadminsmedia/homebox
  version: 0.27.1
  website: https://homebox.software
website: https://homebox.software
