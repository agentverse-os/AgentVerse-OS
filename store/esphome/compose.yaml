# esphome: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  esphome:
    environment:
      ESPHOME_DASHBOARD_USE_PING: ${ESPHOME_PING:-'false'}
      PASSWORD: ${ESPHOME_PASSWORD:-''}
      TZ: ${TZ}
      USERNAME: ${ESPHOME_USERNAME:-''}
    image: ghcr.io/esphome/esphome:2026.8.2
    networks:
      appnet:
        aliases:
        - esphome_esphome_1
    restart: unless-stopped
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - ${APP_DATA_DIR}/data/config:/config
