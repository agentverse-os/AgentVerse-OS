# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/memos-coolify
description: An open-source, lightweight note-taking solution. The pain-less way to create your meaningful notes. Your Notes, Your Way.
endpoint:
  port: 5230
  service: memos
env:
  SERVICE_URL_MEMOS_5230: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: memos-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- note-taking
- microblog
- social-network
- markdown
title: Memos
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/usememos/memos
  tags:
  - note-taking
  - microblog
  - social-network
  - markdown
  template: memos.yaml
website: https://github.com/usememos/memos
