# opencode-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    command:
    - serve
    - --hostname
    - 0.0.0.0
    - --port
    - '4096'
    environment:
      HOME: /home/opencode
    image: ghcr.io/anomalyco/opencode:1.18.26@sha256:494e9bc5de428686aa6656141f231a67aa4d2e8abd55080367277edb88c3f3ba
    networks:
      appnet:
        aliases:
        - opencode_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/opencode:/home/opencode/
