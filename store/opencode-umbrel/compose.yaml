# opencode-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    command:
    - serve
    - --hostname
    - 0.0.0.0
    - --port
    - '4096'
    environment:
      HOME: /home/opencode
    image: ghcr.io/anomalyco/opencode:1.19.6@sha256:de0dcdfb45b47080f9c01770cdd1c7af514cc2fb3dcd6cc3253b792fadb92dfa
    networks:
      appnet:
        aliases:
        - opencode_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/opencode:/home/opencode/
