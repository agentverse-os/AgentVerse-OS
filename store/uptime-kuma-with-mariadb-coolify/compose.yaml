# uptime-kuma-with-mariadb-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mariadb:
    environment:
    - MYSQL_USER=${SERVICE_USER_MARIADB}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MARIADB}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-uptime-kuma-db}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 20s
    image: mariadb:11
    networks:
      appnet:
        aliases:
        - uptime-kuma-with-mariadb-coolify_mariadb_1
    restart: unless-stopped
    volumes:
    - mariadb-data:/var/lib/mysql
  uptime-kuma:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
    - SERVICE_URL_UPTIMEKUMA_3001=${SERVICE_URL_UPTIMEKUMA_3001}
    - TZ=${TZ:-Etc/UTC}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - extra/healthcheck
      timeout: 5s
    image: louislam/uptime-kuma:2
    networks:
      appnet:
        aliases:
        - uptime-kuma-with-mariadb-coolify_uptime-kuma_1
    restart: unless-stopped
    volumes:
    - uptime-kuma-data:/app/data
volumes:
  mariadb-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mariadb-data
      o: bind
      type: none
  uptime-kuma-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/uptime-kuma-data
      o: bind
      type: none
