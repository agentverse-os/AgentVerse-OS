# appsmith-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      APPSMITH_ENCRYPTION_PASSWORD: ${APP_PASSWORD}
      APPSMITH_ENCRYPTION_SALT: ${APP_PASSWORD}
    image: appsmith/appsmith-ce:v2.7.1@sha256:0d2f4d4122b47e0a0b80fe7681d7bf8dfb4b14ccb9f6ee3e6092968c22c04b15
    networks:
      appnet:
        aliases:
        - appsmith_app_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/app:/appsmith-stacks
