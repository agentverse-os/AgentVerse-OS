upstream:
  author: Appsmith
  categories:
  - developer
  release_notes: |-
    ⚠️ If you have manually customized docker.env, replace shell expressions with resolved literal values before updating and move JVM options to your container environment. Preserve your encryption password and salt. Generated defaults and Admin Settings values need no changes.

    This update improves security for CSV downloads, datasource permissions, page editing, and Git operations. It also fixes app imports, OAuth connections using self-signed certificates, table controls, and JSON Form behavior.

    If you customized the embedding allowlist, use valid CSP frame-ancestors sources. Invalid saved values now restrict embedding to the same origin. Git-connected apps must use page names that are single path segments; rename incompatible pages before committing.

    Navigation to a missing page name now fails instead of treating it as a web address. Use a full URL for single-word hosts such as intranet. S3-compatible and DynamoDB endpoints now follow the restricted host policy; blocked hosts cannot be saved, tested, or queried.

    When upgrading from before 2.6, Redis queries must use a static command name; dynamic bindings are supported only in argument values. DynamoDB regions must contain only letters, digits, and hyphens and be no longer than 63 characters. Review the full release notes if you use these connections.

    When upgrading from before 2.5, Elasticsearch queries with dynamic values or paths may need changes. Review the full release notes before updating.

    Other changes to be aware of:
      - Saved data connections keep their credentials unless you change the connection settings. After a change, re-enter the connection's credentials or reconnect its OAuth account.
      - Opening a Git-connected app in the editor may create a one-time automatic commit. Updated Git repositories and new exports cannot be used with older Appsmith versions that only support the previous format.
      - Appsmith AI was discontinued on September 30, 2026. Its queries have stopped working regardless of this update. Switch those queries to a direct connection to OpenAI, Anthropic, or Google AI.


    If you are updating from a version older than 2.0, startup may take longer while your data is migrated. Leave Appsmith running until it finishes.

    Full release notes can be found at https://github.com/appsmithorg/appsmith/releases/tag/v2.7.1
  source: https://github.com/appsmithorg/appsmith
  version: v2.7.1
  website: https://www.appsmith.com/
website: https://www.appsmith.com/
