# zen-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    image: ghcr.io/sheshbabu/zen/zen:2.0.0@sha256:3ec9c007b194ca0873c358b9306b1c5f11d75261cbde4e78bbfce94bef00c17c
    networks:
      appnet:
        aliases:
        - zen_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
    - ${APP_DATA_DIR}/data/images:/images
