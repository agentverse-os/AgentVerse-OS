# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/zen-umbrel
description: A simple app for focused and private note-taking
endpoint:
  port: 8080
  service: app
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/zen/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zen/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zen/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zen/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/zen/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/zen/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: zen-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Zen
type: app
upstream:
  author: Sheshbabu
  categories:
  - files
  release_notes: |-
    This update adds note version history, automatic saving, a table editor, colored tags, and bulk archiving and deletion.

    Internal note links now support a resizable preview panel, search includes previews and sorting, and headings can be collapsed. It also improves canvas persistence and fixes a stored cross-site scripting vulnerability in note titles and search results.

    MCP tokens are now API tokens with configurable tag-level permissions. Existing active tokens retain read access to all tags.

    Full changes can be found at https://github.com/sheshbabu/zen/compare/1.5.0...2.0.0
  source: https://github.com/sheshbabu/zen
  version: 2.0.0
  website: https://www.sheshbabu.com/zen/
website: https://www.sheshbabu.com/zen/
