# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/triliumnext-coolify
description: Build your personal knowledge base with TriliumNext Notes.
endpoint:
  port: 8080
  service: triliumnext
env:
  SERVICE_URL_TRILIUMNEXT_8080: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: triliumnext-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- self-hosted
- notes
- todo
- organize
- markdown
- wiki
title: Triliumnext
type: app
upstream:
  categories:
  - productivity
  source: https://github.com/TriliumNext/Trilium
  tags:
  - self-hosted
  - notes
  - todo
  - organize
  - markdown
  - wiki
  template: triliumnext.yaml
website: https://github.com/TriliumNext/Trilium
