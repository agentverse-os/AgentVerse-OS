# triliumnext-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  triliumnext:
    environment:
    - SERVICE_URL_TRILIUMNEXT_8080=${SERVICE_URL_TRILIUMNEXT_8080}
    - TZ=${TZ:-Europe/Berlin}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - node
      - /usr/src/app/docker_healthcheck.cjs
      timeout: 20s
    image: ghcr.io/triliumnext/trilium:v0.107.0
    networks:
      appnet:
        aliases:
        - triliumnext-coolify_triliumnext_1
    restart: unless-stopped
    volumes:
    - triliumnext_data:/home/node/trilium-data
volumes:
  triliumnext_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/triliumnext_data
      o: bind
      type: none
