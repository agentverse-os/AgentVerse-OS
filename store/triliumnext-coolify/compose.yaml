# triliumnext-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  triliumnext:
    environment:
    - SERVICE_URL_TRILIUMNEXT_8080=${SERVICE_URL_TRILIUMNEXT_8080}
    - TZ=${TZ:-Europe/Berlin}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://127.0.0.1:8080/api/health-check || exit 1
      timeout: 20s
    image: ghcr.io/triliumnext/trilium:stable
    networks:
      appnet:
        aliases:
        - triliumnext-coolify_triliumnext_1
    platform: linux/amd64
    restart: unless-stopped
    volumes:
    - triliumnext_data:/home/node/trilium-data
volumes:
  triliumnext_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/triliumnext_data
      o: bind
      type: none
