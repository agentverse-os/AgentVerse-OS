  port: 1883
  service: mosquitto
env:
  ALLOW_ANONYMOUS: 'true'
  REQUIRE_CERTIFICATE: 'false'
  SERVICE_PASSWORD_MOSQUITTO:
    generate: password
  SERVICE_URL_MOSQUITTO_1883: https://${APP_DOMAIN}
  SERVICE_USER_MOSQUITTO:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: mosquitto-coolify
notes:
- 'порт 8883:8883 (mosquitto) не публикуется: доступ только через edge/gate'
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: REQUIRE_CERTIFICATE
  hint: 'по умолчанию: false'
  label: require certificate
  options: null
  required: false
  type: text
- env: ALLOW_ANONYMOUS
  hint: 'по умолчанию: true'
  label: allow anonymous
  options: null
  required: false
  type: text
tags:
