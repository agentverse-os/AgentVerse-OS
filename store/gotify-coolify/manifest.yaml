# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/gotify-coolify
description: Gotify is an open-source self-hosted notification server.
endpoint:
  port: 80
  service: gotify
env:
  GOTIFY_DATABASE_CONNECTION: data/gotify.db
  GOTIFY_DATABASE_DIALECT: sqlite3
  GOTIFY_PASSSTRENGTH: '10'
  GOTIFY_PLUGINSDIR: data/plugins
  GOTIFY_REGISTRATION: 'false'
  GOTIFY_SERVER_PORT: '80'
  GOTIFY_UPLOADEDIMAGESDIR: data/images
  GOTIFY_USERNAME: admin
  SERVICE_PASSWORD_GOTIFY:
    generate: password
  SERVICE_URL_GOTIFY_80: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_GOTIFY
  path: null
  user: GOTIFY_USERNAME
name: gotify-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: GOTIFY_USERNAME
  hint: 'по умолчанию: admin'
  label: gotify username
  options: null
  required: false
  type: text
- env: GOTIFY_DATABASE_DIALECT
  hint: 'по умолчанию: sqlite3'
  label: gotify database dialect
  options: null
  required: false
  type: text
- env: GOTIFY_DATABASE_CONNECTION
  hint: 'по умолчанию: data/gotify.db'
  label: gotify database connection
  options: null
  required: false
  type: text
- env: GOTIFY_PASSSTRENGTH
  hint: 'по умолчанию: 10'
  label: gotify passstrength
  options: null
  required: false
  type: text
- env: GOTIFY_UPLOADEDIMAGESDIR
  hint: 'по умолчанию: data/images'
  label: gotify uploadedimagesdir
  options: null
  required: false
  type: text
- env: GOTIFY_PLUGINSDIR
  hint: 'по умолчанию: data/plugins'
  label: gotify pluginsdir
  options: null
  required: false
  type: text
- env: GOTIFY_SERVER_PORT
  hint: 'по умолчанию: 80'
  label: gotify server port
  options: null
  required: false
  type: text
- env: GOTIFY_REGISTRATION
  hint: 'по умолчанию: false'
  label: gotify registration
  options: null
  required: false
  type: text
tags:
- productivity
- notification
- collaboration
title: Gotify
type: app
upstream:
  categories:
  - messaging
  source: https://gotify.net/docs/install
  tags:
  - productivity
  - notification
  - collaboration
  template: gotify.yaml
website: https://gotify.net/docs/install
