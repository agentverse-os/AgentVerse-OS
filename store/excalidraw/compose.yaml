# excalidraw: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    networks:
      appnet:
        aliases:
        - excalidraw_excalidraw_1
    restart: unless-stopped
