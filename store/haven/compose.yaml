# haven: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  haven:
    depends_on:
    - haven-db
    environment:
      HAVEN_DB_HOST: haven-db
      HAVEN_DB_NAME: haven
      HAVEN_DB_PASSWORD: ${HAVEN_DB_PASSWORD}
      HAVEN_DB_ROLE: haven
      HAVEN_USER_EMAIL: ${HAVEN_USER_EMAIL}
      HAVEN_USER_PASS: ${HAVEN_USER_PASSWORD}
      RAILS_ENV: production
    image: ghcr.io/havenweb/haven:latest
    networks:
      appnet:
        aliases:
        - haven_haven_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/storage:/storage
  haven-db:
    command:
    - postgres
    - -c
    - max_connections=1000
    - -c
    - synchronous_commit=off
    - -c
    - fsync=off
    - -c
    - full_page_writes=off
    - -c
    - max_wal_size=4GB
    - -c
    - checkpoint_timeout=30min
    - -c
    - wal_level=logical
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: haven
    image: postgres:13.2-alpine
    networks:
      appnet:
        aliases:
        - haven_haven-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
