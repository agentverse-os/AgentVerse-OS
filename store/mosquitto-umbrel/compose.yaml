# mosquitto-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  broker:
    image: eclipse-mosquitto:2.1.4-alpine@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    networks:
      appnet:
        aliases:
        - mosquitto_broker_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/config:/mosquitto/config:rw
    - ${APP_DATA_DIR}/data/mosquitto:/mosquitto/data:rw
    - ${APP_DATA_DIR}/data/log:/mosquitto/log:rw
  web:
    depends_on:
    - broker
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    networks:
      appnet:
        aliases:
        - mosquitto_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
    - ${APP_DATA_DIR}/data/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
