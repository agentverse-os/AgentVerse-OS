  release_notes: |-
    This update includes security fixes for the built-in web server (nginx) that Mosquitto uses. There are no changes to Mosquitto itself.

    If you're upgrading from Mosquitto 2.0, note that `max_packet_size` now defaults to 2,000,000 bytes. Adjust your configuration if you use larger packets. The `acl_file` and `password_file` options are deprecated in favour of plugins, and the bundled clients no longer support TLS v1.1.

    This update includes security and reliability fixes:
      - Fixed a built-in WebSocket handling vulnerability that could allow remote code execution
      - Fixed delayed will messages being suppressed or delivered at the wrong time
      - Fixed incorrect packet-size restrictions for incoming and outgoing messages
      - Fixed password-hashing checks and restored compatibility with legacy SHA-512 password hashes
      - Fixed crashes in the dynamic security plugin and management client


    Full release notes can be found at https://github.com/eclipse-mosquitto/mosquitto/blob/v2.1.4/ChangeLog.txt
