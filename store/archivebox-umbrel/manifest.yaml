  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: ArchiveBox
type: app
upstream:
  author: ArchiveBox
  categories:
  - files
  release_notes: |-
    This update improves archiving speed, saved-page replay, and browsing large collections. It also adds automatic social-media importers, optional chat bots for saving links, and Memento support for finding captures by date.

    Privacy and security fixes strengthen protection of private captures, browser cookies, and server files. Existing login sessions are invalidated during the update; sign in again afterward.

    Setup settings now stay saved when captures start, Chrome extensions update more reliably, and capture tools include newer SingleFile improvements.

    ArchiveBox 0.9 migrates some files in your archive data directory lazily during use. Make a full backup of your archive before updating.

    After updating, complete the server access setup when prompted. For local HTTP access, choose Private Server, Single-domain DNS, and No TLS. Keep the detected URL, click Review and save in Machine config, then Save. Continue using that address to access ArchiveBox.

    Single-domain access disables JavaScript when viewing archived pages. JavaScript still runs while capturing them.

    Full release notes can be found at https://github.com/ArchiveBox/ArchiveBox/releases/tag/v0.9.77
  source: https://github.com/ArchiveBox/ArchiveBox
  version: 0.9.77
  website: https://archivebox.io
website: https://archivebox.io
