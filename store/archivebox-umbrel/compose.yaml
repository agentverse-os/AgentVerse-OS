# archivebox-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  archivebox:
    environment:
      ADMIN_PASSWORD: ${APP_PASSWORD}
      ADMIN_USERNAME: admin
      ALLOWED_HOSTS: '*'
      PUBLIC_ADD_VIEW: 'False'
      PUBLIC_INDEX: 'True'
      PUBLIC_SNAPSHOTS: 'True'
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 180s
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:5797/public/ || exit 1
      timeout: 10s
    image: archivebox/archivebox:0.9.77@sha256:f63170551ec48d7aa087c71e2d093156dbf4b4ed8680e2f97f22483e3bc71e55
    networks:
      appnet:
        aliases:
        - archivebox_archivebox_1
    restart: on-failure
    shm_size: 1gb
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/tmp:/tmp/archivebox
