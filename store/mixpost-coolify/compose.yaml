# mixpost-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
configs:
  mixpost-inline-1:
    content: |
      #!/bin/sh
      # start.sh always creates admin@example.com with the password "changeme".
      # Replace that password with ADMIN_PASSWORD once, while it is still the default.
      (
        for i in $(seq 1 60); do
          sleep 5
          result=$(php /var/www/html/artisan tinker --no-ansi --execute='$u = Inovector\MixpostAuth\MixpostAuth::getUserClass()::where("email", "admin@example.com")->first(); if (! $u) { echo "wait"; } elseif (Illuminate\Support\Facades\Hash::check("changeme", $u->password)) { $u->password = bcrypt(getenv("ADMIN_PASSWORD")); $u->save(); echo "done"; } else { echo "done"; }' 2>/dev/null)
          [ "$result" = "done" ] && break
        done
      ) &
      exec /usr/local/bin/start.sh
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mixpost:
    configs:
    - source: mixpost-inline-1
      target: /usr/local/bin/coolify-start.sh
    depends_on:
    - mysql
    - redis
    entrypoint:
    - /usr/local/bin/coolify-start.sh
    environment:
    - SERVICE_URL_MIXPOST=${SERVICE_URL_MIXPOST}
    - APP_NAME=Mixpost
    - APP_KEY=${SERVICE_BASE64_MIXPOST}
    - APP_DEBUG=false
    - APP_DOMAIN=${SERVICE_URL_MIXPOST}
    - APP_URL=${SERVICE_URL_MIXPOST}
    - DB_DATABASE=${MYSQL_DATABASE:-mixpost_db}
    - DB_USERNAME=${SERVICE_USER_MYSQL}
    - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - SSL_EMAIL=${SSL_EMAIL:-user@example.com}
    - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 60s
      test:
      - CMD-SHELL
      - curl -fsS -o /dev/null http://127.0.0.1/mixpost/login || exit 1
      timeout: 10s
    image: inovector/mixpost:v2.6.0
    networks:
      appnet:
        aliases:
        - mixpost-coolify_mixpost_1
    restart: unless-stopped
    volumes:
    - mixpost-storage:/var/www/html/storage/app
    - mixpost-logs:/var/www/html/storage/logs
  mysql:
    environment:
    - MYSQL_DATABASE=${MYSQL_DATABASE:-mixpost_db}
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -p${SERVICE_PASSWORD_MYSQLROOT}
      timeout: 20s
    image: mysql/mysql-server:8.0
    networks:
      appnet:
        aliases:
        - mixpost-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - mixpost-mysql:/var/lib/mysql
  redis:
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
    image: redis:8.10.3-alpine
    networks:
      appnet:
        aliases:
        - mixpost-coolify_redis_1
    restart: unless-stopped
volumes:
  mixpost-logs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mixpost-logs
      o: bind
      type: none
  mixpost-mysql:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mixpost-mysql
      o: bind
      type: none
  mixpost-storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mixpost-storage
      o: bind
      type: none
