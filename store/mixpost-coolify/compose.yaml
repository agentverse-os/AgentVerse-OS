# mixpost-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mixpost:
    depends_on:
    - mysql
    - redis
    environment:
    - SERVICE_URL_MIXPOST=${SERVICE_URL_MIXPOST}
    - APP_NAME=Mixpost
    - APP_KEY=${SERVICE_BASE64_MIXPOST}
    - APP_DEBUG=false
    - APP_DOMAIN=${SERVICE_URL_MIXPOST}
    - APP_URL=${SERVICE_URL_MIXPOST}
    - DB_DATABASE=${MYSQL_DATABASE:-mixpost_db}
    - DB_USERNAME=${SERVICE_USER_MYSQL}
    - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - SSL_EMAIL=${SSL_EMAIL:-user@example.com}
    image: inovector/mixpost:latest
    networks:
      appnet:
        aliases:
        - mixpost-coolify_mixpost_1
    restart: unless-stopped
    volumes:
    - mixpost-storage:/var/www/html/storage/app
    - mixpost-logs:/var/www/html/storage/logs
  mysql:
    environment:
    - MYSQL_DATABASE=${MYSQL_DATABASE:-mixpost_db}
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -p${SERVICE_PASSWORD_MYSQLROOT}
      timeout: 20s
    image: mysql/mysql-server:8.0
    networks:
      appnet:
        aliases:
        - mixpost-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - mixpost-mysql:/var/lib/mysql
  redis:
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
    image: redis:alpine
    networks:
      appnet:
        aliases:
        - mixpost-coolify_redis_1
    restart: unless-stopped
volumes:
  mixpost-logs:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mixpost-logs
      o: bind
      type: none
  mixpost-mysql:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mixpost-mysql
      o: bind
      type: none
  mixpost-storage:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/mixpost-storage
      o: bind
      type: none
