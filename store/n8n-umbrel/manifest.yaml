  release_notes: |-
    ⚠️ If you're updating from n8n 2.27.3 or earlier, this update includes the database index migration for workflow executions introduced in 2.27.4. Large n8n instances may take several minutes to finish the migration.

    Deprecated Function, Function Item, and LangChain Code nodes can no longer be added or edited. Replace them with supported nodes before importing older workflows. Existing saved workflows can continue running.

    This update includes bug fixes and improvements:
      - Keeps AI Agent tool-call history separate for each input item and fixes extra newlines in streamed responses.
      - Improves expression compatibility and error handling.
      - Corrects credential access checks for instance owners and admins in team projects.
      - Processes every Microsoft Teams change notification in batched requests.
      - Fixes Qdrant connections behind reverse proxies with URL subpaths.


    Full release notes can be found at https://github.com/n8n-io/n8n/releases/tag/n8n%402.48.5
