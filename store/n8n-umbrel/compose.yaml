# n8n-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    - N8N_HOST=$DEVICE_DOMAIN_NAME
    - N8N_SECURE_COOKIE=false
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_PROXY_HOPS=1
    image: n8nio/n8n:2.37.7@sha256:4fed2bb0f79c98a6c677b106cf91923c8b5898f0ce81d56061159f31db5b6da8
    networks:
      appnet:
        aliases:
        - n8n_server_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data:/home/node/.n8n
