# kavita: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  kavita:
    environment:
      TZ: ${TZ}
    image: jvmilazz0/kavita:0.9.0
    networks:
      appnet:
        aliases:
        - kavita_kavita_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/kavita-config:/kavita/config
    - ${ROOT_FOLDER_HOST}/media/data/books:/books
    - ${ROOT_FOLDER_HOST}/media/data/comics:/comics
    - ${ROOT_FOLDER_HOST}/media/data/manga:/manga
