# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/paymenter-coolify
description: Open-Source Billing, Built for Hosting
endpoint:
  port: 80
  service: paymenter
env:
  MYSQL_DATABASE: paymenter-db
  SERVICE_BASE64_KEY:
    generate: hex64
  SERVICE_PASSWORD_64_REDIS:
    generate: hex64
  SERVICE_PASSWORD_MYSQL:
    generate: password
  SERVICE_PASSWORD_MYSQLROOT:
    generate: password
  SERVICE_URL_PAYMENTER: https://${APP_DOMAIN}
  SERVICE_URL_PAYMENTER_80: https://${APP_DOMAIN}
  SERVICE_USER_MYSQL:
    generate: password
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: paymenter-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: MYSQL_DATABASE
  hint: 'по умолчанию: paymenter-db'
  label: mysql database
  options: null
  required: false
  type: text
tags:
- automation
- billing
- open source
title: Paymenter
type: app
upstream:
  categories:
  - finance
  source: https://paymenter.org/docs/guides/docker
  tags:
  - automation
  - billing
  - open source
  template: paymenter.yaml
website: https://paymenter.org/docs/guides/docker
