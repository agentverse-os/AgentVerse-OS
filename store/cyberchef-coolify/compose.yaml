# cyberchef-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cyberchef:
    environment:
    - SERVICE_URL_CYBERCHEF_8080=${SERVICE_URL_CYBERCHEF_8080}
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080
      timeout: 10s
    image: ghcr.io/gchq/cyberchef:11.5.0
    networks:
      appnet:
        aliases:
        - cyberchef-coolify_cyberchef_1
    platform: linux/amd64
    restart: unless-stopped
    volumes:
    - cyberchef-data:/app/data
volumes:
  cyberchef-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/cyberchef-data
      o: bind
      type: none
