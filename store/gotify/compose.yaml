# gotify: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gotify:
    environment:
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
    image: gotify/server:3.0.0
    networks:
      appnet:
        aliases:
        - gotify_gotify_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
