# duplicati-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  duplicati:
    environment:
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: '*'
      DUPLICATI__WEBSERVICE_INTERFACE: any
      DUPLICATI__WEBSERVICE_PASSWORD: ${APP_PASSWORD}
      DUPLICATI__WEBSERVICE_PORT: '8200'
    image: duplicati/duplicati:2.3.0.4@sha256:01f8cb81ad7d548b7ceec61d696bb5d27d8057fee0ddee37c2b8a0ff1f1729f7
    networks:
      appnet:
        aliases:
        - duplicati_duplicati_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${UMBREL_ROOT}/data/storage:/umbrel
