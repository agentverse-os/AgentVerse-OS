# duplicati-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  duplicati:
    environment:
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: '*'
      DUPLICATI__WEBSERVICE_INTERFACE: any
      DUPLICATI__WEBSERVICE_PASSWORD: ${APP_PASSWORD}
      DUPLICATI__WEBSERVICE_PORT: '8200'
    image: duplicati/duplicati:2.4.1.0@sha256:5df64d95abd79ddaa41897a6c234c956d6de03df767a1b8eb8c5baecf3162bbf
    networks:
      appnet:
        aliases:
        - duplicati_duplicati_1
    restart: on-failure
    stop_grace_period: 1m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${UMBREL_ROOT}/data/storage:/umbrel
