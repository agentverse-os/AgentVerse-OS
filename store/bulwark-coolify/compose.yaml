# bulwark-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  bulwark:
    environment:
    - SERVICE_URL_BULWARK_3000=${SERVICE_URL_BULWARK_3000}
    - JMAP_SERVER_URL=
    - SESSION_SECRET=${SERVICE_HEX_64_BULWARK}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3000/api/health
      timeout: 5s
    image: ghcr.io/bulwarkmail/webmail:v1.21.2
    networks:
      appnet:
        aliases:
        - bulwark-coolify_bulwark_1
    restart: unless-stopped
    volumes:
    - bulwark-config:/app/data/admin
    - bulwark-state:/app/data/admin-state
volumes:
  bulwark-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/bulwark-config
      o: bind
      type: none
  bulwark-state:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/bulwark-state
      o: bind
      type: none
