# wireguard-easy-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  wg-easy:
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    environment:
    - SERVICE_URL_WIREGUARDEASY_51821=${SERVICE_URL_WIREGUARDEASY_51821}
    - INIT_ENABLED=true
    - INIT_USERNAME=${SERVICE_USER_ADMIN}
    - INIT_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    - INIT_HOST=${SERVICE_FQDN_WIREGUARDEASY}
    - INIT_PORT=51820
    - INSECURE=${INSECURE:-false}
    - DISABLE_IPV6=${DISABLE_IPV6:-true}
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    networks:
      appnet:
        aliases:
        - wireguard-easy-coolify_wg-easy_1
    restart: unless-stopped
    sysctls:
    - net.ipv4.conf.all.src_valid_mark=1
    - net.ipv4.ip_forward=1
    volumes:
    - wg-easy:/etc/wireguard
    - /lib/modules:/lib/modules:ro
volumes:
  wg-easy:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/wg-easy
      o: bind
      type: none
