# librespeed-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      PGID: 1000
      PUID: 1000
    image: ghcr.io/librespeed/speedtest:6.3.1@sha256:bc34bf69b6c102b23ab81b6e77beb7cce321fb0d3be33ec6e80edef3e9dd8bab
    networks:
      appnet:
        aliases:
        - librespeed_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
