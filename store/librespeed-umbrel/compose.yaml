# librespeed-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
      PGID: 1000
      PUID: 1000
    image: ghcr.io/librespeed/speedtest:6.2.1@sha256:705744f487048f209b4e389312ea82d4d5c36a76db3e5123b97d4b1649b724b5
    networks:
      appnet:
        aliases:
        - librespeed_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
