# plex-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  plex:
    environment:
    - SERVICE_URL_PLEX_32400=${SERVICE_URL_PLEX_32400}
    - _APP_URL=$SERVICE_URL_PLEX
    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-America/Toronto}
    - PLEX_CLAIM=${PLEX_CLAIM}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://localhost:32400/identity
      timeout: 10s
    image: lscr.io/linuxserver/plex:latest
    networks:
      appnet:
        aliases:
        - plex-coolify_plex_1
    restart: unless-stopped
    volumes:
    - plex-config:/config
    - plex-tv:/tv
    - plex-movies:/movies
volumes:
  plex-config:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/plex-config
      o: bind
      type: none
  plex-movies:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/plex-movies
      o: bind
      type: none
  plex-tv:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/plex-tv
      o: bind
      type: none
