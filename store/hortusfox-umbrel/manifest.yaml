# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/hortusfox-umbrel
description: A collaborative plant tracking and management application
endpoint:
  port: 80
  service: app
env:
  APP_PASSWORD:
    generate: password
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/hortusfox/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/hortusfox/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/hortusfox/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/hortusfox/4.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/hortusfox/5.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/hortusfox/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: umbrel@umbrel.local
name: hortusfox-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: HortusFox
type: app
upstream:
  author: Daniel Brendel
  categories:
  - files
  release_notes: |-
    This release adds plant attachments, remembers plant-list sort order, improves image previews, fixes admin table alignment, calendar and API response bugs, and improves text rendering sanitization.

    Full release notes can be found at https://github.com/danielbrendel/hortusfox-web/releases/tag/v5.9
  source: https://github.com/danielbrendel/hortusfox-web
  version: '5.9'
  website: https://www.hortusfox.com/
website: https://www.hortusfox.com/
