# metube-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  metube:
    environment:
    - DELETE_FILE_ON_TRASHCAN=true
    image: ghcr.io/alexta69/metube:2026.11.14@sha256:55ce41ab9a78069dc42bd808b20a96aeef4199560a02698a2205ea8a2bc4fef1
    networks:
      appnet:
        aliases:
        - metube_metube_1
    restart: on-failure
    volumes:
    - ${UMBREL_ROOT}/data/storage/downloads/metube:/downloads
