# audiobookshelf: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    networks:
      appnet:
        aliases:
        - audiobookshelf_audiobookshelf_1
    restart: unless-stopped
    volumes:
    - ${ROOT_FOLDER_HOST}/media/data/books/spoken:/audiobooks
    - ${ROOT_FOLDER_HOST}/media/data/podcasts:/podcasts
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/metadata:/metadata
