# cyberchef: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cyberchef:
    environment:
      TZ: ${TZ}
    image: ghcr.io/gchq/cyberchef:11.4.0
    networks:
      appnet:
        aliases:
        - cyberchef_cyberchef_1
    restart: unless-stopped
