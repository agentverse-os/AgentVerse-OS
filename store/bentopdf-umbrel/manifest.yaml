  release_notes: |-
    This update adds PDF measurement tools, favorite tools, and a redesigned PDF Multi Tool for working with large documents.

    You can now measure distances, perimeters, and areas in the PDF Editor, pin frequently used tools to the homepage, and compress PDFs with the new Hyper Compress engine.

    It also adds drag-and-drop ordering for multi-file conversions, Catalan and Persian translations, and fixes for signatures, placed text, and cropping.

    Full release notes can be found at https://github.com/alam00000/bentopdf/releases/tag/v2.8.11
