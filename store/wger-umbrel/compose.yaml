# wger-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cache:
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: redis-cli ping
      timeout: 5s
    image: redis:8.0.3-alpine@sha256:25c0ae32c6c2301798579f5944af53729766a18eff5660bbef196fc2e6214a9c
    networks:
      appnet:
        aliases:
        - wger_cache_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/redis-data:/data
  celery_beat:
    command: /start-beat
    depends_on:
      celery_worker:
        condition: service_healthy
    environment:
      PS_DATABASE_URI: postgres://wger:wger@db:5432/wger
      PS_STORAGE_PG_URI: postgres://powersync_storage:${APP_SEED}@db:5432/wger
      SECRET_KEY: ${APP_SEED}
    image: wger/server:2.6@sha256:997ead43aabdcd67d054f933e07d2b23875f01bf43271a267cb7796925ca27c4
    networks:
      appnet:
        aliases:
        - wger_celery_beat_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/celery-beat:${APP_DATA_DIR}/beat/
  celery_worker:
    command: /start-worker
    depends_on:
      web:
        condition: service_healthy
    environment:
      PS_DATABASE_URI: postgres://wger:wger@db:5432/wger
      PS_STORAGE_PG_URI: postgres://powersync_storage:${APP_SEED}@db:5432/wger
      SECRET_KEY: ${APP_SEED}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: celery -A wger inspect ping
      timeout: 5s
    image: wger/server:2.6@sha256:997ead43aabdcd67d054f933e07d2b23875f01bf43271a267cb7796925ca27c4
    networks:
      appnet:
        aliases:
        - wger_celery_worker_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/media:/home/wger/media
  db:
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - shared_buffers=256MB
    - -c
    - effective_cache_size=768MB
    - -c
    - work_mem=8MB
    - -c
    - random_page_cost=1.1
    - -c
    - max_connections=30
    environment:
      POSTGRES_DB: wger
      POSTGRES_PASSWORD: wger
      POSTGRES_USER: wger
      TZ: Europe/Berlin
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: pg_isready -U wger
      timeout: 5s
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    networks:
      appnet:
        aliases:
        - wger_db_1
    restart: on-failure
    shm_size: 256mb
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/postgres-data:/var/lib/postgresql/data/
  nginx:
    depends_on:
    - web
    - powersync
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1:80/
      timeout: 5s
    image: nginx:alpine3.22@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
    networks:
      appnet:
        aliases:
        - wger_nginx_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ${APP_DATA_DIR}/data/static:/wger/static:ro
    - ${APP_DATA_DIR}/data/media:/wger/media:ro
  powersync:
    command:
    - start
    - -r
    - unified
    depends_on:
      db:
        condition: service_healthy
      powersync_setup:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_DATABASE_URI: postgres://wger:wger@db:5432/wger
      PS_JWKS_URL: http://wger_web_1:8000/api/v2/powersync-keys
      PS_PORT: 8080
      PS_STORAGE_PG_URI: postgres://powersync_storage:${APP_SEED}@db:5432/wger
    image: journeyapps/powersync-service:1.22.0@sha256:2d5084910f03a029174ebc7f7ce0c0d2c43e932ead63a2d87b919e90ebbb0e77
    networks:
      appnet:
        aliases:
        - wger_powersync_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/powersync.yaml:/config/powersync.yaml:ro
    - ${APP_DATA_DIR}/sync_rules.yaml:/config/sync_rules.yaml:ro
  powersync_setup:
    command: ./manage.py setup-powersync-storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      PS_DATABASE_URI: postgres://wger:wger@db:5432/wger
      PS_STORAGE_PG_URI: postgres://powersync_storage:${APP_SEED}@db:5432/wger
      SECRET_KEY: ${APP_SEED}
    image: wger/server:2.6@sha256:997ead43aabdcd67d054f933e07d2b23875f01bf43271a267cb7796925ca27c4
    networks:
      appnet:
        aliases:
        - wger_powersync_setup_1
    restart: on-failure
    user: 1000:1000
  web:
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      powersync_setup:
        condition: service_completed_successfully
    environment:
      CSRF_TRUSTED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:${APP_WGER_PORT},http://${DEVICE_HOSTNAME}:${APP_WGER_PORT},${APP_WGER_LOCAL_URLS}
      MEDIA_URL: http://${DEVICE_DOMAIN_NAME}:${APP_WGER_PORT}/media/
      POWERSYNC_URL_PATH: ps
      PS_DATABASE_URI: postgres://wger:wger@db:5432/wger
      PS_STORAGE_PG_URI: postgres://powersync_storage:${APP_SEED}@db:5432/wger
      SECRET_KEY: ${APP_SEED}
      SITE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_WGER_PORT}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 300s
      test: wget --no-verbose --tries=1 --spider http://localhost:8000
      timeout: 5s
    image: wger/server:2.6@sha256:997ead43aabdcd67d054f933e07d2b23875f01bf43271a267cb7796925ca27c4
    networks:
      appnet:
        aliases:
        - wger_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/static:/home/wger/static
    - ${APP_DATA_DIR}/data/media:/home/wger/media
