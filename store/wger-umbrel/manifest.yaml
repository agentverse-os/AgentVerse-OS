# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/wger-umbrel
description: A fitness tracker for workouts and nutrition
endpoint:
  port: 80
  service: nginx
env:
  APP_SEED:
    generate: hex64
  APP_WGER_LOCAL_IPS: ${local_ips}
  APP_WGER_LOCAL_URLS: ${ips_with_port}
  APP_WGER_PORT: '8450'
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/wger/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wger/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wger/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wger/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wger/5.webp
- https://getumbrel.github.io/umbrel-apps-gallery/wger/6.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/wger/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: wger-umbrel
notes:
- 'celery_beat: env_file из каталога проигнорирован (значения — через настройки приложения)'
- 'celery_worker: env_file из каталога проигнорирован (значения — через настройки приложения)'
- 'powersync_setup: env_file из каталога проигнорирован (значения — через настройки приложения)'
- 'web: env_file из каталога проигнорирован (значения — через настройки приложения)'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: wger
type: app
upstream:
  author: wger Project
  categories:
  - files
  release_notes: |-
    This update includes security fixes for the built-in web server (nginx) that wger uses. There are no changes to wger itself.

    This update fixes signing in and saving changes when you open wger with https:// in the address bar.
  source: https://github.com/wger-project/wger
  version: 2.7-patch.2
  website: https://wger.de/
website: https://wger.de/
