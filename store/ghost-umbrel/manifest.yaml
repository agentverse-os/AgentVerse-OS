# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/ghost-umbrel
description: A platform for creators to publish, grow, and monetize their content
endpoint:
  port: 2368
  service: web
env:
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/5.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/6.webp
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/7.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/ghost/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: ghost-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Ghost
type: app
upstream:
  author: Ghost Foundation Ltd
  categories:
  - files
  release_notes: |-
    This update adds shipping address and phone collection to Stripe Checkout and fixes gift redemption for new members on paid-only sites.

    It also preserves feature image caption formatting, fixes corrupted card links and subscription layout, and corrects analytics date ranges and today's paid subscription changes.

    Full release notes can be found at https://github.com/TryGhost/Ghost/releases/tag/v6.78.0
  source: https://github.com/TryGhost/Ghost
  version: 6.78.0
  website: https://ghost.org/
website: https://ghost.org/
