# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/ghost-umbrel
description: A platform for creators to publish, grow, and monetize their content
endpoint:
  port: 2368
  service: web
env:
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/4.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/5.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/6.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/ghost/7.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/ghost/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: ghost-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Ghost
type: app
upstream:
  author: Ghost Foundation Ltd
  categories:
  - files
  release_notes: |-
    Ghost 6.62.0 adds the new React tag details screen, updates the Source and Casper themes, and fixes issues with unsubscribe links, subscription attribution links, duplicate image-dimension requests, private-site landing pages for signed-in members, homepage/post design preview lag, and stale Admin sidebar selections.

    Full release notes can be found at https://github.com/TryGhost/Ghost/releases/tag/v6.62.0
  source: https://github.com/TryGhost/Ghost
  version: 6.62.0
  website: https://ghost.org/
website: https://ghost.org/
