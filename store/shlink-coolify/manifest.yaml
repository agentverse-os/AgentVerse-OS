# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/shlink-coolify
description: The definitive self-hosted URL shortener
endpoint:
  port: 8080
  service: shlink-web
env:
  SERVICE_BASE64_SHLINKAPIKEY:
    generate: hex64
  SERVICE_FQDN_SHLINK: ${APP_DOMAIN}
  SERVICE_URL_SHLINK: https://${APP_DOMAIN}
  SERVICE_URL_SHLINKWEB_8080: https://${APP_DOMAIN}
  SERVICE_URL_SHLINK_8080: https://${APP_DOMAIN}
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: null
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: shlink-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags:
- links
- shortener
- sharing
- url
- short
- link
- sharing
title: Shlink
type: app
upstream:
  categories:
  - productivity
  source: https://shlink.io/
  tags:
  - links
  - shortener
  - sharing
  - url
  - short
  - link
  - sharing
  template: shlink.yaml
website: https://shlink.io/
