# gitea-with-mysql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gitea:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SERVICE_URL_GITEA_3000=${SERVICE_URL_GITEA_3000}
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__database__DB_TYPE=mysql
    - GITEA__database__HOST=mysql
    - GITEA__database__NAME=${MYSQL_DATABASE-gitea}
    - GITEA__database__USER=$SERVICE_USER_MYSQL
    - GITEA__database__PASSWD=$SERVICE_PASSWORD_MYSQL
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000
      timeout: 10s
    image: gitea/gitea:latest
    networks:
      appnet:
        aliases:
        - gitea-with-mysql-coolify_gitea_1
    restart: unless-stopped
    volumes:
    - gitea-data:/data
    - gitea-timezone:/etc/timezone:ro
    - gitea-localtime:/etc/localtime:ro
  mysql:
    environment:
    - MYSQL_USER=${SERVICE_USER_MYSQL}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:8.0
    networks:
      appnet:
        aliases:
        - gitea-with-mysql-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - gitea-mysql-data:/var/lib/mysql
volumes:
  gitea-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-data
      o: bind
      type: none
  gitea-localtime:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-localtime
      o: bind
      type: none
  gitea-mysql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-mysql-data
      o: bind
      type: none
  gitea-timezone:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-timezone
      o: bind
      type: none
