# rallly-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  rallly:
    depends_on:
      rallly_db:
        condition: service_healthy
    environment:
    - SERVICE_URL_RALLLY_3000=${SERVICE_URL_RALLLY_3000}
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@rallly_db:5432/${POSTGRES_DB:-rallly}
    - SECRET_PASSWORD=${SERVICE_PASSWORD_64_RALLLY}
    - NEXT_PUBLIC_BASE_URL=${SERVICE_URL_RALLLY}
    - ALLOWED_EMAILS=${ALLOWED_EMAILS}
    - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@example.com}
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_SECURE=${SMTP_SECURE:-false}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PWD=${SMTP_PWD}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      timeout: 20s
    image: lukevella/rallly:latest
    networks:
      appnet:
        aliases:
        - rallly-coolify_rallly_1
    platform: linux/amd64
    restart: unless-stopped
  rallly_db:
    environment:
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-rallly}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 10s
    image: postgres:14.2
    networks:
      appnet:
        aliases:
        - rallly-coolify_rallly_db_1
    restart: unless-stopped
    volumes:
    - rallly_db_data:/var/lib/postgresql/data
volumes:
  rallly_db_data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/rallly_db_data
      o: bind
      type: none
