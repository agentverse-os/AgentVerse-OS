# rallly-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  rallly:
    depends_on:
      rallly_db:
        condition: service_healthy
    environment:
    - SERVICE_URL_RALLLY_3000=${SERVICE_URL_RALLLY_3000}
    - PROXY_MODE=external
    - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@rallly_db:5432/${POSTGRES_DB:-rallly}
    - SECRET_PASSWORD=${SERVICE_PASSWORD_64_RALLLY}
    - NEXT_PUBLIC_BASE_URL=${SERVICE_URL_RALLLY}
    - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
    - INITIAL_ADMIN_EMAIL=
    - ALLOWED_EMAILS=${ALLOWED_EMAILS}
    - SUPPORT_EMAIL=
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_SECURE=${SMTP_SECURE:-false}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PWD=${SMTP_PWD}
    - SMTP_TLS_ENABLED=${SMTP_TLS_ENABLED:-false}
    - BETTER_AUTH_TRUSTED_ORIGINS=${SERVICE_URL_RALLLY}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      timeout: 20s
    image: lukevella/rallly:4.17.0
    networks:
      appnet:
        aliases:
        - rallly-coolify_rallly_1
    platform: linux/amd64
    restart: unless-stopped
  rallly_db:
    environment:
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-rallly}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 10s
    image: postgres:18
    networks:
      appnet:
        aliases:
        - rallly-coolify_rallly_db_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql
volumes:
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
