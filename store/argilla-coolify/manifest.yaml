# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/argilla-coolify
description: Argilla is a collaboration tool for AI engineers and domain experts who need to build high-quality datasets for their projects.
endpoint:
  port: 6900
  service: argilla
env:
  ARGILLA_ENABLE_TELEMETRY: '0'
  ARGILLA_USERNAME: argilla
  BACKGROUND_NUM_WORKERS: '1'
  CLUSTER_NAME: es-argilla-local
  CLUSTER_ROUTING_ALLOCATION_DISK_THRESHOLD_ENABLED: 'false'
  DEFAULT_USER_ENABLED: 'true'
  DISCOVERY_TYPE: single-node
  ES_JAVA_OPTS: \"-Xms512m -Xmx512m\"
  HF_HUB_DISABLE_TELEMETRY: '1'
  NODE_NAME: elasticsearch
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  REINDEX_DATASETS: '1'
  SERVICE_PASSWORD_APIKEY:
    generate: password
  SERVICE_PASSWORD_ARGILLA:
    generate: password
  SERVICE_PASSWORD_AUTHSECRET:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_ARGILLA_6900: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  WORKSPACE: default
  XPACK_SECURITY_ENABLED: 'false'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_ARGILLA
  path: null
  user: ARGILLA_USERNAME
name: argilla-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
