# stirling-pdf: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  stirling-pdf:
    environment:
      DOCKER_ENABLE_SECURITY: ${STIRLING_PDF_DOCKER_ENABLE_SECURITY-false}
    image: stirlingtools/stirling-pdf:2.14.3
    networks:
      appnet:
        aliases:
        - stirling-pdf_stirling-pdf_1
    privileged: true
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/trainingData:/usr/share/tesseract-ocr/5/tessdata
    - ${APP_DATA_DIR}/data/extraConfigs:/configs
    - ${APP_DATA_DIR}/data/customFiles:/customFiles/
    - ${APP_DATA_DIR}/data/logs:/logs/
