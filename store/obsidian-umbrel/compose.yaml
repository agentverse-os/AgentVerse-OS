# obsidian-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/obsidian:1.8.10@sha256:b85e75e572e75f5e00062fb564102eaad8e19970938ee8ec7bae0a96566c1400
    networks:
      appnet:
        aliases:
        - obsidian_server_1
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
