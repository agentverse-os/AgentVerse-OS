# obsidian-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/obsidian:1.15.1@sha256:de6f29048621ee475bf14a7554eabf4799d83b2181566a4fdc9f58c009d6a1dc
    networks:
      appnet:
        aliases:
        - obsidian_server_1
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
