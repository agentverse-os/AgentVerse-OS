# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/obsidian-umbrel
description: The private and flexible writing app that adapts to the way you think
endpoint:
  port: 3000
  service: server
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/obsidian/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/obsidian/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/obsidian/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/obsidian/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: obsidian-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Obsidian
type: app
upstream:
  author: Obsidian
  categories:
  - files
  release_notes: |-
    This update improves search, performance, and reliability.

    - Sort search results by relevance, with faster results and improved matching across accents and languages. - Open vaults, render notes, and navigate large canvases faster. - Fix links and backlinks becoming stale, settings not persisting on exit, and vaults failing to load when a folder cannot be read. - Improve handling of links to unfamiliar file types with a confirmation before opening them.

    If you use URI callbacks, re-enable Allow URI callbacks in Settings → Files and links on each device. This setting is now device-specific.

    Full release notes are available at https://obsidian.md/changelog/2026-11-12-desktop-v1.15.1/
  source: https://github.com/linuxserver/docker-obsidian
  version: 1.15.1
  website: https://obsidian.md/
website: https://obsidian.md/
