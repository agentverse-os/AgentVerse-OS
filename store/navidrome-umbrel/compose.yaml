# navidrome-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - GODEBUG=multipathtcp=0
    - PUID=1000
    - PGID=1000
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    networks:
      appnet:
        aliases:
        - navidrome_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${UMBREL_ROOT}/data/storage/downloads/music:/music
