# navidrome-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
    networks:
      appnet:
        aliases:
        - navidrome_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${UMBREL_ROOT}/data/storage/downloads/music:/music
