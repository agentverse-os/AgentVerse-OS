# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/navidrome-umbrel
description: Your personal streaming service
endpoint:
  port: 4533
  service: server
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/navidrome/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/navidrome/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/navidrome/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/navidrome/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: navidrome-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Navidrome
type: app
upstream:
  author: Navidrome
  categories:
  - media
  release_notes: |-
    This update lets you add Last.fm API credentials in Navidrome's app settings on umbrelOS 2.0, for artist info and scrobbling.

    Previous Navidrome 0.64.2 release notes:

    This update includes important security improvements. We recommend updating as soon as possible.
  source: https://github.com/navidrome/navidrome
  version: 0.64.2-patch.2
  website: https://www.navidrome.org/
website: https://www.navidrome.org/
