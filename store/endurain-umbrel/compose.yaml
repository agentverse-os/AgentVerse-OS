# endurain-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      BEHIND_PROXY: 'true'
      DB_HOST: endurain_db_1
      DB_PASSWORD: endurain
      DB_PORT: 5432
      DB_TYPE: postgres
      DEPLOYMENT_PROFILE: local
      SECRET_KEY: ${APP_PASSWORD}
      TRUSTED_PROXIES: ${NETWORK_IP}/16
      WEB_WORKERS: 1
    image: ghcr.io/endurain-project/endurain:v0.20.2@sha256:045af8835f82df64203b4e025baa2c603512da9c2e17babd0044533452cc20d6
    networks:
      appnet:
        aliases:
        - endurain_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app:/app/backend/data
    - ${APP_DATA_DIR}/data/logs:/app/backend/logs
  db:
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: endurain
      POSTGRES_PASSWORD: endurain
      POSTGRES_USER: endurain
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U endurain
      timeout: 5s
    image: postgres:17.4@sha256:4aed4b0525233308fc5de1b8d47f92326460d598dc5f004d14b41f183360b4e9
    networks:
      appnet:
        aliases:
        - endurain_db_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
