# penpot-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  penpot-admin-console:
    depends_on:
    - penpot-postgres
    environment:
    - PENPOT_PUBLIC_URI=http://${DEVICE_DOMAIN_NAME}:${APP_PENPOT_UI_PORT}
    - PENPOT_INTERNAL_URI=http://penpot-frontend:8080
    - PENPOT_SECRET_KEY=${APP_SEED}
    - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
    - PENPOT_DATABASE_USERNAME=penpot
    - PENPOT_DATABASE_PASSWORD=penpot
    image: penpotapp/admin-console:2.19.3@sha256:27c7ae5d7c061f2e07ddbad393316fa50e3d1d6873f1c5c807740316f29f3715
    networks:
      appnet:
        aliases:
        - penpot_penpot-admin-console_1
    restart: on-failure
  penpot-backend:
    depends_on:
    - penpot-postgres
    - penpot-valkey
    environment:
    - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification disable-smtp enable-prepl-server disable-secure-session-cookies
    - PENPOT_SECRET_KEY=${APP_SEED}
    - PENPOT_ADMIN_CONSOLE_URI=http://penpot-admin-console:3000
    - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
    - PENPOT_DATABASE_USERNAME=penpot
    - PENPOT_DATABASE_PASSWORD=penpot
    - PENPOT_REDIS_URI=redis://penpot_penpot-valkey_1/0
    - PENPOT_OBJECTS_STORAGE_BACKEND=fs
    - PENPOT_OBJECTS_STORAGE_FS_DIRECTORY=/opt/data/assets
    - PENPOT_TELEMETRY_ENABLED=false
    - PENPOT_PUBLIC_URI=http://${DEVICE_DOMAIN_NAME}:${APP_PENPOT_UI_PORT}
    image: penpotapp/backend:2.19.3@sha256:31ebb4dabd104c2ed3ae736dcf5a6043a0660ddaac7bcd8501c28036fb4b578c
    networks:
      appnet:
        aliases:
        - penpot_penpot-backend_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/assets:/opt/data/assets
  penpot-exporter:
    environment:
    - PENPOT_SECRET_KEY=${APP_SEED}
    - PENPOT_PUBLIC_URI=http://${DEVICE_DOMAIN_NAME}:${APP_PENPOT_UI_PORT}
    - PENPOT_INTERNAL_URI=http://penpot-frontend:8080
    - PENPOT_REDIS_URI=redis://penpot_penpot-valkey_1/0
    image: penpotapp/exporter:2.19.3@sha256:1705d70e79f3530b3cee65d0cdbee3c5f44f26d62f5ad43bac7945dce4c7b653
    networks:
      appnet:
        aliases:
        - penpot_penpot-exporter_1
    restart: on-failure
    user: 1000:1000
  penpot-frontend:
    depends_on:
    - penpot-backend
    - penpot-exporter
    - penpot-mcp
    - penpot-admin-console
    environment:
    - PENPOT_FLAGS=enable-registration enable-login-with-password
    - PENPOT_ADMIN_CONSOLE_URI=http://penpot-admin-console:3000
    image: penpotapp/frontend:2.19.3@sha256:d22ce9f6f4859adbc726f45965da0d4b083817b0c13ca4a49aa3e927901cccb9
    networks:
      appnet:
        aliases:
        - penpot_penpot-frontend_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/assets:/opt/data/assets
  penpot-mcp:
    image: penpotapp/mcp:2.19.3@sha256:01ee7620262379c337a9f77e3149d860330d261ffc640d89af60dc8bd45aef94
    networks:
      appnet:
        aliases:
        - penpot_penpot-mcp_1
    restart: on-failure
    user: 1000:1000
  penpot-postgres:
    environment:
    - POSTGRES_INITDB_ARGS=--data-checksums
    - POSTGRES_DB=penpot
    - POSTGRES_USER=penpot
    - POSTGRES_PASSWORD=penpot
    image: postgres:15@sha256:546445ad21cb5893c0997080b831ee45945e798c4359270e16413c8bd93575db
    networks:
      appnet:
        aliases:
        - penpot_penpot-postgres_1
    restart: on-failure
    stop_signal: SIGINT
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
  penpot-valkey:
    healthcheck:
      interval: 1s
      retries: 5
      start_period: 3s
      test:
      - CMD-SHELL
      - valkey-cli ping | grep PONG
      timeout: 3s
    image: valkey/valkey:8.1.3@sha256:facc1d2c3462975c34e10fccb167bfa92b0e0dbd992fc282c29a61c3243afb11
    networks:
      appnet:
        aliases:
        - penpot_penpot-valkey_1
    restart: on-failure
    user: 1000:1000
