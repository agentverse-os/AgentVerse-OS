# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/penpot-umbrel
description: Design and prototyping platform
endpoint:
  port: 8080
  service: penpot-frontend
env:
  APP_PENPOT_UI_PORT: '9001'
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/penpot/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/penpot/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/penpot/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/penpot/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: penpot-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Penpot
type: app
upstream:
  author: Penpot
  categories:
  - developer
  release_notes: |-
    ⚠️ Back up your designs before updating. File and version-history storage is migrated automatically on startup. Very large installations with millions of snapshots or hundreds of GB of database storage must complete the upstream migration procedure before updating: https://github.com/penpot/penpot/blob/2.19.0/operations/2.19.0-migrate-legacy-file-data.md

    This update fixes crashes when duplicating designs with deleted components and prevents a browser plugin initialization failure from leaving the entire app blank. It also improves frontend memory usage when container CPU limits are configured.

    Full release notes can be found at https://github.com/penpot/penpot/releases/tag/2.19.3
  source: https://github.com/penpot/penpot
  version: 2.19.3
  website: https://penpot.app/
website: https://penpot.app/
