# mazanoke-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 90s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 80 || exit 1
      timeout: 5s
    image: ghcr.io/civilblur/mazanoke:v1.1.7@sha256:ca83cddd90cd1e4b43102884bf39025731a1c7569f3bbda9d6530de72528cbab
    networks:
      appnet:
        aliases:
        - mazanoke_web_1
    restart: on-failure
