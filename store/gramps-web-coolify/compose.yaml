# gramps-web-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  grampsweb:
    depends_on:
    - grampsweb_redis
    environment:
    - SERVICE_URL_GRAMPSWEB_5000=${SERVICE_URL_GRAMPSWEB_5000}
    - GRAMPSWEB_TREE=${GRAMPSWEB_TREE:-Gramps Web}
    - GRAMPSWEB_CELERY_CONFIG__broker_url=redis://grampsweb_redis:6379/0
    - GRAMPSWEB_CELERY_CONFIG__result_backend=redis://grampsweb_redis:6379/0
    - GRAMPSWEB_RATELIMIT_STORAGE_URI=redis://grampsweb_redis:6379/1
    - GUNICORN_NUM_WORKERS=${GUNICORN_NUM_WORKERS:-2}
    healthcheck:
      interval: 5s
      retries: 3
      test: wget -O - http://localhost:5000 > /dev/null 2>&1
      timeout: 10s
    image: ghcr.io/gramps-project/grampsweb:25.9.0
    networks:
      appnet:
        aliases:
        - gramps-web-coolify_grampsweb_1
    restart: unless-stopped
    volumes:
    - gramps_users:/app/users
    - gramps_index:/app/indexdir
    - gramps_thumb_cache:/app/thumbnail_cache
    - gramps_cache:/app/cache
    - gramps_secret:/app/secret
    - gramps_db:/root/.gramps/grampsdb
    - gramps_media:/app/media
    - gramps_tmp:/tmp
  grampsweb_celery:
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2
    depends_on:
    - grampsweb_redis
    environment:
    - GRAMPSWEB_TREE=${GRAMPSWEB_TREE:-Gramps Web}
    - GRAMPSWEB_CELERY_CONFIG__broker_url=redis://grampsweb_redis:6379/0
    - GRAMPSWEB_CELERY_CONFIG__result_backend=redis://grampsweb_redis:6379/0
    - GRAMPSWEB_RATELIMIT_STORAGE_URI=redis://grampsweb_redis:6379/1
    healthcheck:
      interval: 5s
      retries: 3
      test: SECRET_KEY="$(cat secret/secret)" celery -A gramps_webapi.celery status || exit 1
      timeout: 10s
    image: ghcr.io/gramps-project/grampsweb:25.9.0
    networks:
      appnet:
        aliases:
        - gramps-web-coolify_grampsweb_celery_1
    restart: unless-stopped
    volumes:
      <<:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp
  grampsweb_redis:
    healthcheck:
      interval: 5s
      retries: 3
      test: redis-cli ping | grep PONG
      timeout: 10s
    image: docker.io/library/redis:7.2.4-alpine
    networks:
      appnet:
        aliases:
        - gramps-web-coolify_grampsweb_redis_1
    restart: unless-stopped
volumes:
  gramps_cache:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_cache
      o: bind
      type: none
  gramps_db:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_db
      o: bind
      type: none
  gramps_index:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_index
      o: bind
      type: none
  gramps_media:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_media
      o: bind
      type: none
  gramps_secret:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_secret
      o: bind
      type: none
  gramps_thumb_cache:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_thumb_cache
      o: bind
      type: none
  gramps_tmp:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_tmp
      o: bind
      type: none
  gramps_users:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gramps_users
      o: bind
      type: none
