# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/foundryvtt-coolify
description: Foundry Virtual Tabletop is a self-hosted & modern roleplaying platform
endpoint:
  port: 30000
  service: foundryvtt
env:
  FOUNDRY_ADMIN: atropos
  FOUNDRY_AWS_CONFIG: ''
  FOUNDRY_CSS_THEME: foundry
  FOUNDRY_DATA: /data/foundryvtt
  FOUNDRY_HOSTNAME: ''
  FOUNDRY_LANGUAGE: en.core
  FOUNDRY_LICENSE_KEY: ''
  FOUNDRY_MINIFY_STATIC_FILES: 'true'
  FOUNDRY_PASSWORD: ''
  FOUNDRY_PROXY_PORT: '80'
  FOUNDRY_PROXY_SSL: 'true'
  FOUNDRY_RELEASE_URL: ''
  FOUNDRY_ROUTE_PREFIX: ''
  FOUNDRY_TELEMETRY: 'false'
  FOUNDRY_USERNAME: ''
  FOUNDRY_WORLD: ''
  SERVICE_URL_FOUNDRY_30000: https://${APP_DOMAIN}
  TIMEZONE: UTC
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: app
  note: null
  password: null
  path: null
  user: FOUNDRY_USERNAME
name: foundryvtt-coolify
notes: []
origin: coolify
provides: []
