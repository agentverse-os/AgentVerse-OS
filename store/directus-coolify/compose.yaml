# directus-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  directus:
    environment:
    - SERVICE_URL_DIRECTUS_8055=${SERVICE_URL_DIRECTUS_8055}
    - KEY=$SERVICE_BASE64_64_KEY
    - SECRET=$SERVICE_BASE64_64_SECRET
    - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    - ADMIN_PASSWORD=$SERVICE_PASSWORD_ADMIN
    - DB_CLIENT=sqlite3
    - DB_FILENAME=/directus/database/data.db
    - WEBSOCKETS_ENABLED=true
    - CORS_ENABLED=${CORS_ENABLED:-true}
    - CORS_ORIGIN=${CORS_ORIGIN}
    - CORS_METHODS=${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}
    - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
    - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8055/admin/login
      timeout: 20s
    image: directus/directus:11
    networks:
      appnet:
        aliases:
        - directus-coolify_directus_1
    restart: unless-stopped
    volumes:
    - directus-database:/directus/database
    - directus-uploads:/directus/uploads
    - directus-extensions:/directus/extensions
    - directus-templates:/directus/templates
volumes:
  directus-database:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/directus-database
      o: bind
      type: none
  directus-extensions:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/directus-extensions
      o: bind
      type: none
  directus-templates:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/directus-templates
      o: bind
      type: none
  directus-uploads:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/directus-uploads
      o: bind
      type: none
