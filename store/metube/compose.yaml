# metube: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    networks:
      appnet:
        aliases:
        - metube_metube_1
    restart: unless-stopped
    volumes:
    - ${ROOT_FOLDER_HOST}/media/downloads/complete/:/downloads
