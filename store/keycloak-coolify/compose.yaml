# keycloak-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  keycloak:
    command:
    - start
    environment:
    - SERVICE_URL_KEYCLOAK_8080=${SERVICE_URL_KEYCLOAK_8080}
    - TZ=${TIMEZONE:-UTC}
    - KC_BOOTSTRAP_ADMIN_USERNAME=${SERVICE_USER_ADMIN}
    - KC_BOOTSTRAP_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    - KC_HOSTNAME=${SERVICE_URL_KEYCLOAK}
    - KC_HTTP_ENABLED=${KC_HTTP_ENABLED:-true}
    - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED:-true}
    - KC_PROXY_HEADERS=${KC_PROXY_HEADERS:-xforwarded}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"
      timeout: 20s
    image: quay.io/keycloak/keycloak:26.1
    networks:
      appnet:
        aliases:
        - keycloak-coolify_keycloak_1
    restart: unless-stopped
    volumes:
    - keycloak-data:/opt/keycloak/data
volumes:
  keycloak-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/keycloak-data
      o: bind
      type: none
