# grafana: generated by the importer (runtipi); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    networks:
      appnet:
        aliases:
        - grafana_grafana_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/grafana:/var/lib/grafana
