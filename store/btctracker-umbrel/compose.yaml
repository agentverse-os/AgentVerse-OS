# btctracker-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - NODE_ENV=production
    - PORT=3000
    - DATABASE_URL=file:/app/data/bitcoin-tracker.db
    - NEXTAUTH_SECRET=${APP_SEED}
    - NEXTAUTH_URL=http://${DEVICE_DOMAIN_NAME}:3947
    image: thewilqq/btc-tracker:v0.8.0@sha256:f7780ebf7e5586efebc324d4532aa768208d9f4e79b9cd048a030be8c4929df5
    networks:
      appnet:
        aliases:
        - btctracker_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
