# btctracker-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    environment:
    - NODE_ENV=production
    - PORT=3000
    - DATABASE_URL=file:/app/data/bitcoin-tracker.db
    - NEXTAUTH_SECRET=${APP_SEED}
    - NEXTAUTH_URL=http://${DEVICE_DOMAIN_NAME}:3947
    image: thewilqq/btc-tracker:v0.7.0@sha256:0c7beea5e0791cc39c9294f0a62faa24aa2ef42ed04571b63977c0afe085321b
    networks:
      appnet:
        aliases:
        - btctracker_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
