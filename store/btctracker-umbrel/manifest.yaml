# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/btctracker-umbrel
description: A simple, privacy-focused Bitcoin investment tracker
endpoint:
  port: 3000
  service: web
env:
  APP_SEED:
    generate: hex64
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/btctracker/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/btctracker/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/btctracker/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/btctracker/4.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/btctracker/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: btctracker-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: BTC Tracker
type: app
upstream:
  author: wilqq-the
  categories:
  - bitcoin
  release_notes: |-
    This update includes a redesigned interface, an important API authentication security hardening, and safer automatic database upgrades with pre-upgrade backups.

    Highlights:
      - API routes now require a valid session or API key, admin-only actions are restricted to admins, and data is scoped to its owner
      - Database upgrades now create a backup before migration and no longer silently drop unknown columns or tables
      - Adds BTC/sats display switching, backup and restore options, more CSV import sources, improved transfer fee handling, and expanded export fields


    Full release notes can be found at https://github.com/wilqq-the/BTC-Tracker/releases/tag/v0.8.0
  source: https://github.com/wilqq-the/BTC-Tracker
  version: 0.8.0
  website: https://github.com/wilqq-the
website: https://github.com/wilqq-the
