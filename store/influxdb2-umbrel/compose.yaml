# influxdb2-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    image: influxdb:2.10.1-alpine@sha256:6df3d6c5b8530ed149ecdd66086d251f40295330aa0620ae0bfdbbf3ddab4fdc
    networks:
      appnet:
        aliases:
        - influxdb2_app_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/data:/var/lib/influxdb2
    - ${APP_DATA_DIR}/data/config:/etc/influxdb2
