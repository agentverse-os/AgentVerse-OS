  release_notes: |-
    If upgrading from a version older than 2.9.0, save any API tokens you still need before updating. Tokens are hashed on startup and their original values can no longer be recovered. Full backup restores require the operator token.

    This update improves database reliability and startup diagnostics.
    - Improved health and readiness checks with clearer startup failure details - Added configurable storage compaction throughput and query time-range limits - Improved query and write statistics, caching, and partial measurement results - Fixed compaction, shard loading, and cancelled query resource handling

    Full release notes can be found at https://github.com/influxdata/influxdb/releases/tag/v2.10.1
