# jupyterlab-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    command: start-notebook.py --IdentityProvider.token=${APP_PASSWORD}
    image: quay.io/jupyter/base-notebook:lab-4.6.6@sha256:1bac999da107f2987abf891ce389d6f1b92a6367d225854eb9916c471d9bb66e
    networks:
      appnet:
        aliases:
        - jupyterlab_server_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/home/jovyan/work
