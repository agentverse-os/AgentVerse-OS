# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/jupyterlab-umbrel
description: Next-generation web interface for interactive computing and data science
endpoint:
  port: 8888
  service: server
env:
  APP_PASSWORD:
    generate: password
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/jupyterlab/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/jupyterlab/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/jupyterlab/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/jupyterlab/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: jupyterlab-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: JupyterLab
type: app
upstream:
  author: jupyterlab
  categories:
  - developer
  release_notes: |-
    This update fixes notebook editing, search, and file handling.

    - Fixes cells running in the old kernel when restarting just after a page loads. - Improves notebook scrolling, cell metadata editing, and search result tracking. - Fixes replacing files with cut-and-paste and improves Markdown previews and the table of contents.

    Full release notes can be found at https://github.com/jupyterlab/jupyterlab/releases/tag/v4.6.6
  source: https://github.com/jupyterlab/jupyterlab
  version: v4.6.6
