# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/infisical-coolify
description: Infisical is the open source secret management platform that developers use to centralize their application configuration and secrets like API keys and database credentials.
endpoint:
  port: 8080
  service: backend
env:
  ALLOW_EMPTY_PASSWORD: yes
  INF_APP_CONNECTION_GITHUB_APP_CLIENT_ID: ''
  INF_APP_CONNECTION_GITHUB_APP_CLIENT_SECRET: ''
  INF_APP_CONNECTION_GITHUB_APP_ID: ''
  INF_APP_CONNECTION_GITHUB_APP_PRIVATE_KEY: ''
  INF_APP_CONNECTION_GITHUB_APP_SLUG: ''
  NODE_ENV: production
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  SERVICE_PASSWORD_ENCRYPTIONKEY:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_REALBASE64_64_AUTHSECRET:
    generate: hex64
  SERVICE_URL_BACKEND_8080: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  SMTP_FROM_ADDRESS: ''
  SMTP_FROM_NAME: ''
  SMTP_HOST: ''
  SMTP_PASSWORD: ''
  SMTP_PORT: ''
  SMTP_USERNAME: ''
