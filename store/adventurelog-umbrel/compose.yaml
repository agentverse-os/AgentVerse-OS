# adventurelog-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: database
      POSTGRES_PASSWORD: adventure
      POSTGRES_USER: adventure
    image: ghcr.io/baosystems/postgis:15-3.5@sha256:ac619116c8ee81a386eb878956950d798b57c502985c12eb6e7be1598aa8d02f
    networks:
      appnet:
        aliases:
        - adventurelog_db_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data/
  server:
    depends_on:
    - db
    environment:
    - PGHOST=adventurelog_db_1
    - PGDATABASE=database
    - PGUSER=adventure
    - PGPASSWORD=adventure
    - SECRET_KEY=adventure
    - DJANGO_ADMIN_USERNAME=admin
    - DJANGO_ADMIN_PASSWORD=admin
    - DJANGO_ADMIN_EMAIL=admin@example.com
    - PUBLIC_URL=http://${DEVICE_DOMAIN_NAME}:8016
    - CSRF_TRUSTED_ORIGINS=http://${DEVICE_DOMAIN_NAME}:8015
    - DEBUG=False
    - FRONTEND_URL=http://${DEVICE_DOMAIN_NAME}:8015
    image: ghcr.io/seanmorley15/adventurelog-backend:v0.13.0@sha256:0250d9cb0d745a8d768f31d3cdc68ac14bfa8b43dedfe0f550158e3861c12db7
    networks:
      appnet:
        aliases:
        - adventurelog_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app:/code/media/
  web:
    depends_on:
    - server
    environment:
      BODY_SIZE_LIMIT: Infinity
      ORIGIN: http://${DEVICE_DOMAIN_NAME}:8015
      PUBLIC_SERVER_URL: http://adventurelogserver1:8000
    image: ghcr.io/seanmorley15/adventurelog-frontend:v0.13.0@sha256:51ee22428b4192f4372b54f84c8b90cd710311ad99993c5045f53b51717dd3f7
    networks:
      appnet:
        aliases:
        - adventurelog_web_1
    restart: on-failure
