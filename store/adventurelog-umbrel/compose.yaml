# adventurelog-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  db:
    environment:
      POSTGRES_DB: database
      POSTGRES_PASSWORD: adventure
      POSTGRES_USER: adventure
    image: ghcr.io/baosystems/postgis:15-3.5@sha256:ac619116c8ee81a386eb878956950d798b57c502985c12eb6e7be1598aa8d02f
    networks:
      appnet:
        aliases:
        - adventurelog_db_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data/
  server:
    depends_on:
    - db
    environment:
    - PGHOST=adventurelog_db_1
    - PGDATABASE=database
    - PGUSER=adventure
    - PGPASSWORD=adventure
    - SECRET_KEY=adventure
    - DJANGO_ADMIN_USERNAME=admin
    - DJANGO_ADMIN_PASSWORD=admin
    - DJANGO_ADMIN_EMAIL=admin@example.com
    - PUBLIC_URL=http://${DEVICE_DOMAIN_NAME}:8016
    - CSRF_TRUSTED_ORIGINS=http://${DEVICE_DOMAIN_NAME}:8015,https://${DEVICE_DOMAIN_NAME}:8015,http://${DEVICE_HOSTNAME}:8015,https://${DEVICE_HOSTNAME}:8015,${APP_ADVENTURELOG_LOCAL_URLS}
    - DEBUG=False
    - FRONTEND_URL=http://${DEVICE_DOMAIN_NAME}:8015
    image: ghcr.io/seanmorley15/adventurelog-backend:v0.13.1@sha256:8c45e21f95875ccd35a6e68f7da72504df9e837d6ee703379512cb8de6a67082
    networks:
      appnet:
        aliases:
        - adventurelog_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/app:/code/media/
  web:
    depends_on:
    - server
    environment:
      BODY_SIZE_LIMIT: Infinity
      HOST_HEADER: x-forwarded-host
      PROTOCOL_HEADER: x-forwarded-proto
      PUBLIC_SERVER_URL: http://adventurelogserver1:8000
    image: ghcr.io/seanmorley15/adventurelog-frontend:v0.13.1@sha256:568b1be1c42f456df066a8bb55be8ce0046b2c6fc96b1650db5d2162eb4f1ce9
    networks:
      appnet:
        aliases:
        - adventurelog_web_1
    restart: on-failure
