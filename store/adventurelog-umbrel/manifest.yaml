# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/adventurelog-umbrel
description: Self-hostable travel tracker and trip planner
endpoint:
  port: 3000
  service: web
env:
  APP_ADVENTURELOG_LOCAL_IPS: ${local_ips}
  APP_ADVENTURELOG_LOCAL_URLS: ${ips_with_port}
  APP_ADVENTURELOG_PORT: '8015'
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  DEVICE_HOSTNAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: adventurelog-umbrel
notes:
- 'порт 8016:80 (server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: AdventureLog
type: app
upstream:
  author: Sean Morley
  categories:
  - files
  release_notes: This update adds support for new storage management and configuration options introduced with umbrelOS 2.0. It also fixes signing in and saving changes when you open AdventureLog with https:// in the address bar.
  source: https://github.com/seanmorley15/AdventureLog
  version: v0.13.1-patch.1
  website: https://adventurelog.app/
website: https://adventurelog.app/
