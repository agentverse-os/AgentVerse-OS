# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/adventurelog-umbrel
description: Self-hostable travel tracker and trip planner
endpoint:
  port: 3000
  service: web
env:
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/adventurelog/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: adventurelog-umbrel
notes:
- 'порт 8016:80 (server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: AdventureLog
type: app
upstream:
  author: Sean Morley
  categories:
  - files
  release_notes: |-
    AdventureLog v0.13.0 "Acadia" is a major update for planning, searching, and sharing travel history. Key highlights include:


      - New dashboard with travel stats, recent locations, upcoming trips, and calendar events
      - New travel calendar with filtering, timezone-aware dates, and ICS export
      - Global search and command palette across locations, collections, lodging, transport, notes, and users
      - Collection PDF exports for printable itineraries
      - Improved maps, geocoding, photo GPS metadata, and HEIF/HEIC image support
      - Stronger shared-collection and protected-media permission checks
      - New Endurain integration and updated Wanderer API-key authentication
      - Self-hosting improvements, including backup/restore/deploy scripts and S3-compatible media storage support


    Full release notes can be found at https://github.com/seanmorley15/AdventureLog/releases/tag/v0.13.0
  source: https://github.com/seanmorley15/AdventureLog
  version: v0.13.0
  website: https://adventurelog.app/
website: https://adventurelog.app/
