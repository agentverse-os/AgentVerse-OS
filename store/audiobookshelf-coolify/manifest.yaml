# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/audiobookshelf-coolify
description: Self-hosted audiobook, ebook, and podcast server
endpoint:
  port: 80
  service: audiobookshelf
env:
  SERVICE_URL_AUDIOBOOKSHELF_80: https://${APP_DOMAIN}
  TIMEZONE: America/Toronto
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: audiobookshelf-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: TIMEZONE
  hint: 'по умолчанию: America/Toronto'
  label: timezone
  options: null
  required: false
  type: text
tags:
- audiobooks
- ebooks
- podcasts
- server
- self-hosted
title: Audiobookshelf
type: app
upstream:
  categories:
  - media
  source: https://www.audiobookshelf.org/
  tags:
  - audiobooks
  - ebooks
  - podcasts
  - server
  - self-hosted
  template: audiobookshelf.yaml
website: https://www.audiobookshelf.org/
