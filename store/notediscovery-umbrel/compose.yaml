# notediscovery-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 5s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      timeout: 3s
    image: ghcr.io/gamosoft/notediscovery:0.31.4@sha256:e3484e5ecfcdad58313048badce322d090e03269d70301b3c2b3892055dcc021
    networks:
      appnet:
        aliases:
        - notediscovery_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
