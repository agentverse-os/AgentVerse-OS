# notediscovery-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 5s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      timeout: 3s
    image: ghcr.io/gamosoft/notediscovery:0.35.0@sha256:23961ea1d33d55ecf05d38bde1a9de63c82c7e86438199d66939f725b7693b41
    networks:
      appnet:
        aliases:
        - notediscovery_web_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
