# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/open-archiver-coolify
description: A self-hosted, open-source email archiving solution with full-text search capability.
endpoint:
  port: 3000
  service: open-archiver
env:
  BODY_SIZE_LIMIT: 100M
  JWT_EXPIRES_IN: 7d
  NODE_ENV: production
  PORT_BACKEND: '4000'
  PORT_FRONTEND: '3000'
  POSTGRES_DB: open_archive
  POSTGRES_USER: ''
  RATE_LIMIT_MAX_REQUESTS: '100'
  RATE_LIMIT_WINDOW_MS: '60000'
  SERVICE_BASE64_128_JWT:
    generate: hex64
  SERVICE_HEX_64_ENCRYPTIONKEY:
    generate: hex64
  SERVICE_HEX_64_STORAGEENCRYPTIONKEY:
    generate: hex64
  SERVICE_PASSWORD_MEILISEARCH:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_PASSWORD_VALKEY:
    generate: password
  SERVICE_URL_OPENARCHIVER_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  STORAGE_LOCAL_ROOT_PATH: /var/data/open-archiver
  STORAGE_S3_ACCESS_KEY_ID: ''
  STORAGE_S3_BUCKET: ''
  STORAGE_S3_ENDPOINT: ''
  STORAGE_S3_FORCE_PATH_STYLE: 'false'
  STORAGE_S3_REGION: ''
  STORAGE_S3_SECRET_ACCESS_KEY: ''
  STORAGE_TYPE: local
  SYNC_FREQUENCY: '* * * * *'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: open-archiver-coolify
notes: []
origin: coolify
provides: []
readme: null
requires: []
route:
  mode: port
  open: iframe
schema: 1
