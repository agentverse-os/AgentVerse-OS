# open-archiver-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  meilisearch:
    environment:
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILISEARCH}
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:7700/health
      timeout: 10s
    image: getmeili/meilisearch:v1.15
    networks:
      appnet:
        aliases:
        - open-archiver-coolify_meilisearch_1
    restart: unless-stopped
    volumes:
    - meilisearch-data:/meili_data
  open-archiver:
    depends_on:
      meilisearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
    - SERVICE_URL_OPENARCHIVER_3000=${SERVICE_URL_OPENARCHIVER_3000}
    - ENCRYPTION_KEY=${SERVICE_HEX_64_ENCRYPTIONKEY}
    - STORAGE_ENCRYPTION_KEY=${SERVICE_HEX_64_STORAGEENCRYPTIONKEY}
    - PORT_BACKEND=${PORT_BACKEND:-4000}
    - PORT_FRONTEND=${PORT_FRONTEND:-3000}
    - NODE_ENV=${NODE_ENV:-production}
    - SYNC_FREQUENCY=${SYNC_FREQUENCY:-* * * * *}
    - POSTGRES_DB=${POSTGRES_DB:-open_archive}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-open-archiver-db}
    - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILISEARCH}
    - MEILI_HOST=http://meilisearch:7700
    - REDIS_HOST=valkey
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${SERVICE_PASSWORD_VALKEY}
    - REDIS_TLS_ENABLED=false
    - STORAGE_TYPE=${STORAGE_TYPE:-local}
    - STORAGE_LOCAL_ROOT_PATH=${STORAGE_LOCAL_ROOT_PATH:-/var/data/open-archiver}
    - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-100M}
    - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
    - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
    - STORAGE_S3_ACCESS_KEY_ID=${STORAGE_S3_ACCESS_KEY_ID}
    - STORAGE_S3_SECRET_ACCESS_KEY=${STORAGE_S3_SECRET_ACCESS_KEY}
    - STORAGE_S3_REGION=${STORAGE_S3_REGION}
    - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE:-false}
    - JWT_SECRET=${SERVICE_BASE64_128_JWT}
    - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
    - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    image: logiclabshq/open-archiver:latest
    networks:
      appnet:
        aliases:
        - open-archiver-coolify_open-archiver_1
    restart: unless-stopped
    volumes:
    - archiver-data:/var/data/open-archiver
  postgres:
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-open-archiver-db}
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - LC_ALL=C
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:17-alpine
    networks:
      appnet:
        aliases:
        - open-archiver-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql/data
  valkey:
    command: valkey-server --requirepass ${SERVICE_PASSWORD_VALKEY}
    healthcheck:
      interval: 10s
      retries: 3
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: valkey/valkey:8-alpine
    networks:
      appnet:
        aliases:
        - open-archiver-coolify_valkey_1
    restart: unless-stopped
    volumes:
    - valkey-data:/data
volumes:
  archiver-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/archiver-data
      o: bind
      type: none
  meilisearch-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/meilisearch-data
      o: bind
      type: none
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
  valkey-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/valkey-data
      o: bind
      type: none
