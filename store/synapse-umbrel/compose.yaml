# synapse-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    command: |-
      -c './start.py generate && ./start.py migrate_config && echo -e "
      enable_registration_without_verification: true" >> /data/homeserver.yaml && exec ./start.py'
    entrypoint: bash
    environment:
      GID: '1000'
      SYNAPSE_ENABLE_REGISTRATION: yes
      SYNAPSE_HTTP_PORT: ${APP_SYNAPSE_PORT}
      SYNAPSE_NO_TLS: yes
      SYNAPSE_REPORT_STATS: yes
      SYNAPSE_SERVER_NAME: ${APP_HIDDEN_SERVICE}
      UID: '1000'
    image: matrixdotorg/synapse:v1.165.0@sha256:673b4223c81a7634fd07d832b939a58f97081cfdaae7cdd2d1664cdcf7611b62
    networks:
      appnet:
        aliases:
        - synapse_server_1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
    - ${APP_DATA_DIR}/data/synapse:/data
