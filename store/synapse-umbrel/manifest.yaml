schema: 1
settings: []
tags: []
title: Synapse
type: app
upstream:
  author: Element
  categories:
  - social
  release_notes: |-
    ⚠️ If you manually enabled limit_profile_requests_to_users_who_share_rooms in homeserver.yaml, also enable require_auth_for_profile_requests before updating, or remove the shared-room restriction option. Synapse will no longer start with the shared-room restriction enabled without authenticated profile requests. The default Umbrel configuration is unaffected.
    This update improves room synchronization, federation reliability, and Matrix calling support.
    - Fixes missing room memberships during initial synchronization. - Improves verification of federated event signatures and error reporting for third-party invitations. - Adds stable MatrixRTC transport discovery for compatible calling clients.
    If you manually configured LiveKit transports, add matching m.livekit entries alongside your existing livekit entries for compatibility with newer clients.
    Full release notes can be found at https://github.com/element-hq/synapse/releases/tag/v1.165.0
  source: https://github.com/element-hq/synapse
