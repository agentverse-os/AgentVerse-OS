# sqlitebrowser-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/CET
    image: linuxserver/sqlitebrowser:3.13.1@sha256:5a7f74ac3878b14b71891caff746e4c3413fafa51dadd2e1dd9a5157dea59452
    networks:
      appnet:
        aliases:
        - sqlitebrowser_app_1
    restart: on-failure
    shm_size: 1gb
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
