# sqlitebrowser-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/CET
    image: linuxserver/sqlitebrowser:3.13.1@sha256:1b1e81f0af222af3353a4c8d3c4737264a1816a43e4410819430335fa099b1da
    networks:
      appnet:
        aliases:
        - sqlitebrowser_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
