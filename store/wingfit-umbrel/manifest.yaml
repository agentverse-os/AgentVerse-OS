# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/wingfit-umbrel
description: An open-source minimalist fitness app
endpoint:
  port: 8000
  service: app
env: {}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/wingfit/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/wingfit/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/wingfit/3.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/wingfit/4.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/wingfit/5.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/wingfit/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: wingfit-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Wingfit
type: app
upstream:
  author: Kovacs
  categories:
  - files
  release_notes: |-
    This release includes:
      - Fix for dark mode menu on mobile


    Full release notes can be found at https://github.com/itskovacs/wingfit/releases
  source: https://github.com/itskovacs/wingfit
  version: 5.3.1
  website: https://wingfit.fr/
website: https://wingfit.fr/
