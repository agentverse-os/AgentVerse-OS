# wingfit-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    command:
    - fastapi
    - run
    - /app/wingfit/main.py
    - --host
    - 0.0.0.0
    image: ghcr.io/itskovacs/wingfit:5.3.1@sha256:fed5dcc1c8abdec6409f4272caa08f9a6f1d2a3c8e1f9a13b3459c2ffea8a360
    networks:
      appnet:
        aliases:
        - wingfit_app_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/app/storage
