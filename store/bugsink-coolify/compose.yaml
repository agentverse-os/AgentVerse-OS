# bugsink-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-bugsink}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:17-alpine
    networks:
      appnet:
        aliases:
        - bugsink-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - bugsink-postgres-data:/var/lib/postgresql/data
  web:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SECRET_KEY=$SERVICE_PASSWORD_64_BUGSINK
    - CREATE_SUPERUSER=:$SERVICE_PASSWORD_BUGSINK
    - SERVICE_URL_BUGSINK_8000=${SERVICE_URL_BUGSINK_8000}
    - BASE_URL=$SERVICE_URL_BUGSINK
    - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-bugsink}
    - BEHIND_HTTPS_PROXY=True
    - SITE_TITLE=${SITE_TITLE:-Bugsink}
    - TIME_ZONE=${TIME_ZONE:-UTC}
    - PHONEHOME=${PHONEHOME:-False}
    - EMAIL_HOST=${EMAIL_HOST}
    - EMAIL_PORT=${EMAIL_PORT:-587}
    - EMAIL_HOST_USER=${EMAIL_HOST_USER}
    - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
    - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - python -c 'import requests; requests.get("http://localhost:8000/health/ready").raise_for_status()'
      timeout: 20s
    image: bugsink/bugsink:2
    networks:
      appnet:
        aliases:
        - bugsink-coolify_web_1
    restart: unless-stopped
volumes:
  bugsink-postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/bugsink-postgres-data
      o: bind
      type: none
