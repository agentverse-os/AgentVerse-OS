# bugsink-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  mysql:
    environment:
    - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-bugsink}
    - MYSQL_USER=${SERVICE_USER_BUGSINK}
    - MYSQL_PASSWORD=${SERVICE_PASSWORD_BUGSINK}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      timeout: 20s
    image: mysql:latest
    networks:
      appnet:
        aliases:
        - bugsink-coolify_mysql_1
    restart: unless-stopped
    volumes:
    - my-datavolume:/var/lib/mysql
  web:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
    - SECRET_KEY=$SERVICE_PASSWORD_64_BUGSINK
    - CREATE_SUPERUSER=admin:$SERVICE_PASSWORD_BUGSINK
    - SERVICE_URL_BUGSINK_8000=${SERVICE_URL_BUGSINK_8000}
    - BASE_URL=$SERVICE_URL_BUGSINK
    - DATABASE_URL=mysql://${SERVICE_USER_BUGSINK}:$SERVICE_PASSWORD_BUGSINK@mysql:3306/${MYSQL_DATABASE:-bugsink}
    - BEHIND_HTTPS_PROXY=True
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - python -c 'import requests; requests.get("http://localhost:8000/").raise_for_status()'
      timeout: 20s
    image: bugsink/bugsink
    networks:
      appnet:
        aliases:
        - bugsink-coolify_web_1
    restart: unless-stopped
volumes:
  my-datavolume:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/my-datavolume
      o: bind
      type: none
