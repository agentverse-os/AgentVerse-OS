  EMAIL_HOST: ''
  EMAIL_HOST_PASSWORD: ''
  EMAIL_HOST_USER: ''
  EMAIL_PORT: '587'
  EMAIL_USE_SSL: 'False'
  EMAIL_USE_TLS: 'True'
  PHONEHOME: 'False'
  POSTGRES_DB: bugsink
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_BUGSINK:
    generate: hex64
  SERVICE_PASSWORD_BUGSINK:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_BUGSINK: https://${APP_DOMAIN}
  SERVICE_URL_BUGSINK_8000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  SITE_TITLE: Bugsink
  TIME_ZONE: UTC
