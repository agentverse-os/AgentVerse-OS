- https://getumbrel.github.io/umbrel-apps-gallery/bazarr/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bazarr/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bazarr/3.webp
health: null
hooks: {}
host_docker_socket: false
