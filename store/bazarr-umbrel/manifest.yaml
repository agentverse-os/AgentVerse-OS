login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: bazarr-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Bazarr
type: app
upstream:
  author: morpheus65535
  categories:
  - media
  release_notes: |-
    Key improvements in this release include:
      - Fixed cutoff logic for non-HI subtitles when HI subtitles are excluded from language profiles
      - Added the Tsukihime anime provider and hash-only mode for the napiprojekt provider
      - Improved subtitle provider handling for napiprojekt, subssabbz, and history queries
      - Added safer subtitle deletion checks and safer post-processing command handling
      - Added subsync quality controls and generic webhook URL parameters


    Full release notes are found at https://github.com/morpheus65535/bazarr/releases/tag/v1.6.2
