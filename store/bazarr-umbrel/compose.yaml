# bazarr-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/bazarr:1.6.2@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
    networks:
      appnet:
        aliases:
        - bazarr_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${UMBREL_ROOT}/data/storage/downloads:/downloads
