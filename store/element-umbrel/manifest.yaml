  - social
  release_notes: |-
    This update includes two security fixes from Element and clearer recovery key prompts. New sign-ins now need to be verified from another signed-in device or with your recovery key.

    ⚠️ Element no longer upgrades very old browser sessions. If you last used Element in a browser before August 2024, that browser may show "Missing saved data" and offer to remove the device. Only continue if you have your recovery key or Element is still signed in on another device, so you can restore your encrypted messages after signing in again. Browsers that have opened Element since August 2024 aren't affected.

    Other improvements include:
      - Clearer recovery key setup and sign-out prompts
      - A softer reset warning if you have no encrypted chats
      - Your room filter selection is now remembered
      - Fixes for calls, picture-in-picture, spoiler formatting and timeline scrolling


    Full release notes can be found at https://github.com/element-hq/element-web/releases
