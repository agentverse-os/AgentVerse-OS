# element-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    image: vectorim/element-web:v1.12.35@sha256:406b48b80153818284a235fa3600b2a5b5b6b0aa0e4ef4896b36d8d3461352f3
    networks:
      appnet:
        aliases:
        - element_web_1
    restart: on-failure
    stop_grace_period: 1m
    user: nginx:nginx
