# nextcloud-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  cron:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint:
    - bash
    - /umbrel-migration-hook
    - --guard
    - cron
    image: nextcloud:35.0.3-apache@sha256:8a7a65b8bae82a79568fec2ed9cf3e374a1944eda2a22ebe130d79463336fee3
    networks:
      appnet:
        aliases:
        - nextcloud_cron_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/nextcloud:/var/www/html
    - ${APP_DATA_DIR}/hooks/pre-start:/umbrel-migration-hook:ro
    - ${APP_DATA_DIR}/data/migration:/umbrel-migration:ro
  db:
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-log-file-size=256M
    entrypoint:
    - bash
    - /umbrel-migration-hook
    - --guard
    - db
    environment:
    - MYSQL_ROOT_PASSWORD=moneyprintergobrrr
    - MYSQL_PASSWORD=moneyprintergobrrr
    - MYSQL_DATABASE=nextcloud
    - MYSQL_USER=nextcloud
    - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 5s
    image: mariadb:10.11.19@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    networks:
      appnet:
        aliases:
        - nextcloud_db_1
    restart: on-failure
    stop_grace_period: 2m
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    - ${APP_DATA_DIR}/hooks/pre-start:/umbrel-migration-hook:ro
    - ${APP_DATA_DIR}/data/migration:/umbrel-migration:ro
  redis:
    image: redis:6.2.2-buster@sha256:e10f55f92478715698a2cef97c2bbdc48df2a05081edd884938903aa60df6396
    networks:
      appnet:
        aliases:
        - nextcloud_redis_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
  web:
    command: apache2-foreground
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint:
    - bash
    - /umbrel-migration-hook
    - --guard
    - web
    environment:
    - MYSQL_HOST=nextcloud_db_1
    - REDIS_HOST=nextcloud_redis_1
    - MYSQL_PASSWORD=moneyprintergobrrr
    - MYSQL_DATABASE=nextcloud
    - MYSQL_USER=nextcloud
    - TRUSTED_PROXIES=${NETWORK_IP}/16
    - NEXTCLOUD_ADMIN_USER=umbrel
    - NEXTCLOUD_ADMIN_PASSWORD=${APP_PASSWORD}
    - NEXTCLOUD_TRUSTED_DOMAINS=${APP_DOMAIN}:${APP_NEXTCLOUD_PORT} ${APP_HIDDEN_SERVICE} ${DEVICE_HOSTNAME}:${APP_NEXTCLOUD_PORT} ${APP_NEXTCLOUD_LOCAL_IPS} nextcloud_web_1
    - PHP_UPLOAD_LIMIT=1024G
    image: nextcloud:35.0.3-apache@sha256:8a7a65b8bae82a79568fec2ed9cf3e374a1944eda2a22ebe130d79463336fee3
    networks:
      appnet:
        aliases:
        - nextcloud_web_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/nextcloud:/var/www/html
    - ${APP_DATA_DIR}/hooks/pre-start:/umbrel-migration-hook:ro
    - ${APP_DATA_DIR}/data/migration:/umbrel-migration:ro
