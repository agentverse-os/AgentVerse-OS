# Импортировано из каталога umbrel командой `cloudd store import umbrel`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/nextcloud-umbrel
description: Productivity platform that keeps you in control
endpoint:
  port: 80
  service: web
env:
  APP_HIDDEN_SERVICE: ''
  APP_NEXTCLOUD_LOCAL_IPS: ${local_ips}
  APP_NEXTCLOUD_PORT: '8081'
  APP_PASSWORD:
    generate: password
  DEVICE_HOSTNAME: ${EDGE_HOST}
  NETWORK_IP: ''
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/nextcloud/1.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/nextcloud/2.jpg
- https://getumbrel.github.io/umbrel-apps-gallery/nextcloud/3.jpg
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/nextcloud/icon.svg
login:
  mode: generated
  note: null
  password: APP_PASSWORD
  path: null
  user: umbrel
name: nextcloud-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Nextcloud
type: app
upstream:
  author: Nextcloud GmbH
  categories:
  - files
  release_notes: |-
    Nextcloud 34.0.3 is a maintenance update for Nextcloud 34. If you're updating from a pre-34 version, the upgrade may take a few minutes while Nextcloud runs its update steps; leave the app running until it comes back online.

    Highlights:
      - 📁 Fixes issues across Files, WebDAV, external storage, previews, versions, trash cleanup, and encrypted-file handling
      - 📅 Improves Calendar, Contacts, Activity, notifications, search, federation, and sharing behavior
      - 🔐 Includes security and dependency maintenance for code signing, host/IP validation, password confirmation, PDF previews, and bundled libraries


    If you use extra Nextcloud apps, check for app updates in Nextcloud after upgrading.

    Full release notes are found at https://github.com/nextcloud-releases/server/releases/tag/v34.0.3
  source: https://github.com/nextcloud/server
  version: 34.0.3
  website: https://nextcloud.com
website: https://nextcloud.com
