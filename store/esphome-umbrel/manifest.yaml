  release_notes: |-
    ESPHome 2026.8.2 is another follow-up to the recent ESPHome 2026.8.0 major update. If you're updating from a pre-2026.8 version, review the upstream upgrade checklist before updating if your configs use explicit BLE tracker IDs (`esp32_ble_id` -> `ble_hub_id`), `voc`/`nox` sensor keys, Modbus controller/server options, RC522 I²C defaults, custom web server integrations, RP2 on-die temperature ADC, LED strip color-order keys, or interrupt-pin `inverted`/`allow_other_uses` settings.
    This point release updates the bundled ESPHome Device Builder, fixes ESP-IDF reconfiguration after component discovery, resolves one_wire reset busy-waiting, improves ESP32 HTTP request watchdog behavior, and fixes LVGL select triggers, JC3636518V2 MIPI SPI dimensions, and ESP8266 mDNS update handling when the radio cannot transmit.
    Full release notes can be found at https://github.com/esphome/esphome/releases/tag/2026.8.2
