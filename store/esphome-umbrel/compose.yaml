# esphome-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: esphome/esphome:2026.11.0@sha256:35a22f23ba41e58ed1fa63627317d86f4eaba585e526e44f1118ab082cc96041
    network_mode: host
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/config
