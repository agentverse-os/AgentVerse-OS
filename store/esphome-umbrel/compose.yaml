# esphome-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: esphome/esphome:2026.8.2@sha256:85abea33854be56d9594eaddaa40988b9cda9560221823a740393c5ed5de82b8
    network_mode: host
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data:/config
