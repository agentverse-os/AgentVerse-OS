# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/chaskiq-coolify
description: Chaskiq is an messaging platform for marketing, support & sales
endpoint:
  port: 3000
  service: chaskiq
env:
  ACTIVE_STORAGE_SERVICE: local
  ADMIN_EMAIL: admin@example
  AWS_ACCESS_KEY_ID: ''
  AWS_S3_BUCKET: ''
  AWS_S3_REGION: ''
  AWS_SECRET_ACCESS_KEY: ''
  CHASKIQ_APPSTORE_TOKEN: ''
  DEFAULT_SENDER_EMAIL: admin@example
  POSTGRES_DB: chaskiq
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_SECRET:
    generate: hex64
  SERVICE_PASSWORD_ADMIN:
    generate: password
  SERVICE_PASSWORD_POSTGRES:
    generate: password
  SERVICE_URL_CHASKIQ: https://${APP_DOMAIN}
  SERVICE_URL_CHASKIQ_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  SMTP_ADDRESS: ''
  SMTP_DELIVERY_METHOD: ''
  SMTP_PASSWORD: ''
  SMTP_USERNAME: ''
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
  mode: generated
  note: null
  password: SERVICE_PASSWORD_ADMIN
  path: null
  user: ADMIN_EMAIL
