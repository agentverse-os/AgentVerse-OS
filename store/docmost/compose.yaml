# docmost: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  docmost:
    depends_on:
    - docmost-db
    - docmost-redis
    environment:
      APP_SECRET: ${DOCMOST_APP_SECRET}
      APP_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      DATABASE_URL: postgresql://docmost:${DOCMOST_PG_PASSWORD}@docmost-db:5432/docmost?schema
      REDIS_URL: redis://docmost-redis:6379
    image: docmost/docmost:0.95.0
    networks:
      appnet:
        aliases:
        - docmost_docmost_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/storage:/app/data/storage
  docmost-db:
    environment:
      POSTGRES_DB: docmost
      POSTGRES_PASSWORD: ${DOCMOST_PG_PASSWORD}
      POSTGRES_USER: docmost
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - docmost_docmost-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgresql:/var/lib/postgresql/data
  docmost-redis:
    image: redis:7.2-alpine
    networks:
      appnet:
        aliases:
        - docmost_docmost-redis_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
