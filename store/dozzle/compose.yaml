# Dozzle reads Docker through the read-only proxy cloudos-docker-ro (bootstrap/docker-proxy), not through the
# host socket.
services:
  dozzle:
    image: amir20/dozzle:v8
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOCKER_HOST: tcp://cloudos-docker-ro:2375
    networks: [appnet, dockerro]
networks:
  appnet:
    external: true
    name: ${APP_NET}
  dockerro:
    external: true
    name: cloudos-docker-ro-net
