# Live container logs (3.10). Docker — through the read-only proxy cloudos-docker-ro (DOCKER_HOST), the host socket is not
# mounted.
schema: 1
origin: manual
name: dozzle
title: Dozzle
description: "Live logs of Docker containers"
i18n:
  ru: { description: "Живые логи Docker-контейнеров" }
  uk: { description: "Живі логи Docker-контейнерів" }
  es: { description: "Registros en vivo de los contenedores Docker" }
icon: 📜
type: app
compose: ./compose.yaml
provides: []
requires: []
route: { mode: port, open: iframe }
auth: own
env: {}
data: []
health: http://dozzle:8080/healthcheck
endpoint: { service: dozzle, port: 8080 }

# no sign-in: access is limited by the Cloud
# OS network
login:
  mode: none
