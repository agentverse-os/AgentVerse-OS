upstream:
  author: Homebridge
  categories:
  - automation
  release_notes: |-
    ⚠️ Major update reminder: If you are upgrading from a pre-2.x Homebridge release, check plugin readiness indicators and update outdated plugins before upgrading. Older plugins that use removed Homebridge or HAP-NodeJS APIs may fail until updated.

    This update includes Homebridge UI 5.30.1, which fixes config editor validation of valid UI options and prevents log and terminal text from being cut off in Safari. Custom plugin UIs can now read the accessory room layout. Homebridge remains at 2.5.0 with Node.js 26.13.1.

    If you use plugins with native dependencies, check their compatibility with Node.js 26 before updating.

    HAP-NodeJS now uses a built-in file storage replacement for node-persist. Saved Homebridge data is not migrated or rewritten, but rare plugins that call removed storage methods may need plugin updates.

    Full release notes can be found at https://github.com/homebridge/docker-homebridge/releases/tag/2026-11-15
  source: https://github.com/homebridge/homebridge
