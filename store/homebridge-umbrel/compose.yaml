# homebridge-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    image: homebridge/homebridge:2026-11-15@sha256:5a76d945dd24250b1886f13f14fd65bb3ccc8489eaf57a23dd336cff1cf436ba
    network_mode: host
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/data/homebridge:/homebridge
