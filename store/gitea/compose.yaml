# gitea: сгенерировано импортёром (runtipi); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gitea:
    depends_on:
    - gitea-db
    environment:
      GITEA__database__DB_HOST: gitea-db:5432
      GITEA__database__DB_NAME: gitea
      GITEA__database__DB_PASSWD: gitea
      GITEA__database__DB_TYPE: postgres
      GITEA__database__DB_USER: gitea
      USER_GID: '1000'
      USER_UID: '1000'
    image: gitea/gitea:1.27.2
    networks:
      appnet:
        aliases:
        - gitea_gitea_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/gitea:/data
  gitea-db:
    environment:
      POSTGRES_DB: gitea
      POSTGRES_PASSWORD: gitea
      POSTGRES_USER: gitea
    image: postgres:14
    networks:
      appnet:
        aliases:
        - gitea_gitea-db_1
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
