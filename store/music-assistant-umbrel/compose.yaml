# music-assistant-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    cap_add:
    - SYS_ADMIN
    - DAC_READ_SEARCH
    environment:
      TORCH_HOME: /data/.cache/torch
      XDG_CACHE_HOME: /data/.cache
    image: ghcr.io/music-assistant/server:2.10.12@sha256:7eb272e2e13da9a5d61dcbc4e1fcfc734776222b23f2825a9b5690d4427cfafb
    network_mode: host
    restart: on-failure
    security_opt:
    - apparmor=unconfined
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data/
    - ${UMBREL_ROOT}/data/storage/downloads:/media
