# music-assistant-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  web:
    cap_add:
    - SYS_ADMIN
    - DAC_READ_SEARCH
    environment:
      TORCH_HOME: /data/.cache/torch
      XDG_CACHE_HOME: /data/.cache
    image: ghcr.io/music-assistant/server:2.10.1@sha256:e6edefe825b1cdc50223c16d9bc2fca909a158b36555a7763512b76ba04a1b9e
    network_mode: host
    restart: on-failure
    security_opt:
    - apparmor=unconfined
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data/
    - ${UMBREL_ROOT}/data/storage/downloads:/media
