# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/music-assistant-umbrel
description: A music library manager for your offline and online music sources
endpoint:
  port: 8896
  service: web
env:
  UMBREL_ROOT: ${APP_DATA_DIR}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/music-assistant/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/music-assistant/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/music-assistant/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/music-assistant/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: music-assistant-umbrel
notes: []
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Music Assistant
type: app
upstream:
  author: Music Assistant
  categories:
  - media
  release_notes: |-
    This release improves music service reliability and fixes AirPlay playback and pairing.

    - Reduces unnecessary requests to music services, improving playback reliability, particularly with Spotify. - Fixes silent playback on HomePod mini 2 and Shairport Sync speakers, AirPlay group startup and synchronization, and pairing on OS 27.2. - Avoids fetching an artist's entire catalogue when opening or playing an artist, and limits stalled playback requests. - Fixes music files failing to import while the server is busy and adds timeouts to audio metadata probes. - Improves artist track listings on the party guest page and safely handles control characters in audio metadata and file lists.

    Full release notes can be found at https://github.com/music-assistant/server/releases/tag/2.10.12
  source: https://github.com/music-assistant/server
  version: 2.10.12
  website: https://www.music-assistant.io
website: https://www.music-assistant.io
