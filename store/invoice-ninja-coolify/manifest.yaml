# Импортировано из каталога coolify командой `cloudd store import coolify`; правки руками перезапишутся —
# для ручной версии поставьте `origin: manual`. Compose и метаданные — upstream, контракт (route/endpoint/env/data) — наш.
auth: own
compose: ./compose.yaml
data:
- tank/apps/invoice-ninja-coolify
description: The leading open-source invoicing platform
endpoint:
  port: 9000
  service: invoice-ninja
env:
  AWS_ACCESS_KEY_ID: ''
  AWS_BUCKET: ''
  AWS_DEFAULT_REGION: ''
  AWS_ENDPOINT: ''
  AWS_SECRET_ACCESS_KEY: ''
  AWS_URL: ''
  DB_DATABASE: invoiceninja
  DB_HOST: mariadb
  DB_PORT: '3306'
  IN_USER_EMAIL: admin@example.com
  LICENSE_KEY: ''
  MAIL_ENCRYPTION: ''
  MAIL_FROM_ADDRESS: ''
  MAIL_FROM_NAME: ''
  MAIL_HOST: ''
  MAIL_MAILER: log
  MAIL_PASSWORD: ''
  MAIL_PORT: ''
  MAIL_USERNAME: ''
  NORDIGEN_SECRET_ID: ''
  NORDIGEN_SECRET_KEY: ''
  PDF_GENERATOR: hosted_ninja
  PHANTOMJS_PDF_GENERATION: 'false'
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REQUIRE_HTTPS: 'false'
  SCOUT_DRIVER: ''
  SERVICE_PASSWORD_INVOICENINJAUSER:
    generate: password
  SERVICE_PASSWORD_MARIADB:
    generate: password
  SERVICE_PASSWORD_MARIADBROOT:
    generate: password
  SERVICE_PASSWORD_REDIS:
    generate: password
  SERVICE_REALBASE64_INVOICENINJA:
    generate: hex64
  SERVICE_URL_INVOICENINJA: https://${APP_DOMAIN}
  SERVICE_USER_MARIADB:
    generate: password
  TRUSTED_PROXIES: '*'
gallery: []
health: null
hooks: {}
host_docker_socket: false
icon: ./logo.png
login:
