# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/gitea-umbrel
description: A painless self-hosted Git service
endpoint:
  port: 8085
  service: server
env:
  APP_GITEA_SSH_PORT: '2222'
  APP_GITEA_TOR_HS_EXTRA_PORTS: 22:gitea_server_1:${APP_GITEA_SSH_PORT}
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/gitea/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/gitea/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/gitea/3.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/gitea/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: gitea-umbrel
notes:
- 'порт ${APP_GITEA_SSH_PORT}:${APP_GITEA_SSH_PORT} (server) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings: []
tags: []
title: Gitea
type: app
upstream:
  author: Gitea
  categories:
  - developer
  release_notes: |-
    This update includes security improvements to access checks, organization and issue visibility, repository mirror credentials, and two-factor authentication. We recommend updating as soon as possible.

    Git pushes and issue notifications are more reliable. This release also improves Actions workflows and live synchronization, fixes wiki previews and pasted code formatting, and adds support for OCI 1.1 container image names.

    Full release notes: https://github.com/go-gitea/gitea/releases/tag/v28.4.0
  source: https://github.com/go-gitea/gitea
  version: 28.4.0
  website: https://gitea.io/en-us/
website: https://gitea.io/en-us/
