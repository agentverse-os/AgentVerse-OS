# bitcoin-umbrel: сгенерировано импортёром (umbrel); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  app:
    environment:
      APPS_SUBNET: ${NETWORK_IP}/16
      BITCOIND_EXTRA_ARGS: -deprecatedrpc=create_bdb
      BITCOIND_IP: ${APP_BITCOIN_NODE_IP}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
      I2P_HOST: ${APP_BITCOIN_I2P_DAEMON_IP}
      I2P_SAM_PORT: '7656'
      P2P_HIDDEN_SERVICE: ${APP_BITCOIN_P2P_HIDDEN_SERVICE}
      P2P_PORT: ${APP_BITCOIN_P2P_PORT}
      P2P_WHITEBIND_PORT: ${APP_BITCOIN_P2P_WHITEBIND_PORT}
      RPC_HIDDEN_SERVICE: ${APP_BITCOIN_RPC_HIDDEN_SERVICE}
      RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      RPC_USER: ${APP_BITCOIN_RPC_USER}
      TOR_CONTROL_PASSWORD: moneyprintergobrrr
      TOR_CONTROL_PORT: '9051'
      TOR_HOST: ${APP_BITCOIN_TOR_PROXY_IP}
      TOR_PORT: ${APP_BITCOIN_TOR_PORT}
      TOR_SOCKS_PORT: '9050'
      ZMQ_HASHBLOCK_PORT: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      ZMQ_HASHTX_PORT: ${APP_BITCOIN_ZMQ_HASHTX_PORT}
      ZMQ_RAWBLOCK_PORT: ${APP_BITCOIN_ZMQ_RAWBLOCK_PORT}
      ZMQ_RAWTX_PORT: ${APP_BITCOIN_ZMQ_RAWTX_PORT}
      ZMQ_SEQUENCE_PORT: ${APP_BITCOIN_ZMQ_SEQUENCE_PORT}
    image: ghcr.io/getumbrel/umbrel-bitcoin:v1.4.0@sha256:13a24256cdd7b1cead36c2e4dcedc699b31fc235a0e4179c8c4527f0c361e6bf
    networks:
      appnet:
        aliases:
        - bitcoin_app_1
    restart: on-failure
    stop_grace_period: 15m30s
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/data:/data
  i2pd_daemon:
    command: --sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error
    image: purplei2p/i2pd:release-2.59.0@sha256:257653c18ce0b127ef480e3d8373b3ddbf1495e842674c8cfc59909be0015979
    networks:
      appnet:
        aliases:
        - bitcoin_i2pd_daemon_1
    restart: on-failure
    user: root
    volumes:
    - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
  tor:
    environment:
      HOME: /tmp
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    networks:
      appnet:
        aliases:
        - bitcoin_tor_1
    restart: on-failure
    user: 1000:1000
    volumes:
    - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
    - ${TOR_DATA_DIR}:/data
