# Imported from the umbrel catalog by `cloudd store import umbrel`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/bitcoin-umbrel
description: Run your personal node powered by Bitcoin Core
endpoint:
  port: 3000
  service: app
env:
  APP_BITCOIN_DATA_DIR: ${EXPORTS_DATA_ROOT}/bitcoin
  APP_BITCOIN_I2P_DAEMON_IP: 10.21.22.11
  APP_BITCOIN_IPC_ENABLED: 'false'
  APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH: node.sock
  APP_BITCOIN_NETWORK: mainnet
  APP_BITCOIN_NETWORK_ELECTRS: $APP_BITCOIN_NETWORK
  APP_BITCOIN_NODE_IP: 10.21.21.8
  APP_BITCOIN_P2P_HIDDEN_SERVICE: ''
  APP_BITCOIN_P2P_PORT: '8333'
  APP_BITCOIN_P2P_WHITEBIND_PORT: '8335'
  APP_BITCOIN_RPC_HIDDEN_SERVICE: ''
  APP_BITCOIN_RPC_PASS: ''
  APP_BITCOIN_RPC_PORT: '8332'
  APP_BITCOIN_RPC_USER: ''
  APP_BITCOIN_TOR_PORT: '8334'
  APP_BITCOIN_TOR_PROXY_IP: 10.21.22.10
  APP_BITCOIN_ZMQ_HASHBLOCK_PORT: '28334'
  APP_BITCOIN_ZMQ_HASHTX_PORT: '28336'
  APP_BITCOIN_ZMQ_RAWBLOCK_PORT: '28332'
  APP_BITCOIN_ZMQ_RAWTX_PORT: '28333'
  APP_BITCOIN_ZMQ_SEQUENCE_PORT: '28335'
  DEVICE_DOMAIN_NAME: ${EDGE_HOST}
  NETWORK_IP: ''
  TOR_DATA_DIR: ''
gallery:
- https://getumbrel.github.io/umbrel-apps-gallery/bitcoin/1.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bitcoin/2.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bitcoin/3.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bitcoin/4.webp
- https://getumbrel.github.io/umbrel-apps-gallery/bitcoin/5.webp
health: null
hooks: {}
host_docker_socket: false
icon: https://getumbrel.github.io/umbrel-apps-gallery/bitcoin/icon.svg
login:
  mode: app
  note: null
  password: null
  path: null
  user: null
name: bitcoin-umbrel
notes:
- 'порт ${APP_BITCOIN_P2P_PORT}:${APP_BITCOIN_P2P_PORT} (app) не публикуется: доступ только через edge/gate'
- 'порт ${APP_BITCOIN_RPC_PORT}:${APP_BITCOIN_RPC_PORT} (app) не публикуется: доступ только через edge/gate'
origin: umbrel
provides: []
readme: ./description.md
requires: []
route:
  mode: port
  open: iframe
schema: 1
settings:
- env: APP_BITCOIN_P2P_HIDDEN_SERVICE
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bitcoin p2p hidden service
  options: null
  required: false
  type: text
- env: APP_BITCOIN_RPC_HIDDEN_SERVICE
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bitcoin rpc hidden service
  options: null
  required: false
  type: text
- env: APP_BITCOIN_RPC_PASS
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bitcoin rpc pass
  options: null
  required: false
  type: text
- env: APP_BITCOIN_RPC_USER
  hint: переменная каталога Umbrel без значения по умолчанию
  label: app bitcoin rpc user
  options: null
  required: false
  type: text
- env: TOR_DATA_DIR
  hint: переменная каталога Umbrel без значения по умолчанию
  label: tor data dir
  options: null
  required: false
  type: text
tags: []
title: Bitcoin Node
type: app
upstream:
  author: Umbrel
  categories:
  - bitcoin
  release_notes: |-
    This update adds Bitcoin Core v32.1, v31.2, v30.4, and v29.5, which fix security vulnerabilities that Bitcoin Core disclosed on October 28, 2026.

    If your node is set to always use the latest version, it will start running Bitcoin Core v32.1 after this update. If you have chosen to stay on a specific version, your node will keep running that version until you change it. We recommend switching in Settings to v32.1, or to v31.2 or v30.4 if you want to stay on the same major version. Bitcoin Core 29.x is now end of life and no longer receives security fixes, so if you have chosen to stay on 29.x, we recommend switching to a newer version.

    Bitcoin Core v32.1 adds new settings for the maximum number of RPC connections, the share of incoming connections that can relay transactions, and block validation prefetch threads. It also raises the default maximum number of peer connections from 125 to 200 on new installs. Existing nodes keep their current setting.

    Private transaction broadcasting is now only available on Bitcoin Core v32.1, which fixes an IP address leak that was not fixed in v31.x. If you have chosen to stay on Bitcoin Core v31.x, private transaction broadcasting will be turned off.

    The app now shows a warning if the version you have chosen to stay on is missing security fixes or no longer receives them.
  source: https://github.com/getumbrel/umbrel-bitcoin
  version: 1.5.0
  website: https://umbrel.com
website: https://umbrel.com
