# zero-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  postgres:
    command:
    - postgres
    - -c
    - wal_level=logical
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRES}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
    - POSTGRES_DB=${POSTGRES_DB:-zero-db}
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:18-alpine
    networks:
      appnet:
        aliases:
        - zero-coolify_postgres_1
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql
  zero:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - SERVICE_URL_ZERO_4848=${SERVICE_URL_ZERO_4848}
    - ZERO_UPSTREAM_DB=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB}
    - ZERO_CVR_DB=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB}
    - ZERO_CHANGE_DB=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB}
    - ZERO_REPLICA_FILE=/data/replica.db
    - ZERO_ADMIN_PASSWORD=${SERVICE_PASSWORD_64_ADMIN}
    - ZERO_QUERY_URL=
    - ZERO_MUTATE_URL=
    - ZERO_ENABLE_CRUD_MUTATIONS=${ZERO_ENABLE_CRUD_MUTATIONS:-false}
    - ZERO_NUM_SYNC_WORKERS=${ZERO_NUM_SYNC_WORKERS:-1}
    - ZERO_APP_ID=${ZERO_APP_ID:-zero}
    - ZERO_LOG_LEVEL=${ZERO_LOG_LEVEL:-info}
    - ZERO_ENABLE_TELEMETRY=${ZERO_ENABLE_TELEMETRY:-true}
    - ZERO_LAZY_STARTUP=${ZERO_LAZY_STARTUP:-false}
    - ZERO_QUERY_API_KEY=${ZERO_QUERY_API_KEY:-}
    - ZERO_MUTATE_API_KEY=${ZERO_MUTATE_API_KEY:-}
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 60s
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:4848/keepalive
      timeout: 20s
    image: rocicorp/zero:1.12.0
    networks:
      appnet:
        aliases:
        - zero-coolify_zero_1
    restart: unless-stopped
    volumes:
    - zero-data:/data
volumes:
  postgres-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/postgres-data
      o: bind
      type: none
  zero-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/zero-data
      o: bind
      type: none
