# Imported from the coolify catalog by `cloudd store import coolify`; manual edits will be overwritten —
# for a hand-maintained version set `origin: manual`. Compose and metadata are upstream, the contract (route/endpoint/env/data) is ours.
auth: own
compose: ./compose.yaml
data:
- tank/apps/zero-coolify
description: Query-driven sync engine for TypeScript apps backed by Postgres.
endpoint:
  port: 4848
  service: zero
env:
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  SERVICE_PASSWORD_64_ADMIN:
    generate: hex64
  SERVICE_PASSWORD_64_POSTGRES:
    generate: hex64
  SERVICE_URL_ZERO_4848: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRES:
    generate: password
  ZERO_APP_ID: zero
  ZERO_ENABLE_CRUD_MUTATIONS: 'false'
  ZERO_ENABLE_TELEMETRY: 'true'
  ZERO_LAZY_STARTUP: 'false'
  ZERO_LOG_LEVEL: info
  ZERO_MUTATE_API_KEY: ''
  ZERO_NUM_SYNC_WORKERS: '1'
  ZERO_QUERY_API_KEY: ''
