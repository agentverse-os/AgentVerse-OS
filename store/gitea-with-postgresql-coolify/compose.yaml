# gitea-with-postgresql-coolify: сгенерировано импортёром (coolify); сеть external (создаёт cloudd), порты не публикуются.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  gitea:
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
    - SERVICE_URL_GITEA_3000=${SERVICE_URL_GITEA_3000}
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__database__DB_TYPE=postgres
    - GITEA__database__HOST=postgresql
    - GITEA__database__NAME=${POSTGRESQL_DATABASE-gitea}
    - GITEA__database__USER=$SERVICE_USER_POSTGRESQL
    - GITEA__database__PASSWD=$SERVICE_PASSWORD_POSTGRESQL
    healthcheck:
      interval: 2s
      retries: 15
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000
      timeout: 10s
    image: gitea/gitea:latest
    networks:
      appnet:
        aliases:
        - gitea-with-postgresql-coolify_gitea_1
    restart: unless-stopped
    volumes:
    - gitea-data:/data
    - gitea-timezone:/etc/timezone:ro
    - gitea-localtime:/etc/localtime:ro
  postgresql:
    environment:
    - POSTGRES_USER=${SERVICE_USER_POSTGRESQL}
    - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
    - POSTGRES_DB=${POSTGRESQL_DATABASE}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 20s
    image: postgres:16-alpine
    networks:
      appnet:
        aliases:
        - gitea-with-postgresql-coolify_postgresql_1
    restart: unless-stopped
    volumes:
    - gitea-postgresql-data:/var/lib/postgresql/data
volumes:
  gitea-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-data
      o: bind
      type: none
  gitea-localtime:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-localtime
      o: bind
      type: none
  gitea-postgresql-data:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-postgresql-data
      o: bind
      type: none
  gitea-timezone:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/gitea-timezone
      o: bind
      type: none
