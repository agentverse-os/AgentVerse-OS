  POSTGRESQL_DATABASE: gitea
  POSTGRES_DB: ''
  POSTGRES_USER: ''
  SERVICE_PASSWORD_POSTGRESQL:
    generate: password
  SERVICE_URL_GITEA_3000: https://${APP_DOMAIN}
  SERVICE_USER_POSTGRESQL:
    generate: password
