# heimdall-umbrel: generated by the importer (umbrel); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  server:
    environment:
    - PUID=1000
    - PGID=1000
    image: linuxserver/heimdall:2.8.4@sha256:a2ab22230f93ef416cdd92713470b17a615fa771a834848193a6332c6b311dce
    networks:
      appnet:
        aliases:
        - heimdall_server_1
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/config:/config
