# terraria-server-coolify: generated by the importer (coolify); the network is external (created by cloudd), ports are not published.
networks:
  appnet:
    external: true
    name: ${APP_NET}
services:
  terraria-server:
    environment:
    - worldpath=${WORLDPATH:-/root/.local/share/Terraria/Worlds}
    - autocreate=${AUTOCREATE:-2}
    - world=${WORLD:-world1.wld}
    - difficulty=${DIFFICULTY:-1}
    - maxplayers=${MAXPLAYERS:-8}
    - password=${SERVICE_PASSWORD_TERRARIA}
    - motd=${MOTD:-Welcome to the server!}
    - language=${LANGUAGE:-en/US}
    - secure=${SECURE:-1}
    image: hexlo/terraria-server-docker:1.4.5.8
    networks:
      appnet:
        aliases:
        - terraria-server-coolify_terraria-server_1
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
    - terraria-server:/root/.local/share/Terraria/Worlds
volumes:
  terraria-server:
    driver: local
    driver_opts:
      device: ${APP_DATA_DIR}/terraria-server
      o: bind
      type: none
