# Spike 0 · Coder server + PostgreSQL for the stand. Coder gets the Incus socket directly — an assumption of the
# spike, not the product (in the product: a restricted Incus remote/project).
#
#   export EDGE_HOST=box.netbird.cloud             # the host name in the overlay network (a NetBird FQDN or <box>.<tailnet>.ts.net)
#   export INCUS_ADMIN_GID=$(getent group incus-admin | cut -d: -f3)
#   docker compose -f coder-compose.yml up -d
#   docker compose -f coder-compose.yml exec coder coder login https://$EDGE_HOST:8444   # the first user is created in the UI
#   coder templates push spike-incus -d . -y                                              # from this directory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder-spike-only
      POSTGRES_DB: coder
    volumes:
      - /srv/postgres/coder:/var/lib/postgresql/data      # tank/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 5s
      timeout: 3s
      retries: 20

  coder:
    image: ghcr.io/coder/coder:latest                      # pin a specific stable after the spike
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: postgresql://coder:coder-spike-only@postgres/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: https://${EDGE_HOST}:8444          # Caddy terminates TLS (03-edge), Coder lives on its own port at the root
      CODER_WILDCARD_ACCESS_URL: ""                        # no wildcard: path-based apps only
      CODER_TELEMETRY_ENABLE: "false"
      CODER_MAX_TOKEN_LIFETIME: 8760h                       # a one-year cloudd token (168h by default)
      CODER_MAX_ADMIN_TOKEN_LIFETIME: 8760h                 # a separate limit applies to the owner
      # the lxc/incus provider inside the provisioner: the local
      # socket
      INCUS_SOCKET: /var/lib/incus/unix.socket
    group_add:
      - "${INCUS_ADMIN_GID}"
    volumes:
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - coder-home:/home/coder
    ports:
      - "127.0.0.1:7080:7080"                              # for the SSH tunnel at the first sign-in; outside — only through Caddy

# Named network: the edge Caddy from 03-edge joins it and proxies to `coder:7080` by name
networks:
  default:
    name: coder-net

volumes:
  coder-home:
