[package]
name = "agents"
version = "0.1.0"
edition = "2021"
description = "AgentVerse OS: сервис «Агенты» — отдельный бэкенд и веб-приложение поверх ядра cloudd (ADR-006, этап 2)"

[[bin]]
name = "cloudos-agents"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
mime_guess = "2"
base64 = "0.22"
pdf-extract = "0.12"
bytes = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# Web Push (docs/agents-ux.md §9.9): aes128gcm encryption and VAPID signing — web-push without its HTTP clients (we send via
# reqwest); VAPID keys are generated with p256
web-push = { version = "0.11", default-features = false }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
strip = true
lto = true
