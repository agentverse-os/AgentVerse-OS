# Edge Caddy (the bootstrap set). The whole configuration is loaded by cloudd through the Admin API (POST /load) —
# the Caddyfile here is only the starter: admin on 0.0.0.0:2019 (published on the host's 127.0.0.1) and nothing
# else. cloudd joins the app networks and coder-net to this container itself at install/start. docker compose up -d
services:
  caddy:
    image: caddy:2
    container_name: cloudos-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8444:8444"                 # Coder (route: port)
      - "8445:8445"                 # "Agents" as a separate app — its own origin for the PWA install (CLOUDD_AGENTS_PORT)
      - "8450-8499:8450-8499"       # route: port apps (CLOUDD_APP_PORT_MIN..MAX)
      - "127.0.0.1:2019:2019"       # the Admin API — only for cloudd on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the cloudd upstream on the host
    networks:
      - default
      - coder-net
    volumes:
      - ./Caddyfile.bootstrap:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /var/run/tailscale:/var/run/tailscale   # certificates for <box>.<tailnet>.ts.net from tailscaled (Tailscale); without Tailscale the directory is empty
networks:
  coder-net:
    external: true
volumes:
  caddy-data:
  caddy-config:
