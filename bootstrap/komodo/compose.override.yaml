# AgentVerse OS · on top of the upstream ferretdb.compose.yaml (moghtech/komodo): the Komodo UI and API only on
# localhost — Komodo Periphery manages the host's docker.sock, it is not needed outside (cloudd goes to 127.0.0.1:9120,
# the user — through Desktop). If needed, the Komodo panel opens through an SSH tunnel: ssh -L 9120:127.0.0.1:9120
# <host>.
services:
  core:
    ports: !override
      - "127.0.0.1:9120:9120"
