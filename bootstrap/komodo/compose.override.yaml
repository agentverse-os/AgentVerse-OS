# AgentVerse OS · on top of the upstream ferretdb.compose.yaml (moghtech/komodo): the Komodo UI and API only on
# localhost — Komodo Periphery manages the host's docker.sock, it is not needed outside (cloudd goes to 127.0.0.1:9120,
# the user — through Desktop). If needed, the Komodo panel opens through an SSH tunnel: ssh -L 9120:127.0.0.1:9120
# <host>.
services:
  core:
    ports: !override
      - "127.0.0.1:9120:9120"
  # Periphery reads the host /proc for its process stats. Under the docker-default AppArmor profile every read of a process
  # confined by another profile (the Incus workspaces) is denied and audited: hundreds of events per second, 880 million
  # in 40 days on the stand, a 3.3 GB host journal. Periphery already holds docker.sock (root-equivalent), so running it
  # unconfined adds no privilege.
  periphery:
    security_opt:
      - apparmor:unconfined
