# Read-only proxy to the Docker socket for Store apps (3.8, threat model): only GET to the container list, events,
# logs and info; no POST/exec/create. Apps get DOCKER_HOST=tcp://cloudos-docker-ro:2375 in the cloudos-docker-ro-net
# network. The full socket stays only with Komodo Periphery (the App Runtime). docker compose -p cloudos-docker-proxy
# up -d
services:
  docker-ro:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: cloudos-docker-ro
    restart: unless-stopped
    environment:
      LOG_LEVEL: warning
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      POST: "0"
      EXEC: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
      PLUGINS: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-ro]
networks:
  docker-ro:
    name: cloudos-docker-ro-net
